name: nixos

# # NIXOS, ONE STAGE: its `ssh.yaml`.
#
# THAT IS THE STAGE THAT PROVES THE MACHINE - the disk boots, the guest reaches a desktop, sshd
# answers, and the bootstrap chain can be checked - without paying for an install that is 20 to 40
# minutes of clicking through a wizard.
#
# ITS TAG IS `linux-nixos-ssh`, NOT THE `nixos-ssh` SHAPE WINDOWS AND MACOS USE. Discovered rather
# than assumed: a wrong tag is a 404 at pull time that reads like a registry problem.
#
# THE NAME IS THE DISTRIBUTION, AND THAT IS THE POINT OF THE SPLIT.
#
# `concurrency:` IS PER WORKFLOW, so dispatching `ubuntu` cannot cancel `ghostbsd` or `windows`. A single
# file holding every stage meant DISPATCHING A LINUX FIX CANCELLED A RUNNING WINDOWS INSTALL - measured,
# forty minutes of one thrown away. The group exists to stop two runs fighting over one machine, and a
# matrix leg is not one machine: every leg gets its own runner.
#
# AND THE MECHANISM IS NOT COPIED. The container options, the device probes, the pull, the daemon and
# the follow loop live once in `stage.yml`, called with `workflow_call`. easydiskbake's 26 workflows
# repeat the same container stanza 23 times; that is the duplication this avoids.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm"

concurrency:
  group: nixos
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS.
#
# `stage.yml` declares `packages: write`, and that is not enough on its own: a reusable workflow's
# permissions are CLAMPED to the caller's. This file declared none, so the token it handed down had
# the repository default - and the install leg's `easyvm push` was refused with
#
#	FAILED: the registry refused a pull,push token (HTTP 403):
#	{"errors":[{"code":"DENIED","message":"requested access to the resource is denied"}]}
#
# measured on windows-install, which had already written a 10767 MiB disk and could not publish it.
# `artifacts-publish.yml` worked the whole time because it is a TOP-LEVEL workflow and its own
# `permissions:` block is the one that applies.
permissions:
  contents: read
  packages: write

jobs:
  stages:
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: nixos
      disks_repository: ${{ inputs.disks_repository }}
      # THE LEGS, AS JSON. `fromJSON` in the called workflow turns this back into a matrix.
      stages: |
        [
          {
            "name": "linux-nixos-ssh",
            "file": "linux/nixos/steps/ssh.yaml",
            "pull": "linux-nixos",
            "out": "linux-nixos-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-nixos-install",
            "file": "linux/nixos/steps/install.yaml",
            "pull": "",
            "out": "linux-nixos.qcow2",
            "publish": "linux-nixos",
            "timeout": 90
          },
          {
            "name": "linux-nixos-vm",
            "file": "linux/nixos/steps/vm-configure.yaml",
            "pull": "linux-nixos-ssh",
            "fallback": "linux-nixos",
            "out": "linux-nixos-vm.qcow2",
            "timeout": 60
          }
        ]
