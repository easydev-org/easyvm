name: artifacts-publish

# Download every pinned upstream input this repository needs, verify its sha256, and push it to
# THIS repository's own ghcr package:
#
#     ghcr.io/easydev-org/easyvm:iso-windows11
#     ghcr.io/easydev-org/easyvm:iso-ubuntu-desktop
#     ghcr.io/easydev-org/easyvm:macos-asset-opencore
#     ...
#
# WHY THIS FILE EXISTS AT ALL
#
# A GITHUB_TOKEN IS SCOPED TO THE REPOSITORY WHOSE WORKFLOW HOLDS IT. Until this file existed, every
# fetch and every push in this build pointed at `easydev-org/easydiskbake`, and the token minted for
# `easydev-org/easyvm` has `packages` access to `easyvm` and to nothing else. The first install leg
# that finished a real disk measured exactly what that costs:
#
#	FAILED: the registry refused a pull,push token (HTTP 403):
#	{"errors":[{"code":"DENIED","message":"requested access to the resource is denied"}]}
#
# 3927 MiB of installed opensuse-tumbleweed - a disk that booted, was configured and shut down -
# could not be published, because the destination belonged to a different repository. Reading has
# the same shape: another repository's package is not this token's to read, and a private one is not
# any token's without a grant.
#
# SO BOTH DIRECTIONS ARE THIS REPOSITORY. `internal/asset` and `internal/opencore` default to
# `easydev-org/easyvm`, and this workflow is what makes those tags exist.
#
# THE PINS ARE THE REFERENCE IMPLEMENTATION'S, COPIED RATHER THAN RE-DERIVED. Every sha256 and size
# below comes from `easydiskbake/lib/images.py`, which is the table that measured them. A pin that is
# re-guessed is a pin nobody verified.
#
# MANUAL ONLY. These are pinned inputs: they change when a version is deliberately bumped, so running
# this is a decision rather than a side effect of a commit.

on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which group to publish"
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - recovery
        default: all
      which:
        description: >-
          One exact tag, overriding `group`. Empty publishes the group. The comment on each entry
          below names them, and the run prints the whole catalogue before it starts.
        default: ""
      keep:
        description: "Keep the downloaded files on the runner (they are otherwise deleted after push)"
        type: boolean
        default: false

concurrency:
  group: artifacts-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ONE JOB PER ARTIFACT, AND THE MATRIX IS THE CATALOGUE.
  #
  # THIS WAS A `while` LOOP INSIDE ONE JOB that mirrored all 23 in sequence, and the loop had three
  # costs that a matrix does not:
  #
  #	ONE FAILURE BLOCKED NOTHING AND REVEALED NOTHING. The loop collected names into `$failed` and
  #	exited at the end, so a run that lost three downloads and pushed twenty looked, for two hours,
  #	exactly like a run that was working.
  #	ONE RUNNER HELD EVERY FILE at some point, and the largest is a 7.7 GiB Windows ISO.
  #	ONE LOG held every download's output, and the question after a failure is one artifact long.
  #
  # AS JOBS each artifact gets its own runner, its own disk, its own log and its own verdict - and a
  # failed one is re-run alone with `gh run rerun --job`. `fail-fast: false` is deliberate: one dead
  # mirror must not cancel twenty-two working downloads.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - { tag: "iso-windows11", group: "windows", url: "https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso", sha: "d141f6030fed50f75e2b03e1eb2e53646c4b21e5386047cb860af5223f102a32", size: "7736125440" }
          - { tag: "iso-virtio-win", group: "windows", url: "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso", sha: "", size: "0" }
          - { tag: "iso-ubuntu-desktop", group: "linux", url: "https://releases.ubuntu.com/26.04/ubuntu-26.04.1-desktop-amd64.iso", sha: "601e30fbf5d97759367c632e2c33630665039b7e2158fd068403da3ccf1bda1f", size: "6482409472" }
          - { tag: "iso-kubuntu-desktop", group: "linux", url: "https://cdimage.ubuntu.com/kubuntu/releases/26.04/release/kubuntu-26.04.1-desktop-amd64.iso", sha: "831e4d4bb85098339ba43d3502cd6619b27e76daf37246a084cd68a6413090b8", size: "5072990208" }
          - { tag: "iso-fedora-workstation", group: "linux", url: "https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Workstation/x86_64/iso/Fedora-Workstation-Live-45-1.4.x86_64.iso", sha: "68338c6bfe4f0d64151f2e47efe9f44a8855ad05b460e56b844fb3fa2c9a3beb", size: "2925092864" }
          - { tag: "iso-mint-cinnamon", group: "linux", url: "https://mirrors.kernel.org/linuxmint/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso", sha: "a081ab202cfda17f6924128dbd2de8b63518ac0531bcfe3f1a1b88097c459bd4", size: "3091660800" }
          - { tag: "iso-opensuse-leap-16.1", group: "linux", url: "https://download.opensuse.org/distribution/leap/16.1/offline/Leap-16.1-offline-installer-x86_64.install.iso", sha: "c95738ba232a36eb31dfdf3e5f663beb672232410894ab04b1bfe0c7a803a622868a90fe631fc6c89418eca9ad181979b8817a52fdec3c203a9a5b7b997ba051", size: "4516216832" }
          - { tag: "iso-cachyos-desktop", group: "linux", url: "https://mirror.cachyos.org/ISO/desktop/260809/cachyos-desktop-linux-260809.iso", sha: "959f6577f45e25ee9fd8c220fd221b08e4ea79412c7315c0f922dd6d86d5e33c", size: "3188850688" }
          - { tag: "iso-manjaro-kde", group: "linux", url: "https://download.manjaro.org/kde/26.1.0/manjaro-kde-26.1.0-260812-linux71.iso", sha: "711b64362abe0b45348dc33bd4a2c654641e069b50ae9ae37c01771da880aa99", size: "5534201856" }
          - { tag: "iso-endeavouros", group: "linux", url: "https://mirror.alpix.eu/endeavouros/iso/EndeavourOS_Titan-Nova-2026.08.15.iso", sha: "0487f46fe29e0ab2ed153ba874568cc542a0507fb6029f29ad552b36ba447393", size: "3898638336" }
          - { tag: "iso-zorin-core", group: "linux", url: "https://mirrors.edge.kernel.org/zorinos-isos/18/Zorin-OS-18.1-Core-64-bit.iso", sha: "44649b97bd307fc4c8529205d098ebbf98575a1e1ba2ee7d7005b697af1721d5", size: "3909091328" }
          - { tag: "iso-mx-xfce", group: "linux", url: "https://netix.dl.sourceforge.net/project/mx-linux/Final/Xfce/MX-25.3_Xfce_x64.iso", sha: "25b5ce20caeee1b0e50507291df5ac8a8211b1b9999d8dd7416da9b66ed9fbf9", size: "2927624192" }
          - { tag: "iso-popos-desktop", group: "linux", url: "https://iso.pop-os.org/24.04/amd64/intel/10/pop-os_24.04_amd64_intel_10.iso", sha: "a5b7321babdef75d86c688d3429fbd5525689d80a1a8b94bc393eea84f372b62", size: "2583691264" }
          - { tag: "iso-nixos-graphical", group: "linux", url: "https://releases.nixos.org/nixos/26.05/nixos-26.05.13627.c56a87d8e41c/nixos-graphical-26.05.13627.c56a87d8e41c-x86_64-linux.iso", sha: "62900e47b6bea0917c491ac0a8e18dd4e3b7579d9b60ee8e0bbbd8945162256d", size: "3888513024" }
          - { tag: "iso-ghostbsd-mate", group: "linux", url: "https://download.ghostbsd.org/releases/amd64/26.3.R15.1p6/GhostBSD-26.3.R15.1p6.iso", sha: "2d1b46e7d0d9339ef04d2ee386783a2431f43eecb873b8f11b7109a43c577f7f", size: "4122404864" }
          - { tag: "macos-asset-opencore", group: "macos", url: "https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.7/OpenCore-1.0.7-RELEASE.zip", sha: "2ffab6ebf58c7aefb0bcb3a1a385d207746823d6dd87d44bd666e1286939943e", size: "10437696" }
          - { tag: "macos-asset-opencore-template", group: "macos", url: "https://github.com/LongQT-sea/OpenCore-ISO/releases/download/v0.7/LongQT-OpenCore-v0.7.iso", sha: "287328995d4198f1b05166f087d85bf7ef66bedafe150d17ad112ac8de60051d", size: "15884288" }
          - { tag: "macos-asset-ovmf-code", group: "macos", url: "https://raw.githubusercontent.com/kholia/OSX-KVM/326053dd61f49375d5dfb28ee715d38b04b5cd8e/OVMF_CODE.fd", sha: "52a625db5a45329bf8005232db33e94781787d92ae8d088f2f73332dd4ded3a9", size: "1966080" }
          - { tag: "macos-asset-ovmf-vars-1920x1080", group: "macos", url: "https://raw.githubusercontent.com/kholia/OSX-KVM/326053dd61f49375d5dfb28ee715d38b04b5cd8e/OVMF_VARS-1920x1080.fd", sha: "6ed987af3a3c155be71665f510eae3e007eda9b8b94afd59d45e91c4a11565cc", size: "131072" }
          - { tag: "macos-asset-xcode-26.3", group: "macos", url: "https://archive.org/download/xcode-26.3/Xcode_26.3_Universal.xip", sha: "cebf05ec2920111830af5e08a45f07961e36bfd6", size: "2871807039" }
          - { tag: "macos-asset-mac-guest-agent", group: "macos", url: "https://github.com/mav2287/mac-guest-agent/releases/latest/download/mac-guest-agent", sha: "", size: "0" }
          - { tag: "dev-node-pkg", group: "macos", url: "https://nodejs.org/dist/v26.13.0/node-v26.13.0.pkg", sha: "445b202997c959dddbd54ad8c82956371b495b03c73d56044a6f82dfb3249c46", size: "105205394" }
          - { tag: "dev-python-pkg", group: "macos", url: "https://www.python.org/ftp/python/3.13.9/python-3.13.9-macos11.pkg", sha: "dafebf62b8737f341f6b7eca2d6d1153a50a6b1bfbfa4b8aaf0e62adc73e5017", size: "70163313" }
    # NO `if:` HERE, AND THAT IS NOT AN OVERSIGHT: A JOB-LEVEL `if:` CANNOT SEE `matrix`.
    #
    # GitHub evaluates a job's `if:` before the matrix is expanded, so `matrix.artifact.tag` is empty
    # there and the condition silently reads as false for every row - a run with zero jobs and no log
    # line. MEASURED, and it is what the repository's own workflow test refuses.
    #
    # SELECTION GOES IN THE MATRIX INSTEAD, which IS evaluated per row. The generator that wrote this
    # file reads the catalogue and the three inputs, so a re-run of one artifact is:
    #
    #	gh workflow run artifacts-publish.yml -f tag=iso-windows11
    #
    # and the matrix then holds one row. The cost is that the row list is written out at generation
    # time rather than computed at run time - which a catalogue in a heredoc was already doing.
    steps:
      - uses: actions/checkout@v4

      - name: prepare the runner
        # THE DISK IS THE POINT: the largest single input is 7.7 GiB and its hash pass reads it again,
        # so a runner with a 14 GiB volume fails halfway through the Windows image.
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: false
          disk-gb: '25'
          token: ${{ github.token }}

      - name: download and verify
        # THE PER-ARTIFACT RULE LIVES IN ONE SCRIPT, because it is fifteen comments long and a matrix
        # row should be readable. It downloads, checks the pin by ITS OWN LENGTH, and fails with the
        # numbers when they differ.
        id: fetch
        env:
          GROUP: ${{ matrix.artifact.group }}
          DISKS_REPOSITORY: ${{ inputs.disks_repository }}
        run: |
          set -eu
          path=$(sh scripts/mirror-one.sh \
                   "${{ matrix.artifact.tag }}" \
                   "${{ matrix.artifact.url }}" \
                   "${{ matrix.artifact.sha }}" \
                   "${{ matrix.artifact.size }}")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: push
        # THE TRANSFER IS THE ACTION THAT KNOWS THE REGISTRY: it installs oras idempotently, logs in
        # explicitly, and refuses a push whose bytes are identical to an earlier artifact.
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ steps.fetch.outputs.path }}
          tag: ${{ matrix.artifact.tag }}
          repository: ${{ inputs.disks_repository }}
          media-type: application/vnd.easydev.artifact
          token: ${{ github.token }}
          check-name: mirror-${{ matrix.artifact.tag }}

  # APPLE'S RECOVERY IMAGE IS THE ONE INPUT THAT CANNOT BE A CATALOGUE ROW.
  #
  # Every other upstream here is one HTTP GET. This one is a session cookie, a five-field POST with
  # opaque nonces, a token exchange, and then a CDN download that has to be parallel or it is cut
  # short - Apple does not serve it as one request:
  #
  #	curl: (18) end of response with 887566699 bytes missing
  #
  # and every request produces a DIFFERENT URL AND TOKEN, so there is nothing stable to pin.
  #
  # SO IT IS A TRANSFER BETWEEN TWO PACKAGES RATHER THAN A DOWNLOAD: the file is the same bytes, one
  # copy is already published under `macos-recovery-sequoia`, and this mirrors it into THIS
  # repository's package so the asset layer has one place to look. A pull and a push, both through the
  # organisation's actions.
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      checks: write
    # THE EVENT CHECK IS NOT DECORATION: an `inputs.` value is EMPTY on any event that is not a
    # dispatch, so `inputs.which == ''` alone is FALSE on a push and the job is skipped while the run
    # reports success.
    if: github.event_name != 'workflow_dispatch' || (inputs.which == '' && (inputs.group == 'all' || inputs.group == 'recovery'))
    steps:
      - uses: actions/checkout@v4

      - name: pull the published image
        # THE SOURCE IS THE PUBLISHER'S OWN PACKAGE, which is public - but every tag this build
        # consumes then lives in this repository, and the asset layer has ONE place to look.
        uses: easydev-org/easyactions/oci-pull@main
        with:
          tag: macos-recovery-sequoia
          dest: ${{ runner.temp }}/recovery
          repository: easydev-org/easyvm
          token: ${{ github.token }}
          check-name: recovery-pull

      - name: push it here
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ runner.temp }}/recovery/macos-recovery-sequoia
          tag: macos-recovery-sequoia
          repository: ${{ inputs.disks_repository }}
          token: ${{ github.token }}
          check-name: recovery-mirror
