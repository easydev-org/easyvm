name: blissos16

# BLISSOS 16.9.7 (ANDROID 13, x86_64), AS A CHAIN OF TWO JOBS.
#
# TWO RATHER THAN THREE, AND THE MISSING LEG IS THE POINT. Every other operating system here has
# install -> ssh -> vm-configure, because the installed system has no way in until a stage puts sshd
# there. Android already has one:
#
#	measured on a BlissOS guest this chain built
#	sent     CNXN host::
#	device   CNXN version=0x1000001 maxdata=4096
#	         banner=...ro.product.model=Generic Android-x86_64
#	         features=shell_v2,cmd,stat_v2,ls_v2,apex,abb,remount_shell,sendrecv_v2,...
#
# adbd is running before anything else is, and it answers CNXN rather than AUTH because the image has
# `ro.adb.secure=0`. So there is no stage whose job is to install a door - `vm-configure` walks
# through the one that is already open.
#
# THE ISO IS A BOOTABLE MEDIUM UNDER BOTH FIRMWARES, AND THAT IS MEASURED RATHER THAN ASSUMED. Its El
# Torito catalog, read out of the file:
#
#	entry 0: x86 BIOS   bootable    image at LBA 7735  (isolinux)
#	section: UEFI
#	entry 2: (UEFI)     bootable    image at LBA 55    (30720 sectors = boot/grub/efi.img)
#
# `boot: os: android` with an `iso:` uses that: firmware finds the loader by itself, exactly as it does
# for Windows and every Linux here. There is no `-kernel` in this chain and there is no reason for one.
#
# THE SHAPE IS THE ONE `freebsd.yml` USES AND FOR THE SAME REASON: `needs:` is what makes a leg wait for
# the artifact the leg before it publishes. A parallel matrix asks for a tag that does not exist yet,
# gets a 404, falls back to the install disk - which has no desktop - and burns its budget.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm"
      from_tag:
        description: >-
          start from a PUBLISHED disk: android-blissos-install or android-blissos-vm. Empty runs the whole chain.
        default: ""

concurrency:
  group: blissos16
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS, and `stage.yml` needs all three:
# `packages: write` to publish a disk, `checks: write` to stream the live log, `contents: read` to check
# out the walkthroughs.
permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    # `from_tag:` NAMES A PUBLISHED DISK AND THE CHAIN STARTS FROM IT - SO THE INSTALL DOES NOT RUN.
    # Without this `if:`, `-f from_tag=android-blissos-install` would start the forty-step install that
    # REPUBLISHES the very tag the caller named.
    if: github.event_name != 'workflow_dispatch' || inputs.from_tag == ''
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: blissos16
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "android-blissos-install",
            "file": "android/blissos16/steps/install.walk",
            "pull": "",
            "assets": ["iso-blissos-16.9.7:blissos-16.9.7.iso"],
            "out": "android-blissos-install.qcow2",
            "publish": "android-blissos-install",
            "timeout": 180
          }
        ]

  vm:
    needs: [install]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'android-blissos-install')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: blissos16
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "android-blissos-vm",
            "file": "android/blissos16/steps/vm-configure.walk",
            "pull": "android-blissos-install",
            "out": "android-blissos-vm.qcow2",
            "publish": "android-blissos-vm",
            "timeout": 90
          }
        ]
