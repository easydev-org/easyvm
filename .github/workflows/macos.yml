name: macos

# # MACOS 15, FOUR STAGES: setup -> ssh -> vm-configure -> dev.
#
# `macos-setup` PROVES THE FIRMWARE: OpenCore as a pflash pair built from the recovery image, the boot
# image in a GPT partition at bootindex 0, the Apple SMC, twenty CPU flags of which `+invtsc` is the
# one whose absence deadlocks the guest, and the recovery image as removable media because macOS
# installs FROM USB. It takes 45 to 90 minutes because macOS copies 36 GiB.
#
# THE NAME IS THE DISTRIBUTION, AND THAT IS THE POINT OF THE SPLIT.
#
# `concurrency:` IS PER WORKFLOW, so dispatching `ubuntu` cannot cancel `ghostbsd` or `windows`. A single
# file holding every stage meant DISPATCHING A LINUX FIX CANCELLED A RUNNING WINDOWS INSTALL - measured,
# forty minutes of one thrown away. The group exists to stop two runs fighting over one machine, and a
# matrix leg is not one machine: every leg gets its own runner.
#
# AND THE MECHANISM IS NOT COPIED. The container options, the device probes, the pull, the daemon and
# the follow loop live once in `stage.yml`, called with `workflow_call`. easydiskbake's 26 workflows
# repeat the same container stanza 23 times; that is the duplication this avoids.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easydiskbake"

concurrency:
  group: macos
  cancel-in-progress: true

jobs:
  stages:
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos
      disks_repository: ${{ inputs.disks_repository }}
      # THE LEGS, AS JSON. `fromJSON` in the called workflow turns this back into a matrix.
      stages: |
        [
          {
            "name": "macos-setup",
            "file": "macos/15/steps/setup.yaml",
            "pull": "",
            "out": "macos15-setup.qcow2",
            "timeout": 195,
            "note": "THE INSTALL IS A 120-MINUTE WAIT, NOT A HANG DETECTOR. `the copy runs until the Setup Assistant appears` is 7200s because writing macOS onto a 128 GiB disk on a shared runner genuinely takes that long. With boot (15), the recovery menu (15), the erase report (5), the copy returning (5) and the shutdown (5) the real floor is 165 minutes, so a 150-minute job was cut off DURING the install however well every step behaved."
          },
          {
            "name": "macos-ssh",
            "file": "macos/15/steps/ssh.yaml",
            "pull": "macos15-ssh",
            "out": "macos15-ssh.qcow2",
            "timeout": 90
          },
          {
            "name": "macos-vm-configure",
            "file": "macos/15/steps/vm-configure.yaml",
            "pull": "macos15-vm-configure",
            "out": "macos15-vm-configure.qcow2",
            "timeout": 90
          },
          {
            "name": "macos-dev",
            "file": "macos/15/steps/dev.yaml",
            "pull": "macos15-dev",
            "out": "macos15-dev.qcow2",
            "timeout": 150
          }
        ]