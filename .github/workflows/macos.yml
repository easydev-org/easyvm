name: macos

# macos, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE LEGS USED TO RUN AS ONE PARALLEL MATRIX, and that produced a race with a timeout for a tail: a leg
# asks for the tag the leg before it publishes, gets a 404 because that leg is still running, falls back
# to the INSTALL disk - which has no sshd - and spends its whole budget on a machine that could never
# answer.
#
# `needs:` IS THE FIX, AND IT IS WHAT THE REFERENCE IMPLEMENTATION ALWAYS DID:
#
#	jobs/bake  ->  jobs/launch needs bake  ->  jobs/ssh needs bake  ->  jobs/vm-configure needs ssh
#
# A leg cannot start before the artifact it pulls exists, because it is not SCHEDULED until then. The
# cost is the sum rather than the maximum, and that is the right way round: a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#
# EVERY STAGE IS STILL DISPATCHABLE ON ITS OWN. `from_tag` names a PUBLISHED disk and the chain starts
# at the stage that needs it - the earlier jobs are skipped, because a `needs` on a SKIPPED job is
# satisfied. That is the reference implementation's `ssh_from`, and it is why there are 4 jobs
# rather than one file with 4 steps.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm"
      from_tag:
        description: >-
          start from a PUBLISHED disk: macos15 or macos15-ssh or macos15-vm-configure or macos15-dev. Empty runs the whole chain. A fix to a later stage then costs that stage, not the entire bake.
        default: ""

concurrency:
  group: macos
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS, and `stage.yml` needs all three:
# `packages: write` to publish a disk, `checks: write` to stream the live log, `contents: read` to check
# out the walkthroughs.
permissions:
  contents: read
  packages: write
  checks: write

jobs:
  setup:
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos-setup",
            "file": "macos/15/steps/setup.yaml",
            "pull": "",
            "out": "macos15.qcow2",
            "publish": "macos15",
            "timeout": 150
          }
        ]

  # THE `ssh` STAGE, WHICH STARTS BY ANSWERING THE WIZARD.
  #
  # `setup` ENDS WHERE THE INSTALLER ENDS - it waits for the Setup Assistant to appear and stops, which
  # is the right end for an INSTALL. What that disk does NOT have is a user, and the `ssh` stage's first
  # act is `click the password field`. MEASURED on the disk this repository published as `macos15`,
  # pulled back and driven locally:
  #
  #	wait for the desktop [11/33]   <- stuck on "Select Your Country or Region"
  #
  # THE WIZARD CAN TAKE 45 MINUTES, so it must not sit inside `setup`: a failure here has to cost the
  # wizard, not the two hours of install before it. AND REMOTE LOGIN IS PART OF IT, because the machine
  # is already on the desktop with a session by the time the wizard is answered - a second stage would
  # boot the disk again and walk back to the same place. The guest is then powered off through its own
  # sshd, so APFS closes its journal and the wizard's writes survive being published.
  ssh:
    needs: [setup]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos15')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos-ssh",
            "file": "macos/15/steps/ssh.yaml",
            "pull": "macos15",
            "out": "macos15-ssh.qcow2",
            "publish": "macos15-ssh",
            "timeout": 120
          }
        ]

  vm:
    needs: [ssh]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos15' || inputs.from_tag == 'macos15-ssh')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos-vm-configure",
            "file": "macos/15/steps/vm-configure.yaml",
            "pull": "macos15-ssh",
            "out": "macos15-vm-configure.qcow2",
            "publish": "macos15-vm-configure",
            "timeout": 60
          }
        ]

  dev:
    needs: [vm]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos15' || inputs.from_tag == 'macos15-ssh' || inputs.from_tag == 'macos15-vm-configure')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos-dev",
            "file": "macos/15/steps/dev.yaml",
            "pull": "macos15-vm-configure",
            "out": "macos15-dev.qcow2",
            "publish": "macos15-dev",
            "timeout": 90
          }
        ]

