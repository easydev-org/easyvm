name: stage

# THE ONE COPY OF "HOW A STAGE RUNS", CALLED BY ONE WORKFLOW PER OPERATING SYSTEM.
#
# WHY THIS EXISTS RATHER THAN ONE BIG MATRIX.
#
# A single `walkthrough.yml` with 21 legs under one `concurrency:` group means DISPATCHING TO TEST
# LINUX CANCELS A RUNNING WINDOWS INSTALL. That is not a hypothetical: it happened, and forty minutes
# of a Windows install were thrown away so a Linux fix could be measured. The concurrency group exists
# to stop two runs fighting over one machine, and a matrix leg is not one machine - every leg gets its
# own runner.
#
# WHY IT IS ONE FILE AND NOT TWENTY-SIX.
#
# easydiskbake has 26 workflows, and the same container stanza appears in 23 of them - 73 duplicated
# lines of `options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN`. Copying that shape
# would reintroduce exactly the "one fact in many places" this port keeps removing, and the first time
# a device or a capability changed, twenty-three files would need the same edit.
#
# SO: THE MECHANISM IS HERE ONCE, AND EACH OS FILE DECLARES ONLY ITS OWN MATRIX. Windows gets its own
# concurrency group, Linux its own, and one can be re-run while another is installing.

on:
  workflow_call:
    inputs:
      stages:
        description: "the matrix legs this workflow runs"
        type: string
        required: true
      # A NAME FOR THE CONCURRENCY GROUP. One per operating system, so that re-running Linux does not
      # cancel a Windows install - which is the whole reason this file exists.
      group:
        description: "the concurrency group, one per OS"
        type: string
        required: true
      # WHERE THE LEG PULLS ITS INPUT DISK FROM, and where it publishes its output.
      #
      # THESE ARE TWO INPUTS BECAUSE THEY ARE TWO DECISIONS, and before the split they were one:
      # every leg pulled from `easydev-org/easyvm` and pushed to `inputs.disks_repository`. A fork
      # that points `disks_repository:` at the upstream package - which is what it must do to reuse
      # the 5 GiB Ubuntu ISO nobody wants to bake twice - then also asks its GITHUB_TOKEN to WRITE
      # there, and a token minted for `easydev-org/easyvm-fork` has no access to `easydev-org/easyvm`
      # at all. The install finishes, the disk is real, and the push answers 403.
      #
      # SO THE READ SIDE DEFAULTS TO THE UPSTREAM PACKAGE AND THE WRITE SIDE TO THIS REPOSITORY.
      # `${{ github.repository }}` is the fork when this runs on the fork and the product when it runs
      # on the product, which is the only value that is right in both places.
      disks_repository:
        description: >-
          the ghcr package this leg PULLS its input disk and media from. Upstream by default, because
          those packages are public and re-baking them costs hours.
        type: string
        default: "easydev-org/easyvm-fork"
      publish_repository:
        description: >-
          the ghcr package this leg PUSHES its disk to. This repository by default - a token can only
          write to the package its own repository holds.
        type: string
        default: ""
      # THE FREE DISK THIS LEG NEEDS, IN GB, BECAUSE THE ANSWER DIFFERS BY AN ORDER OF MAGNITUDE.
      #
      # MEASURED ON 2026-11-21: `runner-check` reported
      #
      #	/__w/easyvm-bsd/easyvm-bsd has 11 GiB free; 40 GiB needed
      #
      # on a job running THIS stage.yml, from THIS commit, that the easydev-org/easyvm run at the same
      # minute PASSED - GitHub's hosted runners do not all carry the same free space, and `prune: true`
      # cannot help from inside a `container:` job: what it deletes is the HOST's SDKs, which a
      # container job cannot see.
      #
      # AND ONE NUMBER FOR EVERY GUEST WAS ALREADY WRONG. A BSD install reads a 1.3 GiB ISO; a Windows
      # install reads 7.7 GiB twice. The caller knows which it is; this workflow does not.
      password:
        description: >-
          the guest account's password, when a caller needs to override the walk's own `password:`
          line. Empty by default, because the walk knows what its disk was built with.
        type: string
        default: ""
      disk_gb:
        description: >-
          free GB this leg needs on the runner. 0 skips the check. Sized for the working copy, the
          compressed result and the recording - not the disk's virtual size.
        type: string
        default: "40"
      image_tag:
        description: >-
          the image tag this stage runs inside. `latest` is the product and is what every operating
          system's workflow uses; a BRANCH tag is how a change to the vocabulary is driven by real
          guests before it merges, without publishing over `:latest`.
        type: string
        default: "latest"
      # THE SMALLEST DISK THIS STAGE WILL PUBLISH, IN MiB. A leg may override it with `floor_mb` in its
      # own matrix entry, and that is why it is an input rather than a constant.
      #
      # THE CHECK ITSELF MUST STAY. `qemu-img create` writes a 197,632-byte qcow2 - a header and
      # nothing else - so a walk whose every click missed still produces a file that `-s` accepts, and
      # MEASURED ON linux-zorin that disk was published and the next stage pulled a machine with no
      # system on it. 512 MiB catches that because a bare header is three orders of magnitude below it.
      #
      # BUT ONE NUMBER FOR EVERY GUEST IS AS WRONG HERE AS IT WAS FOR `disk_gb`. A BSD install is not a
      # desktop Linux: MEASURED, a complete NetBSD 11.1 with every set compresses to 535,887,872 bytes
      # - 511.0 MiB - and a floor of 512 refused it. The answer on that side was to write 1.1 GiB of
      # /dev/urandom into swap, which passed the check while making the published size say nothing
      # about the contents. This input is the other answer: the leg that knows its disk is small says
      # so, and the check keeps doing the job it was written for.
      disk_floor_mb:
        description: >-
          the smallest compressed disk, in MiB, that this stage will publish. Below this the leg fails
          rather than publishing a qcow2 header. A matrix leg overrides it with `floor_mb`.
        type: string
        default: "512"
      # WHICH REPOSITORY'S PACKAGE HOLDS THE IMAGE, AND IT IS NOT ALWAYS THE CALLER'S.
      #
      # `ghcr.io/${{ github.repository }}` WAS RIGHT WHILE EVERY CALLER LIVED IN easydev-org/easyvm.
      # It stopped being right the day the walkthroughs moved into easyvm-windows, easyvm-macos,
      # easyvm-linux, easyvm-android and easyvm-bsd: in a called workflow `github.repository` is the
      # CALLER, so the expression would have looked for
      #
      #	ghcr.io/easydev-org/easyvm-linux:latest
      #
      # - a package that does not exist, because the IMAGE is built here, by `image.yml`, and the
      # walkthrough repositories hold no Go code to build one from. GitHub's failure for a missing
      # image on a `container:` job is not a helpful message: the run fails to start the container
      # and reports it as an infrastructure error with no log.
      #
      # SO IT IS AN INPUT WITH THE OLD BEHAVIOUR AS ITS DEFAULT. A caller inside easyvm passes
      # nothing and gets `${{ github.repository }}`; a walkthrough repository passes
      # `easydev-org/easyvm`.
      image_repository:
        description: >-
          the ghcr repository that holds the stage image. Empty means the caller's own repository,
          which is what every in-repository call wants; a walkthrough repository names
          `easydev-org/easyvm`, because the image is built there.
        type: string
        default: ""

# NO WORKFLOW-LEVEL `concurrency` HERE. THE CALLER OWNS THE RUN.
#
# A reusable workflow is part of its caller's run, and declaring `concurrency` inside it makes GitHub
# reject the reference - the symptom is a run with ZERO JOBS and no log line, which is what run
# 43069605983 showed. The group belongs to the file a person dispatches, and each operating system's
# file already declares its own.

jobs:
  stage:
    runs-on: ubuntu-24.04
    # THE LEG'S OWN TIMEOUT, NOT ONE NUMBER FOR ALL. A 150-minute macOS install must not be bounded by
    # a default chosen for a 70-minute Windows stage.
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/${{ inputs.image_repository || github.repository }}:${{ inputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE THREE THINGS EVERY GUEST NEEDS, IN ONE PLACE. `--device /dev/net/tun` is the tap the NIC is
      # attached to; `--cap-add NET_ADMIN` creates the tap, the bridge and the iptables rules;
      # `--device /dev/kvm` is the accelerator, without which a macOS guest cannot be given `+invtsc`
      # and deadlocks, and every other guest runs fifty times slower.
      # NET_RAW IS FOR THE DIAGNOSIS, NOT THE PRODUCT. tcpdump and the raw-socket ICMP echo both
      # open AF_PACKET / raw sockets, which need CAP_NET_RAW; with only NET_ADMIN they fail, and the
      # failure looks like "captured 0 packets", which reads as "the packet never left" when the
      # truth is "we were not allowed to look". Granting it makes the capture honest. The engine's
      # actual network path (tap, bridge, iptables) needs only NET_ADMIN; NET_RAW adds nothing it
      # uses to run a guest.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN --cap-add NET_RAW
    # `packages: READ` WAS THE 403. The install leg publishes its disk with `oras push`, and a
    # read-only token cannot create a package version at all:
    #
    #	FAILED: the registry refused a pull,push token (HTTP 403):
    #	{"errors":[{"code":"DENIED","message":"requested access to the resource is denied"}]}
    #
    # measured on linux-opensuse-tumbleweed-install, whose 3927 MiB disk was finished and could not
    # be published. `write` covers read as well, which is what the pull side needs.
    permissions:
      contents: read
      packages: write
      # `checks: write` IS WHAT PUBLISHES THE LIVE LOG, AND IT IS NOT GRANTED BY DEFAULT.
      #
      # `follow it` streams to a CHECK RUN because a step's Actions log cannot be read until the step
      # ends. MEASURED: without this line the POST is refused, the action falls back to running the
      # command unpublished, and the whole feature looks like a no-op - there is no error in the step's
      # own output, because a stream that cannot publish still runs the command by design.
      checks: write
    strategy:
      # EVERY LEG AT ONCE. Each matrix leg gets its own runner, with its own /dev/kvm and its own
      # container, so the legs do not compete - and `max-parallel: 1` would make a stage wait for the
      # sum of every stage before it rather than the longest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stages) }}
    steps:
      - uses: actions/checkout@v4

      # THE DEVICES AND THE DISK, BY THE ORGANISATION'S ACTION.
      #
      # THIS REPLACES THIRTY LINES OF HAND-WRITTEN PROBES that three other repositories had their own
      # copy of. The action checks the same things and two that this step did not:
      #
      #	/dev/kvm OPENS            not `test -e`: on a GitHub runner the node is 0o660 root:kvm and
      #	                          the job's uid is neither, so a permission test says no about a
      #	                          device that works. The action opens it and chmods 0666 when needed.
      #	qemu ACCELERATES           the handshake behind the open. `test -e /dev/kvm` PASSED on run
      #	                          43063744565 while qemu fell back to TCG, and the symptom was not an
      #	                          error - the guest booted, everything took fifty times as long, and
      #	                          macOS could not get the CPU flags it needs.
      #	/dev/net/tun MAKES A TAP  not `test -e`: `ip tuntap add` is the only call that tests the node
      #	                          and the NET_ADMIN capability together.
      #	DISK                      the leg writes a 128 GiB qcow2, reads a 7 GiB ISO and keeps an mp4.
      #	                          The action prunes what a VM job never uses - .NET, Android, GHC,
      #	                          CodeQL - and fails BEFORE the install rather than forty minutes into
      #	                          it with `no space left on device`.
      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          tun: true
          # THE RECORDING, THE INPUT DISK AND THE OUTPUT DISK ARE ALL ON THIS MOUNT, and the largest
          # single input is a 7.7 GiB Windows ISO that is read twice.
          disk-gb: ${{ inputs.disk_gb }}
          token: ${{ github.token }}

      # A SECOND, SMALLER FLOOR, BECAUSE THE FIRST ONE IS A GUESS ABOUT SOMEBODY ELSE'S RUNNER.
      #
      # MEASURED ON A SPLIT REPOSITORY, 2026-11-21: `runner-check` reported
      #
      #	/__w/easyvm-bsd/easyvm-bsd has 11 GiB free; 40 GiB needed
      #
      # on a job that runs the SAME stage.yml as easydev-org/easyvm, from the same commit, on the same
      # runner image - and the run in easydev-org/easyvm at the same minute PASSED the same check.
      # GitHub's hosted runners do not all carry the same free space, and `prune: true` cannot help
      # from inside a `container:` job: what it deletes is the HOST's SDKs, which this job cannot see.
      #
      # SO THE DISK IS A PROPERTY OF THE STAGE RATHER THAN A CONSTANT. A BSD install reads a 1.3 GiB
      # ISO; a Windows install reads 7.7 GiB twice. One number for both is a number that is wrong for
      # one of them.
      - name: the files the walk copies beside itself
        # A `scp:` NAMES A LOCAL FILE, AND THE DAEMON LOOKS FOR IT IN `work` FIRST AND ITS OWN
        # WORKING DIRECTORY SECOND. The second is the repository ROOT, which is not where a walk's
        # helpers live - they sit beside the `.walk` that copies them.
        #
        # MEASURED ON RUN 44886219518 (`macos-dev`, step 5/21 "copy run-xcode-install.sh in"):
        #
        #	error: no file to copy at run-xcode-install.sh (work="/__w/easyvm-macos/easyvm-macos/work"):
        #	       stat run-xcode-install.sh: no such file or directory
        #
        # THE FILE EXISTED, at `15/steps/run-xcode-install.sh` in the caller's checkout. This step
        # copies what is beside the walk into `work`, which is the place the reader already prefers,
        # so a helper script is found without every stage learning its own directory layout.
        #
        # IT IS A COPY AND NOT A SYMLINK: the daemon runs as a different user in some deployments, and
        # a link into the checkout is a permission question that this has no reason to ask.
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/work"
          dir=$(dirname "${{ matrix.file }}")
          n=0
          for f in "$dir"/*; do
            [ -f "$f" ] || continue
            case "$f" in "${{ matrix.file }}") continue ;; esac
            cp -f "$f" "$GITHUB_WORKSPACE/work/"
            n=$((n + 1))
          done
          echo "staged $n file(s) from $dir beside ${{ matrix.file }}"
          ls -l "$GITHUB_WORKSPACE/work/" | head -20

      - name: the tools the files use
        # NAMED SO A MISSING ONE IS THIS STEP RATHER THAN A FAILURE FORTY MINUTES INTO AN INSTALL that
        # needed `xorriso` to build an answer CD.
        #
        # `oras` IS NOT INSTALLED HERE ANY MORE. `oci-push` installs it idempotently when it publishes,
        # and a leg that publishes nothing does not need it - which is why the install moved to the
        # action that uses it rather than sitting in every leg's prepare.
        run: |
          set -eu
          easyvm versions
          for tool in qemu-img 7z xorriso unzip mformat mcopy mdir curl; do
            if command -v "$tool" > /dev/null; then
              printf '  %-10s %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '  %-10s MISSING\n' "$tool"
            fi
          done
          mkdir -p "$GITHUB_WORKSPACE/work"

      - name: pull the input disk
        # AN INSTALL HAS NO INPUT: its first step creates the disk it writes to. Every other leg pulls
        # the disk the leg before it published, and THERE IS EXACTLY ONE TAG TO TRY.
        #
        # THIS WAS A LOOP WITH TWO FALLBACKS AND A THIRTY-MINUTE WAIT, and all of that existed for one
        # reason: the legs ran as a PARALLEL MATRIX, so a leg could ask for a tag the leg before it had
        # not published yet, get a 404, and then fall back to the INSTALL disk - which has no sshd - and
        # wait out its timeout on a machine that could never answer.
        #
        # `needs:` IN THE CALLER REMOVED THE RACE, so the loop is gone with it. A leg that finds its tag
        # missing now has a REAL problem: the leg before it published nothing, and saying so at once is
        # worth more than thirty minutes of retries that end in the same place.
        # THE GUARD IS THE MATRIX ROW, NOT AN INPUT: an install leg's `pull` is empty and everything
        # else names one tag. `matrix.pull` is a string, and an empty one is how "I start a chain" is
        # spelled.
        if: matrix.pull != ''
        # THE TOKEN IS NOT OPTIONAL, AND ITS ABSENCE READS LIKE A MISSING TAG.
        #
        # MEASURED ON RUN 43382281309 (`linux-ubuntu-ssh`, step 6):
        #
        #	GITHUB_TOKEN is empty; a private package needs it and an anonymous pull answers 401
        #	linux-ubuntu is not in the package. This leg pulls the disk the leg before it published
        #
        # The install leg HAD published `linux-ubuntu`. An anonymous GET of a private package is a
        # 401, `pull-artifact.sh` reports that as "not in the package", and the leg then failed with a
        # message pointing at the job BEFORE it - which was fine. The diagnosis cost a full round trip
        # through two logs.
        #
        # THIS STEP IS A `run:` BLOCK RATHER THAN AN ACTION, so `TestEveryRegistryActionIsGivenAToken`
        # could not see it: that test checks `with: token:` on `oci-pull`/`oci-push`/`log-stream`.
        # The token here is an `env:` variable, and it is the same credential.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # A FAILURE HERE IS SAID PLAINLY, because the one thing a reader must not have to do is
          # work out whether "not in the package" means the tag is absent or the credential is.
          [ -n "${GITHUB_TOKEN:-}" ] || {
            echo "::error::GITHUB_TOKEN is empty, so this pull would be anonymous and would answer"
            echo "::error::401 - which this script reports as a missing tag. The step's `env:` block"
            echo "::error::is what carries it, and the job's `packages:` permission is what makes it"
            echo "::error::non-empty at all."
            exit 1
          }
          tag="${{ matrix.pull }}"
          [ -n "$tag" ] || { echo "this leg has no pull:"; exit 0; }
          echo "=== pull $tag"
          # THE SCRIPT COMES FROM THE CALLER'S CHECKOUT, AND THAT IS A DEPENDENCY A CALLER CAN
          # FORGET. MEASURED on the first split run:
          #
          #	sh: 0: cannot open /__w/easyvm-bsd/easyvm-bsd/.github/pull-artifact.sh: No such file
          #
          # - the job then reported `iso-freebsd is not in the package`, which names the CATALOGUE and
          # not the missing file. A reusable workflow cannot read its own repository at runtime, so
          # the caller must carry it; this guard is what turns the next such mistake into a sentence.
          [ -f "$GITHUB_WORKSPACE/.github/pull-artifact.sh" ] || {
            echo "::error::this repository has no .github/pull-artifact.sh, and stage.yml needs it to"
            echo "::error::read the package. Copy it from easydev-org/easyvm; without it this leg"
            echo "::error::reports a missing TAG for what is a missing SCRIPT."
            exit 1
          }
          sh "$GITHUB_WORKSPACE/.github/pull-artifact.sh" \
             ghcr.io "$(printf '%s' "${{ inputs.disks_repository }}" | tr '[:upper:]' '[:lower:]')" \
             "$tag" "$GITHUB_WORKSPACE/work/disk.qcow2" || {
            echo "::error::$tag is not in the package. This leg pulls the disk the leg before it"
            echo "::error::published, and that leg declares its own tag in the caller's matrix."
            echo "::error::A missing tag here means the previous job published nothing - read ITS log,"
            echo "::error::not this one."
            exit 1
          }

      - name: pull the media this leg boots from
        # EVERY INPUT THE WALK NEEDS IS ALREADY ON DISK BEFORE IT STARTS. A walkstep may not download:
        # `easyvm run` is a client that drives a machine, and a stage whose duration depends on a
        # registry is a stage that fails for reasons the file cannot describe.
        #
        # MEASURED, WHICH IS WHY THIS STEP EXISTS: `macos-vm-configure` spent 18 minutes inside its
        # own `fetch the recovery image` step pulling 800 MiB from ghcr, then ran out of the fifteen
        # minutes `wait for sshd` had budgeted and reported a machine that never answered. The guest
        # was fine - the same disk booted to a shell in 32 seconds locally. The stage was measuring a
        # download and calling it a boot.
        #
        # `matrix.assets` IS A LIST OF `tag:name` PAIRS, and the name is what the walk's `iso:`,
        # `recovery:` and `driver_cd:` say. The walk never spells a tag; this step never spells a
        # filename.
        if: matrix.assets != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ -n "${GITHUB_TOKEN:-}" ] || {
            echo "::error::GITHUB_TOKEN is empty, so this pull would be anonymous and would answer"
            echo "::error::401 - which this script reports as a missing tag."
            exit 1
          }
          repo="$(printf '%s' "${{ inputs.disks_repository }}" | tr '[:upper:]' '[:lower:]')"
          # ONE PAIR PER LINE, STILL `tag:name`, AND THE SPLIT IS ON THE COLON.
          #
          # THE FIRST VERSION SPLIT ON A PIPE THAT WAS NEVER IN THE INPUT. `toJSON` of a list of
          # strings is `["iso-freebsd:freebsd.iso"]`, so stripping the brackets and quotes and turning
          # `","` into newlines gives one `tag:name` per line - and `IFS='|'` then read the WHOLE line
          # as the tag:
          #
          #	[error] iso-freebsd:freebsd.iso is not in the package
          #
          # MEASURED on runs 43875028889 and 43875047148, whose install legs failed in 24 seconds with
          # the tag and the filename reported as one name. A `read` that finds no separator leaves the
          # first variable holding everything and the second empty, which is exactly what happened.
          #
          # `${pair%%:*}` AND `${pair#*:}` RATHER THAN `IFS=':' read`, because a filename may contain a
          # colon and a tag may not: the FIRST colon is the separator on both sides.
          # WHITESPACE IS STRIPPED FIRST, AND ITS ABSENCE COST A ROUND OF FIVE FAILED RUNS.
          #
          # MEASURED on run 43877785751: the tag arrived as "  iso-ubuntu-desktop" - two leading
          # spaces - and `pull-artifact.sh` asked the registry for a tag spelled that way:
          #
          #	=== manifest ghcr.io/easydev-org/easyvm:  iso-ubuntu-desktop
          #	##[error]  iso-ubuntu-desktop is not in the package
          #
          # The tag IS in the package; the spaces were. The expression below renders inside a `run:`
          # block with the indentation of the surrounding YAML, so the JSON arrives padded - which is
          # why the strip comes before anything else.
          # `printf '%s\n'` AND NOT `%s`: without the trailing newline the LAST pair never reaches
          # `read`, so a single asset would be skipped entirely and two would deliver one.
          # `tr -d ' \t'` AND NOT `[:space:]`: newlines must survive, because the sed below is
          # what creates them.
          # ONE LINE, THEN ONE PAIR PER LINE. The expression renders as JSON - possibly spread over
          # several lines with the indentation of this YAML - so newlines, tabs and spaces are all
          # removed first, the brackets are stripped, and the result is split on COMMAS.
          #
          # THREE ATTEMPTS AT THIS EACH BROKE A DIFFERENT SHAPE, and the shapes are why:
          #
          #	sed 's/","/NEWLINE/g'   misses "a", NEWLINE "b" - a list written over two lines
          #	IFS='|' read            misses everything - the separator is a colon
          #	printf '%s'              drops the LAST pair - no trailing newline means no last read,
          #	                         which is why the loop below also tests the variable
          #
          # `tr -d ' \t\n'` FOLLOWED BY `tr ',' '\n'` HAS NO SUCH GAP: the first makes one line out of
          # any layout, and the second splits on the one character JSON always puts between items.
          printf '%s' '${{ toJSON(matrix.assets) }}' | tr -d ' \t\n' \
            | sed -e 's/^\[//' -e 's/\]$//' -e 's/"//g' \
            | tr ',' '\n' \
            | while IFS= read -r pair || [ -n "$pair" ]; do
            [ -n "$pair" ] || continue
            tag=${pair%%:*}
            name=${pair#*:}
            [ -n "$tag" ] || continue
            dest="$GITHUB_WORKSPACE/work/$name"
            echo "=== pull $tag -> $dest"
            sh "$GITHUB_WORKSPACE/.github/pull-artifact.sh" ghcr.io "$repo" "$tag" "$dest" || {
              echo "::error::$tag is not in the package. This leg boots from it, so it cannot start."
              echo "::error::artifacts-publish.yml is what puts it there; read that job's log."
              exit 1
            }

            # EVERY ASSET IS A TAR, AND IT IS UNPACKED HERE.
            #
            # THAT IS THE ONE SHAPE THIS ENGINE UNDERSTANDS: a `fetch:` step used to exist because a
            # stage needed files that were not on disk yet - a firmware unpacked from a tar, an answer
            # CD assembled from an ISO - and that put "how to prepare a file" inside the walkthrough,
            # in a second place beside this one. There is one place now, and it is this step.
            #
            # A TAR OF ONE FILE IS STILL A TAR: an installer image arrives as `ubuntu.tar` holding
            # `ubuntu.iso`, so the walk's `iso: ubuntu.iso` is a name in the work directory whether
            # that thing came out of an archive or not. The archive is removed, because a 6 GiB ISO
            # plus the tar that held it is 12 GiB on a runner that does not have it.
            case "$dest" in
              *.tar)
                echo "=== unpack $dest"
                # THE NAME THE WALK ASKS FOR IS THE ONE THE ASSET DECLARED, and the member inside the
                # tar is whatever the publisher called it - `mirror-one.sh` writes `$tag`, so an image
                # arrives as `iso-blissos-16.9.7` while the walk's `needs:` says
                # `blissos-16.9.7.iso`. Unpacking and then renaming to `basename` minus `.tar` makes
                # the two agree without a table of exceptions here.
                before=$(mktemp)
                ls -1 "$GITHUB_WORKSPACE/work" > "$before"
                tar -xf "$dest" -C "$GITHUB_WORKSPACE/work"
                rm -f "$dest"
                wanted="$GITHUB_WORKSPACE/work/$(basename "$dest" .tar)"
                # THE ONE FILE THE ARCHIVE ADDED, when the name the walk wants is not there.
                if [ ! -e "$wanted" ]; then
                  added=$(ls -1 "$GITHUB_WORKSPACE/work" | grep -vxF -f "$before" | head -2)
                  if [ "$(printf '%s\n' "$added" | wc -l)" = "1" ]; then
                    mv "$GITHUB_WORKSPACE/work/$added" "$wanted"
                    echo "renamed $added -> $(basename "$wanted")"
                  fi
                fi
                rm -f "$before"

                # A `.template` MEMBER IS COPIED TO THE NAME THE WALK ASKS FOR, BECAUSE qemu WRITES
                # TO THE RESULT.
                #
                # AN ARTIFACT THAT IS READ IS PUBLISHED ONCE AND SHARED; a file a guest MODIFIES
                # cannot be, or the second guest inherits the first one's NVRAM. So the publisher
                # ships the untouched bytes under `X.template` and every leg copies it to `X`.
                #
                # THE COPY LIVES HERE RATHER THAN IN THE ENGINE because it used to live in
                # `internal/asset`, beside the `fetch:` step that pulled the tar - and deleting
                # `fetch:` deleted it. MEASURED on macos-setup run 45156593695: the leg stopped at
                # step 1/33 with "macos.vars is not in .../work", because the tar had delivered
                # `macos.vars.template` and nothing copied it.
                for t in "$GITHUB_WORKSPACE/work"/*.template; do
                  [ -e "$t" ] || continue
                  cp -f "$t" "${t%.template}"
                  echo "copied $(basename "$t") -> $(basename "${t%.template}")"
                done
                ;;
              *)
                echo "::error::$dest is not a tar. Every published asset is one, because a stage's"
                echo "::error::files have to arrive by one mechanism. See artifacts-publish.yml."
                exit 1
                ;;
            esac
            ls -l "$GITHUB_WORKSPACE/work"
          done

      # SEED THE DISK WITH AN SSH SERVER BEFORE ITS FIRST BOOT.
      #
      # The leg that follows this one exists only to get an ssh session. Every Linux leg used to
      # do that by TYPING `apt-get install openssh-server` into a desktop terminal, and MEASURED
      # over ten zorin runs the virtual keyboard drops and doubles characters at line boundaries;
      # one lost `'` leaves bash at a `>` prompt that swallows every later command, so the stage
      # reached `wait for sshd` having never run its install.
      #
      # `debugfs -w` cannot fix that either: it writes inodes without recomputing ext4's
      # `metadata_csum` bitmaps, and the guest's kernel answers "bad block bitmap checksum" and
      # systemd reports "Structure needs cleaning" - the files are there and invisible. So the
      # root filesystem is REBUILT the way microvm builds one: a tree, a chroot, `mke2fs -d`.
      #
      # MEASURED end to end on a real ubuntu disk: rdump 19 s, apt inside the chroot with no
      # /proc mounted printed "Proceeding anyway" and installed, `mke2fs -d -U <old uuid>` passed
      # `e2fsck -fn`, the disk came out with the SAME 128 GiB and the SAME partition table, and
      # the guest reached `ssh_ready="true"` with no keystroke at all.
      #
      # IT IS A MATRIX ROW, NOT AN INPUT: a leg that needs a seeded disk says so and no other leg
      # pays for it. `seed-family` picks the package manager; the script also probes, so a wrong
      # value is not fatal.
      - name: put an ssh server in the disk before it boots
        if: matrix.seed != '' && matrix.seed != 'false'
        run: |
          set -eu
          disk="$GITHUB_WORKSPACE/work/${{ matrix.out || 'disk.qcow2' }}"
          [ -s "$disk" ] || { echo "::error::no disk at $disk to seed"; exit 1; }

          # THE SCRIPT COMES FROM THE CALLER'S CHECKOUT, because that is where the walkthroughs
          # live and the seed program is theirs, not the engine's - the engine drives a machine,
          # it does not edit a filesystem.
          script="$GITHUB_WORKSPACE/scripts/seed-ssh.sh"
          [ -f "$script" ] || {
            echo "::error::this repository has no scripts/seed-ssh.sh but asked for a seeded disk"
            exit 1
          }

          chmod +x "$script"
          sh "$script" "$disk" "${{ matrix.seed-family || 'apt' }}"

          # THE CLAIM, CHECKED: the disk is still the size it was, so fstab, swap and growfs
          # assumptions still hold.
          echo "=== the seeded disk ==="
          qemu-img info "$disk" | grep -E 'virtual size|disk size'

      - name: the guest's memory has to fit in the runner's
        # A GUEST BIGGER THAN THE RUNNER IS KILLED BY THE OOM KILLER A FEW MINUTES IN, AND NOTHING IN
        # THE LOGS SAYS SO. MEASURED, from the macos26 stage that first asked 16384:
        #
        #	the guest was killed and disk.qcow2 was left at 194 KiB
        #
        # with no error in any log - the machine simply stopped being there. This stage now asks for
        # 12288 on windows and macos 15, and a standard `ubuntu-24.04` runner has sixteen.
        #
        # THE NUMBER COMES FROM THE FILE THIS LEG RUNS, so raising it there is caught here rather
        # than turning into a broken pipe nobody can attribute.
        #
        # `{print $NF}` READS BOTH SPELLINGS: a `.walk` writes `memory_mb == 12288` and a `.yaml`
        # writes `memory_mb: 12288`; the number is the last word either way.
        run: |
          set -eu
          file="${{ matrix.file }}"
          need_mib=$(grep -m1 'memory_mb' "$file" | awk '{print $NF}' | tr -cd '0-9')
          if [ -z "$need_mib" ]; then
            echo "the guest size is the engine's default; $file names none"
            exit 0
          fi
          need_gib=$(( need_mib / 1024 ))
          total_kib=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
          total_gib=$(( total_kib / 1024 / 1024 ))
          # THE NUMBER IS PRINTED EVEN WHEN IT PASSES, because "this runner has 7 GiB" is the one
          # fact a reader needs when the same commit succeeds in one repository and fails in another.
          # MEASURED 2026-11-21: three different hosted runners in one group all reported 7, while a
          # run of the same stage.yml from easydev-org/easyvm an hour earlier had enough for an
          # 8 GiB guest - so the size is not something a repository can assume about its runners.
          echo "runner memory: ${total_gib} GiB total ($(( total_kib / 1024 )) MiB); this guest asks for ${need_gib} GiB plus 2 GiB of margin"
          # ONE GIBABYTE OF MARGIN, AND THE NUMBER IS A TRADE RATHER THAN A MEASUREMENT.
          #
          # The old margin was two, on the measurement that qemu's own RSS on top of a 12 GiB guest is
          # 12.01 GiB - i.e. the daemon costs about a hundredth of a gigabyte, and the two was
          # headroom rather than arithmetic. MEASURED 2026-11-21: every hosted runner in this group
          # reports `7932 MiB` total, which is 7 GiB after the integer division, so a two-GiB margin
          # refused an 8 GiB guest on a machine with 7.7 GiB of RAM - a guest that had 1.7 GiB of real
          # headroom would have been turned away.
          #
          # IT IS STILL A REAL CHECK: the daemon, qemu's device models and the page cache all live in
          # the same RAM, and an over-committed host does not fail politely - the OOM killer takes the
          # guest minutes in and leaves an almost empty disk with nothing in any log.
          if [ "$(( need_gib + 1 ))" -gt "$total_gib" ]; then
            echo "::error::$file asks for ${need_gib} GiB and this runner has ${total_gib} GiB."
            echo "::error::The OOM killer would take the guest a few minutes in, leaving an almost"
            echo "::error::empty disk and no error in any log. Lower memory_mb or use a larger runner."
            exit 1
          fi
          echo "runner: ${total_gib} GiB, guest: ${need_gib} GiB (from $file)"

      - name: start the daemon
        # ONE PROCESS OWNS THE MACHINE FOR THE WHOLE STAGE. It runs in the background because
        # `easyvm run` is a CLIENT: it sends a request and returns, and the daemon drives the file.
        #
        # THE READY LINE IS THE CONTRACT, not the socket file: a file that exists is not a daemon that
        # answers. The output is CAPTURED FIRST and matched with `case`, because `| grep -q` closes the
        # pipe on its first match, the writer takes SIGPIPE, and `set -o pipefail` turns that into exit
        # 141 for a check that SUCCEEDED.
        run: |
          set -eu
          # THERE IS NO `--novnc-port` ANY MORE, AND PASSING IT KILLED EVERY CI LEG AT STARTUP.
          #
          # The console used to be a second HTTP server on :6080. It is now served by the daemon's own
          # listener on :8080 - one port, bound once - and the flag was deleted with it. This line was
          # not, so the daemon refused to start:
          #
          #	flag provided but not defined: -novnc-port
          #	Usage of serve: -http string ... -work string ...
          #
          # and every install leg failed in 312 bytes of log with NO VIDEO AT ALL, because a machine
          # that never started records nothing. Three workflows, one flag.
          # THE PACKAGE THIS GUEST WRITES TO IS THIS REPOSITORY, AND IT IS SAID OUT LOUD.
          #
          # `internal/asset` FALLS BACK TO ONE HARD-CODED NAME when `DISKS_REPOSITORY` is empty -
          # correct for the product, wrong for every fork, and a fork has no credentials for it. A
          # `fetch:` step that runs inside this daemon would therefore publish into `easydev-org/easyvm`
          # and be refused with a 403 that names the registry rather than the variable.
          #
          # THE LEGS BELOW DO NOT FETCH: every input arrives by `pull-artifact.sh` before the walk
          # starts, which is the rule this stage is built on. This is the belt for the one step that
          # forgets, and it is the fork's own name rather than a second default.
          export DISKS_REPOSITORY="$(printf '%s' "${{ inputs.publish_repository || github.repository }}" | tr '[:upper:]' '[:lower:]')"
          # THE DAEMON'S OWN FETCHES NEED THE SAME TOKEN THE STEPS USE, AND THIS IS WHERE THE
          # `vm-configure` LEG LEARNED IT.
          #
          # MEASURED ON RUN 44886759231 (`windows-vm-configure`, step 4/28 "unpack the agent and its
          # driver from the prepared ISO"):
          #
          #	error: the virtio-win ISO is not here and could not be fetched: pulling iso-virtio-win
          #	from easydev-org/easyvm-windows: ... needs credentials (401); a public artifact needs none
          #
          # THAT SENTENCE IS TRUE AND THE FAULT WAS HERE. A `fetch:` step runs INSIDE THE DAEMON, not
          # in the step that started it, so the token each pull step exports for itself never reaches
          # this process. In easydev-org/easyvm the package is public and an anonymous pull answers
          # 200, so the omission was invisible; in a repository whose package is private it fails at
          # the one step that fetched a driver mid-walk.
          export GITHUB_TOKEN="${{ github.token }}"
          # THERE IS NO `--shapes`: the machine a leg starts is the `machine:` and `args:` its own
          # walk wrote, so the daemon loads no registry and reads no directory beside the image.
          easyvm serve --work "$GITHUB_WORKSPACE/work" \
            > "$GITHUB_WORKSPACE/work/daemon.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/work/daemon.pid"
          for i in $(seq 1 30); do
            logs=$(cat "$GITHUB_WORKSPACE/work/daemon.log" || true)
            case "$logs" in *"listening on"*) break ;; esac
            sleep 1
          done
          logs=$(cat "$GITHUB_WORKSPACE/work/daemon.log" || true)
          printf '%s\n' "$logs"
          case "$logs" in
            *"listening on"*) echo "the daemon is up" ;;
            *) echo "=== THE DAEMON DID NOT COME UP ==="; exit 1 ;;
          esac

      - name: ask for the run
        # THE FILE IS THE ARGUMENT. `--boot-disk` names what to start and `--out` where a `compress:`
        # writes - both are facts about the job, so they are flags and not YAML.
        run: |
          set -eu
          disk_args=""
          if [ -f "$GITHUB_WORKSPACE/work/disk.qcow2" ]; then
            disk_args="--boot-disk $GITHUB_WORKSPACE/work/disk.qcow2"
          fi
          # THE PASSWORD COMES FROM THE WALK, NOT FROM THIS LINE.
          #
          # MEASURED ON THE PUBLISHED `linux-opensuse-leap-16.1` DISK, booted in a local pod and asked
          # directly. The console logins fine with the password its own install walk set (`Qz7vLp2w`),
          # and sshd then reports
          #
          #	sshd-session[11671]: pam_unix(sshd:auth): authentication failure; ... user=vmuser
          #	sshd-session[11671]: Failed password for vmuser from 172.30.0.1 port 54708 ssh2
          #
          # because THIS LINE PASSES `--password admin`, WHICH OVERRIDES THE WALK'S DEFAULT. A walk that
          # says `password Qz7vLp2w` is parsed as `{from: args.password, default: Qz7vLp2w}`, so this
          # flag replaces the one value the file chose and the guest never had.
          #
          # EVERY GUEST WHOSE PASSWORD IS NOT `admin` was therefore unusable over ssh, however correct
          # its walk - opensuse-leap-16.1 is the one that failed loudly enough to be measured.
          #
          # `${{ inputs.password }}` IS EMPTY UNLESS A CALLER ASKS FOR ONE, so the walk's own default
          # stands by default and a caller can still override it deliberately.
          pw_args=""
          if [ -n "${{ inputs.password }}" ]; then
            pw_args="--password ${{ inputs.password }}"
          fi
          # shellcheck disable=SC2086
          easyvm run "$GITHUB_WORKSPACE/${{ matrix.file }}" \
            --work "$GITHUB_WORKSPACE/work" \
            $disk_args \
            --out "$GITHUB_WORKSPACE/work/${{ matrix.out }}" \
            $pw_args \
            || {
              echo "=== THE DAEMON REFUSED THE RUN ==="
              cat "$GITHUB_WORKSPACE/work/daemon.log"
              exit 1
            }

      - name: follow it
        # THE WALK IS STREAMED TO A CHECK RUN, SO IT CAN BE WATCHED WHILE IT RUNS.
        #
        # THIS STEP'S OWN COMMENT NAMED THE PROBLEM BEFORE IT WAS STREAMED: "a step that runs for an
        # hour has invisible stdout until it ends, and 'which step is it on' is the one question an
        # in-progress stage has". `$GITHUB_STEP_SUMMARY` was the workaround - a table someone has to
        # expand, not the log.
        #
        # THE ACTIONS LOG IS UNREADABLE UNTIL THE STEP FINISHES; A CHECK RUN'S `output.text` IS, and
        # `easyactions/log-stream` publishes the newest 60,000 characters to one every ten seconds.
        #
        # IT NEEDS NOTHING BUT curl. That action used to be a Python script, and THIS image has no
        # interpreter on purpose - the driver is Go and speaks QMP directly - so it refused to start in
        # the one place a three-hour leg lives. It is a shell script now, and the jq it would otherwise
        # need was replaced with sed.
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ${{ matrix.name }}-live
          interval: "10"
          max_bytes: "60000"
          command: |
            set -eu
            summary=${GITHUB_STEP_SUMMARY:-/dev/null}
            printf '| time | state |\n|---|---|\n' >> "$summary"
            # THE LOOP MUST END BEFORE GITHUB ENDS THE JOB, OR THE DIAGNOSIS IS NEVER PRINTED.
            #
            # This was `timeout + 5`, which is five rounds PAST the job's own `timeout-minutes`. Every
            # leg that overran was therefore killed by the runner mid-sleep, and the line a person
            # needs
            #
            #	=== THE WALKTHROUGH DID NOT FINISH IN TIME ===
            #	<daemon.log: the step it was on and the error it hit>
            #
            # NEVER APPEARED. Measured on macos-setup: 97 minutes in `follow it`, still going, with 150
            # for the job - so its conclusion was going to be an opaque cancellation and not a reason.
            #
            # TEN MINUTES OF HEADROOM, because the two steps after this one are not instant either:
            # `what it produced` lists and the artifact upload pushes the disk, which is gigabytes.
            #
            # POSIX SH ONLY, BECAUSE A `container:` JOB RUNS STEPS WITH /bin/sh. `$SECONDS` is bash and
            # dash does not define it, and `set -o pipefail` is ignored rather than refused.
            limit=$(( ${{ matrix.timeout }} - 10 ))
            rounds=0
            while [ "$rounds" -lt "$limit" ]; do
              rounds=$((rounds + 1))
              state=$(easyvm status --work "$GITHUB_WORKSPACE/work" 2>&1 || true)
              printf '%s\n' "$state"
              printf '| %s | %s |\n' "$(date -u +%H:%M:%S)" "$(printf '%s' "$state" | head -1)" >> "$summary"
              case "$state" in
                *"status: finished"*)
                  echo "=== THE WALKTHROUGH FINISHED ==="
                  cat "$GITHUB_WORKSPACE/work/daemon.log" 2>/dev/null || true
                  exit 0 ;;
                *"status: failed"*)
                  echo "=== THE WALKTHROUGH FAILED ==="
                  cat "$GITHUB_WORKSPACE/work/daemon.log" 2>/dev/null || true
                  # THE NETWORK, WHEN THE GUEST IS UP AND NOTHING CAN REACH IT.
                  #
                  # MEASURED on bsd ssh, run 45103494289: the console log showed `Starting sshd.`, a
                  # DHCP lease on 172.30.0.2, and the probe still answered
                  #
                  #	ssh probe: dial tcp 172.30.0.1:2222: i/o timeout
                  #
                  # The same disk, booted in the cluster's own lab pod on this same image, answered a
                  # `TCP connect` and an `SSH-2.0-OpenSSH_10.0 FreeBSD` banner on 172.30.0.1:2222 -
                  # so the engine's forwarding is right and something about THIS runner's network is
                  # not. These five commands are what tells the two apart, and none of them was in the
                  # log that took an hour to read.
                  echo "=== THE NETWORK AS THE RUNNER HAS IT ==="
                  ip -4 addr show 2>&1 | head -30 || true
                  echo "--- the route to the guest ---"
                  ip route get 172.30.0.2 2>&1 || true
                  echo "--- the bridge and the tap ---"
                  ip link show type bridge 2>&1 | head -10 || true
                  ip link show type tap 2>&1 | head -10 || true
                  echo "--- the nat table (DNAT lives here) ---"
                  iptables -t nat -S 2>&1 | head -40 || true
                  echo "--- the filter table (FORWARD policy drops the reply) ---"
                  iptables -S FORWARD 2>&1 | head -20 || true
                  echo "--- the guest, from the container ---"
                  printf '%s\n' 'import socket' \
                    'for host, port in (("172.30.0.1", 2222), ("172.30.0.2", 22)):' \
                    '    s = socket.socket(); s.settimeout(4)' \
                    '    try:' \
                    '        s.connect((host, port))' \
                    '        b = s.recv(60) if port == 2222 else b""' \
                    '        print(host, port, "OPEN", b)' \
                    '    except Exception as e:' \
                    '        print(host, port, type(e).__name__, e)' \
                    '    finally:' \
                    '        s.close()' > /tmp/probe.py
                  python3 /tmp/probe.py 2>&1 || true
                  exit 1 ;;
              esac
              sleep 60
            done
            echo "=== THE WALKTHROUGH DID NOT FINISH IN TIME ==="
            cat "$GITHUB_WORKSPACE/work/daemon.log" 2>/dev/null || true
            exit 1

      - name: what it produced
        if: always()
        run: |
          set -u
          ls -l "$GITHUB_WORKSPACE/work/" || true
          for f in "$GITHUB_WORKSPACE"/work/*.qcow2; do
            [ -e "$f" ] || continue
            printf '%s: %s MiB\n' "$f" "$(( $(stat -c %s "$f") >> 20 ))"
          done

      # THE ONE FAILURE THAT LEAVES NO FAILURE BEHIND.
      #
      # A LEG WHOSE QMP SOCKET WAS DELETED OUT FROM UNDER IT DOES NOT REPORT AN ERROR AT THE MOMENT OF
      # DAMAGE. The guest keeps running, the daemon keeps answering, and every `/api/click` returns
      # {"ok":true} while the pointer on the screen never moves:
      #
      #	could not read the screen: qmp /work/drive.sock.qmp: connect: no such file or directory
      #	(waited 30s; is another process already holding this socket? qemu permits one client)
      #
      # MEASURED on the lab pod, where it cost forty minutes of a walk that looked like a dead widget.
      # The cause was `_ = os.Remove(qmpPath)` running unconditionally in `Boot`, and the fix is the
      # live-socket probe in front of it. THIS STEP IS WHAT NOTICES A REGRESSION OF THAT FIX, and it
      # is here rather than in one workflow because the mechanism is not OS-specific: a socket that
      # vanished is a machine nothing could drive, whatever the guest was.
      - name: the machine was never orphaned from its own socket
        if: always()
        run: |
          set -u
          log="$GITHUB_WORKSPACE/work/daemon.log"
          if [ ! -f "$log" ]; then
            echo "no daemon log at $log; nothing to check"
            exit 0
          fi

          # A MISSING SOCKET, AS THE DAEMON ITSELF WORDED IT. Every mid-run occurrence is counted
          # because one is enough: the step that hit it is the step that silently did nothing.
          missing=$(grep -c "connect: no such file or directory" "$log" 2>/dev/null || true)
          missing=${missing:-0}
          if [ "$missing" != "0" ]; then
            echo "=== THE MACHINE LOST ITS QMP SOCKET $missing TIME(S) ==="
            grep -n "no such file or directory" "$log" | head -10
            echo
            echo "A walk in this state reports success on steps that did nothing, so its disk and its"
            echo "screenshots cannot be trusted. `Boot` must probe a live socket and REFUSE to delete"
            echo "it - see probeUnixSocket in internal/daemon/driver.go."
            exit 1
          fi

          echo "the machine kept its qmp socket for the whole leg"

      - name: stop the daemon
        if: always()
        run: |
          set -u
          if [ -f "$GITHUB_WORKSPACE/work/daemon.pid" ]; then
            pid=$(cat "$GITHUB_WORKSPACE/work/daemon.pid")
            kill "$pid" 2>/dev/null || true
            easyvm stop --work "$GITHUB_WORKSPACE/work" 2>/dev/null || true
            sleep 5
            kill -9 "$pid" 2>/dev/null || true
          fi
          pgrep -a qemu-system-x86_64 || true

      # PARTING A DISK IS THE PIPELINE'S WORK, NOT THE DAEMON'S.
      #
      # A UEFI guest that installs a loader into /EFI/<vendor> and registers it with efibootmgr
      # leaves an entry in the VARIABLES store - which this engine deliberately makes fresh every
      # boot, so no guest inherits another's NVRAM. Firmware with an empty NVRAM looks in exactly one
      # place, \EFI\BOOT\BOOTX64.EFI, and a disk whose loader is elsewhere does not start:
      #
      #	BdsDxe: failed to load Boot0002 "UEFI QEMU HARDDISK QM00011" ... : Not Found
      #	BdsDxe: No bootable option or device was found.
      #
      # MEASURED on android blissos 16.9.7, whose installer finished with "Congratulations!" and
      # whose ESP held a complete /EFI/BLISSOS tree.
      #
      # THE DAEMON USED TO DO THIS ITSELF, as an `esp_fallback:` verb with a hand-written FAT32
      # driver - 552 lines of GPT parsing, qemu-io hex dumps, cluster chains and directory entries.
      # It worked and it did not belong there: the engine drives a machine, it does not edit a
      # filesystem. `mtools` reads and writes the same structures a partition at a byte offset in one
      # command, and both halves were checked against a REAL published disk - the same file list, the
      # same sizes, the same rewritten config.
      #
      # THE DECLARATION IS THE MATRIX, so a stage that needs it says so and no other stage pays:
      #
      #	"disk-parted": {"from": "/EFI/BLISSOS", "search": "/android-2024-10-11/kernel"}
      #
      # `from` is the directory the installer wrote. `search` is optional: when it is given, a
      # `search.fs_uuid <uuid>` line in the copied GRUB.CFG is replaced with a
      # `search --file <that path>` - because the installer records the UUID BEFORE it formats the
      # partition, so the value names a filesystem that does not exist.
      - name: part the disk, for a firmware that has no boot entry
        if: matrix.disk-parted.from != ''
        run: |
          set -eu
          out="$GITHUB_WORKSPACE/work/${{ matrix.out }}"
          [ -s "$out" ] || { echo "no disk at $out to part"; exit 1; }
          from='${{ matrix.disk-parted.from }}'
          search='${{ matrix.disk-parted.search }}'

          # THE ESP'S OFFSET, READ FROM THE GPT. THE SCRIPT IS ENCODED HERE RATHER THAN NAMED.
          #
          # A REUSABLE WORKFLOW CANNOT READ ITS OWN REPOSITORY AT RUNTIME: `$GITHUB_WORKSPACE` is the
          # CALLER's checkout, so `python3 .github/esp-offset.py` answered
          #
          #   can't open file '/__w/easyvm-android/easyvm-android/.github/esp-offset.py'
          #
          # on the first android leg that reached this step. It is the trap `pull-artifact.sh`
          # documents, and the answer is the same: carry the work where it runs.
          #
          # AND IT IS BASE64 RATHER THAN A `<<'EOF'` HEREDOC, because a `run: |` block is a YAML
          # scalar: every line must be indented to the block's column, and a heredoc terminator must
          # be at column zero. The two cannot both be true. One long line has no such problem.
          esp=$(printf '%s' '' | base64 -d | python3 - "$out")
          echo "=== the ESP is at byte $esp of $(basename "$out")"

          # mtools READS A RAW IMAGE AND NOT A QCOW2, MEASURED: the same command that lists the ESP
          # of a raw file answers `init :: non DOS media` for the qcow2 it came from. So the disk is
          # unpacked, edited, and packed back - and the round trip is sparse, so a 128 GiB disk costs
          # the blocks it actually holds.
          raw="$GITHUB_WORKSPACE/work/$(basename "$out" .qcow2).raw"
          qemu-img convert -f qcow2 -O raw "$out" "$raw"

          dev="$raw@@$esp"
          mdeltree -i "$dev" ::/EFI/BOOT 2>/dev/null || true
          mmd -i "$dev" ::/EFI/BOOT
          mcopy -i "$dev" -n "::$from"/*.EFI ::/EFI/BOOT/
          # THE MENU THE CONFIG SOURCES LIVES BESIDE IT.
          mcopy -i "$dev" -n "::$from"/*.CFG ::/EFI/BOOT/ 2>/dev/null || true
          if [ -n "$search" ]; then
            mtype -i "$dev" "::$from"/GRUB.CFG \
              | sed "s|^search\.fs_uuid .*|search --no-floppy --set=root --file $search|" \
              > "$GITHUB_WORKSPACE/work/grub.cfg"
            # THE OLD COPY IS DELETED FIRST. `mcopy` ONTO AN EXISTING NAME EXITS 1 AND WRITES
            # NOTHING - MEASURED on the real disk: rc=1 and the file still began `search.fs_uuid`.
            # A rewrite that silently keeps the stale config is the one failure this step exists to
            # prevent, so the delete is not tidiness.
            mdel -i "$dev" ::/EFI/BOOT/GRUB.CFG 2>/dev/null || true
            mcopy -i "$dev" "$GITHUB_WORKSPACE/work/grub.cfg" ::/EFI/BOOT/GRUB.CFG
            rm -f "$GITHUB_WORKSPACE/work/grub.cfg"
          fi

          # THE CLAIM, CHECKED: the loader is at the one path an empty NVRAM looks at, and it is
          # the installer's own file rather than an empty placeholder.
          mdir -i "$dev" ::/EFI/BOOT
          size=$(mdir -i "$dev" ::/EFI/BOOT | awk '$1 ~ /X64/ && $2 == "EFI" {print $3; exit}')
          [ -n "$size" ] && [ "$size" -gt 100000 ] || {
            echo "::error::/EFI/BOOT has no BOOTX64.EFI of a real size (got [$size])"
            exit 1
          }
          echo "=== /EFI/BOOT/BOOTX64.EFI is $size bytes"

          # BACK TO A QCOW2, IN PLACE, because that is what the next stage pulls.
          qemu-img convert -f raw -O qcow2 -c "$raw" "$out"
          rm -f "$raw"
          echo "=== /EFI/BOOT holds the loader"

      - name: publish the disk
        # A LEG THAT PRODUCED A DISK PUBLISHES IT, AND THAT IS HOW THE NEXT STAGE GETS ITS INPUT.
        #
        # THE TRANSFER IS `oci-push`, NOT FIFTY LINES OF `oras login` AND `oras push`. The action adds
        # the four things this step used to do by hand and one it did not:
        #
        #	IDEMPOTENT oras INSTALL   it was a block in every leg's prepare; now it is where it is used
        #	EXPLICIT LOGIN            oras reads no GITHUB_TOKEN from the environment, so an anonymous
        #	                          push is answered `DENIED`, which reads like a package permission
        #	SHA256 + --distinct-from  a stage that was supposed to change the disk and did not is a
        #	                          failure, not a republish of identical bytes
        #	--stamp                   a tag nothing has to invent twice
        #
        # THE FILE IS CHECKED BEFORE ANYTHING IS PUSHED. An `install` declares `out:` and a
        # `vm-configure` does too, while an `ssh` leg had no `compress:` for months - so "no disk"
        # is a warning, and a disk below the floor is a refusal.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # THE LEG'S OWN FLOOR, OR THE INPUT'S DEFAULT WHEN IT DECLARES NONE.
          disk_floor_mb: ${{ matrix.floor_mb || inputs.disk_floor_mb }}
        run: |
          set -u
          # AN EMPTY `out:` IS A STAGE THAT PUBLISHES NO DISK, and it is its own case rather than a
          # missing file. With `matrix.out` empty the path below is `work/` - A DIRECTORY, which `-s`
          # accepts - so the floor check read 4096 bytes from `stat` and answered "this is a qcow2
          # header with nothing written to it" about a stage that never had a disk to begin with.
          #
          # MEASURED on the first smoke runs (4517...): four of four walk steps passed, including
          # `BdsDxe: starting` in two seconds, and the leg still reported failure because of this.
          if [ -z "${{ matrix.out }}" ]; then
            echo "this stage declares no \`out:\`, so it publishes no disk; its artifact is the recording"
            exit 0
          fi
          out="$GITHUB_WORKSPACE/work/${{ matrix.out }}"
          if [ ! -s "$out" ]; then
            echo "no disk to publish at $out (the stage may not write one)"
            ls -l "$GITHUB_WORKSPACE/work/" || true
            exit 0
          fi

          # A DISK THAT WAS NEVER WRITTEN IS NOT A DISK, AND `-s` CANNOT TELL THE DIFFERENCE.
          #
          # `qemu-img create` writes a 197,632-BYTE qcow2 - a header and nothing else - so a walk whose
          # every click landed on the wrong pane still produces a file that `-s` accepts. MEASURED ON
          # linux-zorin: the install leg reported success, `oras push` published it, and `linux-zorin`
          # sat beside a 0 MiB file in the package. The next stage then pulled a disk with no system on
          # it and failed somewhere unrelated.
          #
          # THE FLOOR IS AN INPUT (`disk_floor_mb`, overridable per leg with `floor_mb`) AND ITS DEFAULT
          # IS STILL 512 MiB. A bare qcow2 header is 0.19 MiB, so any floor anywhere near 512 catches
          # it; what the floor must NOT do is refuse a real system. MEASURED, that is exactly what it
          # did: a complete NetBSD 11.1 - every set, a tree that boots to `login:` - compresses to
          # 535,887,872 bytes, 511.0 MiB, and this check refused it. The workaround at the time was to
          # write 1.1 GiB of /dev/urandom into swap, which satisfied the check and made the published
          # size a lie about the contents. So the leg that knows its system is small declares its own
          # floor, and the check keeps catching the case it was written for.
          floor="${disk_floor_mb}"
          case "$floor" in ''|*[!0-9]*) floor=512 ;; esac
          size=$(stat -c %s "$out")
          if [ "$size" -lt $((floor * 1024 * 1024)) ]; then
            echo "::error::$out is $size bytes, below the ${floor} MiB floor for an installed system."
            echo "::error::This is a qcow2 header with nothing written to it - the walk's clicks did"
            echo "::error::not reach the installer's disk. Publishing it would put a disk with no"
            echo "::error::system behind a tag the next stage pulls."
            ls -l "$GITHUB_WORKSPACE/work/" || true
            exit 1
          fi

          # `matrix.publish` IS THE TAG, AND `matrix.name` IS ONLY THE JOB'S NAME.
          #
          # THEY WERE THE SAME THING AND THEY MUST NOT BE. Each leg pulls the disk the PREVIOUS stage
          # produced - install -> ssh -> vm-configure - so the install leg's disk has to be published
          # under the name the ssh leg asks for, which is the OS's own name and not the leg's:
          #
          #	install leg   name=linux-zorin-install    publishes  linux-zorin
          #	ssh leg       name=linux-zorin-ssh        publishes  linux-zorin-ssh   (pulls linux-zorin)
          #	vm leg        name=linux-zorin-vm         publishes  linux-zorin-vm    (pulls linux-zorin-ssh)
          #
          # PUBLISHING UNDER `matrix.name` MEANT the install leg wrote `linux-zorin-install` while every
          # ssh leg pulled `linux-zorin`, so the two names never met and a fresh package could never
          # boot an installed disk.
          tag="${{ matrix.publish }}"
          if [ -z "$tag" ]; then tag="${{ matrix.name }}"; fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "out=$out" >> "$GITHUB_ENV"

      - name: push the disk
        # THE PUSH ITSELF, AS A STEP OF ITS OWN, BECAUSE AN ACTION IS A STEP AND `oci-push` IS WHAT
        # KNOWS THE REGISTRY. The step above decided WHETHER there is a disk and wrote `out=` and
        # `tag=` to the environment; this one moves it.
        #
        # `env.out` IS EMPTY WHEN THERE WAS NOTHING TO PUBLISH, and an action given an empty `path`
        # would fail a leg whose walkthrough legitimately writes no disk. So the guard is the
        # variable the previous step set, not `always()`.
        if: env.out != '' && env.tag != '' 
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ env.out }}
          tag: ${{ env.tag }}
          repository: ${{ inputs.publish_repository || github.repository }}
          media-type: application/vnd.easydev.qcow2
          token: ${{ github.token }}
          check-name: ${{ matrix.name }}-publish

      # THE RECORDING IS ITS OWN ARTIFACT, AND IT IS THE FIRST ONE TO OPEN AFTER A FAILURE.
      #
      # MEASURED: `linux-cachyos-vm` was ONE artifact of 7,362,380,205 bytes - the recording, the
      # daemon log, the console log AND the 128 GiB qcow2 in one zip. GITHUB'S ARTIFACT API CANNOT
      # EXTRACT A SINGLE MEMBER, so watching the video meant downloading the disk. That is the
      # opposite of what a post-mortem needs: the video is tens of megabytes and answers "what was on
      # screen", while the disk is the file nobody looks at until a leg passes.
      #
      # THREE ARTIFACTS, AND EACH HAS ONE REASON TO EXIST:
      #
      #   <leg>-video   the recording                      open it first, always
      #   <leg>-logs    daemon.log and console.log          the guest's own words
      #   <leg>-disk    the qcow2                           only a PASSING leg's disk matters
      #
      # THE DISK IS NOT HOW A DOWNSTREAM STAGE GETS ITS INPUT: `oras push` writes it and `easyvm
      # pull` reads it back, which is why this artifact is archive rather than transport.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-video
          path: |
            work/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-logs
          path: |
            work/daemon.log
            # THE GUEST'S OWN SERIAL CONSOLE, WHICH IS THE ONLY RECORD OF WHAT THE FIRMWARE DID.
            #
            # MEASURED ON UBUNTU-INSTALL: `console.log` was 24 KB - the firmware had booted something,
            # and its output is the only place that says WHAT - and the artifact carried only
            # `disk.qcow2` and `daemon.log`, so the one file that would have answered it was thrown
            # away. The step's failure said `drop=+0.0 ... on a 1920x1080 frame`, which is a black
            # screen and no reason.
            work/console.log
          if-no-files-found: warn
          retention-days: 7

      # THE DISK IS NOT AN ARTIFACT. IT GOES TO ghcr AND NOWHERE ELSE.
      #
      # THIS UPLOAD WAS 22 GiB ON `windows-install` - the qcow2 of a whole Windows guest, zipped and
      # pushed a second time, to storage that is not what a downstream stage reads and not what a
      # post-mortem opens.
      #
      # THE THREE ARTIFACTS ABOVE EACH HAVE A READER:
      #
      #   <leg>-video   the recording          "what was on screen" - tens of megabytes
      #   <leg>-logs    daemon.log, console.log  "what the guest said" - kilobytes
      #   (nothing)     the qcow2              the disk is TRANSPORT: `oci-push` writes it and
      #                                        `pull-artifact.sh` reads it back, which is what the
      #                                        next stage actually runs
      #
      # MEASURED: `windows-install` succeeded, published `windows11` (10,786 MiB in ghcr), and then
      # spent SEVEN MINUTES re-uploading the same file as a 22,133,669,203-byte artifact. Every
      # passing install leg would pay that, on every run, for a file nobody downloads: a leg that
      # passes needs no post-mortem, and a leg that fails has no disk worth reading.
      #
      # A FAILING LEG'S DISK IS STILL RECOVERABLE from the work directory in the job log's own
      # `what it produced` listing, and the two files that DO explain a failure - the recording and
      # the guest's console - are already separate artifacts.
