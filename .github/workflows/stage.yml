name: stage

# THE ONE COPY OF "HOW A STAGE RUNS", CALLED BY ONE WORKFLOW PER OPERATING SYSTEM.
#
# WHY THIS EXISTS RATHER THAN ONE BIG MATRIX.
#
# A single `walkthrough.yml` with 21 legs under one `concurrency:` group means DISPATCHING TO TEST
# LINUX CANCELS A RUNNING WINDOWS INSTALL. That is not a hypothetical: it happened, and forty minutes
# of a Windows install were thrown away so a Linux fix could be measured. The concurrency group exists
# to stop two runs fighting over one machine, and a matrix leg is not one machine - every leg gets its
# own runner.
#
# WHY IT IS ONE FILE AND NOT TWENTY-SIX.
#
# easydiskbake has 26 workflows, and the same container stanza appears in 23 of them - 73 duplicated
# lines of `options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN`. Copying that shape
# would reintroduce exactly the "one fact in many places" this port keeps removing, and the first time
# a device or a capability changed, twenty-three files would need the same edit.
#
# SO: THE MECHANISM IS HERE ONCE, AND EACH OS FILE DECLARES ONLY ITS OWN MATRIX. Windows gets its own
# concurrency group, Linux its own, and one can be re-run while another is installing.

on:
  workflow_call:
    inputs:
      stages:
        description: "the matrix legs this workflow runs"
        type: string
        required: true
      # A NAME FOR THE CONCURRENCY GROUP. One per operating system, so that re-running Linux does not
      # cancel a Windows install - which is the whole reason this file exists.
      group:
        description: "the concurrency group, one per OS"
        type: string
        required: true
      # THE DEFAULT TAG EACH LEG PULLS. A stage that installs has none.
      disks_repository:
        type: string
        default: "easydev-org/easyvm"

# NO WORKFLOW-LEVEL `concurrency` HERE. THE CALLER OWNS THE RUN.
#
# A reusable workflow is part of its caller's run, and declaring `concurrency` inside it makes GitHub
# reject the reference - the symptom is a run with ZERO JOBS and no log line, which is what run
# 43069605983 showed. The group belongs to the file a person dispatches, and each operating system's
# file already declares its own.

jobs:
  stage:
    runs-on: ubuntu-24.04
    # THE LEG'S OWN TIMEOUT, NOT ONE NUMBER FOR ALL. A 150-minute macOS install must not be bounded by
    # a default chosen for a 70-minute Windows stage.
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # THE THREE THINGS EVERY GUEST NEEDS, IN ONE PLACE. `--device /dev/net/tun` is the tap the NIC is
      # attached to; `--cap-add NET_ADMIN` creates the tap, the bridge and the iptables rules;
      # `--device /dev/kvm` is the accelerator, without which a macOS guest cannot be given `+invtsc`
      # and deadlocks, and every other guest runs fifty times slower.
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    # `packages: READ` WAS THE 403. The install leg publishes its disk with `oras push`, and a
    # read-only token cannot create a package version at all:
    #
    #	FAILED: the registry refused a pull,push token (HTTP 403):
    #	{"errors":[{"code":"DENIED","message":"requested access to the resource is denied"}]}
    #
    # measured on linux-opensuse-tumbleweed-install, whose 3927 MiB disk was finished and could not
    # be published. `write` covers read as well, which is what the pull side needs.
    permissions:
      contents: read
      packages: write
      # `checks: write` IS WHAT PUBLISHES THE LIVE LOG, AND IT IS NOT GRANTED BY DEFAULT.
      #
      # `follow it` streams to a CHECK RUN because a step's Actions log cannot be read until the step
      # ends. MEASURED: without this line the POST is refused, the action falls back to running the
      # command unpublished, and the whole feature looks like a no-op - there is no error in the step's
      # own output, because a stream that cannot publish still runs the command by design.
      checks: write
    strategy:
      # EVERY LEG AT ONCE. Each matrix leg gets its own runner, with its own /dev/kvm and its own
      # container, so the legs do not compete - and `max-parallel: 1` would make a stage wait for the
      # sum of every stage before it rather than the longest.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stages) }}
    steps:
      - uses: actions/checkout@v4

      # THE DEVICES AND THE DISK, BY THE ORGANISATION'S ACTION.
      #
      # THIS REPLACES THIRTY LINES OF HAND-WRITTEN PROBES that three other repositories had their own
      # copy of. The action checks the same things and two that this step did not:
      #
      #	/dev/kvm OPENS            not `test -e`: on a GitHub runner the node is 0o660 root:kvm and
      #	                          the job's uid is neither, so a permission test says no about a
      #	                          device that works. The action opens it and chmods 0666 when needed.
      #	qemu ACCELERATES           the handshake behind the open. `test -e /dev/kvm` PASSED on run
      #	                          43063744565 while qemu fell back to TCG, and the symptom was not an
      #	                          error - the guest booted, everything took fifty times as long, and
      #	                          macOS could not get the CPU flags it needs.
      #	/dev/net/tun MAKES A TAP  not `test -e`: `ip tuntap add` is the only call that tests the node
      #	                          and the NET_ADMIN capability together.
      #	DISK                      the leg writes a 128 GiB qcow2, reads a 7 GiB ISO and keeps an mp4.
      #	                          The action prunes what a VM job never uses - .NET, Android, GHC,
      #	                          CodeQL - and fails BEFORE the install rather than forty minutes into
      #	                          it with `no space left on device`.
      - name: prepare
        uses: easydev-org/easyactions/runner-check@main
        with:
          kvm: true
          tun: true
          # THE RECORDING, THE INPUT DISK AND THE OUTPUT DISK ARE ALL ON THIS MOUNT, and the largest
          # single input is a 7.7 GiB Windows ISO that is read twice.
          disk-gb: '40'
          token: ${{ github.token }}

      - name: the tools the files use
        # NAMED SO A MISSING ONE IS THIS STEP RATHER THAN A FAILURE FORTY MINUTES INTO AN INSTALL that
        # needed `xorriso` to build an answer CD.
        #
        # `oras` IS NOT INSTALLED HERE ANY MORE. `oci-push` installs it idempotently when it publishes,
        # and a leg that publishes nothing does not need it - which is why the install moved to the
        # action that uses it rather than sitting in every leg's prepare.
        run: |
          set -eu
          easyvm versions
          for tool in qemu-img 7z xorriso unzip mformat mcopy mdir curl; do
            if command -v "$tool" > /dev/null; then
              printf '  %-10s %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '  %-10s MISSING\n' "$tool"
            fi
          done
          mkdir -p "$GITHUB_WORKSPACE/work"

      - name: pull the input disk
        # AN INSTALL HAS NO INPUT: its first step creates the disk it writes to. Every other stage
        # starts from a published one, and `pull` is the tag - so a leg can be pointed at any disk this
        # repository has ever published.
        if: matrix.pull != ''
        # THE TOKEN IS THE VARIABLE `easyvm pull` READS, AND IT IS NOT IN THE CONTAINER BY
        # DEFAULT.
        #
        # `GITHUB_TOKEN` IS NOT AUTOMATICALLY EXPORTED INTO A CONTAINER JOB. It was used for the
        # registry login of the container image itself - the only place this file mentioned it -
        # while `easyvm` reads `os.Getenv("GITHUB_TOKEN")` to exchange for a registry session.
        # WITH NONE SET, EVERY PULL AND EVERY PUSH ASKED ANONYMOUSLY and the registry answered
        #
        #	FAILED: the registry refused a pull,push token (HTTP 403): {"errors":[{"code":
        #	"DENIED","message":"requested access to the resource is denied"}]}
        #
        # `artifacts-publish.yml` HAS ALWAYS SET THIS, which is why it could push while the stages
        # could not. One workflow passing a variable and the other not does not show up in a diff
        # of their `permissions:` blocks, and that is where this was looked for first.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          # A FALLBACK, BECAUSE THE LEGS RUN AT THE SAME TIME.
          #
          # `matrix.pull` IS WHERE THIS DISK SHOULD COME FROM, and on a package that has every tag it
          # is the only source tried. THE LEGS ARE DISPATCHED TOGETHER, though - `fail-fast: false`
          # and no `needs:` - so on a FRESH PACKAGE the `vm` leg starts while the `ssh` leg whose
          # output it wants has not published it yet.
          #
          # MEASURED, AND IT COST A WHOLE BATCH: all fifteen workflows dispatched at once against an
          # empty package, and every `ssh`/`vm` leg answered
          #
          #   FAILED: ghcr.io/easydev-org/easyvm:linux-zorin-ssh is not in the registry (404)
          #
          # SO EACH LEG TRIES ITS OWN TAG, THEN THE STAGES BEFORE IT, IN ORDER. The chain is
          # install -> ssh -> vm-configure -> dev, and `fallback` is that chain written out for this
          # leg. The FIRST tag that exists wins, which means:
          #
          #   once every tag exists   nothing falls back, and each leg continues its own disk
          #   a fresh package         `vm` continues the INSTALLED disk instead of failing, and
          #                           vm-configure configures the name, the share and the agent
          #                           itself - which is all it ever needed ssh for
          #
          # A FALLBACK IS NOT A SILENT SUBSTITUTE: it is printed, and the leg's own `out` is still
          # published under its own name, so the next run finds the tag it wanted.
          # THE PULL IS TAKEN FROM THE JSON, AND THE RENDERED VALUE IS PRINTED SO A MISMATCH IS
          # VISIBLE RATHER THAN INFERRED.
          #
          # MEASURED ON windows-ssh, WHOSE LEG DECLARES `"pull": "windows11"`:
          #
          #	will try, in order: windows11-ssh windows11
          #	=== pull windows11-ssh
          #
          # - the FIRST tag tried was the leg's own output name, not the disk the leg before it
          # publishes. `windows11` was present only as a fallback. The declaration is correct in
          # `windows.yml` at the same commit (`git show e408153:.github/workflows/windows.yml`), so
          # the value arriving here was not the value declared.
          #
          # SO IT IS PRINTED, and the leg's own name is printed beside it: a run that says
          # `pull=windows11-ssh` for a leg named `windows-ssh` is a run whose matrix arrived wrong,
          # and that is a sentence rather than an investigation.
          tags="${{ matrix.pull }}"
          fallbacks="${{ matrix.fallback }}"
          echo "  matrix: name=${{ matrix.name }} pull='$tags' fallback='$fallbacks' out=${{ matrix.out }}"
          # A LEG THAT PULLS ITS OWN OUTPUT NAME IS ALWAYS WRONG HERE - that is the disk it is about
          # to WRITE. Refusing it converts a confusing 404 loop into one line that says what happened.
          if [ "$tags" = "${{ matrix.out }}" ]; then
            echo "::error::this leg pulls '$tags', which is its own output file. The matrix did not"
            echo "::error::carry the 'pull' it declares; refusing rather than recursing."
            exit 1
          fi
          for fb in $fallbacks; do
            case " $tags " in *" $fb "*) ;; *) tags="$tags $fb" ;; esac
          done
          echo "  will try, in order: $tags"
          got=""
          # THE LEGS ARE DISPATCHED TOGETHER, SO THE DISK A LEG WANTS MAY BE PUBLISHING RIGHT NOW.
          #
          # `fail-fast: false` with no `needs:` starts every leg at once, so `vm` pulls
          # `linux-ubuntu-ssh` while the `ssh` leg that writes it is still running. MEASURED THREE
          # TIMES: `will try, in order: linux-ubuntu-ssh linux-ubuntu` then fifteen to thirty minutes
          # spent on the FALLBACK disk, which is the install image with no sshd - a timeout that looks
          # like a broken walk and is only a race.
          #
          # SO THE FIRST TAG IS WAITED FOR, not abandoned on the first 404. Every later tag is an
          # immediate fallback, because those are tags that either exist or never will.
          first=1
          for tag in $tags; do
            echo "=== pull $tag"
            attempt=0
            while :; do
              # THE TRANSFER IS A SHELL SCRIPT, NOT `easyvm pull`. `oras pull` HAS NO RESUME: a retry
              # around it restarts every multi-gigabyte transfer at byte zero, so more attempts make
              # more failures rather than progress - measured on a 28 GiB blob whose first four
              # attempts each died at the same stream error. This one fetches the blob with `Range:`
              # and keeps a `.part` file.
              #
              # IT IS THE SAME ALGORITHM AS `easyactions/oci-pull`, DELIBERATELY DUPLICATED FOR ONE
              # REASON: THIS LOOP RETRIES ON 404. The action is a STEP, and a step cannot sit inside a
              # `while` that waits thirty minutes for a tag the parallel leg has not published yet - so
              # the retry stays here and the transfer is the same three requests with the same
              # `Range:` resume. THE ACTION IS THE ONE TO USE ANYWHERE ELSE; this copy exists because
              # this call site is a loop.
              if sh "$GITHUB_WORKSPACE/.github/pull-artifact.sh" \
                     ghcr.io "$(printf '%s' "${{ inputs.disks_repository }}" | tr '[:upper:]' '[:lower:]')" \
                     "$tag" "$GITHUB_WORKSPACE/work/disk.qcow2"; then
                got="$tag"
                break 2
              fi
              if [ "$first" != "1" ]; then
                echo "  (no $tag in the package; trying the next one)"
                break
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 60 ]; then
                echo "  ($tag did not appear in 30 minutes; falling back)"
                first=0
                break
              fi
              echo "  ($tag is not there yet - the leg that publishes it is likely still running;"
              echo "   waiting 30s, attempt $attempt of 60)"
              sleep 30
            done
            first=0
          done
          if [ -z "$got" ]; then
            echo "::error::none of these tags exist: $tags"
            echo "::error::a fresh package needs each leg run once; an install leg has no pull:"
            exit 1
          fi
          echo "  the input disk is $got"
          ls -l "$GITHUB_WORKSPACE/work/"
          # A TRUNCATED ARTIFACT IS ONE LINE HERE RATHER THAN A BOOT TIMEOUT.
          qemu-img check "$GITHUB_WORKSPACE/work/disk.qcow2" || true

      - name: start the daemon
        # ONE PROCESS OWNS THE MACHINE FOR THE WHOLE STAGE. It runs in the background because
        # `easyvm run` is a CLIENT: it sends a request and returns, and the daemon drives the file.
        #
        # THE READY LINE IS THE CONTRACT, not the socket file: a file that exists is not a daemon that
        # answers. The output is CAPTURED FIRST and matched with `case`, because `| grep -q` closes the
        # pipe on its first match, the writer takes SIGPIPE, and `set -o pipefail` turns that into exit
        # 141 for a check that SUCCEEDED.
        run: |
          set -eu
          easyvm serve --work "$GITHUB_WORKSPACE/work" --novnc-port 6080 \
            > "$GITHUB_WORKSPACE/work/daemon.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/work/daemon.pid"
          for i in $(seq 1 30); do
            logs=$(cat "$GITHUB_WORKSPACE/work/daemon.log" || true)
            case "$logs" in *"listening on"*) break ;; esac
            sleep 1
          done
          logs=$(cat "$GITHUB_WORKSPACE/work/daemon.log" || true)
          printf '%s\n' "$logs"
          case "$logs" in
            *"listening on"*) echo "the daemon is up" ;;
            *) echo "=== THE DAEMON DID NOT COME UP ==="; exit 1 ;;
          esac

      - name: ask for the run
        # THE FILE IS THE ARGUMENT. `--boot-disk` names what to start and `--out` where a `compress:`
        # writes - both are facts about the job, so they are flags and not YAML.
        run: |
          set -eu
          disk_args=""
          if [ -f "$GITHUB_WORKSPACE/work/disk.qcow2" ]; then
            disk_args="--boot-disk $GITHUB_WORKSPACE/work/disk.qcow2"
          fi
          # shellcheck disable=SC2086
          easyvm run "$GITHUB_WORKSPACE/${{ matrix.file }}" \
            --work "$GITHUB_WORKSPACE/work" \
            $disk_args \
            --out "$GITHUB_WORKSPACE/work/${{ matrix.out }}" \
            --password admin \
            || {
              echo "=== THE DAEMON REFUSED THE RUN ==="
              cat "$GITHUB_WORKSPACE/work/daemon.log"
              exit 1
            }

      - name: follow it
        # THE WALK IS STREAMED TO A CHECK RUN, SO IT CAN BE WATCHED WHILE IT RUNS.
        #
        # THIS STEP'S OWN COMMENT NAMED THE PROBLEM BEFORE IT WAS STREAMED: "a step that runs for an
        # hour has invisible stdout until it ends, and 'which step is it on' is the one question an
        # in-progress stage has". `$GITHUB_STEP_SUMMARY` was the workaround - a table someone has to
        # expand, not the log.
        #
        # THE ACTIONS LOG IS UNREADABLE UNTIL THE STEP FINISHES; A CHECK RUN'S `output.text` IS, and
        # `easyactions/log-stream` publishes the newest 60,000 characters to one every ten seconds.
        #
        # IT NEEDS NOTHING BUT curl. That action used to be a Python script, and THIS image has no
        # interpreter on purpose - the driver is Go and speaks QMP directly - so it refused to start in
        # the one place a three-hour leg lives. It is a shell script now, and the jq it would otherwise
        # need was replaced with sed.
        uses: easydev-org/easyactions/log-stream@main
        with:
          token: ${{ github.token }}
          name: ${{ matrix.name }}-live
          interval: "10"
          max_bytes: "60000"
          command: |
            set -eu
            summary=${GITHUB_STEP_SUMMARY:-/dev/null}
            printf '| time | state |\n|---|---|\n' >> "$summary"
            # THE LOOP MUST END BEFORE GITHUB ENDS THE JOB, OR THE DIAGNOSIS IS NEVER PRINTED.
            #
            # This was `timeout + 5`, which is five rounds PAST the job's own `timeout-minutes`. Every
            # leg that overran was therefore killed by the runner mid-sleep, and the line a person
            # needs
            #
            #	=== THE WALKTHROUGH DID NOT FINISH IN TIME ===
            #	<daemon.log: the step it was on and the error it hit>
            #
            # NEVER APPEARED. Measured on macos-setup: 97 minutes in `follow it`, still going, with 150
            # for the job - so its conclusion was going to be an opaque cancellation and not a reason.
            #
            # TEN MINUTES OF HEADROOM, because the two steps after this one are not instant either:
            # `what it produced` lists and the artifact upload pushes the disk, which is gigabytes.
            #
            # POSIX SH ONLY, BECAUSE A `container:` JOB RUNS STEPS WITH /bin/sh. `$SECONDS` is bash and
            # dash does not define it, and `set -o pipefail` is ignored rather than refused.
            limit=$(( ${{ matrix.timeout }} - 10 ))
            rounds=0
            while [ "$rounds" -lt "$limit" ]; do
              rounds=$((rounds + 1))
              state=$(easyvm status --work "$GITHUB_WORKSPACE/work" 2>&1 || true)
              printf '%s\n' "$state"
              printf '| %s | %s |\n' "$(date -u +%H:%M:%S)" "$(printf '%s' "$state" | head -1)" >> "$summary"
              case "$state" in
                *"status: finished"*)
                  echo "=== THE WALKTHROUGH FINISHED ==="
                  cat "$GITHUB_WORKSPACE/work/daemon.log" 2>/dev/null || true
                  exit 0 ;;
                *"status: failed"*)
                  echo "=== THE WALKTHROUGH FAILED ==="
                  cat "$GITHUB_WORKSPACE/work/daemon.log" 2>/dev/null || true
                  exit 1 ;;
              esac
              sleep 60
            done
            echo "=== THE WALKTHROUGH DID NOT FINISH IN TIME ==="
            cat "$GITHUB_WORKSPACE/work/daemon.log" 2>/dev/null || true
            exit 1

      - name: what it produced
        if: always()
        run: |
          set -u
          ls -l "$GITHUB_WORKSPACE/work/" || true
          for f in "$GITHUB_WORKSPACE"/work/*.qcow2; do
            [ -e "$f" ] || continue
            printf '%s: %s MiB\n' "$f" "$(( $(stat -c %s "$f") >> 20 ))"
          done

      - name: stop the daemon
        if: always()
        run: |
          set -u
          if [ -f "$GITHUB_WORKSPACE/work/daemon.pid" ]; then
            pid=$(cat "$GITHUB_WORKSPACE/work/daemon.pid")
            kill "$pid" 2>/dev/null || true
            easyvm stop --work "$GITHUB_WORKSPACE/work" 2>/dev/null || true
            sleep 5
            kill -9 "$pid" 2>/dev/null || true
          fi
          pgrep -a qemu-system-x86_64 || true

      - name: publish the disk
        # A LEG THAT PRODUCED A DISK PUBLISHES IT, AND THAT IS HOW THE NEXT STAGE GETS ITS INPUT.
        #
        # THE TRANSFER IS `oci-push`, NOT FIFTY LINES OF `oras login` AND `oras push`. The action adds
        # the four things this step used to do by hand and one it did not:
        #
        #	IDEMPOTENT oras INSTALL   it was a block in every leg's prepare; now it is where it is used
        #	EXPLICIT LOGIN            oras reads no GITHUB_TOKEN from the environment, so an anonymous
        #	                          push is answered `DENIED`, which reads like a package permission
        #	SHA256 + --distinct-from  a stage that was supposed to change the disk and did not is a
        #	                          failure, not a republish of identical bytes
        #	--stamp                   a tag nothing has to invent twice
        #
        # THE FILE IS CHECKED BEFORE ANYTHING IS PUSHED. An `install` declares `out:` and a
        # `vm-configure` does too, while an `ssh` leg had no `compress:` for months - so "no disk"
        # is a warning, and a disk below the floor is a refusal.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          out="$GITHUB_WORKSPACE/work/${{ matrix.out }}"
          if [ ! -s "$out" ]; then
            echo "no disk to publish at $out (the stage may not write one)"
            ls -l "$GITHUB_WORKSPACE/work/" || true
            exit 0
          fi

          # A DISK THAT WAS NEVER WRITTEN IS NOT A DISK, AND `-s` CANNOT TELL THE DIFFERENCE.
          #
          # `qemu-img create` writes a 197,632-BYTE qcow2 - a header and nothing else - so a walk whose
          # every click landed on the wrong pane still produces a file that `-s` accepts. MEASURED ON
          # linux-zorin: the install leg reported success, `oras push` published it, and `linux-zorin`
          # sat beside a 0 MiB file in the package. The next stage then pulled a disk with no system on
          # it and failed somewhere unrelated.
          #
          # THE FLOOR IS 512 MiB: the smallest real install here - ghostbsd at 2.7 GiB, popos at 2.5 -
          # is several times that, and a bare qcow2 header is three orders of magnitude below it.
          size=$(stat -c %s "$out")
          if [ "$size" -lt $((512 * 1024 * 1024)) ]; then
            echo "::error::$out is $size bytes, below the 512 MiB floor for an installed system."
            echo "::error::This is a qcow2 header with nothing written to it - the walk's clicks did"
            echo "::error::not reach the installer's disk. Publishing it would put a disk with no"
            echo "::error::system behind a tag the next stage pulls."
            ls -l "$GITHUB_WORKSPACE/work/" || true
            exit 1
          fi

          # `matrix.publish` IS THE TAG, AND `matrix.name` IS ONLY THE JOB'S NAME.
          #
          # THEY WERE THE SAME THING AND THEY MUST NOT BE. Each leg pulls the disk the PREVIOUS stage
          # produced - install -> ssh -> vm-configure - so the install leg's disk has to be published
          # under the name the ssh leg asks for, which is the OS's own name and not the leg's:
          #
          #	install leg   name=linux-zorin-install    publishes  linux-zorin
          #	ssh leg       name=linux-zorin-ssh        publishes  linux-zorin-ssh   (pulls linux-zorin)
          #	vm leg        name=linux-zorin-vm         publishes  linux-zorin-vm    (pulls linux-zorin-ssh)
          #
          # PUBLISHING UNDER `matrix.name` MEANT the install leg wrote `linux-zorin-install` while every
          # ssh leg pulled `linux-zorin`, so the two names never met and a fresh package could never
          # boot an installed disk.
          tag="${{ matrix.publish }}"
          if [ -z "$tag" ]; then tag="${{ matrix.name }}"; fi
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "out=$out" >> "$GITHUB_ENV"

      - name: push the disk
        # THE PUSH ITSELF, AS A STEP OF ITS OWN, BECAUSE AN ACTION IS A STEP AND `oci-push` IS WHAT
        # KNOWS THE REGISTRY. The step above decided WHETHER there is a disk and wrote `out=` and
        # `tag=` to the environment; this one moves it.
        #
        # `env.out` IS EMPTY WHEN THERE WAS NOTHING TO PUBLISH, and an action given an empty `path`
        # would fail a leg whose walkthrough legitimately writes no disk. So the guard is the
        # variable the previous step set, not `always()`.
        if: env.out != '' && env.tag != '' 
        uses: easydev-org/easyactions/oci-push@main
        with:
          path: ${{ env.out }}
          tag: ${{ env.tag }}
          repository: ${{ inputs.disks_repository }}
          media-type: application/vnd.easydev.qcow2
          token: ${{ github.token }}
          check-name: ${{ matrix.name }}-publish

      # THE RECORDING IS ITS OWN ARTIFACT, AND IT IS THE FIRST ONE TO OPEN AFTER A FAILURE.
      #
      # MEASURED: `linux-cachyos-vm` was ONE artifact of 7,362,380,205 bytes - the recording, the
      # daemon log, the console log AND the 128 GiB qcow2 in one zip. GITHUB'S ARTIFACT API CANNOT
      # EXTRACT A SINGLE MEMBER, so watching the video meant downloading the disk. That is the
      # opposite of what a post-mortem needs: the video is tens of megabytes and answers "what was on
      # screen", while the disk is the file nobody looks at until a leg passes.
      #
      # THREE ARTIFACTS, AND EACH HAS ONE REASON TO EXIST:
      #
      #   <leg>-video   the recording                      open it first, always
      #   <leg>-logs    daemon.log and console.log          the guest's own words
      #   <leg>-disk    the qcow2                           only a PASSING leg's disk matters
      #
      # THE DISK IS NOT HOW A DOWNSTREAM STAGE GETS ITS INPUT: `oras push` writes it and `easyvm
      # pull` reads it back, which is why this artifact is archive rather than transport.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-video
          path: |
            work/*.mp4
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}-logs
          path: |
            work/daemon.log
            # THE GUEST'S OWN SERIAL CONSOLE, WHICH IS THE ONLY RECORD OF WHAT THE FIRMWARE DID.
            #
            # MEASURED ON UBUNTU-INSTALL: `console.log` was 24 KB - the firmware had booted something,
            # and its output is the only place that says WHAT - and the artifact carried only
            # `disk.qcow2` and `daemon.log`, so the one file that would have answered it was thrown
            # away. The step's failure said `drop=+0.0 ... on a 1920x1080 frame`, which is a black
            # screen and no reason.
            work/console.log
          if-no-files-found: warn
          retention-days: 7

      # THE DISK IS NOT AN ARTIFACT. IT GOES TO ghcr AND NOWHERE ELSE.
      #
      # THIS UPLOAD WAS 22 GiB ON `windows-install` - the qcow2 of a whole Windows guest, zipped and
      # pushed a second time, to storage that is not what a downstream stage reads and not what a
      # post-mortem opens.
      #
      # THE THREE ARTIFACTS ABOVE EACH HAVE A READER:
      #
      #   <leg>-video   the recording          "what was on screen" - tens of megabytes
      #   <leg>-logs    daemon.log, console.log  "what the guest said" - kilobytes
      #   (nothing)     the qcow2              the disk is TRANSPORT, and its transport is `easyvm
      #                                        push` -> `easyvm pull`, which is what the next stage
      #                                        actually runs
      #
      # MEASURED: `windows-install` succeeded, published `windows11` (10,786 MiB in ghcr), and then
      # spent SEVEN MINUTES re-uploading the same file as a 22,133,669,203-byte artifact. Every
      # passing install leg would pay that, on every run, for a file nobody downloads: a leg that
      # passes needs no post-mortem, and a leg that fails has no disk worth reading.
      #
      # A FAILING LEG'S DISK IS STILL RECOVERABLE from the work directory in the job log's own
      # `what it produced` listing, and the two files that DO explain a failure - the recording and
      # the guest's console - are already separate artifacts.
