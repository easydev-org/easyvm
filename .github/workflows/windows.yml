name: windows

# windows, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE LEGS USED TO RUN AS ONE PARALLEL MATRIX, and that produced a race with a timeout for a tail: a leg
# asks for the tag the leg before it publishes, gets a 404 because that leg is still running, falls back
# to the INSTALL disk - which has no sshd - and spends its whole budget on a machine that could never
# answer.
#
# `needs:` IS THE FIX, AND IT IS WHAT THE REFERENCE IMPLEMENTATION ALWAYS DID:
#
#	jobs/bake  ->  jobs/launch needs bake  ->  jobs/ssh needs bake  ->  jobs/vm-configure needs ssh
#
# A leg cannot start before the artifact it pulls exists, because it is not SCHEDULED until then. The
# cost is the sum rather than the maximum, and that is the right way round: a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#
# EVERY STAGE IS STILL DISPATCHABLE ON ITS OWN. `from_tag` names a PUBLISHED disk and the chain starts
# at the stage that needs it - the earlier jobs are skipped, because a `needs` on a SKIPPED job is
# satisfied. That is the reference implementation's `ssh_from`, and it is why there are 4 jobs
# rather than one file with 4 steps.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm"
      from_tag:
        description: >-
          start from a PUBLISHED disk: windows11 or windows11-ssh or windows11-vm-configure or windows11-dev. Empty runs the whole chain. A fix to a later stage then costs that stage, not the entire bake.
        default: ""

concurrency:
  group: windows
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS, and `stage.yml` needs all three:
# `packages: write` to publish a disk, `checks: write` to stream the live log, `contents: read` to check
# out the walkthroughs.
permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    # `from_tag:` NAMES A PUBLISHED DISK AND THE CHAIN STARTS FROM IT - SO THE INSTALL DOES NOT RUN.
    #
    # THIS JOB HAD NO `if:` AT ALL, so `gh workflow run -f from_tag=windows11` dispatched the INSTALL
    # ANYWAY: measured on run 43591537026, whose first job was `windows-install` on a request that named
    # an already-published disk. The ssh and vm jobs below already had their gates; the one that
    # produces the input did not, and every later gate is written in terms of tags this job would have
    # replaced.
    if: github.event_name != 'workflow_dispatch' || inputs.from_tag == ''
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: windows
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows-install",
            "file": "windows/11/steps/install.yaml",
            "pull": "",
            "out": "windows11.qcow2",
            "publish": "windows11",
            "timeout": 175
          }
        ]

  ssh:
    needs: [install]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'windows11')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: windows
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows-ssh",
            "file": "windows/11/steps/ssh.yaml",
            "pull": "windows11",
            "out": "windows11-ssh.qcow2",
            "publish": "windows11-ssh",
            "timeout": 70
          }
        ]

  vm:
    needs: [ssh]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'windows11' || inputs.from_tag == 'windows11-ssh')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: windows
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows-vm-configure",
            "file": "windows/11/steps/vm-configure.yaml",
            "pull": "windows11-ssh",
            "out": "windows11-vm-configure.qcow2",
            "publish": "windows11-vm-configure",
            "timeout": 60
          }
        ]

  dev:
    needs: [vm]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'windows11' || inputs.from_tag == 'windows11-ssh' || inputs.from_tag == 'windows11-vm-configure')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: windows
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "windows-dev",
            "file": "windows/11/steps/dev.yaml",
            "pull": "windows11-vm-configure",
            "out": "windows11-dev.qcow2",
            "publish": "windows11-dev",
            "timeout": 90
          }
        ]

