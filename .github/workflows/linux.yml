name: linux

# TWELVE LINUX DISTRIBUTIONS, ONE STAGE EACH: its `ssh.yaml`.
#
# THAT IS THE STAGE THAT PROVES THE MACHINE - the disk boots, the guest reaches a desktop, sshd
# answers, and the bootstrap chain can be checked - without paying for an install that is 20 to 40
# minutes of clicking through a wizard.
#
# THEIR TAGS ARE `linux-<name>-ssh`, NOT THE `<name>-ssh` SHAPE WINDOWS AND MACOS USE. Discovered
# rather than assumed: a wrong tag is a 404 at pull time that reads like a registry problem.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easydiskbake"

# ITS OWN CONCURRENCY GROUP, WHICH IS THE POINT OF THE SPLIT.
#
# A single group for every operating system meant DISPATCHING A LINUX FIX CANCELLED A RUNNING WINDOWS
# INSTALL - forty minutes of one, thrown away. The group exists to stop two runs fighting over a
# machine, and a matrix leg is not one machine: every leg gets its own runner. Scoping the group to one
# OS keeps "a newer run of THIS is better" without making an unrelated stage collateral.
concurrency:
  group: linux
  cancel-in-progress: true

jobs:
  stages:
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: linux
      disks_repository: ${{ inputs.disks_repository }}
      # THE LEGS, AS JSON. `fromJSON` in the called workflow turns this back into a matrix, so the
      # mechanism stays in one file and each OS declares only what it runs.
      stages: |
        [
          {
            "name": "linux-ubuntu-ssh",
            "file": "linux/ubuntu/steps/ssh.yaml",
            "pull": "linux-ubuntu-ssh",
            "out": "linux-ubuntu-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-cachyos-ssh",
            "file": "linux/cachyos/steps/ssh.yaml",
            "pull": "linux-cachyos-ssh",
            "out": "linux-cachyos-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-kubuntu-ssh",
            "file": "linux/kubuntu/steps/ssh.yaml",
            "pull": "linux-kubuntu-ssh",
            "out": "linux-kubuntu-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-mint-ssh",
            "file": "linux/mint/steps/ssh.yaml",
            "pull": "linux-mint-ssh",
            "out": "linux-mint-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-popos-ssh",
            "file": "linux/popos/steps/ssh.yaml",
            "pull": "linux-popos-ssh",
            "out": "linux-popos-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-mx-ssh",
            "file": "linux/mx/steps/ssh.yaml",
            "pull": "linux-mx-ssh",
            "out": "linux-mx-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-nixos-ssh",
            "file": "linux/nixos/steps/ssh.yaml",
            "pull": "linux-nixos-ssh",
            "out": "linux-nixos-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-manjaro-ssh",
            "file": "linux/manjaro/steps/ssh.yaml",
            "pull": "linux-manjaro-ssh",
            "out": "linux-manjaro-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-fedora-workstation-ssh",
            "file": "linux/fedora-workstation/steps/ssh.yaml",
            "pull": "linux-fedora-workstation-ssh",
            "out": "linux-fedora-workstation-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-opensuse-tumbleweed-ssh",
            "file": "linux/opensuse-tumbleweed/steps/ssh.yaml",
            "pull": "linux-opensuse-tumbleweed-ssh",
            "out": "linux-opensuse-tumbleweed-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-endeavour-ssh",
            "file": "linux/endeavour/steps/ssh.yaml",
            "pull": "linux-endeavour-ssh",
            "out": "linux-endeavour-ssh.qcow2",
            "timeout": 60
          },
          {
            "name": "linux-zorin-ssh",
            "file": "linux/zorin/steps/ssh.yaml",
            "pull": "linux-zorin-ssh",
            "out": "linux-zorin-ssh.qcow2",
            "timeout": 60
          }
        ]
