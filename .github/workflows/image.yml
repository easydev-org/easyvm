name: image

# Build the easyvm image on GitHub, never locally.
#
# WHY AN IMAGE AT ALL. A walkthrough drives a real qemu against a real disk, so a test needs the
# machine every stage runs on - qemu 11.1 with KVM, OVMF, swtpm, samba, tesseract. Installing those
# per job is four minutes of apt before a single step runs, and the installed set drifts from the
# one a real run uses. The image is the environment as a fact rather than as a hope.
#
# TWO JOBS, AND THE SECOND DEPENDS ON THE FIRST FOR A REASON: the binary is built once and copied
# into the image, so the image does not carry a Go toolchain (400 MB) for a binary that is already
# compiled. If the build fails, there is nothing to put in the image and the second job does not
# start.

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr"
        type: boolean
        default: true
      platforms:
        description: "Platforms to build"
        default: "linux/amd64"
      no_cache:
        description: "Rebuild every layer (use when the image is stale but the push said success)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Containerfile"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/image.yml"

# ONE IMAGE BUILD AT A TIME, AND THE NEWEST ONE WINS.
#
# WITHOUT THIS, EVERY PUSH TO A FILE UNDER `internal/**` QUEUES A FULL BUILD - four minutes of apt, a Go
# build, and a multi-hundred-megabyte push - and they run ONE AFTER ANOTHER. Measured: six builds queued
# behind two running walkthroughs, the oldest waiting thirty-five minutes for a commit four revisions
# stale. Every one but the last is work whose result nobody will use.
#
# The image a workflow pulls is `:latest`, so only the newest build can be the one that matters - and
# cancelling the older ones is not losing information, it is skipping a version that was already
# superseded before it started.
concurrency:
  group: image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ===========================================================================
  # BUILD THE BINARY, AND PROVE IT RUNS.
  #
  # `go vet` FIRST, because a program that does not type-check has no business being built. THE TESTS
  # RUN IN THE TESTING IMAGE (`docker build --target tester`), in the `behaviour` job - see the note
  # there for the measured reason.
  # ===========================================================================
  binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # VET STAYS ON THE RUNNER, BECAUSE IT NEEDS NOTHING BUT THE COMPILER. It is the cheap gate: a
      # program that does not type-check has no business being built into an image.
      - name: vet
        run: go vet ./...

      # `go test` DOES NOT RUN HERE ANY MORE, AND THE REASON IS MEASURED.
      #
      # On 2026-11-16 this job failed with
      #
      #	gpt_test.go:32: qemu-img create: exec: "qemu-img": executable file not found in $PATH
      #
      # and the tempting fix - skip the test when the tool is missing - is the wrong one. A test that
      # cannot run is not a test, and `qemu-img` is in the image for the reason the image exists. So
      # the tests run in the TESTING IMAGE (`docker build --target tester`), which is this same image
      # plus a Go toolchain: it has qemu, qemu-img, tesseract, smbd and the UEFI firmware because
      # walkthroughs need them, and a unit test of this program is a claim about those very things.
      #
      # IT IS THE `behaviour` JOB'S FIRST STEP RATHER THAN A FOURTH JOB, because the tester image
      # depends on the RUNTIME image and the runtime image is built there. Queueing it earlier would
      # mean building the 900 MB apt layer twice.

      - name: build
        run: |
          set -euo pipefail
          mkdir -p dist
          # CGO_ENABLED=0 because the binary must run in a distroless-shaped layer with no libc
          # assumptions; the ssh and qmp packages are pure Go.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/easyvm ./cmd/easyvm
          ls -l dist/easyvm

      - name: the binary answers for itself
        # A BINARY THAT CANNOT DESCRIBE ITSELF IS ONE NOBODY CAN DEBUG IN A CONTAINER. This is the
        # check that the thing in dist/ is the program and not a stub: `versions` reports the CPU
        # model it will use and the tools it can see.
        run: |
          set -euo pipefail
          ./dist/easyvm versions
          # THE OUTPUT IS CAPTURED FIRST, THEN SEARCHED. `easyvm versions | grep -q` exits 141:
          # grep -q closes the pipe on its first match, the writer takes SIGPIPE, and
          # `set -euo pipefail` turns that into a failed step - for a check that SUCCEEDED.
          versions=$(./dist/easyvm versions)
          printf '%s\n' "$versions"
          printf '%s\n' "$versions" | grep 'Skylake-Client-v4'

      - uses: actions/upload-artifact@v4
        with:
          name: easyvm-binary
          path: dist/easyvm
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # BUILD THE IMAGE.
  # ===========================================================================
  image:
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyvm-binary
          path: dist

      - name: the binary arrived
        # THE ARTIFACT IS A SEPARATE JOB'S OUTPUT, so its presence is checked rather than assumed -
        # a `download-artifact` that finds nothing leaves an empty directory and the COPY in the
        # Containerfile then fails with a message about a missing file, which points at the wrong
        # place.
        #
        # AND THE EXECUTABLE BIT IS RESTORED BY HAND, because upload-artifact/zIP DOES NOT CARRY IT.
        # Measured on run 43000474575, the first run where this step existed:
        #
        #     === dist/easyvm IS NOT EXECUTABLE ===
        #     -rw-r--r-- 1 runner runner ... dist/easyvm
        #
        # The binary was built with mode 0755 and arrived as 0644. That is not a defect in the
        # artifact action - a zip has no unix mode to carry - and the check is what caught it,
        # which is why the check is here rather than an `ls` in the Containerfile.
        run: |
          set -euo pipefail
          test -f dist/easyvm || { echo "=== dist/easyvm IS MISSING ==="; ls -l dist/; exit 1; }
          chmod 0755 dist/easyvm
          test -x dist/easyvm || { echo "=== dist/easyvm IS STILL NOT EXECUTABLE ==="; ls -l dist/; exit 1; }
          versions=$(./dist/easyvm versions)
          printf '%s\n' "$versions"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        # IT MUST PUSH ON A PUSH. `inputs.push != false` IS TRUE ONLY WHEN THE INPUT EXISTS, and on
        # a `push` event it is empty - so `'' != false` was false and every push-to-main build
        # built, self-checked, and published NOTHING, while the job reported success. Measured on
        # run 43013438028: `push: false` in build-push-action's own resolved inputs, and
        # ghcr.io/easydev-org/easyvm:latest still carrying an older commit's binary.
        #
        # `github.event_name != 'workflow_dispatch' || inputs.push` says what is meant: a push to
        # main publishes, and a manual run publishes unless the box was unticked.
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # TWO TAGS AND BOTH MATTER. `latest` is what a run pulls by default; the sha is what makes
          # a run reproducible and lets a reader say which image produced a log line.
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          # THE SAME CONDITION AS THE LOGIN ABOVE, and it has to be: a build that pushes without
          # logging in fails, and one that logs in without pushing is a credential nobody uses.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # THE SELF-CHECKS IN THE CONTAINERFILE ARE THE PRODUCT OF THIS JOB. They assert qemu,
          # ffmpeg, smbd, swtpm, websockify, noVNC, OVMF and `-cpu Skylake-Client-v4` - so a base
          # image that loses one of them fails the build here rather than twenty minutes into a
          # walkthrough. `no-cache` on the checks would be the way to force them; layer caching is
          # kept because the RUN that carries them also carries the apt install.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # `no_cache` EXISTS BECAUSE A GREEN BUILD CAN PUBLISH A STALE BINARY, AND IT DID.
          #
          # MEASURED: run 44691416157 reported binary/image/behaviour all SUCCESS and pushed
          # `latest` = sha256:07ad3ff4..., and the pod that pulled that digest still had an
          # /usr/local/bin/easyvm that could not read a `.walk` file -
          #
          #	FAILED: /tmp/made.walk: yaml: unmarshal errors:
          #	  line 1: cannot unmarshal !!str `walkthr...` into map[string]interface {}
          #
          # while the SAME commit built locally answers
          #
          #	linux-fedora-workstation - sshd, 39 step(s)
          #
          # So the artifact was right and the LAYER was old: `COPY dist/easyvm` is cached by content
          # and the build cache decided it had seen that path before. The step that checks the image
          # (`easyvm versions`) cannot catch this - it only proves SOME working binary is in there.
          #
          # `-f no_cache=true` rebuilds every layer. It costs four minutes of apt and is worth it
          # exactly when a push reported success and the binary did not change.
          no-cache: ${{ inputs.no_cache || false }}

      - name: the image runs, and its binary does
        # THE BUILD SUCCEEDING IS NOT THE SAME AS THE IMAGE WORKING. This starts the built image and
        # asks the binary inside it to describe itself - which proves the COPY put it where the
        # entrypoint looks, that it is executable, and that the qemu it will drive is the one the
        # Containerfile asserted.
        # SAME BUG AS THE PUSH CONDITION, ONE MORE TIME: `inputs.platforms` is EMPTY on a `push`
        # event, so `'' == ''` is true and these ran - which is the opposite of the failure I was
        # looking for, and worth stating rather than assuming: this one accidentally worked.
        #
        # They are kept, and written as the condition that means what is wanted: run unless the
        # manual form asked for a platform this job cannot execute (an arm64 image cannot be run on
        # an amd64 runner, so asking is the caller saying "build only").
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == '' || inputs.platforms == 'linux/amd64'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/easyvm \
            "${{ env.IMAGE }}:latest" versions

      - name: the CPU model is the one every guest uses
        # THE ONE ASSERTION THAT MATTERS MOST, ASKED OF THE BUILT IMAGE RATHER THAN THE BUILDER.
        # `-cpu host` makes a run unreproducible across runners, and cachyos panicked in its first
        # second because of it. If this image's qemu does not know the model, every walkthrough
        # fails on its first boot.
        #
        # NOT `| grep -q`, AND THIS IS THE SECOND TIME. `grep -q` closes the pipe on its first match
        # and the writer takes SIGPIPE; `set -euo pipefail` turns that into exit 141 for a check
        # that SUCCEEDED. Run 43001461321 failed here having already built, pushed and run the
        # image - every other step in the job was green.
        # SAME BUG AS THE PUSH CONDITION, ONE MORE TIME: `inputs.platforms` is EMPTY on a `push`
        # event, so `'' == ''` is true and these ran - which is the opposite of the failure I was
        # looking for, and worth stating rather than assuming: this one accidentally worked.
        #
        # They are kept, and written as the condition that means what is wanted: run unless the
        # manual form asked for a platform this job cannot execute (an arm64 image cannot be run on
        # an amd64 runner, so asking is the caller saying "build only").
        if: github.event_name != 'workflow_dispatch' || inputs.platforms == '' || inputs.platforms == 'linux/amd64'
        run: |
          set -euo pipefail
          models=$(docker run --rm --entrypoint qemu-system-x86_64 \
            "${{ env.IMAGE }}:latest" -cpu help 2>&1)
          printf '%s\n' "$models" | grep 'Skylake-Client-v4'
          echo "the image knows -cpu Skylake-Client-v4"

  # ===========================================================================
  # THE IMAGE'S BEHAVIOUR, ASKED OF THE IMAGE.
  #
  # THIS JOB IS WHERE `go test ./...` RUNS NOW, AND IT RUNS IN THE IMAGE.
  #
  # ON 2026-11-16 the `binary` job failed with
  #
  #	gpt_test.go:32: qemu-img create: exec: "qemu-img": executable file not found in $PATH
  #
  # because that job ran the tests on a bare runner. Skipping the test was the wrong answer: a test
  # that cannot run is not a test. The tests moved HERE, into `docker build --target tester`, which is
  # the runtime image plus a Go toolchain - qemu, qemu-img, tesseract, smbd and the UEFI firmware are
  # present because the walkthroughs need them, and this program's tests are claims about exactly
  # those things.
  #
  # AND THE PROPERTIES `go test` CANNOT SEE ARE ASKED OF THE BUILT IMAGE BELOW: whether a kernel file
  # lock is honoured on the filesystem the pod actually mounts, whether a socket qemu made can be
  # told apart from a leftover, and whether the daemon refuses a second owner by name.
  #
  # WHAT THIS JOB EXISTS FOR, MEASURED ON THE LAB POD AND NOT REPRODUCIBLE IN `go test`:
  #
  #	REFUSED: a machine is already running on this daemon: a `create` sandbox, up 3m49s
  #	... and then, after that sandbox's process was killed without a destroy, the next boot did
  #
  #	_ = os.Remove("/work/drive.sock.qmp")
  #
  #	on a qemu that was still running. That guest became undrivable and UNREPORTABLE - the daemon
  #	said `could not read the screen: qmp ... no such file or directory`, and `/api/click` answered
  #	{"ok":true} for forty minutes while the pointer on the screen never moved.
  #
  # THE THREE STEPS BELOW ARE THE THREE LOCKS, and each one fails on the image as it was before this
  # change. They cost about a minute because none of them boots a guest: they run the daemon.
  # ===========================================================================
  behaviour:
    needs: image
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == '' || inputs.platforms == 'linux/amd64'
    runs-on: ubuntu-24.04
    # TWENTY-FIVE MINUTES: two image builds (the runtime is cached from `image`, the tester is not),
    # a full `go test ./...` in the tester, and three checks that start two daemons and two qemus.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # THE CONTAINERFILE COPIES `dist/easyvm`, so this job builds it exactly as `binary` does. The
      # alternative - pulling `:latest` and building only the tester stage on top of it - would test
      # a binary from a different commit than the one under test.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build the binary the image carries
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" -o dist/easyvm ./cmd/easyvm
          chmod 0755 dist/easyvm
          ls -l dist/easyvm

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: the unit tests, in the machine they describe
        # THE WHOLE POINT OF THIS STEP IS WHERE IT RUNS. A test that spawns `qemu-img` needs
        # `qemu-img`, and the image has it because every walkthrough needs it. On a bare runner the
        # same test failed with `executable file not found in $PATH`, and the fix for that was never
        # to skip it.
        #
        # `--target tester` is this same image plus a Go toolchain, so the tools a test reaches for
        # are the ones the walkthroughs get. The source is a bind mount, so a change to one Go file
        # does not rebuild the qemu layer.
        #
        # THE RUNTIME IMAGE IS TAGGED FROM THE SAME BUILD, so the steps below drive exactly what
        # these tests passed against - not a second pull of `:latest` that could be another commit.
        run: |
          set -euo pipefail
          # `runtime` AND NOT `easyvm-runtime`. The latter is the base stage - qemu, the tools and the
          # binary - and it has NO ENTRYPOINT, because the entrypoint belongs to the product. MEASURED
          # on run 43803801237, where this named the base:
          #
          #	exec: "serve": executable file not found in $PATH
          #
          # which is the exact failure the shipped image's own comment warns about, reproduced in a
          # check written to catch it.
          docker build -f ./Containerfile --target runtime -t easyvm-ci:local .
          docker build -f ./Containerfile --target tester -t easyvm-tester:ci .
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GOCACHE=/tmp/go-cache \
            easyvm-tester:ci \
            test ./... -count=1 -timeout 600s
          # `test` AND NOT `go test`: the tester image's ENTRYPOINT is the go binary, so the command
          # after the image name is go's own argument. Measured on run 43800447440, where this read
          # `go test` and the container answered:
          #
          #	go go: unknown command
          #	Run 'go help' for usage.
          #
          # A doubled word, an exit code 2, and a job that had already built both images successfully.

      - name: a second daemon on the same work directory is refused, by name
        # THE OUTERMOST LOCK. Everything a machine owns lives in one `--work` directory - the qmp
        # socket, the tap, the overlay, the frames, the disk - and each is a singleton that
        # `internal/qmp.Registry` can only enforce INSIDE one process. Two daemons on one directory
        # agree on nothing, and the damage is silent.
        #
        # THE REFUSAL MUST NAME THE HOLDER. A message that says only "in use" leaves a reader with a
        # directory full of files and no way to learn which process to stop.
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          echo "WORK=$work" >> "$GITHUB_ENV"

          # THE FIRST DAEMON HOLDS THE DIRECTORY.
          docker run -d --name lock-a \
            --cap-add NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v "$work:/work" \
            "easyvm-ci:local" serve --work /work --http :8080

          # AND IT IS RUNNING BEFORE THE SECOND ASKS. `serve` prints its listen line once it has the
          # lock, so waiting for that line is waiting for the lock rather than guessing at a sleep.
          for i in $(seq 1 60); do
            # THE OUTPUT IS CAPTURED, NOT PIPED INTO `grep -q`: grep closes the pipe on its first
            # match, the writer takes SIGPIPE, and `pipefail` turns a successful check into exit 141.
            logs=$(docker logs lock-a 2>&1 || true)
            case "$logs" in *listening*) break ;; esac
            sleep 1
          done
          case "$(docker logs lock-a 2>&1)" in
            *listening*) ;;
            *) echo "=== THE FIRST DAEMON NEVER STARTED LISTENING ==="; docker logs lock-a; exit 1 ;;
          esac

          # THE SECOND MUST FAIL. Its exit status is the assertion; the sentence is the diagnosis.
          set +e
          docker run --rm \
            --cap-add NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v "$work:/work" \
            "easyvm-ci:local" serve --work /work --http :8081 > /tmp/second.log 2>&1
          status=$?
          set -e

          if [ "$status" = 0 ]; then
            echo "=== A SECOND DAEMON ACQUIRED THE SAME WORK DIRECTORY ==="
            docker logs lock-a
            exit 1
          fi

          cat /tmp/second.log
          # THE TWO THINGS THE MESSAGE OWES THE READER: which directory, and who holds it.
          case "$(cat /tmp/second.log)" in
            *"another easyvm is already using"*) ;;
            *) echo "=== THE REFUSAL DID NOT NAME A HOLDER ==="; exit 1 ;;
          esac
          # THE CONTAINER SEES THE BIND MOUNT'S TARGET, which is `/work`, not the host path it was
          # mounted from. Asserting the host path failed on a correct refusal:
          #
          #	FAILED: another easyvm is already using /work (pid 1); one work directory holds one
          #	        machine. Stop it, or pass a different --work
          #	=== THE REFUSAL DID NOT NAME THE DIRECTORY ===
          case "$(cat /tmp/second.log)" in
            *"/work"*) ;;
            *) echo "=== THE REFUSAL DID NOT NAME THE DIRECTORY ==="; exit 1 ;;
          esac
          case "$(cat /tmp/second.log)" in
            *"pid"*) ;;
            *) echo "=== THE REFUSAL DID NOT NAME A PID ==="; exit 1 ;;
          esac

          docker rm -f lock-a

      - name: the lock is released by SIGKILL, so it is a kernel lock and not a pidfile
        # THE PROPERTY THAT DECIDES THE DESIGN. A pidfile is a CLAIM and survives the process that
        # wrote it: a crashed daemon would block its own directory until somebody deleted a file by
        # hand. A kernel `flock` is a FACT and dies with its holder, for any reason, including
        # SIGKILL - which is the signal no handler can catch.
        #
        # WITHOUT THIS, `flock` WOULD BE INDISTINGUISHABLE FROM A FILE THAT HAPPENS TO EXIST.
        run: |
          set -euo pipefail
          work=$(mktemp -d)

          docker run -d --name lock-b \
            --cap-add NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v "$work:/work" \
            "easyvm-ci:local" serve --work /work --http :8080

          for i in $(seq 1 60); do
            logs=$(docker logs lock-b 2>&1 || true)
            case "$logs" in *listening*) break ;; esac
            sleep 1
          done
          case "$(docker logs lock-b 2>&1)" in
            *listening*) ;;
            *) echo "=== THE DAEMON NEVER STARTED LISTENING ==="; docker logs lock-b; exit 1 ;;
          esac

          # SIGKILL: no defer runs, no signal handler fires, no cleanup on the way out.
          docker kill -s KILL lock-b
          docker rm -f lock-b

          # AND THE DIRECTORY IS USABLE AGAIN, IMMEDIATELY. A daemon that starts and stays up is the
          # proof; the timeout is only there so a daemon that somehow started cleanly does not hold
          # the job open.
          set +e
          timeout 20 docker run --rm \
            --cap-add NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v "$work:/work" \
            "easyvm-ci:local" serve --work /work --http :8080 > /tmp/after.log 2>&1
          status=$?
          set -e
          cat /tmp/after.log

          # 124 IS `timeout` KILLING A HEALTHY DAEMON, which is the SUCCESS case here: it started,
          # took the lock and kept serving. Anything else that is not zero is a real failure.
          if [ "$status" != 0 ] && [ "$status" != 124 ]; then
            echo "=== THE LOCK SURVIVED SIGKILL, SO IT IS NOT A KERNEL LOCK (exit $status) ==="
            exit 1
          fi
          case "$(cat /tmp/after.log)" in
            *"another easyvm"*)
              echo "=== THE LOCK OUTLIVED ITS HOLDER ==="
              exit 1 ;;
          esac

      - name: a live qemu's socket is not deleted, and a leftover's is
        # THE INNERMOST LOCK, AND THE ONE THAT DID THE SILENT DAMAGE. `Boot` used to run
        # `_ = os.Remove(qmpPath)` unconditionally. With a live listener behind that path it deleted
        # a running guest's only control channel - and the guest kept running, so nothing reported an
        # error at the point of damage.
        #
        # THE PROBE IS TESTED ON BOTH SIDES HERE because either half alone is a different bug: a
        # probe that never says "alive" deletes live sockets, and one that never says "leftover"
        # refuses to start on a directory that is genuinely free.
        #
        # THE LISTENER IS QEMU, WHICH IS IN THE IMAGE FOR THE REASON THE IMAGE EXISTS. `socat` and
        # `python3` are not, and a shell redirect cannot bind a unix socket; `qemu -machine none` with
        # `-qmp unix:...,server=on` is a real QMP socket with no guest behind it, which is exactly the
        # stand-in needed.
        run: |
          set -euo pipefail
          work=$(mktemp -d)

          docker run -d --name probe-holder \
            -v "$work:/work" \
            --entrypoint qemu-system-x86_64 \
            "easyvm-ci:local" \
            -machine none -display none -qmp "unix:/work/drive.sock.qmp,server=on,wait=off"

          # WAIT FOR THE SOCKET TO EXIST, which is qemu's own signal that it bound the path.
          ok=""
          for i in $(seq 1 60); do
            if docker run --rm -v "$work:/work" --entrypoint test \
                 "easyvm-ci:local" -S /work/drive.sock.qmp 2>/dev/null; then ok=yes; break; fi
            sleep 1
          done
          [ "$ok" = yes ] || { echo "=== qemu DID NOT BIND THE SOCKET ==="; docker logs probe-holder; exit 1; }

          # THE BEHAVIOUR UNDER TEST, ASKED DIRECTLY: the binary's own probe must see it, and the
          # file must survive. `easyvm` has no `probe` subcommand, so this asks the same question the
          # way `Boot` does - and then the whole point is that no `rm` follows it.
          #
          # A DAEMON ON THIS DIRECTORY MUST REFUSE, AND MUST NOT UNLINK. `run` with a file that does
          # not exist fails later, after `Boot` has had its chance to delete the socket - so the
          # assertion is the socket's continued existence rather than the step's exit status.
          set +e
          timeout 90 docker run --rm \
            --cap-add NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -v "$work:/work" \
            "easyvm-ci:local" run /walks/does-not-exist.yaml --work /work > /tmp/live.log 2>&1
          set -e
          cat /tmp/live.log

          before=$(docker run --rm -v "$work:/work" --entrypoint test \
                     "easyvm-ci:local" -S /work/drive.sock.qmp 2>&1 || echo gone)
          if [ "$before" = "gone" ]; then
            echo "=== THE LIVE QMP SOCKET WAS DELETED, WHICH IS THE DEFECT THIS JOB EXISTS FOR ==="
            docker rm -f probe-holder
            exit 1
          fi
          echo "the live socket survived: a running machine cannot be orphaned by a second boot"

          docker rm -f probe-holder

          # AND A LEFTOVER IS STILL REMOVED, or the fix would trade one silent failure for another:
          # a work directory that can never be started in again. The leftover is made by killing the
          # holder, which on this filesystem leaves the name behind - and if it does not, the case is
          # vacuous rather than failed, so it says which happened.
          work2=$(mktemp -d)
          docker run -d --name probe-dead \
            -v "$work2:/work" \
            --entrypoint qemu-system-x86_64 \
            "easyvm-ci:local" \
            -machine none -display none -qmp "unix:/work/drive.sock.qmp,server=on,wait=off"
          for i in $(seq 1 60); do
            if docker run --rm -v "$work2:/work" --entrypoint test \
                 "easyvm-ci:local" -S /work2/drive.sock.qmp 2>/dev/null; then break; fi
            sleep 1
          done
          docker kill -s KILL probe-dead >/dev/null 2>&1 || true
          docker rm -f probe-dead >/dev/null 2>&1 || true

          if docker run --rm -v "$work2:/work" --entrypoint test \
               "easyvm-ci:local" -S /work2/drive.sock.qmp 2>/dev/null; then
            echo "a leftover socket is present; the next boot must remove it rather than refuse"
            # A DAEMON ON THIS DIRECTORY MUST GET PAST THE PROBE. Its failure, if any, has to be about
            # the walkthrough file and not about the socket.
            set +e
            timeout 90 docker run --rm \
              --cap-add NET_ADMIN \
              --device /dev/net/tun:/dev/net/tun \
              -v "$work2:/work" \
              "easyvm-ci:local" run /walks/does-not-exist.yaml --work /work > /tmp/dead.log 2>&1
            set -e
            cat /tmp/dead.log
            case "$(cat /tmp/dead.log)" in
              *"already listening"*)
                echo "=== A LEFTOVER SOCKET WAS REFUSED INSTEAD OF REMOVED ==="
                exit 1 ;;
            esac
          else
            echo "NOTE: this filesystem reclaims the socket name on close, so the leftover case is"
            echo "      covered by the unit test instead of here."
          fi

      - name: what the job proved
        run: |
          cat <<'EOF'
          === THE THREE LOCKS, ASKED OF THE IMAGE ===

          1  a second daemon on one --work directory is refused, by directory, holder and pid
          2  that lock is released by SIGKILL, so it is the kernel's and not a pidfile's
          3  a live qemu's socket is refused rather than deleted; a leftover's is removed

          1 and 2 are `LockWork` (internal/daemon/worklock.go). 3 is
          `probeUnixSocket` in `Boot` (internal/daemon/driver.go).

          THE E2E THAT USES THEM IS ubuntu.yml, which is the cheapest guest this repository has.
          A green run here and a green ubuntu chain is the pair that says a walkthrough cannot
          collide with another one.
          EOF
