name: macos26

# MACOS 26 (TAHOE), AS A CHAIN THAT TODAY HAS ONE STAGE.
#
# THIS FILE EXISTS BECAUSE 26 HAD NO ENTRY POINT AT ALL. `macos/26/steps/` held one file - `resume.yaml`,
# which boots a disk that already exists - so nothing ever INSTALLED 26, and the firmware this
# repository publishes for it (`macos-asset-*-26`) had no consumer. The setup stage below is that
# consumer, and it is the only stage: 26 has no `ssh` or `vm-configure` walkthrough yet.
#
# WHY A SEPARATE FILE RATHER THAN A ROW IN macos.yml. The two releases pull DIFFERENT ASSETS - a
# different recovery image and a different firmware, with different identities baked into it - and a
# matrix that chose between them would put the choice in a variable instead of in the file a reader
# opens. `macos.yml` is the 15 chain and this is the 26 chain; the day 26 grows an ssh stage it gets a
# job here, not a condition there.
#
# THE CHAIN IS TWO STAGES, AND `from_tag` PICKS WHERE IT STARTS.
#
#   setup   CREATES the disk: recovery image, Disk Utility, the copy, the first boot.
#   ssh     ANSWERS the Setup Assistant, enables Remote Login, and powers off through sshd.
#
# There is no `vm-configure` stage because there is no `macos/26/steps/vm-configure.walk` - 26 never
# grew one, and inventing a stage for a file that does not exist is a job that fails at load.
#
# `from_tag: macos26` starts at `ssh`, because that disk is already published. `from_tag: macos26-ssh`
# is accepted by the ssh job as well: it means "the disk I want is the one ssh publishes", which is
# how a dispatch names the LAST tag when it wants the chain to end there.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the assets"
        default: "easydev-org/easyvm"
      from_tag:
        description: "start from this published disk instead of building it (macos26, macos26-ssh)"
        default: ""

concurrency:
  group: macos26
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  # THE GUEST'S MEMORY HAS TO FIT IN THE RUNNER'S, AND THE CHECK READS THE WALK RATHER THAN A CONSTANT.
  #
  # MEASURED ON RUN 44122437321, at the 16384 this file used to ask for: the erase and the licence
  # sheet passed, the destination card was selected, "the copy runs, look 1" began, and at its tenth
  # attempt the QMP connection became `write: broken pipe` and every later attempt said the same. The
  # daemon logged no error, the qemu console had nothing after `HANDOFF TO XNU`, and disk.qcow2 was
  # still 194 KiB - it had never grown. That is an OOM kill seen from the process that survives it:
  # qemu allocates a guest's RAM on demand, so a guest larger than the runner boots, looks healthy,
  # and dies once the copy touches enough pages.
  #
  # THE WALK NOW ASKS FOR 12288, measured on a host with room: qemu's RSS plateaus at 12.01 GiB while
  # the install advances normally. 12288 + 8 leaves the runner room for qemu itself, the page cache
  # the recording writes through, and the 128 GiB qcow2's metadata.
  #
  # IT IS A SEPARATE JOB SO THE MESSAGE IS THE WHOLE JOB. A check inside `setup` would be one step of
  # forty and would read as "prepare failed".
  room:
    runs-on: ubuntu-24.04
    steps:
      # THE FILE THIS CHECK READS HAS TO BE HERE, which is what the checkout is for - the check would
      # otherwise compare the runner against an empty string and pass everything.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: macos/26/steps/setup.walk
      - name: the guest's memory has to fit in the runner's
        run: |
          set -eu
          # THE NUMBER COMES FROM THE FILE THE STAGE RUNS, so raising it there is caught here instead
          # of turning into a broken pipe nobody can attribute.
          # THE VALUE IS READ WITH grep AND cut RATHER THAN AN awk CHARACTER CLASS. This
          # repository refuses bash-only constructs in a workflow - a container job's steps run under
          # dash, where they are syntax errors - and its check is a plain text match, so an awk
          # character class for whitespace trips it. MEASURED: internal/oci's
          # TestNoWorkflowUsesABashOnlyConstruct failed on the awk version of this line.
          # THE `.walk` SPELLS IT `memory_mb == 12288`, so the field separator is `==` and not `:`.
          # THE VALUE IS THE LAST WORD ON THE LINE, which is true of both spellings - so `awk
          # '{print $NF}'` reads either one and the check does not have to be edited again when a
          # file moves between formats.
          need_mib=$(grep -m1 'memory_mb' macos/26/steps/setup.walk | awk '{print $NF}' | tr -cd '0-9')
          if [ -z "$need_mib" ]; then
            echo "::error::macos/26/steps/setup.walk declares no memory_mb, so this check cannot say whether the guest fits"
            exit 1
          fi
          need_gib=$(( need_mib / 1024 ))
          total_kib=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)
          total_gib=$(( total_kib / 1024 / 1024 ))
          echo "runner: ${total_gib} GiB, guest: ${need_gib} GiB (macos/26/steps/setup.walk memory_mb: ${need_mib})"
          # THE MARGIN IS TWO GIB, AND IT COMES FROM THE MEASUREMENT RATHER THAN FROM FEAR.
          #
          # Measured on a host with room: a 12 GiB guest's qemu RSS climbs to 12.01 GiB during the copy
          # and plateaus - the guest uses essentially all of its own RAM, and qemu's own footprint on
          # top is small. The page cache the recording writes through is RECLAIMABLE, so it does not
          # cause an OOM kill; the cgroup this was measured in reported `max 1539` with `oom_kill 0`,
          # which is the kernel reclaiming page cache rather than killing anything.
          #
          # SO THE TEST IS "THE GUEST'S RAM PLUS TWO GIB", NOT "PLUS EIGHT". A margin larger than the
          # real overhead would fail a runner that can actually do the work, which is the mistake the
          # first version of this check made: it demanded 20 GiB and would have refused the 15 GiB
          # runner that this walk is now sized for.
          margin_gib=2
          if [ "$total_gib" -lt $(( need_gib + margin_gib )) ]; then
            echo "::error::this runner has ${total_gib} GiB and the macOS 26 setup walk asks for ${need_gib} GiB plus about ${margin_gib} GiB for qemu itself. The guest will be killed by the OOM killer a few minutes into the copy, with no error in any log - measured on run 44122437321, where a 16 GiB guest on a 15 GiB runner left disk.qcow2 at 194 KiB. Lower memory_mb in macos/26/steps/setup.walk, or use a larger runner."
            exit 1
          fi

  setup:
    needs: room
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos26')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos26
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos26-setup",
            "file": "macos/26/steps/setup.walk",
            "pull": "",
            "assets": ["macos-recovery-tahoe:recovery.dmg", "macos-asset-boot-26:boot.img", "macos-asset-rom-26:macos.rom", "macos-asset-vars-26:macos.vars"],
            "out": "macos26.qcow2",
            "publish": "macos26",
            "timeout": 400
          }
        ]

  # THE `ssh` STAGE, WHICH STARTS BY ANSWERING THE WIZARD.
  #
  # `setup` ENDS WHERE THE INSTALLER ENDS: the Setup Assistant is up and there is no user yet. This
  # stage answers every pane, logs in as the account it creates, turns Remote Login on, proves the
  # session over ssh, and powers the guest off through its own init - so APFS closes its journal
  # before the disk is published.
  #
  # IT IS A SEPARATE JOB FOR THE SAME REASON macos.yml HAS ONE: the wizard plus the login plus the
  # ssh proof is its own hour, and a failure here must cost that hour rather than the whole install.
  #
  # ITS OWN `timeout` IS 200 MINUTES. Measured: the wizard took ~25 minutes on the workbench and the
  # CI runner is slower (the install there is ~40 minutes against ~25), and the update pane's
  # reset-then-wait-then-log-in sequence alone spends two and a half minutes.
  ssh:
    needs: [room, setup]
    # A SKIPPED `setup` IS SATISFIED BY `needs`, which is what makes `from_tag: macos26` start HERE:
    # the disk is already published, and re-installing it to reach a one-hour wizard is three wasted
    # hours. A FAILED setup is still refused, because then `macos26` points at an older disk and an
    # ssh stage that ran anyway would prove something about a disk nobody asked about.
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos26' || inputs.from_tag == 'macos26-ssh')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos26
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos26-ssh",
            "file": "macos/26/steps/ssh.walk",
            "pull": "macos26",
            "assets": ["macos-asset-boot-26:boot.img", "macos-asset-rom-26:macos.rom", "macos-asset-vars-26:macos.vars"],
            "out": "macos26-ssh.qcow2",
            "publish": "macos26-ssh",
            "timeout": 200
          }
        ]

  # THE VM-CONFIGURE STAGE: the guest agent, the three names, the login agent and auto login.
  #
  # IT IS NOT A COPY OF macos/15/steps/vm-configure.walk. A probe against the disk the ssh stage
  # publishes answered for 26 - time zone already America/Los_Angeles, locale already en_US, FileVault
  # already Off, LocalHostName already `vmuser` - so the time zone, locale and FileVault steps are
  # GONE, and what is left is what the probe found missing: HostName, ComputerName,
  # ~/Library/LaunchAgents (which does not exist), /etc/kcpassword, and `displaysleep 10`.
  #
  # ITS OWN HOUR AND A HALF. `xcode` is not here - that is the dev job - but the agent install plus the
  # launcher proof plus two reboots' worth of ssh is still the longest of the configure stages.
  vm-configure:
    needs: [room, ssh]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos26' || inputs.from_tag == 'macos26-ssh' || inputs.from_tag == 'macos26-vm-configure')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos26
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos26-vm-configure",
            "file": "macos/26/steps/vm-configure.walk",
            "pull": "macos26-ssh",
            "assets": ["macos-asset-boot-26:boot.img", "macos-asset-rom-26:macos.rom", "macos-asset-vars-26:macos.vars", "macos-asset-mac-guest-agent:mac-guest-agent"],
            "out": "macos26-vm-configure.qcow2",
            "publish": "macos26-vm-configure",
            "timeout": 90
          }
        ]

  # THE DEVELOPER TOOLCHAIN, WHICH IS THE FOURTH STAGE OF THE 15 CHAIN AND THE THIRD HERE.
  #
  # IT IS XCODE 26.6 RATHER THAN THE 26.3 macos15 USES, and the difference is measured rather than
  # chosen. Apple's requirements table gives 26.3 as "macOS Sequoia 15.6 - Tahoe 26.x" and 26.6 as
  # "macOS Tahoe 26.2 - 26.x": 26.3 is the newest SEQUOIA can run, 26.6 is the newest TAHOE - and the
  # newest for INTEL at all, because Xcode 27's release notes say it "will only install and run on
  # Apple silicon Macs". This guest is x86_64.
  #
  # `Universal`, NOT `Apple_silicon`: both are published for every 26.x release and only Universal
  # installs on an Intel Mac.
  #
  # THE ASSETS ARE THE REASON THIS JOB EXISTS RATHER THAN A ROW SOMEWHERE. `TestEverySCPSourceIsProduced`
  # refuses a walk whose `scp:` names a file no earlier step writes, so `Xcode_26.6_Universal.xip`,
  # `node.pkg` and `python.pkg` have to be declared here for `pull-artifact.sh` to place them.
  #
  # NINETY MINUTES, THE SAME AS macos.yml'S dev JOB: expanding a .xip prints nothing for about twenty
  # minutes and `xcodebuild -runFirstLaunch` is another long silence, so the stage's own clock is
  # mostly waiting.
  dev:
    needs: [room, vm-configure]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'macos26' || inputs.from_tag == 'macos26-ssh' || inputs.from_tag == 'macos26-vm-configure' || inputs.from_tag == 'macos26-dev')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: macos26
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "macos26-dev",
            "file": "macos/26/steps/dev.walk",
            "pull": "macos26-vm-configure",
            "assets": ["macos-asset-boot-26:boot.img", "macos-asset-rom-26:macos.rom", "macos-asset-vars-26:macos.vars", "macos-asset-xcode-26.6:Xcode_26.6_Universal.xip", "dev-node-pkg:node.pkg", "dev-python-pkg:python.pkg"],
            "out": "macos26-dev.qcow2",
            "publish": "macos26-dev",
            "timeout": 90
          }
        ]
