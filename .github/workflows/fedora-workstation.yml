name: fedora-workstation

# # FEDORA-WORKSTATION, ONE STAGE: its `ssh.yaml`.
#
# THAT IS THE STAGE THAT PROVES THE MACHINE - the disk boots, the guest reaches a desktop, sshd
# answers, and the bootstrap chain can be checked - without paying for an install that is 20 to 40
# minutes of clicking through a wizard.
#
# ITS TAG IS `linux-fedora-workstation-ssh`, NOT THE `fedora-workstation-ssh` SHAPE WINDOWS AND MACOS USE. Discovered rather
# than assumed: a wrong tag is a 404 at pull time that reads like a registry problem.
#
# THE NAME IS THE DISTRIBUTION, AND THAT IS THE POINT OF THE SPLIT.
#
# `concurrency:` IS PER WORKFLOW, so dispatching `ubuntu` cannot cancel `ghostbsd` or `windows`. A single
# file holding every stage meant DISPATCHING A LINUX FIX CANCELLED A RUNNING WINDOWS INSTALL - measured,
# forty minutes of one thrown away. The group exists to stop two runs fighting over one machine, and a
# matrix leg is not one machine: every leg gets its own runner.
#
# AND THE MECHANISM IS NOT COPIED. The container options, the device probes, the pull, the daemon and
# the follow loop live once in `stage.yml`, called with `workflow_call`. easydiskbake's 26 workflows
# repeat the same container stanza 23 times; that is the duplication this avoids.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-fork"
      from_tag:
        description: >-
          start from a PUBLISHED disk: linux-fedora-workstation or linux-fedora-workstation-ssh. Empty runs the whole chain.
        default: ""

concurrency:
  group: fedora-workstation
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS.
#
# `stage.yml` declares `packages: write`, and that is not enough on its own: a reusable workflow's
# permissions are CLAMPED to the caller's. This file declared none, so the token it handed down had
# the repository default - and the install leg's `easyvm push` was refused with
#
#	FAILED: the registry refused a pull,push token (HTTP 403):
#	{"errors":[{"code":"DENIED","message":"requested access to the resource is denied"}]}
#
# measured on windows-install, which had already written a 10767 MiB disk and could not publish it.
# `artifacts-publish.yml` worked the whole time because it is a TOP-LEVEL workflow and its own
# `permissions:` block is the one that applies.
permissions:
  contents: read
  packages: write
  # THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS, so this has to be here too: the
  # live log is a check run, and publishing one needs `checks: write`.
  checks: write

# THE LEGS ARE JOBS THAT DEPEND ON EACH OTHER, NOT A MATRIX.
#
# THIS FILE USED TO PASS ALL THREE LEGS AS ONE `stages:` MATRIX, so they STARTED AT ONCE - and the
# ssh leg asks for the tag the install leg publishes, which does not exist yet. MEASURED on run
# 44346623094: `linux-manjaro-install` finished 32 of 32 steps and pushed its disk, while
# `linux-manjaro-ssh` failed at step 5 with
#
#	linux-manjaro-ssh is not in the package
#
# because it was pulling a tag ANOTHER LEG IN ITS OWN MATRIX had not written. `needs:` is the fix,
# and `cachyos.yml` already had it.
jobs:
  install:
    if: github.event_name != 'workflow_dispatch' || inputs.from_tag == ''
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: fedora-workstation
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-fedora-workstation-install",
            "file": "linux/fedora-workstation/steps/install.walk",
            "pull": "",
            "assets": [
              "iso-fedora-workstation:fedora-workstation.iso"
            ],
            "out": "linux-fedora-workstation.qcow2",
            "publish": "linux-fedora-workstation",
            "timeout": 90
          }
        ]

  ssh:
    needs: [install]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == 'linux-fedora-workstation')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: fedora-workstation
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-fedora-workstation-ssh",
            "file": "linux/fedora-workstation/steps/ssh.walk",
            "pull": "linux-fedora-workstation",
            "out": "linux-fedora-workstation-ssh.qcow2",
            "timeout": 60,
            "publish": "linux-fedora-workstation-ssh"
          }
        ]

  vm:
    needs: [ssh]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == 'linux-fedora-workstation' || inputs.from_tag == 'linux-fedora-workstation-ssh')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: fedora-workstation
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-fedora-workstation-vm",
            "file": "linux/fedora-workstation/steps/vm-configure.walk",
            "pull": "linux-fedora-workstation-ssh",
            "fallback": "linux-fedora-workstation",
            "out": "linux-fedora-workstation-vm.qcow2",
            "timeout": 60,
            "publish": "linux-fedora-workstation-vm"
          }
        ]
