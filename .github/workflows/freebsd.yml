name: freebsd

# freebsd, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE SHAPE IS THE ONE THE OTHER DISTRIBUTIONS USE, AND THE REASON IS THE SAME ONE: the legs used to
# run as a parallel matrix, and a leg that asks for the tag the leg before it publishes gets a 404
# while that leg is still running. It then falls back to the INSTALL disk - which has no desktop - and burns its whole
# budget on a machine that could never answer.
#
# `needs:` IS THE FIX. A leg cannot start before the artifact it pulls exists, because it is not
# SCHEDULED until then. The cost is the sum rather than the maximum, and a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#
# FREEBSD REPLACES GHOSTBSD, AND THE MEASUREMENT THAT DECIDED IT IS IN THE ESP:
#
#	FreeBSD 15.1  EFI/BOOT/BOOTX64.EFI  665600 bytes, first16 = 4d5a90000300000004000000ffff0000
#	GhostBSD 26.3 EFI/BOOT/BOOTX64.EFI       0 bytes
#
# GhostBSD's GBI writes a ZERO-BYTE boot loader into the EFI system partition, so UEFI cannot load
# the installed system and the machine falls back to the install CD. That is a defect in GBI that no
# walkthrough can repair - the disk it leaves is not bootable. FreeBSD's `bsdinstall` writes a real
# MZ/PE executable, and a disk from this chain boots to `login:` with no CD attached.
#
# FREEBSD IS NOT THE CHEAPER VERSION OF GHOSTBSD EITHER: both are the same base system, and FreeBSD
# additionally has a SCRIPTED installer (`bsdinstall script`) whose preamble is a file rather than a
# sequence of dialogs.
#
# EVERY STAGE IS STILL DISPATCHABLE ON ITS OWN. `from_tag` names a PUBLISHED disk and the chain starts
# at the stage that needs it - the earlier jobs are skipped, because a `needs` on a SKIPPED job is
# satisfied.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm-fork"
      from_tag:
        description: >-
          start from a PUBLISHED disk: bsd-freebsd-install or bsd-freebsd-ssh or bsd-freebsd-vm. Empty runs the whole chain. A fix to a later stage then costs that stage, not the entire bake.
        default: ""

concurrency:
  group: freebsd
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS, and `stage.yml` needs all three:
# `packages: write` to publish a disk, `checks: write` to stream the live log, `contents: read` to check
# out the walkthroughs.
permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    # `from_tag:` NAMES A PUBLISHED DISK AND THE CHAIN STARTS FROM IT - SO THE INSTALL DOES NOT RUN.
    #
    # THIS JOB HAD NO `if:` AT ALL, which is the same defect `6643303` fixed for ubuntu and windows and
    # `375c8c9` fixed for macos: `gh workflow run freebsd.yml -f from_tag=bsd-freebsd-install` was meant
    # to pick up the disk install had already published and run the later stages against it, and instead
    # it started the whole forty-four-step install that would REPUBLISH the very tag the caller named.
    #
    # MEASURED, on run 43628110384: dispatched with `from_tag=bsd-freebsd-install`, and the install job
    # was `in_progress` at step 10 within three minutes.
    if: github.event_name != 'workflow_dispatch' || inputs.from_tag == ''
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: freebsd
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-freebsd-install",
            "file": "bsd/freebsd/steps/install.walk",
            "pull": "",
            "assets": ["iso-freebsd:freebsd.iso"],
            "out": "bsd-freebsd-install.qcow2",
            "publish": "bsd-freebsd-install",
            "timeout": 180
          }
        ]

  ssh:
    needs: [install]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'bsd-freebsd-install')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: freebsd
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-freebsd-ssh",
            "file": "bsd/freebsd/steps/ssh.walk",
            "pull": "bsd-freebsd-install",
            "out": "bsd-freebsd-ssh.qcow2",
            "publish": "bsd-freebsd-ssh",
            "timeout": 240
          }
        ]

  vm:
    needs: [ssh]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'bsd-freebsd-install' || inputs.from_tag == 'bsd-freebsd-ssh')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: freebsd
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "bsd-freebsd-vm",
            "file": "bsd/freebsd/steps/vm-configure.walk",
            "pull": "bsd-freebsd-ssh",
            "out": "bsd-freebsd-vm.qcow2",
            "publish": "bsd-freebsd-vm",
            "timeout": 60
          }
        ]
