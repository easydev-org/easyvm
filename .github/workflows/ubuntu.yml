name: ubuntu

# ubuntu, AS A CHAIN OF JOBS THAT DEPEND ON EACH OTHER.
#
# THE LEGS USED TO RUN AS ONE PARALLEL MATRIX, and that produced a race with a timeout for a tail: a leg
# asks for the tag the leg before it publishes, gets a 404 because that leg is still running, falls back
# to the INSTALL disk - which has no sshd - and spends its whole budget on a machine that could never
# answer.
#
# `needs:` IS THE FIX, AND IT IS WHAT THE REFERENCE IMPLEMENTATION ALWAYS DID:
#
#	jobs/bake  ->  jobs/launch needs bake  ->  jobs/ssh needs bake  ->  jobs/vm-configure needs ssh
#
# A leg cannot start before the artifact it pulls exists, because it is not SCHEDULED until then. The
# cost is the sum rather than the maximum, and that is the right way round: a serial chain that finishes
# is worth more than a parallel one whose third leg always times out.
#
# EVERY STAGE IS STILL DISPATCHABLE ON ITS OWN. `from_tag` names a PUBLISHED disk and the chain starts
# at the stage that needs it - the earlier jobs are skipped, because a `needs` on a SKIPPED job is
# satisfied. That is the reference implementation's `ssh_from`, and it is why there are 3 jobs
# rather than one file with 3 steps.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easyvm"
      from_tag:
        description: >-
          start from a PUBLISHED disk: linux-ubuntu or linux-ubuntu-ssh or linux-ubuntu-vm. Empty runs the whole chain. A fix to a later stage then costs that stage, not the entire bake.
        default: ""

concurrency:
  group: ubuntu
  cancel-in-progress: true

# THE CALLED WORKFLOW CANNOT ASK FOR MORE THAN ITS CALLER GRANTS, and `stage.yml` needs all three:
# `packages: write` to publish a disk, `checks: write` to stream the live log, `contents: read` to check
# out the walkthroughs.
permissions:
  contents: read
  packages: write
  checks: write

jobs:
  install:
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: ubuntu
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-ubuntu-install",
            "file": "linux/ubuntu/steps/install.yaml",
            "pull": "",
            "out": "linux-ubuntu.qcow2",
            "publish": "linux-ubuntu",
            "timeout": 90
          }
        ]

  ssh:
    needs: [install]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'linux-ubuntu')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: ubuntu
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-ubuntu-ssh",
            "file": "linux/ubuntu/steps/ssh.yaml",
            "pull": "linux-ubuntu",
            "out": "linux-ubuntu-ssh.qcow2",
            "publish": "linux-ubuntu-ssh",
            "timeout": 60
          }
        ]

  vm:
    needs: [ssh]
    if: always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.from_tag == '' || inputs.from_tag == 'linux-ubuntu' || inputs.from_tag == 'linux-ubuntu-ssh')
    uses: ./.github/workflows/stage.yml
    secrets: inherit
    with:
      group: ubuntu
      disks_repository: ${{ inputs.disks_repository }}
      stages: |
        [
          {
            "name": "linux-ubuntu-vm",
            "file": "linux/ubuntu/steps/vm-configure.yaml",
            "pull": "linux-ubuntu-ssh",
            "out": "linux-ubuntu-vm.qcow2",
            "publish": "linux-ubuntu-vm",
            "timeout": 60
          }
        ]

