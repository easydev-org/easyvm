name: walkthrough

# Replicate a Windows 11 stage against easyvm itself.
#
# THE POINT IS NOT "THE BINARY STARTS". It is that the YAML file in this repository drives a real
# machine through a real stage: an installed disk is booted, reached over ssh, changed, published.
# A stage that only compiles proves nothing about that.
#
# EVERY DISK IS PULLED, NOT BAKED. Baking Windows takes 45 to 90 minutes and is not what this
# repository tests - the disks already exist in ghcr, published by easydiskbake, and the question
# here is whether easyvm can drive them. `easyvm pull` fetches one; `easyvm run` starts it.
#
# THE MACHINE IS A CONTAINER AND THE COMMANDS ARE CLIENTS. `easyvm serve` owns qemu, the QMP socket
# and the console, and every `run`/`status`/`stop` is a request to it over a unix socket - so the
# machine has one owner for the whole stage, and a stage that fails leaves something `status` can
# still describe. The container gets the two devices the network requires: --device /dev/net/tun
# and --cap-add NET_ADMIN. Without them the daemon refuses to start rather than falling back to
# qemu's user-mode network, which cannot work here - the SMB server binds 172.30.0.1 on the host
# side of the tap.
#
# WHY THERE IS NO macOS JOB YET, AND IT IS NOT AN OVERSIGHT.
#
# A macOS guest boots through OpenCore, which is a pflash ROM plus a variable store plus a FAT boot
# image - all built on the host from the recovery image, because Apple's APFS driver is extracted
# out of it. `internal/machine.Boot.Validate` refuses a macOS boot without those three files, and
# this build has no step that produces them: `internal/asset` returns "not implemented" for every
# macOS asset. Adding a job that boots a macOS disk would therefore fail at its first step with
# "OpenCore's firmware ROM is missing" - a true message, forty minutes after the pull, about a
# capability rather than about a machine.
#
# So the Windows stage is proven first, and the macOS job arrives with the step that builds
# OpenCore. The YAML for it is already in the tree and already loads; what is missing is host work,
# not a walkthrough.

on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: "Windows 11: boot the ssh disk, prove ssh, configure the guest, publish (~40 min)"
        type: boolean
        default: true
      windows_ssh_from:
        description: "Windows: the disk to start from"
        default: "windows11-ssh"
      # WHERE THE DISKS COME FROM. A separate input because the artifact repository is a different
      # repository from this one, and a rename must not silently pull from the wrong place.
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easydiskbake"
      timeout_minutes:
        description: "how long the stage may run"
        default: "60"

concurrency:
  group: walkthrough
  cancel-in-progress: false

env:
  # THE IMAGE THIS REPOSITORY BUILDS, which is also the environment every stage runs in: qemu 11.1,
  # OVMF, samba, dnsmasq, ffmpeg, tesseract, qemu-img and the easyvm binary.
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  # ===========================================================================
  # WINDOWS 11 - boot the published disk and drive it over ssh.
  #
  # windows/11/steps/ssh.yaml does: take the input disk, boot it, wait for the desktop, turn on
  # sshd, prove the build and the account, configure the machine, publish, stop. The steps that
  # need the answer file and the driver CD belong to the INSTALL stage, which is not run here -
  # this disk is already installed, so its boot is a disk boot with no media attached.
  # ===========================================================================
  windows:
    if: inputs.windows_run
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '60') }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: log in to ghcr
        # THE DISK IS IN A DIFFERENT REPOSITORY'S PACKAGES, so the pull needs a token that can read
        # it. `docker login` is for the image below; `easyvm pull` takes the same token from
        # GITHUB_TOKEN, which is passed into the container by name and never written to disk.
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: prepare
        # THE TWO DEVICES THE NETWORK REQUIRES, ASSERTED BEFORE ANYTHING PULLS. A runner without
        # /dev/kvm or /dev/net/tun produces a qemu that crawls or a daemon that refuses, and the
        # refusal is right - but the message is clearer here than forty minutes later.
        run: |
          set -euo pipefail
          test -e /dev/kvm || { echo "=== NO /dev/kvm ==="; exit 1; }
          test -e /dev/net/tun || { echo "=== NO /dev/net/tun ==="; exit 1; }
          ls -l /dev/kvm /dev/net/tun
          mkdir -p work

      - name: pull the disk
        # THE DISK ARRIVES BEFORE THE MACHINE STARTS, so a pull failure is one step with one
        # message rather than a boot that waits out its timeout on a file that is not there.
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /usr/local/bin/easyvm \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -v "$PWD/work:/work" \
            "${{ env.IMAGE }}" \
            pull --tag "${{ inputs.windows_ssh_from || 'windows11-ssh' }}" \
                 --repository "${{ inputs.disks_repository }}" \
                 --dest "/work/disk.qcow2"
          ls -l work/

      - name: start the daemon
        # ONE CONTAINER OWNS THE MACHINE FOR THE WHOLE STAGE. It runs detached because `run`
        # returns immediately - the daemon drives the file, the client says where it is - and a
        # detached daemon means a stage that hangs still has a `status` to read.
        run: |
          set -euo pipefail
          docker run -d --name easyvm \
            --device /dev/kvm \
            --device /dev/net/tun \
            --cap-add NET_ADMIN \
            -v "$PWD/work:/work" \
            -v "$PWD:/src:ro" \
            -p 6080:6080 \
            "${{ env.IMAGE }}" \
            serve --work /work --novnc-port 6080

          # THE READY LINE IS THE CONTRACT, not the socket file: a file that exists is not a daemon
          # that answers. The output is CAPTURED FIRST and searched second - `docker logs ... |
          # grep -q` closes the pipe on its first match, the writer takes SIGPIPE, and `set -o
          # pipefail` turns that into exit 141 for a check that SUCCEEDED. That has already
          # happened twice in this repository.
          for i in $(seq 1 30); do
            logs=$(docker logs easyvm 2>&1 || true)
            case "$logs" in *"listening on"*) break ;; esac
            sleep 1
          done
          logs=$(docker logs easyvm 2>&1 || true)
          printf '%s\n' "$logs"
          case "$logs" in
            *"listening on"*) echo "the daemon is up" ;;
            *) echo "=== THE DAEMON DID NOT COME UP ==="; exit 1 ;;
          esac

      - name: ask for the run
        # THE FILE IS THE ARGUMENT. `--boot-disk` names what to start and `--out` where a
        # `compress:` writes - both are facts about the job, which is why they are flags and not
        # YAML: the same file must be runnable against any copy of the disk.
        run: |
          set -euo pipefail
          docker exec easyvm /usr/local/bin/easyvm run \
            /src/windows/11/steps/ssh.yaml \
            --work /work \
            --boot-disk /work/disk.qcow2 \
            --out /work/windows11-ssh.qcow2 \
            --password admin

      - name: follow it
        # SIXTY SECONDS AT A TIME, AND THE STATUS EACH TIME. A stage that reports nothing for forty
        # minutes is a stage whose failure cannot be placed; `status` is one line and it is already
        # the fact a reader wants. The state is matched with `case` rather than `| grep -q`, for
        # the SIGPIPE reason above.
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 60 * 60))
          while [ $SECONDS -lt $deadline ]; do
            state=$(docker exec easyvm /usr/local/bin/easyvm status --work /work 2>&1 || true)
            printf '%s\n' "$state"
            case "$state" in
              *"status: finished"*)
                echo "=== THE WALKTHROUGH FINISHED ==="
                docker logs --tail 200 easyvm 2>&1
                exit 0 ;;
              *"status: failed"*)
                echo "=== THE WALKTHROUGH FAILED ==="
                docker logs --tail 400 easyvm 2>&1
                exit 1 ;;
            esac
            sleep 60
          done
          echo "=== THE WALKTHROUGH DID NOT FINISH IN AN HOUR ==="
          docker logs --tail 400 easyvm 2>&1
          exit 1

      - name: what it produced
        if: always()
        run: |
          set -euo pipefail
          docker logs easyvm > work/daemon.log 2>&1 || true
          ls -l work/ || true

      - name: stop the container
        if: always()
        run: |
          docker stop easyvm || true
          docker rm easyvm || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-walkthrough
          path: |
            work/daemon.log
            work/*.mp4
            work/*.qcow2
          if-no-files-found: warn
          retention-days: 7
