name: walkthrough

# Replicate the Windows 11 stage against easyvm itself, on the image this repository builds.
#
# THE POINT IS NOT "THE BINARY STARTS". It is that the YAML file in this repository drives a real
# machine through a real stage: a published disk is booted, reached over ssh, changed, and
# published again.
#
# THE JOB RUNS INSIDE THE IMAGE (`container:`), NOT IN A `docker run` IT STARTS.
#
# That is not a style choice, it is the difference between working and not. `docker run` gives a
# container ITS OWN network namespace, where /proc/sys/net is mounted read-only and
#
#     sysctl -w net.ipv4.ip_forward=1
#
# fails with "Read-only file system" - measured on run 43016361709, which is where this workflow
# failed first. A GitHub Actions `container:` job shares the runner's network namespace, so the
# sysctl is one the kernel will accept, which is how the Python implementation has always done it.
#
# THE NETWORK NEEDS THREE THINGS AND ALL THREE ARE ASSERTED BEFORE A GUEST STARTS:
#
#     --device /dev/net/tun    the tap the guest's NIC is attached to
#     --cap-add NET_ADMIN      creating the tap, the bridge and the iptables rules
#     --device /dev/kvm        hardware virtualisation; without it qemu runs interpreted and a
#                              60-minute stage becomes a 6-hour one
#
# The program refuses to fall back to qemu's user-mode network (`-netdev user`), because the host's
# smbd binds 172.30.0.1 on the bridge address and a user-mode guest cannot route to it.
#
# WHY THERE IS NO macOS JOB YET, AND IT IS NOT AN OVERSIGHT.
#
# A macOS guest boots through OpenCore - a pflash ROM, a variable store and a FAT boot image, all
# built on the host from the recovery image because Apple's APFS driver is extracted out of it - and
# machine.Boot.Validate refuses a macOS boot without those three files. This build has no step that
# produces them: internal/asset returns "not implemented" for every macOS asset. A macOS job would
# therefore fail at its first step, forty minutes after the pull, with a true message about a
# missing capability. The YAML is in the tree and already loads; what is missing is host work.

on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: "Windows 11: boot the ssh disk, prove ssh, configure the guest, publish (~40 min)"
        type: boolean
        default: true
      windows_ssh_from:
        description: "Windows: the disk to start from"
        default: "windows11-ssh"
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easydiskbake"
      timeout_minutes:
        description: "how long the stage may run"
        default: "70"

concurrency:
  group: walkthrough
  cancel-in-progress: false

jobs:
  windows:
    if: inputs.windows_run
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '70') }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        # THE THREE THINGS THE NETWORK AND THE GUEST NEED, ASSERTED BEFORE ANYTHING IS PULLED.
        # A runner without /dev/kvm or /dev/net/tun produces a qemu that crawls or a daemon that
        # refuses; the refusal is right, but this says which one and stops in two seconds.
        run: |
          set -eu
          test -e /dev/kvm || { echo "=== NO /dev/kvm ==="; exit 1; }
          test -e /dev/net/tun || { echo "=== NO /dev/net/tun ==="; exit 1; }
          ls -l /dev/kvm /dev/net/tun
          id
          # THE IMAGE ITSELF IS PART OF THE ENVIRONMENT, so what it carries is checked here rather
          # than discovered by a step that fails for an unrelated reason.
          easyvm versions
          qemu-img --version | head -1
          mkdir -p "$GITHUB_WORKSPACE/work"

      - name: pull the disk
        # THE DISK ARRIVES BEFORE THE MACHINE STARTS, so a pull failure is one step with one
        # message rather than a boot that waits out its timeout on a file that is not there.
        #
        # `easyvm pull`, NOT a shell-out: it resumes a partial transfer, it asks for one tag and
        # does not search, and the image carries no `oras` or `crane` to be a different version.
        run: |
          set -eu
          easyvm pull --tag "${{ inputs.windows_ssh_from || 'windows11-ssh' }}" \
                      --repository "${{ inputs.disks_repository }}" \
                      --dest $GITHUB_WORKSPACE/work/disk.qcow2
          ls -l "$GITHUB_WORKSPACE/work/"
          qemu-img check $GITHUB_WORKSPACE/work/disk.qcow2 || true

      - name: start the daemon
        # ONE PROCESS OWNS THE MACHINE FOR THE WHOLE STAGE. It is started in the background because
        # `easyvm run` is a CLIENT: it sends a request and returns, and the daemon drives the file.
        # That is what makes a hung stage diagnosable - `status` still answers.
        #
        # THE READY LINE IS THE CONTRACT, not the socket file: a file that exists is not a daemon
        # that answers. The output is CAPTURED FIRST and searched with `case`: `| grep -q` closes
        # the pipe on its first match, the writer takes SIGPIPE, and `set -o pipefail` turns that
        # into exit 141 for a check that SUCCEEDED. That has happened twice here already.
        run: |
          set -eu
          easyvm serve --work "$GITHUB_WORKSPACE/work" --novnc-port 6080 > $GITHUB_WORKSPACE/work/daemon.log 2>&1 &
          echo $! > $GITHUB_WORKSPACE/work/daemon.pid
          for i in $(seq 1 30); do
            logs=$(cat $GITHUB_WORKSPACE/work/daemon.log || true)
            case "$logs" in *"listening on"*) break ;; esac
            sleep 1
          done
          logs=$(cat $GITHUB_WORKSPACE/work/daemon.log || true)
          printf '%s\n' "$logs"
          case "$logs" in
            *"listening on"*) echo "the daemon is up" ;;
            *) echo "=== THE DAEMON DID NOT COME UP ==="; exit 1 ;;
          esac

      - name: ask for the run
        # THE FILE IS THE ARGUMENT. `--boot-disk` names what to start and `--out` where a
        # `compress:` writes - both are facts about the job, which is why they are flags and not
        # YAML: the same file must be runnable against any copy of the disk.
        run: |
          set -eu
          easyvm run "$GITHUB_WORKSPACE/windows/11/steps/ssh.yaml" \
            --work "$GITHUB_WORKSPACE/work" \
            --boot-disk $GITHUB_WORKSPACE/work/disk.qcow2 \
            --out $GITHUB_WORKSPACE/work/windows11-ssh.qcow2 \
            --password admin || {
              echo "=== THE DAEMON REFUSED THE RUN ==="
              cat $GITHUB_WORKSPACE/work/daemon.log
              exit 1
            }

      - name: follow it
        # SIXTY SECONDS AT A TIME, AND THE STATUS EACH TIME. A stage that reports nothing for forty
        # minutes is a stage whose failure cannot be placed; `status` is one line and it is already
        # the fact a reader wants. Matched with `case`, for the SIGPIPE reason above.
        #
        # POSIX SH ONLY, BECAUSE A `container:` JOB RUNS STEPS WITH /bin/sh, NOT BASH. The first
        # version of this loop counted with `$SECONDS`, which bash defines and dash does not:
        #
        #     /__w/_temp/xxx.sh: 3: SECONDS: parameter not set
        #
        # - so the step died on its third line, having already reported nothing, while the daemon
        # it was watching was up and starting a guest (run 43018660638). The loop counts its own
        # iterations instead: sixty sleeps of sixty seconds, which is the same hour and needs no
        # shell feature beyond arithmetic.
        run: |
          set -eu
          rounds=0
          while [ "$rounds" -lt 62 ]; do
            rounds=$((rounds + 1))
            state=$(easyvm status --work "$GITHUB_WORKSPACE/work" 2>&1 || true)
            printf '[%s] %s\n' "$(date +%H:%M:%S)" "$state"
            case "$state" in
              *"status: finished"*)
                echo "=== THE WALKTHROUGH FINISHED ==="
                exit 0 ;;
              *"status: failed"*)
                echo "=== THE WALKTHROUGH FAILED ==="
                cat $GITHUB_WORKSPACE/work/daemon.log
                exit 1 ;;
            esac
            if [ "$rounds" -lt 62 ]; then sleep 60; fi
          done
          echo "=== THE WALKTHROUGH DID NOT FINISH IN TIME ==="
          cat $GITHUB_WORKSPACE/work/daemon.log
          exit 1

      - name: what it produced
        if: always()
        run: |
          set -u
          ls -l "$GITHUB_WORKSPACE/work/" || true
          # THE DISK IS THE THING THE STAGE EXISTS TO PROVE, so its size is the first number a
          # reader wants - and the last frame is what a failure is diagnosed from.
          for f in "$GITHUB_WORKSPACE"/work/*.qcow2; do
            [ -e "$f" ] || continue
            printf '%s: %s MiB\n' "$f" "$(( $(stat -c %s "$f") >> 20 ))"
          done

      - name: stop the daemon
        if: always()
        run: |
          set -u
          if [ -f $GITHUB_WORKSPACE/work/daemon.pid ]; then
            pid=$(cat $GITHUB_WORKSPACE/work/daemon.pid)
            kill "$pid" 2>/dev/null || true
            # A DAEMON THAT DOES NOT EXIT IS HOLDING /dev/kvm. One `easyvm stop` is the polite
            # way; SIGKILL follows only if it is still there.
            easyvm stop --work "$GITHUB_WORKSPACE/work" 2>/dev/null || true
            sleep 5
            kill -9 "$pid" 2>/dev/null || true
          fi
          pgrep -a qemu-system-x86_64 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows11-walkthrough
          # RELATIVE TO THE WORKSPACE, because a `container:` job copies the workspace in and out
          # and an absolute path outside it is not collected.
          path: |
            work/daemon.log
            work/*.mp4
            work/*.qcow2
          if-no-files-found: warn
          retention-days: 7
