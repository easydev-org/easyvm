name: walkthrough

# Drive every migrated walkthrough against easyvm itself, on the image this repository builds.
#
# THE POINT IS NOT "THE BINARY STARTS". It is that the YAML files in this repository drive real
# machines through real stages: a published disk is booted, reached over ssh, changed, published
# again - and the two install stages go from an empty disk to a working system.
#
# THE JOB RUNS INSIDE THE IMAGE (`container:`), NOT IN A `docker run` IT STARTS.
#
# That is not a style choice, it is the difference between working and not. `docker run` gives a
# container ITS OWN network namespace, where /proc/sys/net is mounted read-only and
#
#     sysctl -w net.ipv4.ip_forward=1
#
# fails with "Read-only file system" - measured on run 43016361709, which is where this workflow
# failed first. A GitHub Actions `container:` job shares the runner's network namespace, so the
# sysctl is one the kernel will accept, which is how the Python implementation has always done it.
#
# THE NETWORK NEEDS THREE THINGS AND ALL THREE ARE ASSERTED BEFORE A GUEST STARTS:
#
#     --device /dev/net/tun    the tap the guest's NIC is attached to
#     --cap-add NET_ADMIN      creating the tap, the bridge and the iptables rules
#     --device /dev/kvm        hardware virtualisation; without it qemu runs interpreted and a
#                              60-minute stage becomes a 6-hour one
#
# The program refuses to fall back to qemu's user-mode network (`-netdev user`), because the host's
# smbd binds 172.30.0.1 on the bridge address and a user-mode guest cannot route to it.
#
# THE MACHINE'S OWN NETWORK IS THE PART THAT WAS WRONG TWICE, so it is worth naming both:
#
#     PREROUTING   a packet ARRIVING from outside, on its way to the bridge address
#     OUTPUT       a connection made BY A PROCESS IN THIS CONTAINER to that address
#
# The daemon's own ssh client is inside the container, so it needs the second one. With only
# PREROUTING the bridge address refuses in three milliseconds and the step reports
# "connection refused" about a guest whose sshd is running (run 43022310562, step 16 of 29).
#
# THE STAGES ARE A MATRIX, AND EACH ORDER IS THE LIFECYCLE THEY WERE BUILT IN.
#
#     windows   install -> ssh -> vm-configure -> dev
#     macos     setup   -> ssh -> vm-configure -> dev
#
# A stage may start from a published tag instead of from the stage above it - that is what `from:`
# means - because the disk is the handoff and a run that starts in the middle is a real use.
#
# WHY macOS'S `desktop` STAGE IS NOT HERE. It is the Setup Assistant driver, and macos/15/steps/
# sequoia.yaml is that walkthrough: it exists and it loads, but the stage before it (setup) ends at
# the wizard, and a matrix leg that depends on a disk no leg here produces is a leg that can only
# run from a tag. It is listed as a `from:`-only entry rather than silently omitted.

on:
  workflow_dispatch:
    inputs:
      disks_repository:
        description: "the ghcr repository that holds the disks"
        default: "easydev-org/easydiskbake"
      windows_ssh_from:
        description: "windows-ssh: the disk to start from (empty = the default tag)"
        default: "windows11-ssh"
      macos_dev_from:
        description: "macos-dev: the disk to start from (empty = the default tag)"
        default: "macos15-dev"
      timeout_minutes:
        description: "how long one stage may run"
        default: "90"

concurrency:
  group: walkthrough
  cancel-in-progress: false

env:
  # THE IMAGE THIS REPOSITORY BUILDS, which is also the environment every stage runs in: qemu 11.1,
  # OVMF, samba, dnsmasq, ffmpeg, tesseract, qemu-img, mtools, xorriso, 7z and the easyvm binary.
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  # ===========================================================================
  # EVERY STAGE, ONE MATRIX LEG EACH.
  #
  # A LEG IS: prepare the two devices, pull the input disk if the stage is not an install, start
  # the daemon, ask it to run the file, follow status sixty seconds at a time, keep what it made.
  #
  # THE LEGS DO NOT DEPEND ON EACH OTHER. Each one pulls the disk it starts from by tag, which is
  # what the Python workflow chain was reduced to and what makes a stage runnable on its own. A
  # matrix that chained them would make one early failure hide eight stages that work.
  #
  # AND THAT IS WHY `needs:` IS ABSENT RATHER THAN FORGOTTEN: a chain here would mean a stage cannot
  # be checked without re-running the install before it, and the install is an hour.
  # ===========================================================================
  stage:
    # THE EVENT IS NAMED HERE AND NOWHERE ELSE, BECAUSE A PUSH CREATES A RUN TOO.
    #
    # This workflow has one trigger - `workflow_dispatch` - but GitHub still creates a run for a
    # push that touches the workflow file. On such a run there are no dispatch inputs, so anything
    # that tested one would be false and the run would be reported FAILED for doing nothing.
    # A job skipped by `if` is neutral; that is the difference this line buys (runs 43037274437,
    # 43042630231, 43043002991, 43043556912).
    #
    # `matrix` IS NOT AVAILABLE IN A JOB-LEVEL `if:` AND THAT WAS THE WHOLE BUG. GitHub rejects the
    # expression outright:
    #
    #     HTTP 422: failed to parse workflow: (Line: 109, Col: 9): Unrecognized named-value:
    #     'matrix'. Located at position 133 within expression
    #
    # so the workflow could not be DISPATCHED AT ALL, and every push that touched the file created a
    # run with zero jobs and a failure conclusion - five of them, with the only explanation in this
    # one line from the dispatch API. `matrix` is defined inside `jobs.<id>.steps` and nowhere else.
    #
    # SO THE JOB TESTS ONLY THE EVENT. THERE IS NO STAGE SELECTOR ANY MORE, and that is the honest
    # answer rather than a missing feature: a matrix's `include` list is static, so "run only these
    # legs" would need either a per-step condition on eight steps (easy to get wrong, and wrong
    # means a leg starts a VM it was not asked to start) or a matrix with zero legs for the stages
    # not chosen - which GitHub reports as a FAILED run. Every leg runs; a leg is a stage.
    if: github.event_name == 'workflow_dispatch' 
    runs-on: ubuntu-24.04
    # THE LEG'S OWN TIMEOUT, NOT ONE NUMBER FOR ALL EIGHT. A 150-minute macOS install must not be
    # bounded by a default chosen for a 70-minute Windows stage, and a job-wide override would make
    # the slowest leg the only one that can be given room.
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --device /dev/kvm --device /dev/net/tun --cap-add NET_ADMIN
    permissions:
      contents: read
      packages: read
    strategy:
      # EVERY LEG AT ONCE, AND THAT IS CORRECT RATHER THAN GREEDY.
      #
      # EACH MATRIX LEG GETS ITS OWN RUNNER. A workflow matrix is not several jobs on one machine;
      # it is one job per combination, each on a fresh VM with its own /dev/kvm, its own disk and its
      # own container. So the reason I gave for `max-parallel: 1` - "a macOS install and a Windows
      # stage would compete for /dev/kvm" - described a machine that never exists.
      #
      # WHAT IT COST: eight legs at the slowest leg's worst case instead of one. The first real run
      # serialised them, so `macos-setup` - the leg with no CI evidence at all - was still `queued`
      # behind seven others after forty minutes.
      #
      # `fail-fast: false` STAYS, and it is the opposite of `max-parallel`: one leg's failure must
      # not cancel the other seven, because they are different stages of different systems and the
      # whole point of the matrix is to learn which ones work.
      fail-fast: false
      matrix:
        include:
          # --- windows -------------------------------------------------------
          - name: windows-install
            file: windows/11/steps/install.yaml
            os: windows
            # AN INSTALL CREATES ITS OWN DISK, so there is nothing to pull.
            pull: ""
            out: windows11.qcow2
            timeout: 130
          - name: windows-ssh
            file: windows/11/steps/ssh.yaml
            os: windows
            pull: windows11-ssh
            out: windows11-ssh.qcow2
            timeout: 70
          - name: windows-vm-configure
            file: windows/11/steps/vm-configure.yaml
            os: windows
            pull: windows11-vm-configure
            out: windows11-vm-configure.qcow2
            timeout: 70
          - name: windows-dev
            file: windows/11/steps/dev.yaml
            os: windows
            pull: windows11-dev
            out: windows11-dev.qcow2
            timeout: 120
          # --- macos ---------------------------------------------------------
          - name: macos-setup
            file: macos/15/steps/setup.yaml
            os: macos
            pull: ""
            out: macos15-setup.qcow2
            timeout: 150
          - name: macos-ssh
            file: macos/15/steps/ssh.yaml
            os: macos
            pull: macos15-ssh
            out: macos15-ssh.qcow2
            timeout: 90
          - name: macos-vm-configure
            file: macos/15/steps/vm-configure.yaml
            os: macos
            pull: macos15-vm-configure
            out: macos15-vm-configure.qcow2
            timeout: 90
          - name: macos-dev
            file: macos/15/steps/dev.yaml
            os: macos
            pull: macos15-dev
            out: macos15-dev.qcow2
            timeout: 150
    steps:
      - uses: actions/checkout@v4

      - name: prepare
        # THE THREE THINGS THE NETWORK AND THE GUEST NEED, ASSERTED BEFORE ANYTHING IS PULLED. A
        # runner without /dev/kvm or /dev/net/tun produces a qemu that crawls or a daemon that
        # refuses; the refusal is right, but this says which one and stops in two seconds.
        run: |
          set -eu
          test -e /dev/kvm || { echo "=== NO /dev/kvm ==="; exit 1; }
          test -e /dev/net/tun || { echo "=== NO /dev/net/tun ==="; exit 1; }
          ls -l /dev/kvm /dev/net/tun
          easyvm versions
          qemu-img --version | head -1
          # THE HOST-SIDE TOOLS THE FILES USE. Named here so a missing one is this step rather than
          # a failure forty minutes into an install that needed `xorriso` to build an answer CD.
          for tool in qemu-img 7z xorriso unzip mformat mcopy mdir; do
            command -v "$tool" > /dev/null || echo "  (optional, not present: $tool)"
          done
          mkdir -p "$GITHUB_WORKSPACE/work"

      - name: pull the input disk
        # AN INSTALL HAS NO INPUT: its first step creates the disk it writes to. Every other stage
        # starts from a published one, and `from:` is the tag - so a leg can be pointed at any disk
        # this repository has ever published.
        if: matrix.pull != ''
        run: |
          set -eu
          tag="${{ matrix.pull }}"
          case "${{ matrix.name }}" in
            windows-ssh)  tag="${{ inputs.windows_ssh_from || 'windows11-ssh' }}" ;;
            macos-dev)    tag="${{ inputs.macos_dev_from || 'macos15-dev' }}" ;;
          esac
          echo "pulling $tag"
          easyvm pull --tag "$tag" \
                      --repository "${{ inputs.disks_repository }}" \
                      --dest "$GITHUB_WORKSPACE/work/disk.qcow2"
          ls -l "$GITHUB_WORKSPACE/work/"
          # A TRUNCATED ARTIFACT IS ONE LINE HERE RATHER THAN A BOOT TIMEOUT. `qemu-img check` reads
          # the image's own metadata, so a resume that ended early says so by name.
          qemu-img check "$GITHUB_WORKSPACE/work/disk.qcow2" || true

      - name: start the daemon
        # ONE PROCESS OWNS THE MACHINE FOR THE WHOLE STAGE. It runs in the background because
        # `easyvm run` is a CLIENT: it sends a request and returns, and the daemon drives the file.
        # That is what makes a hung stage diagnosable - `status` still answers.
        run: |
          set -eu
          easyvm serve --work "$GITHUB_WORKSPACE/work" --novnc-port 6080 \
            > "$GITHUB_WORKSPACE/work/daemon.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/work/daemon.pid"
          # THE READY LINE IS THE CONTRACT, not the socket file: a file that exists is not a daemon
          # that answers. The output is CAPTURED FIRST and matched with `case`, because
          # `| grep -q` closes the pipe on its first match, the writer takes SIGPIPE, and
          # `set -o pipefail` turns that into exit 141 for a check that SUCCEEDED.
          for i in $(seq 1 30); do
            logs=$(cat "$GITHUB_WORKSPACE/work/daemon.log" || true)
            case "$logs" in *"listening on"*) break ;; esac
            sleep 1
          done
          logs=$(cat "$GITHUB_WORKSPACE/work/daemon.log" || true)
          printf '%s\n' "$logs"
          case "$logs" in
            *"listening on"*) echo "the daemon is up" ;;
            *) echo "=== THE DAEMON DID NOT COME UP ==="; exit 1 ;;
          esac

      - name: ask for the run
        # THE FILE IS THE ARGUMENT. `--boot-disk` names what to start and `--out` where a
        # `compress:` writes - both are facts about the job, so they are flags and not YAML: the
        # same file must be runnable against any copy of the disk.
        #
        # `--shutdown=kill` IS FOR THE STAGES THAT OWN NOTHING. An install's disk is throwaway
        # until `compress:` reads it, and a macOS stage that is handed an overlay must not spend
        # five minutes asking the guest to power down - macOS answers the power button with a
        # dialog nobody clicks.
        run: |
          set -eu
          disk_args=""
          if [ -f "$GITHUB_WORKSPACE/work/disk.qcow2" ]; then
            disk_args="--boot-disk $GITHUB_WORKSPACE/work/disk.qcow2"
          fi
          # shellcheck disable=SC2086
          easyvm run "$GITHUB_WORKSPACE/${{ matrix.file }}" \
            --work "$GITHUB_WORKSPACE/work" \
            $disk_args \
            --out "$GITHUB_WORKSPACE/work/${{ matrix.out }}" \
            --password admin \
            || {
              echo "=== THE DAEMON REFUSED THE RUN ==="
              cat "$GITHUB_WORKSPACE/work/daemon.log"
              exit 1
            }

      - name: follow it
        # SIXTY SECONDS AT A TIME, TO THE STEP SUMMARY AS WELL AS STDOUT - a step that runs for an
        # hour has invisible stdout until it ends, and "which step is it on" is the one question an
        # in-progress stage has. Matched with `case`, for the SIGPIPE reason above.
        run: |
          set -eu
          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          printf '| time | state |\n|---|---|\n' >> "$summary"
          rounds=0
          limit=$(( ${{ matrix.timeout }} + 5 ))
          while [ "$rounds" -lt "$limit" ]; do
            rounds=$((rounds + 1))
            state=$(easyvm status --work "$GITHUB_WORKSPACE/work" 2>&1 || true)
            printf '[%s] %s\n' "$(date +%H:%M:%S)" "$state"
            one_line=$(printf '%s' "$state" | tr '\n' ' ' | tr -s ' ')
            printf '| %s | %s |\n' "$(date +%H:%M:%S)" "$one_line" >> "$summary"
            case "$state" in
              *"status: finished"*)
                echo "=== THE WALKTHROUGH FINISHED ==="
                exit 0 ;;
              *"status: failed"*)
                echo "=== THE WALKTHROUGH FAILED ==="
                cat "$GITHUB_WORKSPACE/work/daemon.log"
                exit 1 ;;
            esac
            if [ "$rounds" -lt "$limit" ]; then sleep 60; fi
          done
          echo "=== THE WALKTHROUGH DID NOT FINISH IN TIME ==="
          cat "$GITHUB_WORKSPACE/work/daemon.log"
          exit 1

      - name: what it produced
        if: always()
        run: |
          set -u
          ls -l "$GITHUB_WORKSPACE/work/" || true
          for f in "$GITHUB_WORKSPACE"/work/*.qcow2; do
            [ -e "$f" ] || continue
            printf '%s: %s MiB\n' "$f" "$(( $(stat -c %s "$f") >> 20 ))"
          done

      - name: stop the daemon
        if: always()
        run: |
          set -u
          if [ -f "$GITHUB_WORKSPACE/work/daemon.pid" ]; then
            pid=$(cat "$GITHUB_WORKSPACE/work/daemon.pid")
            kill "$pid" 2>/dev/null || true
            easyvm stop --work "$GITHUB_WORKSPACE/work" 2>/dev/null || true
            sleep 5
            kill -9 "$pid" 2>/dev/null || true
          fi
          pgrep -a qemu-system-x86_64 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            work/daemon.log
            work/*.mp4
            work/*.qcow2
          if-no-files-found: warn
          retention-days: 7
