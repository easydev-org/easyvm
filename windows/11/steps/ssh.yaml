name: windows 11 - ssh
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/windows11-ssh.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '900'
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: start recording
  record: install.mp4
- name: take the input disk
  disk: disk.qcow2
- name: boot the disk
  boot: true
  os: windows
  timeout: 900
- name: wait for the desktop
  desktop: windows
  timeout: '{{ boot_timeout }}'
- name: wake the screen
  key: esc
  settle: 5
- name: wake the screen again
  key: esc
  settle: 3
- name: open the run dialog
  key: meta_l+r
  settle: 3
- name: type powershell
  type: powershell
  type_gap: 0.15
  settle: 2
- name: open powershell
  key: ret
  settle: 14
- name: keep the screen on before ssh exists
  type: powercfg /change monitor-timeout-ac 0; powercfg /change monitor-timeout-dc 0; powercfg /change standby-timeout-ac 0; powercfg /change standby-timeout-dc 0; 'SCREEN=kept-on'
  type_gap: 0.15
  settle: 2
- name: run the screen setting
  key: ret
  settle: 3
- name: install openssh
  type: winget install --id Microsoft.OpenSSH.Preview --exact --source winget --accept-source-agreements --accept-package-agreements --disable-interactivity; 'WINGET_EXIT=' + $LASTEXITCODE; 'WINGET_LOW='
    + ($LASTEXITCODE -band 0xFF)
  type_gap: 0.15
  settle: 2
- name: run the install
  key: ret
  settle: 120
- name: configure sshd
  type: 'try { Set-Service sshd -StartupType Automatic -ErrorAction Stop; ''STEP1=ok'' } catch { ''STEP1=FAILED: '' + $_.Exception.Message }; try { $c = ''C:\ProgramData\ssh\sshd_config''; if (Test-Path
    $c) { (Get-Content $c) -replace ''^#?\s*PasswordAuthentication\s+.*'', ''PasswordAuthentication yes'' -replace ''^#?\s*Port\s+.*'', ''Port 22'' | Set-Content $c; ''STEP2=ok'' } else { ''STEP2=FAILED:
    no sshd_config'' } } catch { ''STEP2=FAILED: '' + $_.Exception.Message }; try { Start-Service sshd -ErrorAction Stop; ''STEP3=ok'' } catch { ''STEP3=FAILED: '' + $_.Exception.Message }; try { Get-NetFirewallRule
    -Name sshd-22 -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue; New-NetFirewallRule -Name sshd-22 -DisplayName ''OpenSSH 22'' -Enabled True -Direction Inbound -Protocol
    TCP -Action Allow -LocalPort 22 -ErrorAction Stop | Out-Null; ''STEP4=ok'' } catch { ''STEP4=FAILED: '' + $_.Exception.Message }; Get-NetTCPConnection -State Listen -LocalPort 22 -ErrorAction SilentlyContinue
    | Select-Object -First 1 -ExpandProperty LocalPort'
  type_gap: 0.15
  settle: 2
- name: run the sshd configuration
  key: ret
  settle: 25
- name: wait for sshd
  require_ssh: true
  ssh_probe: echo ok
  timeout: 600
- name: do not blank the screen
  ssh: powershell -Command "powercfg /change monitor-timeout-ac 0; powercfg /change monitor-timeout-dc 0; powercfg /change standby-timeout-ac 0; powercfg /change standby-timeout-dc 0"
  timeout: 120
  optional: true
- name: no hibernation file
  ssh: powershell -Command "powercfg -h off"
  timeout: 120
- name: hold windows update
  ssh: powershell -Command "New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Force | Out-Null; Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
    -Name NoAutoRebootWithLoggedOnUsers -Value 1 -Type DWord -Force; Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' -Name NoAutoUpdate -Value 1 -Type DWord -Force"
  timeout: 120
- name: turn off restore points
  ssh: powershell -Command "Disable-ComputerRestore -Drive 'C:\' -ErrorAction SilentlyContinue"
  timeout: 180
- name: compact the component store
  ssh: DISM /Online /Cleanup-Image /StartComponentCleanup
  timeout: 3600
  optional: true
- name: prove the power settings took
  ssh: powershell -Command "$m = (powercfg /query SCHEME_CURRENT SUB_VIDEO VIDEOIDLE 2>$null | Select-String 'Current AC Power Setting').ToString().Split(':')[-1].Trim(); $s = (powercfg /query SCHEME_CURRENT
    SUB_SLEEP STANDBYIDLE 2>$null | Select-String 'Current AC Power Setting').ToString().Split(':')[-1].Trim(); 'MONITOR=' + $m + ' STANDBY=' + $s + ' HIBER=' + (Test-Path C:\hiberfil.sys)"
  timeout: 180
- name: prove sshd is automatic
  ssh: powershell -Command "(Get-Service sshd).StartupType"
  timeout: 180
- name: prove sshd is listening
  ssh: netstat -ano | findstr LISTENING | findstr ":22 "
  timeout: 180
- name: prove the account can log in
  ssh: whoami
  timeout: 60
- name: prove the build
  ssh: powershell -Command "[System.Environment]::OSVersion.Version.ToString()"
  timeout: 180
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
