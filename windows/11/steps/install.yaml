name: windows 11 - install to a desktop
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  computer_name:
    from: args.computer_name
    default: sandbox
  windows_image_index:
    from: args.windows_image_index
    default: '6'
  out:
    from: args.out
    default: out/windows11.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '1800'
steps:
- name: start recording
  record: windows11-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: build the answer CD
  fetch: answer_iso
  template: windows/11/answer/Autounattend.xml
- name: name the installer
  fetch: windows_iso
- name: boot the installer
  boot: true
  os: windows
  iso: windows_iso
  answer_cd: answer_iso
  driver_cd: driver_iso
  timeout: 1800
- name: wait for the firmware to offer the DVD
  until_console: DVD-ROM
  timeout: 180
  blind_after: 60
- name: press a key so the loader takes it
  key: esc
  wait_after: 1
- name: press it again, because the prompt is emitted more than once
  key: esc
  wait_after: 1
- name: and once more, for a loader that was not listening yet
  key: esc
  wait_after: 2
- name: Setup is on screen
  loop:
    max: 180
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      says:
      - Windows
      - Setup
    until:
      fact: done
- name: wait for the desktop
  desktop: windows
  timeout: 5400
- name: reboot into the installed system
  boot: true
  os: windows
  timeout: 900
- name: the installed system reaches a desktop
  desktop: windows
  timeout: 1800
- name: shut the installed system down
  shutdown: acpi
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
