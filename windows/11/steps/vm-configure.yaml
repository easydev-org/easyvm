name: windows 11 - configure the vm (share, logon hook)
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  hostname:
    from: args.hostname
    default: easyvm-win11
  timezone:
    from: args.timezone
    default: America/Los_Angeles
  locale:
    from: args.locale
    default: en_US.UTF-8
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  host:
    from: args.host
    default: 172.30.0.1
  smb_user:
    from: args.smb_user
    default: guest
  smb_pass:
    from: args.smb_pass
    default: ''
  out:
    from: args.out
    default: out/distro.qcow2
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: boot the disk
  boot: true
  os: windows
  timeout: 900
- name: wait for the desktop
  desktop: windows
  timeout: 900
- name: wait for sshd
  require_ssh: true
  ssh_probe: echo ok
  timeout: 900
- name: unpack the agent and its driver from the prepared ISO
  # `virtio-win.iso` IS ALREADY ON DISK - the workflow pulls it as this stage's `driver_cd` - so this
  # step unpacks and downloads nothing: `fetchWindowsAgent` checks the ISO's size and only reaches
  # for the network when the file is absent or truncated.
  #
  # THE MSI AND ITS DRIVER COME FROM THE SAME ISO ON PURPOSE: the driver's .inf names hardware IDs
  # the MSI's service binds through, and a driver from another release is a device that installs and
  # never starts.
  family: windows
  asset: guest_agent
- name: copy the driver in
  scp:
  - vioserial/vioser.inf
  - C:/Users/{{ user }}/vioser.inf
  requires:
  - ssh
  timeout: 300
- name: copy the driver's payload in
  scp:
  - vioserial/vioser.sys
  - C:/Users/{{ user }}/vioser.sys
  requires:
  - ssh
  timeout: 300
- name: copy the driver's catalogue in
  scp:
  - vioserial/vioser.cat
  - C:/Users/{{ user }}/vioser.cat
  requires:
  - ssh
  timeout: 300
- name: copy the agent installer in
  scp:
  - qemu-ga-x86_64.msi
  - C:/Users/{{ user }}/qemu-ga-x86_64.msi
  requires:
  - ssh
  timeout: 600
- name: install the driver the agent talks on
  ssh: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "Push-Location $env:USERPROFILE; $p = Start-Process pnputil.exe -ArgumentList @(''/add-driver'',''vioser.inf'',''/install'') -PassThru -Wait -NoNewWindow; Write-Output (''PNPUTIL_EXIT='' +
    $p.ExitCode); Pop-Location"

    '
  timeout: 600
- name: install the guest agent
  ssh: 'cmd /c "msiexec /i C:\Users\{{ user }}\qemu-ga-x86_64.msi /qn /norestart /l*v C:\Users\{{ user }}\qemu-ga-install.log & echo MSIEXEC_EXIT=%ERRORLEVEL%"

    '
  timeout: 600
- name: prove the guest agent answers
  ssh: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "$s = Get-Service QEMU-GA -ErrorAction SilentlyContinue; if ($s) { Write-Output (''service: '' + $s.Status + '' / '' + $s.StartType) } else { Write-Output ''service: ABSENT'' }; $d = Get-PnpDevice
    -Class Ports -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match ''Guest Agent|virtio'' }; if ($d) { $d | ForEach-Object { Write-Output (''device: '' + $_.FriendlyName + '' / '' + $_.Status) } } else { Write-Output ''device: NO virtio-serial
    port'' }"

    '
  timeout: 120
- name: set the computer's name
  # `Rename-Computer` NEEDS A RESTART TO TAKE EFFECT, and that is why the step below it reads the
  # PENDING value rather than the live one. This stage never reboots: the disk is published and the
  # NEXT stage boots it, and the rename lands then - which is the same contract `DefaultDomainName`
  # already relies on, because that value is also read at logon rather than now.
  #
  # THE GUEST IS NOT RESTARTED HERE ON PURPOSE: a `reboot:` after a `Rename-Computer` would make this
  # stage's disk the one that came back from a restart, and the desktop proof above already ran.
  ssh: >-
    powershell -NoProfile -Command "Rename-Computer -NewName '{{ hostname }}' -Force -ErrorAction Stop;
    Write-Output RENAME_SCHEDULED"
  timeout: 300
- name: prove the new name is pending, which is all a rename can promise before a restart
  # `Get-ComputerInfo` REPORTS THE LIVE NAME AND WILL STILL SHOW THE OLD ONE, so the proof reads the
  # registry key Rename-Computer writes - the pending name - and says which is which rather than
  # failing on a machine that did exactly what was asked.
  ssh: >-
    powershell -NoProfile -Command "$pending = (Get-ItemProperty -Path
    'HKLM:\SYSTEM\CurrentControlSet\Control\ComputerName\ComputerName').ComputerName;
    Write-Output ('pending = ' + $pending);
    Write-Output ('live    = ' + $env:COMPUTERNAME);
    if ($pending -eq '{{ hostname }}') { Write-Output 'HOSTNAME_PENDING_OK' }
    else { Write-Output 'HOSTNAME_NOT_SET'; exit 1 }"
  timeout: 120
- name: set the time zone to Pacific
  # `tzutil /s` TAKES A WINDOWS ZONE NAME, NOT AN IANA ONE: `Pacific Standard Time` is what this
  # machine's own tzutil /l calls America/Los_Angeles, and the IANA name is accepted by neither
  # tzutil nor Set-TimeZone. The two are different databases and a stage that passes the wrong one
  # gets "The time zone parameter is invalid" rather than a wrong clock.
  ssh: >-
    powershell -NoProfile -Command "Set-TimeZone -Id 'Pacific Standard Time' -ErrorAction Stop;
    Write-Output (Get-TimeZone | Select-Object -ExpandProperty Id)"
  timeout: 120
- name: prove the time zone
  ssh: >-
    powershell -NoProfile -Command "Write-Output ('zone = ' + (Get-TimeZone).Id);
    Write-Output ('now  = ' + (Get-Date -Format o));
    if ((Get-TimeZone).Id -eq 'Pacific Standard Time') { Write-Output 'TIMEZONE_OK' }
    else { Write-Output 'TIMEZONE_WRONG'; exit 1 }"
  timeout: 60
- name: set the locale to American English
  # THREE SEPARATE SETTINGS ON WINDOWS, AND EACH ANSWERS A DIFFERENT QUESTION:
  #
  #	Set-WinUILanguageOverride   which language the interface speaks
  #	Set-Culture                 the formatting of dates, numbers and currency
  #	Set-WinSystemLocale         the code page non-Unicode programs are given
  #
  # SETTING ONLY THE FIRST is the common mistake: the UI is English and the date is still dd/MM/yyyy.
  ssh: >-
    powershell -NoProfile -Command "Set-WinUILanguageOverride -Language 'en-US';
    Set-Culture -CultureInfo 'en-US';
    Set-WinSystemLocale -SystemLocale 'en-US';
    Write-Output LOCALE_WRITTEN"
  timeout: 300
- name: prove the locale
  ssh: >-
    powershell -NoProfile -Command "Write-Output ('culture = ' + (Get-Culture).Name);
    Write-Output ('ui      = ' + (Get-WinUILanguageOverride).Name);
    if ((Get-Culture).Name -eq 'en-US') { Write-Output 'LOCALE_OK' }
    else { Write-Output 'LOCALE_WRONG'; exit 1 }"
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: prove the guest can fetch from the host share
  share_mount: true
  share_family: windows
  requires:
  - share
  timeout: 180
- name: show what the guest sees at the share
  # THE SHARE IS HTTP, SO THE GUEST'S OWN CLIENT IS THE PROOF. `share_mount:` fetches a sentinel the
  # host wrote and compares the bytes; this step is the readable version of the same answer, printed
  # so a person can see what happened rather than only whether it passed.
  #
  # IT USED TO CHECK A CIFS MOUNT AND A ROUND TRIP THROUGH ~/shared. Both are gone: there is no mount
  # any more, and a guest writing to its own home and reading it back proves the guest's filesystem.
  #
  # THIS STEP USED TO SAY `sh -c 'curl ...'` - THE LINUX VOCABULARY, IN THE WINDOWS FILE. Windows has
  # neither `sh` nor `curl`, so the session answered 255 and the step failed on its own words while
  # `prove the guest can fetch from the host share` - which asks powershell - had just succeeded on
  # the same URL. MEASURED on run 43938650176, step 20 of 30.
  #
  # `Invoke-WebRequest` IS WHAT THE PROOF STEP ALREADY USES and is present on every Windows build this
  # repository boots. It prints the body, so the readable answer is the same answer the check made.
  ssh: >-
    powershell -NoProfile -Command "(Invoke-WebRequest -UseBasicParsing -TimeoutSec 20
    'http://172.30.0.1:8080/shared/').Content; Write-Output ('fetch exit = ' + $LASTEXITCODE)"
  timeout: 120
- name: write the launcher
  write: launcher
  family: windows
  timeout: 60
- name: write the task registration script
  write: windows_task
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.ps1
  - C:/Users/{{ user }}/bootstrap-launcher.ps1
  timeout: 300
- name: copy the task registration script in
  scp:
  - bootstrap-install.ps1
  - C:/Users/{{ user }}/bootstrap-install.ps1
  timeout: 300
- name: register the logon task
  ssh: 'powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/{{ user }}/bootstrap-install.ps1

    '
  timeout: 300
- name: prove the logon task is registered
  ssh: 'cmd /c "schtasks /Query /TN vm-bootstrap /V /FO LIST | findstr /i /C:TaskName /C:Status"

    '
  timeout: 60
- name: name the machine's own domain for winlogon, or the auto-logon half-applies
  # `AutoLogon` IN THE ANSWER FILE IS SUPPOSED TO SET `AutoAdminLogon`, `DefaultUserName` and
  # `DefaultPassword`. THE FOURTH VALUE CANNOT GO IN THE ANSWER FILE AT ALL: it is the COMPUTER NAME,
  # which Windows assigns during setup and which the answer file does not know.
  #
  # MEASURED, and it is in issue easydev-org/easyvm#1's own words: with an empty domain the machine
  # "half-applies the setting and still stops at the login screen". `WORKGROUP` is not the answer
  # either - that is the WORKGROUP name, not the local account's domain.
  #
  # `$env:COMPUTERNAME` IS THE DOMAIN A LOCAL ACCOUNT BELONGS TO, and that is the whole point: the
  # account is `.\vmuser`, so the domain is the machine.
  #
  # `-Type String` MATTERS AS MUCH AS THE VALUE: `Set-ItemProperty` with no type stores a REG_SZ for
  # this name, but a `$true` written for `AutoAdminLogon` becomes `True` and Winlogon does not read
  # that as a boolean. That is the second trap in the same issue.
  #
  # AND THE PASSWORD IS WRITTEN HERE TOO, BECAUSE THE ANSWER FILE DID NOT LEAVE ONE BEHIND. MEASURED
  # on run 43955342754, step 28 of 30, on a machine whose answer file had `AutoLogon` with
  # `<Password><Value>admin</Value><PlainText>true</PlainText>`:
  #
  #	AutoAdminLogon    : 1
  #	DefaultUserName   : vmuser
  #	DefaultDomainName : SANDBOX          (correct - the rename has not restarted yet)
  #	PASSWORD_MISSING
  #
  # SETUP CONSUMED `AutoLogon` FOR ITS OWN UNATTENDED RUN and did not carry `DefaultPassword` into
  # the logon key, so Winlogon has three of the four values and stops at the login screen. The three
  # this step can write, it writes; the password is one of them, and it is the same one the answer
  # file put on the account.
  ssh: 'powershell -NoProfile -Command "Set-ItemProperty -Path ''HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'' -Name DefaultDomainName -Value $env:COMPUTERNAME -Type String; Set-ItemProperty -Path ''HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'' -Name AutoAdminLogon -Value ''1'' -Type String; Set-ItemProperty -Path ''HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'' -Name DefaultPassword -Value ''{{ password }}'' -Type String; Write-Output AUTOLOGON_DOMAIN_SET"

    '
  timeout: 120
- name: prove all four winlogon values are what an unattended boot needs
  # ALL FOUR ARE READ BACK, because any three leave the machine at a login screen and none of them
  # produces an error when it is wrong.
  #
  #	AutoAdminLogon          '1', as a STRING - 'True' is not a boolean Winlogon reads
  #	DefaultUserName         the account
  #	DefaultDomainName       the COMPUTER NAME, not WORKGROUP and not empty
  #	DefaultPassword         present at all, which is what makes this a local-account logon
  #
  # THE PROOF READS ALL FOUR BY NAME rather than printing three and asking the key for the fourth: a
  # `Format-List` of a SELECTED set cannot show the value it was not asked for, and the failure this
  # replaces printed three correct values above the one that was missing.
  ssh: 'powershell -NoProfile -Command "$k = ''HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon''; $w = Get-ItemProperty -Path $k; Write-Output (''AutoAdminLogon    = '' + $w.AutoAdminLogon); Write-Output (''DefaultUserName   = '' + $w.DefaultUserName); Write-Output (''DefaultDomainName = '' + $w.DefaultDomainName); if ($w.DefaultPassword) { Write-Output ''DefaultPassword   = present''; Write-Output PASSWORD_PRESENT } else { Write-Output ''DefaultPassword   = MISSING''; Write-Output PASSWORD_MISSING; exit 1 }"

    '
  timeout: 120
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
