name: windows 11 - configure the vm (share, logon hook)
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  host:
    from: args.host
    default: 172.30.0.1
  smb_user:
    from: args.smb_user
    default: guest
  smb_pass:
    from: args.smb_pass
    default: ''
  out:
    from: args.out
    default: out/distro.qcow2
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: boot the disk
  boot: true
  os: windows
  timeout: 900
- name: wait for the desktop
  desktop: windows
  timeout: 900
- name: wait for sshd
  require_ssh: true
  ssh_probe: echo ok
  timeout: 900
- name: fetch the agent and its driver on the host
  family: windows
  timeout: 1200
  asset: guest_agent
- name: copy the driver in
  scp:
  - vioserial/vioser.inf
  - C:/Users/{{ user }}/vioser.inf
  requires:
  - ssh
  timeout: 300
- name: copy the driver's payload in
  scp:
  - vioserial/vioser.sys
  - C:/Users/{{ user }}/vioser.sys
  requires:
  - ssh
  timeout: 300
- name: copy the driver's catalogue in
  scp:
  - vioserial/vioser.cat
  - C:/Users/{{ user }}/vioser.cat
  requires:
  - ssh
  timeout: 300
- name: copy the agent installer in
  scp:
  - qemu-ga-x86_64.msi
  - C:/Users/{{ user }}/qemu-ga-x86_64.msi
  requires:
  - ssh
  timeout: 600
- name: install the driver the agent talks on
  ssh: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "Push-Location $env:USERPROFILE; $p = Start-Process pnputil.exe -ArgumentList @(''/add-driver'',''vioser.inf'',''/install'') -PassThru -Wait -NoNewWindow; Write-Output (''PNPUTIL_EXIT='' +
    $p.ExitCode); Pop-Location"

    '
  timeout: 600
- name: install the guest agent
  ssh: 'cmd /c "msiexec /i C:\Users\{{ user }}\qemu-ga-x86_64.msi /qn /norestart /l*v C:\Users\{{ user }}\qemu-ga-install.log & echo MSIEXEC_EXIT=%ERRORLEVEL%"

    '
  timeout: 600
- name: prove the guest agent answers
  ssh: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "$s = Get-Service QEMU-GA -ErrorAction SilentlyContinue; if ($s) { Write-Output (''service: '' + $s.Status + '' / '' + $s.StartType) } else { Write-Output ''service: ABSENT'' }; $d = Get-PnpDevice
    -Class Ports -ErrorAction SilentlyContinue | Where-Object { $_.FriendlyName -match ''Guest Agent|virtio'' }; if ($d) { $d | ForEach-Object { Write-Output (''device: '' + $_.FriendlyName + '' / '' + $_.Status) } } else { Write-Output ''device: NO virtio-serial
    port'' }"

    '
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: mount the host share
  share_mount: true
  share_family: windows
  requires:
  - share
  timeout: 180
- name: prove the share is readable and writable
  ssh: 'cmd /c net use \\{{ host }}\shared "" /user:{{ smb_user }} /persistent:no >nul 2>&1 & dir \\{{ host }}\shared & echo written-by-this-session > \\{{ host }}\shared\from-guest.txt & type \\{{ host }}\shared\from-guest.txt

    '
  timeout: 120
- name: write the launcher
  write: launcher
  family: windows
  timeout: 60
- name: write the task registration script
  write: windows_task
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.ps1
  - C:/Users/{{ user }}/bootstrap-launcher.ps1
  timeout: 300
- name: copy the task registration script in
  scp:
  - bootstrap-install.ps1
  - C:/Users/{{ user }}/bootstrap-install.ps1
  timeout: 300
- name: register the logon task
  ssh: 'powershell -NoProfile -ExecutionPolicy Bypass -File C:/Users/{{ user }}/bootstrap-install.ps1

    '
  timeout: 300
- name: prove the logon task is registered
  ssh: 'cmd /c "schtasks /Query /TN vm-bootstrap /V /FO LIST | findstr /i /C:TaskName /C:Status"

    '
  timeout: 60
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
