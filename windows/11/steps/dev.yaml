- name: wait for sshd again
  require_ssh: true
  ssh_probe: echo ok
  timeout: 600
- name: build and run a C program
  script: "$ErrorActionPreference = 'Continue'\n$vswhere = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\nWrite-Output \"vswhere: $vswhere\"\nif (-not (Test-Path $vswhere)) {\n  Write-Output \"VSWHERE_MISSING\"\n  exit 1\n\
    }\n$root = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\nWrite-Output \"installation: $root\"\nif (-not $root) {\n  Write-Output \"VCTOOLS_MISSING\"\n  exit 1\n}\n$vcvars = Join-Path\
    \ $root 'VC\\Auxiliary\\Build\\vcvars64.bat'\nWrite-Output \"vcvars: $vcvars\"\nif (-not (Test-Path $vcvars)) {\n  Write-Output \"VCVARS_MISSING\"\n  exit 1\n}\n$dir = Join-Path $env:TEMP 'msvc-check'\nNew-Item -ItemType Directory -Force -Path $dir\
    \ | Out-Null\n$src = Join-Path $dir 'hello.c'\nSet-Content -Path $src -Value '#include <stdio.h>' -Encoding ASCII\nAdd-Content -Path $src -Value 'int main(void){ printf(\"hello-from-msvc\\n\"); return 0; }' -Encoding ASCII\n$bat = Join-Path $dir 'build.bat'\n\
    Set-Content -Path $bat -Value \"@call `\"$vcvars`\"\" -Encoding ASCII\nAdd-Content -Path $bat -Value \"cl /nologo `\"$src`\" /Fe:`\"$dir\\hello.exe`\"\" -Encoding ASCII\nAdd-Content -Path $bat -Value \"exit /b %ERRORLEVEL%\" -Encoding ASCII\n& cmd\
    \ /c $bat\n$clcode = $LASTEXITCODE\nWrite-Output \"cl exit: $clcode\"\nif ($clcode -ne 0) { Write-Output \"COMPILE_FAILED\"; exit 1 }\n$exe = Join-Path $dir 'hello.exe'\nif (-not (Test-Path $exe)) { Write-Output \"NO_EXE\"; exit 1 }\n& $exe\nif ($LASTEXITCODE\
    \ -ne 0) { Write-Output \"RUN_FAILED\"; exit 1 }\nWrite-Output \"COMPILE_OK\"\n"
  script_shell: powershell
  script_name: msvc-check.ps1
  timeout: 900
- name: build and run a dotnet app
  script: "$ErrorActionPreference = 'Continue'\n$dotnet = Join-Path $env:ProgramFiles 'dotnet\\dotnet.exe'\nWrite-Output \"dotnet: $dotnet\"\nWrite-Output \"exists: $(Test-Path $dotnet)\"\nif (-not (Test-Path $dotnet)) {\n  $onPath = Get-Command dotnet\
    \ -ErrorAction SilentlyContinue\n  Write-Output \"on path: $($onPath.Source)\"\n  if (-not $onPath) { Write-Output \"DOTNET_MISSING\"; exit 1 }\n  $dotnet = $onPath.Source\n}\n$sdks = & $dotnet --list-sdks 2>&1\nWrite-Output \"sdks:\"\n$sdks | ForEach-Object\
    \ { Write-Output \"  $_\" }\nif (-not $sdks) { Write-Output \"NO_SDK\"; exit 1 }\n$dir = Join-Path $env:TEMP 'dotnet-check'\nif (Test-Path $dir) { Remove-Item -Recurse -Force $dir }\nNew-Item -ItemType Directory -Force -Path $dir | Out-Null\n& $dotnet\
    \ new console --output $dir --force 2>&1 | ForEach-Object { Write-Output \"  $_\" }\n$newcode = $LASTEXITCODE\nWrite-Output \"new exit: $newcode\"\nif ($newcode -ne 0) { Write-Output \"TEMPLATE_FAILED\"; exit 1 }\n& $dotnet run --project $dir 2>&1\
    \ | ForEach-Object { Write-Output \"  $_\" }\n$runcode = $LASTEXITCODE\nWrite-Output \"run exit: $runcode\"\nif ($runcode -ne 0) { Write-Output \"BUILD_FAILED\"; exit 1 }\nWrite-Output \"DOTNET_OK\"\n"
  script_shell: powershell
  script_name: dotnet-check.ps1
  timeout: 1800
- name: prove powershell 7
  ssh: powershell -Command "pwsh -v"
  timeout: 300
- name: prove the windows sdk
  ssh: powershell -Command "if (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include') { Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Name } else { 'SDK_MISSING' }"
  timeout: 120
- name: prove python node and git
  script: "$ErrorActionPreference = 'Continue'\n$bad = 0\nforeach ($t in @('python', 'node', 'git')) {\n  $c = Get-Command \"$t.exe\" -ErrorAction SilentlyContinue\n  if ($c) {\n    Write-Output \"ok      $t -> $($c.Source)\"\n  } else {\n    Write-Output\
    \ \"MISSING $t\"\n    $bad = 1\n  }\n}\nif ($bad -ne 0) {\n  Write-Output \"=== THE THREE THE macOS DISK ALSO HAS ARE NOT ALL HERE ===\"\n  exit 1\n}\nWrite-Output \"PYTHON_NODE_GIT_OK\"\n"
  script_shell: powershell
  script_name: prove-python-node-git.ps1
  timeout: 300
- name: note what the toolchain reports
  ssh: powershell -Command "'SDK=' + (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include' -Name -ErrorAction SilentlyContinue | Select-Object -Last 1) + ' DOTNET=' + ((& 'C:\Program Files\dotnet\dotnet.exe' --version) 2>&1)"
  timeout: 180
  optional: true
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
