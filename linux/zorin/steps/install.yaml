name: zorin - the ubiquity walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - zorin.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: zorin.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
- name: wait for the installer to put itself up
  loop:
    max: 120
    do:
    - settle: 5
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - install
        - zorin
      - - try
        - zorin
      - - welcome
      - - false
        - localization
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: install zorin os
  settle: 40
  do:
  - click:
    - 1223
    - 586
    settle: 3
  - click:
    - 1223
    - 586
    settle: 3
- name: install zorin os (once more, if the wizard is not up)
  when_not:
  - keyboard
  settle: 40
  do:
  - click:
    - 1223
    - 586
    settle: 3
  - click:
    - 1223
    - 586
    settle: 3
- name: disable the screen saver and the lock
  run: xrandr --output Virtual-1 --mode 1920x1080 2>/dev/null || xrandr --output Virtual1 --mode 1920x1080 2>/dev/null || xrandr -s 1920x1080 2>/dev/null || true; xset s off; xset -dpms; xset s noblank; gsettings set org.gnome.desktop.session idle-delay
    0; gsettings set org.gnome.desktop.screensaver lock-enabled false; ( for i in $(seq 1 1080); do xdotool mousemove_relative -- 1 0 2>/dev/null; xdotool mousemove_relative -- -1 0 2>/dev/null; sleep 20; done ) >/dev/null 2>&1 & exit
  terminal_wait: 8
  type_gap: 0.15
  settle: 10
- name: welcome
  click:
  - 1361
  - 764
  settle: 15
- name: keyboard - english (us)
  click:
  - 1106
  - 402
  settle: 4
- name: keyboard
  click:
  - 1361
  - 764
  settle: 18
- name: updates and other software, when this build shows it
  when_not_any:
  - - installation
    - type
  click:
  - 1361
  - 764
  settle: 18
- name: the updates pane is done
  loop:
    max: 60
    do:
    - settle: 3
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - installation
        - type
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: the keyboard pane is done
  loop:
    max: 80
    do:
    - settle: 3
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - installation
        - type
      - - updates
        - and
        - other
        - software
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: installation type - install now
  click:
  - 1361
  - 764
  settle: 18
- name: the disk warning is up
  loop:
    max: 60
    do:
    - settle: 2
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - write
        - the
        - changes
        - to
        - disks
      - - partition
        - tables
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
# THE DIALOG THAT ASKS FOR PERMISSION ALSO NAMES THE FILESYSTEM, AND THAT IS THE ONLY PLACE Ubiquity
# SAYS IT ON SCREEN. MEASURED, verbatim:
#
#	The following partitions are going to be formatted:
#	partition #1 of Virtual disk 1 (vda) as ESP
#	partition #2 of Virtual disk 1 (vda) as ext4
#
# SO THE ext4 CHECK IS A READING OF THIS DIALOG rather than a combo the walk has to set: Ubiquity has
# no filesystem selector at all, and `Advanced features... None selected` is the default that means
# ext4. A walk that accepted the default without reading this could publish a btrfs disk and nothing
# above would have noticed - the pages before this one do not mention a filesystem.
- name: the dialog names the filesystem it will create
  see: {name: format}

- name: the root partition will be ext4
  check:
    name: ext4
    from: format
    mode: text
    words:
    - ext4

    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
- name: write the changes to disks
  click:
  - 1293
  - 673
  settle: 20
- name: the disk warning is answered
  loop:
    max: 60
    do:
    - settle: 3
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - where
        - are
        - you
      - - time
        - zone
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: where are you
  click:
  - 1361
  - 764
  settle: 18
- name: the time zone pane is done
  loop:
    max: 60
    do:
    - settle: 3
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - who
        - are
        - you
      - - your
        - name
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: who are you - your name
  click:
  - 975
  - 386
  type: '{{ user }}'
  settle: 2
- name: who are you - username
  click:
  - 859
  - 477
  type: '{{ user }}'
  settle: 2
- name: who are you - password
  click:
  - 873
  - 514
  type: '{{ password }}'
  settle: 2
- name: who are you - confirm password
  click:
  - 883
  - 550
  type: '{{ password }}'
  settle: 3
- name: who are you
  click:
  - 1361
  - 764
  settle: 20
- name: the install runs, as measured
  settle: 2400
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'