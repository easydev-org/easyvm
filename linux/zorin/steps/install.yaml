name: zorin - the ubiquity walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: zorin-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: zorin
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the installer to put itself up
  loop:
    max: 120
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - install
        - zorin
      - - try
        - zorin
      - - welcome
      - - false
        - localization
    until:
      fact: done
- name: install zorin os
  wait_after: 40
  do:
  - at:
    - 1223
    - 586
    wait_after: 3
  - at:
    - 1223
    - 586
    wait_after: 3
- name: install zorin os (once more, if the wizard is not up)
  unless:
  - keyboard
  wait_after: 40
  do:
  - at:
    - 1223
    - 586
    wait_after: 3
  - at:
    - 1223
    - 586
    wait_after: 3
- name: disable the screen saver and the lock
  run: xrandr --output Virtual-1 --mode 1920x1080 2>/dev/null || xrandr --output Virtual1 --mode 1920x1080 2>/dev/null || xrandr -s 1920x1080 2>/dev/null || true; xset s off; xset -dpms; xset s noblank; gsettings set org.gnome.desktop.session idle-delay
    0; gsettings set org.gnome.desktop.screensaver lock-enabled false; ( for i in $(seq 1 1080); do xdotool mousemove_relative -- 1 0 2>/dev/null; xdotool mousemove_relative -- -1 0 2>/dev/null; sleep 20; done ) >/dev/null 2>&1 & exit
  terminal_wait: 8
  type_gap: 0.15
  wait_after: 10
- name: welcome
  at:
  - 1361
  - 764
  wait_after: 15
- name: keyboard - english (us)
  at:
  - 1106
  - 402
  wait_after: 4
- name: keyboard
  at:
  - 1361
  - 764
  wait_after: 18
- name: updates and other software, when this build shows it
  unless_any:
  - - installation
    - type
  at:
  - 1361
  - 764
  wait_after: 18
- name: the updates pane is done
  loop:
    max: 60
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installation
        - type
    until:
      fact: done
- name: the keyboard pane is done
  loop:
    max: 80
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installation
        - type
      - - updates
        - and
        - other
        - software
    until:
      fact: done
- name: installation type - install now
  at:
  - 1361
  - 764
  wait_after: 18
- name: the disk warning is up
  loop:
    max: 60
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - write
        - the
        - changes
        - to
        - disks
      - - partition
        - tables
    until:
      fact: done
- name: write the changes to disks
  at:
  - 1293
  - 673
  wait_after: 20
- name: the disk warning is answered
  loop:
    max: 60
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - where
        - are
        - you
      - - time
        - zone
    until:
      fact: done
- name: where are you
  at:
  - 1361
  - 764
  wait_after: 18
- name: the time zone pane is done
  loop:
    max: 60
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - who
        - are
        - you
      - - your
        - name
    until:
      fact: done
- name: who are you - your name
  at:
  - 975
  - 386
  type: '{{ user }}'
  wait_after: 2
- name: who are you - username
  at:
  - 859
  - 477
  type: '{{ user }}'
  wait_after: 2
- name: who are you - password
  at:
  - 873
  - 514
  type: '{{ password }}'
  wait_after: 2
- name: who are you - confirm password
  at:
  - 883
  - 550
  type: '{{ password }}'
  wait_after: 3
- name: who are you
  at:
  - 1361
  - 764
  wait_after: 20
- name: the install runs, as measured
  wait: 2400
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
