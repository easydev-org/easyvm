name: zorin - the ubiquity walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: zorin-install.mp4
  poll: 20
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 64
- name: fetch the installer image
  fetch: linux_iso
  release: zorin
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the installer to put itself up
  until_any:
  - - install
    - zorin
  - - try
    - zorin
  - - welcome
  - - false
    - localization
  timeout: 600
  poll: 5
- name: install zorin os
  at:
  - 1223
  - 586
  repeat:
  - 2
  - 3
  settle: 40
- name: install zorin os (once more, if the wizard is not up)
  unless:
  - keyboard
  at:
  - 1223
  - 586
  repeat:
  - 2
  - 3
  settle: 40
- name: disable the screen saver and the lock
  run: xrandr --output Virtual-1 --mode 1920x1080 2>/dev/null || xrandr --output Virtual1 --mode 1920x1080 2>/dev/null || xrandr -s 1920x1080 2>/dev/null || true; xset s off; xset -dpms; xset s noblank;
    gsettings set org.gnome.desktop.session idle-delay 0; gsettings set org.gnome.desktop.screensaver lock-enabled false; ( for i in $(seq 1 1080); do xdotool mousemove_relative -- 1 0 2>/dev/null; xdotool
    mousemove_relative -- -1 0 2>/dev/null; sleep 20; done ) >/dev/null 2>&1 & exit
  terminal_wait: 8
  settle: 10
- name: welcome
  at:
  - 1361
  - 764
  settle: 15
- name: keyboard - english (us)
  at:
  - 1106
  - 402
  settle: 4
- name: keyboard
  at:
  - 1361
  - 764
  settle: 18
- name: updates and other software, when this build shows it
  unless_any:
  - - installation
    - type
  at:
  - 1361
  - 764
  settle: 18
- name: the keyboard pane is done
  until_any:
  - - installation
    - type
  - - updates
    - and
    - other
    - software
  timeout: 180
  poll: 3
- name: installation type - install now
  at:
  - 1361
  - 764
  settle: 18
- name: the disk warning is up
  until_any:
  - - write
    - the
    - changes
    - to
    - disks
  - - partition
    - tables
  timeout: 120
  poll: 2
- name: write the changes to disks
  at:
  - 1293
  - 673
  settle: 20
- name: the disk warning is answered
  until_any:
  - - where
    - are
    - you
  - - time
    - zone
  timeout: 180
  poll: 3
- name: where are you
  at:
  - 1361
  - 764
  settle: 18
- name: the time zone pane is done
  until_any:
  - - who
    - are
    - you
  - - your
    - name
  timeout: 180
  poll: 3
- name: who are you - your name
  at:
  - 975
  - 386
  type: '{{ user }}'
  settle: 2
- name: who are you - username
  at:
  - 859
  - 477
  type: '{{ user }}'
  settle: 2
- name: who are you - password
  at:
  - 873
  - 514
  type: '{{ password }}'
  settle: 2
- name: who are you - confirm password
  at:
  - 883
  - 550
  type: '{{ password }}'
  settle: 3
- name: who are you
  at:
  - 1361
  - 764
  settle: 20
- name: the install runs, as measured
  wait: 2400
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
