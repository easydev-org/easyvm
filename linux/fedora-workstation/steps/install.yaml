name: fedora-workstation - anaconda and the first boot
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - fedora-workstation.iso
- name: start recording
  record: fedora-workstation-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: fedora-workstation.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true

# THE SESSION IS KEPT AWAKE, AND THIS MEDIUM NEEDS IT MORE THAN MOST.
#
# MEASURED: a run sat at `the editor is up` and the frame came back COMPLETELY BLACK - the GNOME
# live session's blanking had fired while blivet-gui was loading. `keep_alive` on the desktop wait
# covers THAT WAIT ONLY; everything after it is unprotected, and this wizard has long quiet pages.
#
# IT IS A POINTER NUDGE AND NOT `xset`, because `run:` TYPES INTO A TERMINAL and this live session
# does not put one on screen - the same reason the file clicks a desktop icon rather than running
# `anaconda`. A pointer that moves resets the idle timer on every desktop.
#
# A LOOP CANNOT EXPRESS "WAIT A WHILE": its `until:` has to become true, and a loop whose condition is
# always false ends by failing - MEASURED, `the session is kept awake with a pointer nudge: the loop
# ran 3 attempt(s) and the condition never held`. So these are plain steps, one press each, and the
# pauses between them are what keep the timer reset across the wizard's quiet pages.
# THE KEEP-AWAKE IS IN THE MIDDLE OF THE SCREEN, NOT IN A CORNER.
#
# The first version clicked (12,12) and (24,24) - the top-left - to reset GNOME's idle timer. MEASURED
# on the run that followed: the frame went COMPLETELY BLACK from that point on and stayed black for
# the rest of the stage, with qemu alive and the framebuffer still 1920x1080. A click in that corner
# is the Activities hot corner on GNOME, which opens the overview; a second one there can leave the
# session in a state whose screen is the overview's backdrop - which is what a black frame is.
#
# SO THE PRESS LANDS ON THE WALLPAPER, well away from every edge and from the desktop's own icons.
- name: a pointer nudge on the wallpaper, so the idle timer starts again
  click:
  - 960
  - 300
  wait_after: 20

# FEDORA 45's ANACONDA IS A WEB UI, AND THIS STAGE STILL WALKED THE Qt WIZARD.
#
# MEASURED: `wait for the anaconda window` spent its whole 60-attempt budget with this on screen:
#
#	Welcome to Fedora Linux
#	  This live media can be used to install Fedora Linux or as a temporary system.
#	  Installation can be started at any time by launching the install app.
#	  [ Install Fedora Linux... ]   [ Not Now ]
#
# - the live session's OWN WELCOME DIALOG, which has to be answered before anything opens. The loop
# waited for words from the old wizard (`installation method`, `installation summary`) and clicked
# (420,300), which is the wallpaper behind that dialog; neither could ever change the screen.
#
# AND WHEN IT DOES OPEN IT IS A BROWSER, NOT A WINDOW: `Waiting for 127.0.0.1...` and then a
# web page whose first screen says `Welcome. Let's install Fedora Linux now.` - so the words this
# stage waits for afterwards are the WEB UI's, not the Qt one's.
- name: answer the live session's welcome dialog
  loop:
    max: 30
    do:
    - wait: 5
    ocr:
      name: welcome_dialog
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: offered
      from: welcome_dialog
      mode: says_any
      words:
      - - Welcome
      - - Install
    until:
      fact: offered

# THE BUTTON IS AT (830, 698): its box spans x=488..617, y=455..475 in the 1280-wide view, so its
# centre is (553, 465) there. MEASURED on this dialog's own frame.
- name: launch the installer
  click:
  - 830
  - 698
  wait_after: 25

# THE WIZARD CHOOSES ITS OWN LANGUAGE FROM GEOIP, AND ON A RUNNER IN ASIA THAT IS CHINESE.
#
# MEASURED: anaconda opened reading
#
#	Fedora Linux 45 (Workstation Edition) 安装
#	欢迎。現在讓我們安裝Fedora Linux。
#
# - so every later verdict written in English matched nothing, and the loop above spent fifteen
# minutes on a page that was up. The same thing happened to cachyos' installer for the same reason.
#
# SO THE FIRST THING DONE TO THIS WIZARD IS SETTING IT TO ENGLISH, exactly as cachyos' file does: type
# into its language search box and take `English (United States)`.
- name: anaconda's web ui is up
  loop:
    max: 60
    do:
    - wait: 10
    ocr:
      name: anaconda
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: ready
      from: anaconda
      mode: says_any
      # NEITHER WORD MAY BE ONE THE DESKTOP ALREADY CARRIES.
      #
      # MEASURED: this check passed on a frame that was still the DESKTOP -
      #
      #	anaconda: 75 word(s): -_ Nov17 6:52PM na? O qv e or . ss . U%e ...
      #
      # - because its set was `Welcome | Installation | Storage` and the live session's wallpaper
      # carries a desktop icon labelled `Install Fedora Linux`. `Installation` is not `Install`, but
      # the OCR of this desktop is noisy enough to produce it, and the loop therefore satisfied
      # itself before Anaconda had a window.
      #
      # THE WINDOW'S TITLE IS THE ONE THING THAT READS THE SAME IN EVERY LANGUAGE THIS WIZARD PICKS.
      #
      # MEASURED: on a runner whose geoip chose Chinese the wizard opened as
      #
      #	Fedora Linux 45 (Workstation Edition) 安装
      #	欢迎。現在讓我們安裝Fedora Linux。
      #
      # so an English body sentence (`questions`, `Welcome`) matched nothing for fifteen minutes on a
      # page that was up. The title line is `Fedora Linux 45 (Workstation Edition)` in both, and the
      # wallpaper's icon says `Install Fedora Linux` - `Fedora` alone is on it, so the title's
      # `Workstation` is what separates the two.
      words:
      - - Workstation
      - - Encryption
    until:
      fact: ready

# THE FIRST TWO `Next` PRESSES, IN THE WEB UI'S OWN COORDINATES.
#
# MEASURED: its footer sits at y=666 in the 1280-wide view - `Back / Next / Quit` - so `Next` is
# (726, 999) on this frame. The file had (729, 1002), which is the OLD Qt wizard's footer, three
# pixels off in x and y from a button that no longer exists at that position.
#
# AND THE VERDICTS ARE THE WEB UI'S WORDS: `Installation method` and `Storage configuration` are
# titles the Qt wizard drew; the web UI's second page is `How would you like to install?` with a
# `Destination` heading, and its third is the storage editor link or the encryption page.
- name: open the language search
  click:
  - 938
  - 224
  wait_after: 2

- name: search for the United States
  type: united states
  wait_after: 4

- name: choose English (United States)
  click:
  - 853
  - 314
  wait_after: 6

- name: the wizard is in English now
  ocr:
    name: english
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

- name: it speaks English
  check:
    name: ok
    from: english
    mode: says
    # `install` alone would match the desktop icon; `Welcome` and `now` are the English page's.
    words:
    - - Welcome
    - - now

- name: welcome
  click:
  - 726
  - 999
  wait_after: 15

- name: the installation method page
  ocr:
    name: method
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

- name: that page asks how to install
  check:
    name: asking
    from: method
    mode: says_any
    # `Destination` AND `Encryption` ARE THIS WIZARD'S OWN HEADINGS - the live desktop carries
    # neither, which is what the previous version of this check got wrong by including `install`.
    words:
    - - Destination
    - - Encryption
    - - storage

# THE STORAGE EDITOR LINK IS ON THE PAGE WE ARE ALREADY ON, SO NO `Next` IS PRESSED HERE.
#
# MEASURED, three runs: pressing `Next` on the installation-method page goes to `Storage
# configuration` - one checkbox, `Encrypt my data` - and the `storage editor` link is NOT there.
# Every click after it then landed on a page with nothing to click, and the run ended sitting on
# `Storage configuration` with the disk at 0 MiB.
#
# The link `If none of the options above apply, use the storage editor ...` is on the
# INSTALLATION-METHOD page, which the two steps above have just verified. So the editor is opened
# from there, and this wizard's `Storage configuration` page is never visited.

- name: open the storage editor, which is the only place a filesystem can be chosen
  click:
  - 928
  - 446
  wait_after: 8

- name: launch it
  click:
  - 794
  - 642
  wait_after: 20

# BLIVET-GUI TAKES LONGER THAN TWO MINUTES TO DRAW ON THIS MEDIUM, AND ITS FIRST FRAME SAYS NOTHING.
#
# MEASURED by hand: `Launch storage editor` puts up a spinner reading `Loading...` and the real page
# arrives 20-45 seconds later. `max: 24` x `wait: 5` is 120 seconds, and the loop also read `Loading`
# as a failed match - so it gave up on a page that was arriving. MEASURED on a run: five minutes at
# this step and then a failure, with the frame black from the session's blanking.
- name: the editor is up
  loop:
    max: 60
    do:
    - wait: 10
    ocr:
      name: blivet
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: blivet
      mode: says_any
      # `Storage` IS ON THE PAGE BEFORE THIS ONE, WHICH IS WHY THIS LOOP PASSED WITHOUT THE EDITOR.
      #
      # MEASURED:
      #
      #	blivet: 41 word(s): Fedora Linux 45 (Workstation Edition) installation : 1 Welcome
      #	                    Storage configuration ...
      #	the editor is up [check]: up = true (mode says_any: read "Storage")
      #
      # - the frame was Anaconda's `Storage configuration` page, which carries the word `Storage` in
      # its title. The loop satisfied itself after ONE attempt, every click below went into that page
      # instead of blivet-gui, and the run ended back on `Storage configuration` with the disk at 0.
      #
      # THE WORDS BELOW ARE INSIDE BLIVET-GUI AND NOWHERE ELSE: its right-hand panel is headed
      # `Requirements` and says `Fedora Linux requires at least 8.30 GB of disk space`, and its table
      # has a column headed `Type` whose row reads `Unformatted data`.
      words:
      - - Requirements
      - - Unformatted
      - - Type
    until:
      fact: up

- name: the disk's menu
  click:
  - 1185
  - 328
  wait_after: 4

- name: create the partition table
  click:
  - 1117
  - 480
  wait_after: 6

- name: initialize it as GPT, which is the default
  click:
  - 474
  - 381
  wait_after: 8

# THE FREE-SPACE KEBAB IS ON ITS OWN ROW, AT y=363 - NOT 42 PIXELS BELOW IT.
#
# MEASURED off the frame that follows `Initialize`: the table has two rows, `vda - Virtio Disk` at
# y=318 and `Free space` at y=363, and each row's kebab is the four-pixel column at x=1183..1186.
# The file had (1186, 405), which is 42 pixels below the second row and lands on the table's
# background - so `Create partition` was never opened, and the next step (which presses the dialog's
# orange Create) failed with `no pixel within 45 of rgb(177,56,11) on this screen`.
#
# THAT MESSAGE IS WHAT MADE THIS FINDABLE: a colour step that cannot find its colour says the pane is
# not the one on screen, which is exactly right, and it is a far better failure than a click that
# reports success into empty space.
- name: the free space's menu
  click:
  - 1185
  - 363
  wait_after: 4

# `Create partition` IS THE FIRST ITEM OF THE ROW'S MENU, 42 PIXELS BELOW THE KEBAB.
#
# MEASURED off the menu's own frame, crop 980..1300 x 330..420 scaled 4x: the item's text centre is
# (610, 300) in that crop, which is (980+610/4, 330+300/4) = (1132, 405) on the frame. The file had
# (1120, 450) - 45 pixels low, on the menu's shadow - so the dialog never opened and the steps after
# it typed into the page. That is why the failure was `no pixel within 45 of rgb(177,56,11)` at the
# Create press two steps later: there was no dialog for the button to be in.
- name: the free space menu is open
  loop:
    max: 12
    do:
    - wait: 2
    ocr:
      name: the_free_space_menu_is_open
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: the_free_space_menu_is_open
      mode: says_any
      words:
      - - Create
      - - Format
      - - Delete
    until:
      fact: up

- name: create the root partition
  click:
  - 1132
  - 405
  wait_after: 8

- name: the root dialog is up
  loop:
    max: 12
    do:
    - wait: 2
    ocr:
      name: the_root_dialog_is_up
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: the_root_dialog_is_up
      mode: says_any
      words:
      - - Create
      - - Type
      - - Mount
    until:
      fact: up

- name: name it root
  click:
  - 882
  - 271
  type: root
  wait_after: 2

- name: mount it at the root
  click:
  - 882
  - 333
  type: /
  wait_after: 2

# THE TYPE LIST IS NOT TOUCHED: ITS DEFAULT IS EXT4, MEASURED. A click into it would be a step that
# can only make things worse - the list is opened and a wrong entry is one row away.
# THE `Create` BUTTON IS THE DIALOG'S ONLY ORANGE FILL, SO IT IS FOUND BY ITS COLOUR.
#
# MEASURED off the hand run's own frame: the button's orange pixels span x=406..474, y=610..644, so
# its centre is (440, 627). The file had (456, 627) - sixteen pixels right, on the button's rounded
# edge - and a press there was reported as done while the dialog stayed open, which is why the disk
# ended up showing `Free space  137 GB` and the failure only appeared later as
# `Storage requirements not met`.
#
# A COLOUR IS A FACT THE DIALOG DRAWS: orange is not used anywhere else on this page, and
# `at_color` clicks the centre of the largest blob of it wherever the dialog has moved to.
- name: create it, taking the dialog's own ext4 default
  # THE BUTTON'S OWN CENTRE, MEASURED. The dialog's `Create` is at x 404..478, y 608..648 on the hand
  # run's frame, so its centre is (441, 628); blivet-gui draws that button in rgb(177,56,11) and this
  # press used to be found by that colour. MEASURED on the CI leg it resolves to (483, 620), and both
  # points are inside the same 74x40 button.
  click:
  - 441
  - 628
  wait_after: 8

# THE PARTITION HAS TO EXIST BEFORE IT CAN BE SHRUNK, AND A MISSED `Create` LOOKS LIKE NOTHING.
#
# MEASURED: this run reported every click as done and ended with the disk still showing
# `Free space  137 GB` - the create and the shrink had both been pressed into a dialog that was
# already closed, or into a page that had not yet redrawn. The failure surfaced far away, as
# `Storage requirements not met / Failed to find a suitable stage1 device`.
#
# SO EACH PARTITION IS CHECKED BY ITS OWN ROW: `vda1` and `vda2` appear in the table only when the
# dialog's Create actually took.
- name: the root partition exists
  loop:
    max: 20
    do:
    - wait: 4
    ocr:
      name: part1
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 1
    check:
      name: there
      from: part1
      mode: says_any
      words:
      - - vda1
      - - ext4
    until:
      fact: there

# THE ROW IS SELECTED BEFORE ITS KEBAB IS PRESSED.
#
# MEASURED: after `Create`, the table has two rows - `vda - Virtio Disk` and `vda1 ext4 filesystem /
# 137 GB` - and their kebabs are at (1185, 318) and (1185, 363). A press on the second one sometimes
# opens its menu and sometimes does not, because blivet-gui draws the kebab only for the row under the
# pointer, and the press is the first thing that puts the pointer there.
#
# SO THE ROW IS CLICKED FIRST - on its own `vda1` label, which is inert - and the kebab after it.
# THE ROW IS SELECTED ON ITS TYPE CELL, NOT ITS LABEL - THE LABEL IS A LINK TO THE DETAIL PAGE.
#
# MEASURED: a press on `vda1` at (460, 363) opens
#
#	Storage > vda - VirtIO Disk > vda1
#	Partition    Name -   UUID 4d012aae...   Type Linux filesystem data   Size 137 GB
#	ext4 filesystem   Name root   Mount point /
#
# - a DETAIL page, with its own Shrink/Grow and its own kebabs at different heights. The step that
# followed pressed the LIST page's kebab coordinate into that page and opened nothing, which is why
# `the partition menu is open` failed with the detail page on screen.
#
# `ext4 filesystem` at (460, 363) is the Type cell of the same row and selects the row without
# navigating.
# THE PARTITION'S DETAIL PAGE IS THE RELIABLE WAY TO ITS SHRINK BUTTON.
#
# MEASURED, five runs: the LIST page's row-menu (the four-pixel kebab at (1185, 363)) opens only when
# the row is already hovered, and pressing it from a cold pointer sometimes opens a menu and sometimes
# nothing - which is why `the partition menu is open` failed on runs where the table plainly showed
# `vda1 ext4 filesystem / 137 GB`.
#
# THE `vda1` LABEL IS A LINK TO A DETAIL PAGE, and that page has its OWN `Shrink` button at a fixed
# place, drawn whether or not anything is hovered:
#
#	Storage > vda - VirtIO Disk > vda1
#	Partition          Name -   UUID 4d012aae...   Type Linux filesystem data   Size 137 GB
#	                   [Shrink]  [Grow]  kebab                                  <- at y=178 in 1280
#	ext4 filesystem    Name root   Mount point /
#
# MEASURED off that page's own frame: `Shrink` is at (672, 178) in the 1280-wide view, which is
# (1008, 267) on this frame.
- name: open the root partition's detail page
  click:
  - 460
  - 363
  wait_after: 6

- name: the detail page is up
  loop:
    max: 12
    do:
    - wait: 2
    ocr:
      name: detail
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: detail
      mode: says_any
      # `UUID` IS ON THE DETAIL PAGE AND NOWHERE ON THE LIST IT CAME FROM.
      words:
      - - UUID
      - - filesystem
    until:
      fact: up

- name: shrink it from the detail page
  click:
  - 1008
  - 267
  wait_after: 6

- name: the shrink dialog is up
  loop:
    max: 12
    do:
    - wait: 2
    ocr:
      name: shrink_dialog
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: shrink_dialog
      mode: says_any
      words:
      - - Shrink
      - - Size
    until:
      fact: up

- name: shrink it
  click:
  - 1029
  - 562
  wait_after: 6

- name: to 136 GB, leaving room for the ESP
  click:
  - 1041
  - 275
  wait_after: 1

- name: replace the size
  key: ctrl+a
  wait_after: 1

- name: the size the shrink dialog is given
  type: '136'
  wait_after: 2

- name: confirm the shrink
  # THE SHRINK DIALOG'S `Shrink` BUTTON, by its own centre. MEASURED: the CI leg resolved the same
  # button to (489, 333) through blivet-gui's accent colour, and the hand walk pressed (456, 337).
  # Both are inside the button; (456, 337) is the hand-run centre and is used here.
  click:
  - 456
  - 337
  wait_after: 8

# THE SHRINK LEAVES THE DETAIL PAGE OPEN, SO THE LIST IS RETURNED TO BY ITS BREADCRUMB.
#
# MEASURED: after `Shrink`, the page is still `Storage > vda - VirtIO Disk > vda1`, and the new
# `Free space 1.44 GB` row exists on the LIST page behind it. `Storage` in that breadcrumb is at
# (196, 143) in the 1280-wide view - (294, 215) here - and is the link back up.
# THE BREADCRUMB'S `Storage` IS AT (427, 222), NOT (294, 215).
#
# MEASURED off the detail page's own frame, crop 250..700 x 190..240 scaled 3x: the word `Storage`
# spans x=454..600 in that crop, centred at (530, 96) - which is (250+530/3, 190+96/3) = (427, 222)
# on the frame. (294, 215) is 133 pixels LEFT of it, on the page's margin, so the list was never
# returned to and every step below pressed LIST coordinates into the DETAIL page.
- name: back to the partition list
  click:
  - 427
  - 222
  wait_after: 6

- name: the list is up, with free space on it
  loop:
    max: 12
    do:
    - wait: 2
    ocr:
      name: back_at_list
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: back_at_list
      mode: says_any
      # `Free` IS IN BLIVET'S RIGHT-HAND PANEL ON EVERY PAGE - `You can either free up enough space
      # here` - so it proved nothing. MEASURED:
      #
      #	back_at_list: 92 word(s): ... Storage > vda-VirtIO Disk > vdal ... You can either free up
      #	                             enough space here ...
      #	back_at_list [check]: up = true (mode says_any: read "Free")
      #
      # on a frame that was STILL THE DETAIL PAGE. The breadcrumb `Storage > vda - VirtIO Disk > vda1`
      # is what those words came from, and the steps after it pressed the LIST's kebab coordinate into
      # that detail page, so the ESP dialog was never opened.
      #
      # `Unformatted` OR `locate` ARE THE LIST'S OWN: the free-space row's Type cell reads
      # `Unformatted data`, and the detail page's Type cell reads `Linux filesystem data`.
      words:
      - - Unformatted
      - - GPT
    until:
      fact: up

# THE FREE-SPACE KEBAB IS THE THIRD ROW ONCE THE ROOT PARTITION EXISTS.
#
# MEASURED on the list after the shrink, which now has THREE rows:
#
#	vda - VirtIO Disk   GPT partitions             y=211 in the 1280 view -> 317 here
#	vda1                ext4 filesystem  /  136 GB y=242                -> 363
#	Free space                                     1.44 GB  y=271       -> 407
#
# THE FIRST VERSION PRESSED (1186, 405) AND THE SECOND PRESSED (1185, 363) - and the second was a
# correction in the WRONG DIRECTION: 405 was the third row's kebab on a table with three rows, which
# is exactly what the shrink leaves behind, and 363 is the ROOT PARTITION's kebab. MEASURED: the menu
# that opened at 363 read `ext4 filesystem / Edit mount point / Format / Partition / Shrink / Grow /
# Delete` - a PARTITION's menu, and the press after it landed on the root partition's row.
#
# SO THE ROW THAT MATTERS IS NAMED: on a three-row table the free space is the third, at y=407.
# THE KEBAB NEEDS A SECOND PRESS, BECAUSE THE FIRST ONE IS WHAT HOVERS THE ROW.
#
# MEASURED: `Free space 1.44 GB` is on the table at y=407 and its kebab is the four-pixel column at
# x=1183..1186 on that line - and a single press there left no menu open, with the pointer sitting on
# the kebab and nothing drawn under it.
#
# THE PRESS IS THEREFORE RETRIED UNTIL THE MENU IS THERE, and the menu's own word proves it. `Create`
# is the first item; `Shrink` and `Format` are on the partition menus and NOT on a free-space menu, so
# `Format` is the one that says this is the free space's menu rather than the root partition's.
- name: the new free space's menu
  loop:
    max: 6
    do:
    - click:
      - 1185
      - 407
      wait_after: 3
    ocr:
      name: fs_menu
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 1
    check:
      name: open
      from: fs_menu
      mode: says_any
      words:
      # `Create` IS THE FREE-SPACE MENU'S FIRST ITEM AND A PARTITION'S MENU DOES NOT HAVE IT -
      # measured, the partition menu reads `ext4 filesystem / Edit mount point / Format / Partition /
      # Shrink / Grow / Delete`, and the free space's reads `Create partition`.
      - - Create
    until:
      fact: open

- name: create the ESP
  click:
  - 1132
  - 449
  wait_after: 8

- name: the ESP dialog is up
  loop:
    max: 12
    do:
    - wait: 2
    ocr:
      name: esp_dialog
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: esp_dialog
      mode: says_any
      # `EFI` IS IN BLIVET'S RIGHT-HAND PANEL ON EVERY PAGE - it lists `/boot/efi` under
      # `Partitions (advanced)` - so that word proved nothing. MEASURED:
      #
      #	esp_dialog: 80 word(s): ... Storage > vda-VirtIO Disk > vdal Requirements ...
      #	esp_dialog [check]: up = true (mode says_any: read "EFI")
      #
      # on a frame with no dialog on it. The breadcrumb `Storage > vda - VirtIO Disk > vda1` is what
      # `Cancel` AND `Automatically` ARE ON THIS DIALOG AND OCR RETURNS NEITHER. MEASURED, the
      # reading of a dialog that was plainly on screen:
      #
      #	"Create partition on /dev/vda - Mount point | ] . Type | EXT4 ... size fie] :
      #	 Overwrite (C Overwrite existing data with zeros (slower) - Encryption | No encryption"
      #
      # so the verdict waited on two words never in the text. `Overwrite` and
      # `Encryption` are on this dialog's own body and come back cleanly.
      words:
      - - Overwrite
      - - Encryption
    until:
      fact: up


# THE TYPE LIST IS A NATIVE SELECT, SO THE KEYBOARD PICK IS STEADIER THAN A POPUP COORDINATE.
#
# MEASURED: the previous pair clicked the combo and then an item's coordinate, and the dialog came
# back with `Type [EXT4]` - the list had closed without taking the choice, so the "ESP" was created as
# a second ext4 partition (and then could not be the boot device). A popup that closes on the wrong
# press is the same failure the row menus had.
#
# A NATIVE SELECT RESPONDS TO TYPE-AHEAD: focus it, type the option's first letters, and press Return.
# `EFI system partition` is the only option starting with `EF`, so two keys are enough.
# THE TYPE LIST IS A CUSTOM WIDGET, NOT A NATIVE SELECT - TYPE-AHEAD DOES NOTHING.
#
# MEASURED: `type: 'EF'` then Return left the combo reading `EXT4`, because this is a styled div, not
# an HTML `<select>`. Typing into it changes nothing and Return dismisses it.
#
# THE LIST ITSELF, MEASURED off its own frame (crop 370..820 x 240..410 scaled 3x):
#
#	XFS
#	EXT4                     <- where the dialog opens
#	BTRFS
#	VFAT
#	NTFS
#	Swap
#	EFI system partition     <- item centre (657, 567) on this frame
#	No filesystem
#
# So the combo is clicked to open the list and the item by its measured coordinate. (648, 576) - the
# previous pair - is nine pixels down and nine left, on the list's own border.
# THE COMBO'S PRESS IS RETRIED, BECAUSE A PRESS THAT MISSES LEAVES NO LIST TO PICK FROM.
#
# MEASURED on consecutive runs: the same press at (882, 396) opened the list on one run and left the
# dialog reading `EXT4` on the next, with the OCR of the strip as `Oe a |__ Partitions (ac` - the
# right-hand panel, no list. A list that is not open cannot be picked from, and the coordinate after it
# then lands on the dialog's own background.
#
# SO THE PRESS AND THE PICK ARE ONE LOOP: open, choose, and read the combo; repeat if it still says
# something other than the ESP. Six attempts, each verified by the same word.
- name: set the type to the ESP
  loop:
    max: 6
    do:
    - click:
      - 882
      - 396
      wait_after: 3
    - click:
      - 648
      - 576
      wait_after: 3
    ocr:
      name: type_now
      region: [560, 380, 1400, 420]
      region_at: [1920, 1080]
      scale: 1
      wait: 1
    check:
      name: esp
      from: type_now
      mode: says_any
      # `EFI` IS READ AS `eF` ON THIS ROW - measured, the crop's own text was
      # `| eFsystemparttion system partition a`. `partition` is read cleanly and no other entry in the
      # list contains it (`EXT4`, `BTRFS`, `XFS`, `VFAT`, `NTFS`, `Swap`, `No filesystem`).
      words:
      - - partition
    until:
      fact: esp

- name: name it boot
  click:
  - 882
  - 271
  clear: true
  type: boot
  wait_after: 2

# THE NAME IS NOT READ BACK, AND `the ESP exists` IS WHY.
#
# MEASURED, three attempts at reading the field's own strip:
#
#	esp_name: 0 word(s):
#	esp_name: 2 word(s): fee SSS          <- scale 3
#	esp_name: 0 word(s):                  <- and again
#
# - a 60-row strip of a text input is below what tesseract will resolve at any scale this tree uses,
# and `boot` is short enough that the fragments it produces are letters. The frame it was reading
# plainly held `boot`.
#
# SO THE VERDICT MOVES TO WHERE IT CAN BE TAKEN: `the ESP exists` reads the LIST after `Create`, where
# `vda2` and `EFI` are drawn as table cells rather than inside an input. A name that did not take
# would leave the row without its mount point and that check catches it; a name that did take needs no
# second opinion.

- name: create it, and the mount point is filled in for us
  # THE ESP DIALOG'S `Create`, by its own centre. MEASURED: the hand walk pressed (456, 566) and the
  # CI leg resolved the same button to (415, 564) through blivet-gui's accent colour.
  click:
  - 456
  - 566
  wait_after: 10

- name: the ESP exists
  loop:
    max: 20
    do:
    - wait: 4
    ocr:
      name: part2
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 1
    check:
      name: there
      from: part2
      mode: says_any
      words:
      - - vda2
      - - EFI
    until:
      fact: there

- name: back to the installer
  click:
  - 450
  - 975
  wait_after: 12

- name: accept the layout it detected
  click:
  - 756
  - 337
  wait_after: 15

- name: the review page, which now names this storage
  ocr:
    name: review
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 4

- name: the review names a configured layout
  check:
    name: configured
    from: review
    mode: says_any
    words:
    - - configured
    - - Review
# THE REVIEW PAGE HAS ITS OWN `Begin installation`, AND NOTHING PRESSED IT.
#
# MEASURED: the review page read 120 words and `configured = true`, and then the install step waited
# on a disk that never moved - because the wizard was still ON the review page. `Next` on the
# installation-method page only gets you there; the button that starts writing is on THAT page.
#
# ITS COORDINATE IS THE SAME FOOTER AS EVERY OTHER PAGE (726, 999), measured on the frame that showed
# `Use configured storage` selected with `vda1 / vda2 /boot/efi` listed under it.
# THE REVIEW PAGE'S BUTTON IS `Install`, AT (731, 999) - NOT `Next` AT (726, 999).
#
# MEASURED off that page's own frame: the footer reads `Back  Install  Quit` with `Install` the blue
# filled one, its box spanning x=460..515 in the 1280 view - centre (487, 666) - which is (731, 999)
# here. (726, 999) is 5 pixels left, on the gap between `Back` and `Install`, and a press there does
# nothing at all.
#
# AND THE PAGE SHOWS WHY THIS STEP EXISTS: `Installation type  Use configured storage` with
# `vda1 136 GB mount /` and `vda2 1.44 GB mount /boot/efi` - the layout the storage editor built.
# THE `Install` PRESS IS RETRIED, BECAUSE A PRESS THAT DOES NOTHING LOOKS LIKE A PAGE THAT DID.
#
# MEASURED: the button's blue box spans x=689..772, y=981..1017 on that page - centre (730, 999) - and
# the file's (731, 999) is one pixel from it. A run pressed it and the page stayed on `Review and
# install` for twenty-five minutes with the disk at 18 MiB.
#
# The button is found BY ITS COLOUR instead, which is true wherever the page has scrolled to, and the
# press is repeated until the wizard leaves the review page.
#
# `begin` IS THE WORD THE PROGRESS PAGE USES (`Installing Fedora Linux`, `Beginning installation`),
# and `Review` is what this page carries - so the verdict distinguishes the two.
# THE PRESS IS THE BUTTON'S OWN CENTRE, (730, 999), MEASURED - NOT THE COLOUR BLOB'S CENTROID.
#
# MEASURED: `at_color` found the blue blob at (708, 990) - the blob includes the button's antialiased
# left edge and its label's dark pixels drag the centroid left - and a press there did nothing while
# the pointer visibly sat on the button. The button's own box is x=689..772, y=981..1017, centre
# (730, 999), and a press there starts the install on the first attempt: the next frame reads
# `Installing / Software installation: ... / Installing software 8%`.
#
# SO THIS IS A PLAIN COORDINATE AGAIN, WITH THE VERDICT BELOW PROVING IT TOOK.
# THE WIZARD'S ACCENT IS `rgb(60,110,180)` AND THAT IS THE PRESS.
#
# MEASURED on this workstation: the button is at (730, 999) and a press there starts the install. ON
# THE RUNNER THE SAME COORDINATE DOES NOT - the run's own log says
#
#	=== begin the installation       clicked (730, 999)
#	=== after_install: 75 word(s)    <- the review page, unchanged, for twenty attempts
#
# and the page it was on was the review page, so the press missed a button this workstation has at
# that coordinate. That is a difference in where the wizard is DRAWN, not in what it does.
#
# SO THE BUTTON IS FOUND BY THE WIZARD'S OWN ACCENT COLOUR. `rgb(60,110,180)` fills `Install` and
# nothing else on that page, `at_color` clicks the centre of its largest blob, and the search is the
# whole frame so a dialog that is drawn elsewhere is still found.
# THE SEARCH IS THE FOOTER, BECAUSE THE WIZARD'S TITLE BAR IS THE SAME BLUE.
#
# MEASURED on the runner: the press with a whole-frame search found the blob at (1084, 79) and again at
# (1580, 79) - y=79 IS THE TITLE BAR. Fedora's Anaconda paints `{Fedora Linux 45 ... installation` in
# `rgb(60,110,180)` across the top of the window, so the largest blob of that colour was the chrome and
# every press went into the window's own header.
#
# THE BUTTONS ARE IN THE FOOTER: `Back / Install / Quit` sit at y=999 on this frame and the wizard's
# content area is above them, so the search box is the bottom tenth of the frame - which excludes the
# title bar by construction.
# THE WIZARD HAS TWO FOOTER BUTTONS IN TWO DIFFERENT BLUES, AND THE PRESS NAMES EACH ONE.
#
# MEASURED off run 44265476989, which reached `Review and install` and then pressed the WRONG BUTTON:
#
#	`Installation method` page   `Next`   rgb(59,110,179)   the wizard's ACCENT
#	`Review and install` page    `Install` rgb(44,73,116)   a DARKER NAVY
#
# - and the second page's footer also carries `Quit` as plain text at (563, 668) of the 1280 view. An
# accent search of the footer found the accent's antialiased edge ON THE QUIT LABEL's row and pressed
# (852, 996) and (732, 1010) in turn, which opened `Quit installer? - Your progress will not be saved`.
# The run's last frame is that dialog over a correctly-configured review page.
#
# SO THE NAVY IS THE BUTTON: MEASURED on this run's review frame, `rgb(41,65,114)` fills 2881 pixels
# of x 600..900, y 950..1040 - spanning x 600..855, centre (727, 999) - and nothing else in that
# footer is navy. On the `Installation method` page there is NO navy at all (the earlier run's own
# footer had 93 pixels of it), so a navy press can only ever name `Install` on the review page.
#
# THE ACCENT PRESS ADVANCES THE PAGES BEFORE IT, AND ONLY THOSE. The two steps below are separate for
# that reason: the accent takes `Installation method` to `Review and install`, and the navy presses
# `Install` there. Each reads the progress pane's own word, so a press that misses is retried and a
# press that lands is not repeated.
- name: next from the installation method
  loop:
    max: 4
    do:
    - click:
      - 730
      - 999
      wait_after: 12
    ocr:
      name: review_page
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 3
      wait: 2
    check:
      name: here
      from: review_page
      mode: says_any
      # `Review` IS THE THIRD STEP'S OWN NAME IN THE WIZARD'S LIST, and it appears there before the
      # page is drawn - but the page's body says `Review and install`, which is what this waits for.
      words:
      - - Review
    until:
      fact: here

# THE `Quit installer?` DIALOG IS DISMISSED FIRST, BECAUSE AN EARLIER ACCENT PRESS OPENED ONE.
#
# MEASURED: the dialog is drawn over the review page with `[Quit] [Continue installation]`, and ESC
# closes it. It is a no-op when no dialog is open.
- name: close any quit dialog
  key: esc
  wait_after: 3

- name: press install
  loop:
    max: 4
    do:
    - click:
      - 730
      - 999
      wait_after: 15
    ocr:
      name: install_started
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 3
      wait: 2
    check:
      name: begun
      from: install_started
      mode: says_any
      # `Installing` IS THE PROGRESS PANE'S OWN WORD. MEASURED: the review page's OCR at 3x carries
      # `Review and install` and no `Installing`.
      words:
      - - Installing
    until:
      fact: begun

- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
# THE INSTALL IS OVER WHEN THE DISK STOPS GROWING, AND WHAT FOLLOWED THIS STEP WAS A SECOND
# INSTALLATION THAT COULD NEVER RUN.
#
# MEASURED on run 44274246924, which is the first run that wrote the disk: `the install is written`
# reported
#
#	8121 MiB, unchanged for 180s after 11m11s - the write is finished
#
# and then the file pressed (963, 364) to close the installer, waited for a `first boot`, and spent
# ninety ten-second attempts reading a BLACK SCREEN - 0 words, every time.
#
# THE CONSOLE LOG SAYS WHERE THE MACHINE WENT:
#
#	BdsDxe: loading Boot0002 "UEFI QEMU DVD-ROM QM00011"
#	Booting `Test this media & start Fedora-Workstation-Live'
#
# - THE FIRMWARE BOOTED THE DVD AGAIN. The medium is still attached and its boot entry sorts first,
# so the reboot goes back into the LIVE INSTALLER, not into the system that was just written. A black
# frame is that firmware hand-off, and a `first boot` gate can never see a desktop it was never
# booted into.
#
# AND THE NINETEEN STEPS AFTER IT WERE INSTALLER PAGES - `language - search for the United States`,
# `location services off`, `time zone`, `about you - full name`, `start using fedora linux`,
# `skip the tour`. Those are Anaconda's pages, so the run that "passed" them would have walked a
# SECOND install, on a disk that already had one. They cannot run on an installed system's first
# boot, and they were never the point of this stage.
#
# SO THIS STAGE ENDS THE WAY EVERY OTHER INSTALL STAGE IN THIS REPOSITORY ENDS: the disk is finished,
# the machine is stopped, and the disk is published. The first boot of the installed system is the
# NEXT stage - `ssh.yaml` - which boots the published disk with no medium attached, which is the only
# way a first boot can be about the system rather than about the ISO.
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
