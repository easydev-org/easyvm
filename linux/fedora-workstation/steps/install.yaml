name: fedora-workstation - anaconda and the first boot
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: fedora-workstation-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 64
- name: fetch the installer image
  fetch: linux_iso
  release: fedora-workstation
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the anaconda window
  until_any:
  - - installation
    - method
  - - installation
    - summary
  - - let's
    - install
  timeout: 300
  poll: 5
  keep_alive: true
- name: install fedora linux
  at:
  - 838
  - 708
  repeat:
  - 2
  - 3
  settle: 3
- name: install fedora linux (again, if anaconda is not up)
  unless:
  - installation
  - method
  at:
  - 838
  - 708
  repeat:
  - 2
  - 3
  settle: 25
- name: install fedora linux (and once more)
  unless:
  - installation
  - method
  at:
  - 838
  - 708
  repeat:
  - 2
  - 3
  settle: 30
- name: anaconda is up
  until_any:
  - - installation
    - method
  - - let's
    - install
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 300
  poll: 10
  keep_alive: true
- name: welcome
  at:
  - 729
  - 1002
  settle: 15
  expect_any:
  - - installation
    - method
- name: installation method
  at:
  - 729
  - 1002
  settle: 12
  expect_any:
  - - storage
    - configuration
  - - configuracion
    - de
    - almacenamiento
- name: storage configuration
  at:
  - 729
  - 1002
  settle: 12
  expect_any:
  - - review
    - and
    - install
  - - revisar
    - e
    - instalar
- name: erase data and install
  at:
  - 780
  - 1002
  settle: 20
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
- name: exit to the live desktop
  at:
  - 963
  - 364
  settle: 10
- name: first boot
  until_any:
  - - welcome
    - to
    - fedora
  - - type
    - to
    - search
  - - start
    - using
    - fedora
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 900
  poll: 10
- name: language - search for the United States
  at:
  - 960
  - 492
  type: united states
  settle: 5
- name: language - pick English (United States)
  at:
  - 960
  - 550
  settle: 6
- name: language
  at:
  - 1432
  - 181
  settle: 10
- name: typing
  at:
  - 1432
  - 181
  settle: 10
- name: location services off
  at:
  - 1209
  - 485
  settle: 2
- name: automatic problem reporting off
  at:
  - 1209
  - 601
  settle: 2
- name: privacy
  at:
  - 1432
  - 181
  settle: 10
- name: time zone
  at:
  - 1432
  - 181
  settle: 12
- name: third party repositories
  at:
  - 1432
  - 181
  settle: 10
- name: about you - full name
  at:
  - 1000
  - 528
  type: '{{ user }}'
  settle: 2
  expect:
  - '{{ user }}'
- name: about you
  at:
  - 1432
  - 181
  settle: 10
- name: password - password
  at:
  - 960
  - 493
  type: '{{ password }}'
  settle: 2
- name: password - confirm
  at:
  - 960
  - 630
  type: '{{ password }}'
  settle: 3
- name: password
  at:
  - 1432
  - 181
  settle: 20
- name: start using fedora linux
  at:
  - 959
  - 709
  settle: 25
- name: skip the tour
  at:
  - 852
  - 756
  settle: 12
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
