name: fedora-workstation - anaconda and the first boot
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: fedora-workstation-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: fedora-workstation
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the anaconda window
  loop:
    max: 60
    do:
    - at:
      - 420
      - 300
      wait_after: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installation
        - method
      - - installation
        - summary
      - - let's
        - install
    until:
      fact: done
- name: install fedora linux
  wait_after: 3
  do:
  - at:
    - 838
    - 708
    wait_after: 3
  - at:
    - 838
    - 708
    wait_after: 3
- name: install fedora linux (again, if anaconda is not up)
  unless:
  - installation
  - method
  wait_after: 25
  do:
  - at:
    - 838
    - 708
    wait_after: 3
  - at:
    - 838
    - 708
    wait_after: 3
- name: install fedora linux (and once more)
  unless:
  - installation
  - method
  wait_after: 30
  do:
  - at:
    - 838
    - 708
    wait_after: 3
  - at:
    - 838
    - 708
    wait_after: 3
- name: anaconda is up
  loop:
    max: 30
    do:
    - at:
      - 420
      - 300
      wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - installation
        - method
      - - let's
        - install
    until:
      fact: done
- name: welcome
  at:
  - 729
  - 1002
  expect_any:
  - - installation
    - method
  wait_after: 15
- name: installation method
  at:
  - 729
  - 1002
  expect_any:
  - - storage
    - configuration
  - - configuracion
    - de
    - almacenamiento
  wait_after: 12
- name: storage configuration
  at:
  - 729
  - 1002
  expect_any:
  - - review
    - and
    - install
  - - revisar
    - e
    - instalar
  wait_after: 12
- name: erase data and install
  at:
  - 780
  - 1002
  wait_after: 20
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
- name: exit to the live desktop
  at:
  - 963
  - 364
  wait_after: 10
- name: first boot
  loop:
    max: 90
    do:
    - wait: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - fedora
      - - type
        - to
        - search
      - - start
        - using
        - fedora
    until:
      fact: done
- name: language - search for the United States
  at:
  - 960
  - 492
  type: united states
  wait_after: 5
- name: language - pick English (United States)
  at:
  - 960
  - 550
  wait_after: 6
- name: language
  at:
  - 1432
  - 181
  wait_after: 10
- name: typing
  at:
  - 1432
  - 181
  wait_after: 10
- name: location services off
  at:
  - 1209
  - 485
  wait_after: 2
- name: automatic problem reporting off
  at:
  - 1209
  - 601
  wait_after: 2
- name: privacy
  at:
  - 1432
  - 181
  wait_after: 10
- name: time zone
  at:
  - 1432
  - 181
  wait_after: 12
- name: third party repositories
  at:
  - 1432
  - 181
  wait_after: 10
- name: about you - full name
  at:
  - 1000
  - 528
  type: '{{ user }}'
  expect:
  - '{{ user }}'
  wait_after: 2
- name: about you
  at:
  - 1432
  - 181
  wait_after: 10
- name: password - password
  at:
  - 960
  - 493
  type: '{{ password }}'
  wait_after: 2
- name: password - confirm
  at:
  - 960
  - 630
  type: '{{ password }}'
  wait_after: 3
- name: password
  at:
  - 1432
  - 181
  wait_after: 20
- name: start using fedora linux
  at:
  - 959
  - 709
  wait_after: 25
- name: skip the tour
  at:
  - 852
  - 756
  wait_after: 12
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
