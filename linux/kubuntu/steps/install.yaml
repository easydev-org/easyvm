name: kubuntu - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: kubuntu-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 64
- name: fetch the installer image
  fetch: linux_iso
  release: kubuntu
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the calamares window
  until_any:
  - - welcome
    - to
    - kubuntu
  - - choose
    - your
    - language
  - - erase
    - disk
  timeout: 600
  poll: 5
  keep_alive: true
- name: install kubuntu on the live desktop
  at:
  - 1326
  - 841
  repeat:
  - 2
  - 0.8
  settle: 25
- name: welcome
  repeat_until:
    attempts: 3
    settle: 12
    actions:
    - at:
      - 1757
      - 1058
      settle: 12
    - at:
      - 1757
      - 1058
      settle: 12
    - key: alt+n
      settle: 12
    until_any:
    - changed: true
- name: location
  repeat_until:
    attempts: 3
    settle: 12
    actions:
    - at:
      - 1757
      - 1058
      settle: 12
    - at:
      - 1757
      - 1058
      settle: 12
    - key: alt+n
      settle: 12
    until_any:
    - changed: true
- name: keyboard
  repeat_until:
    attempts: 3
    settle: 12
    actions:
    - at:
      - 1757
      - 1058
      settle: 12
    - at:
      - 1757
      - 1058
      settle: 12
    - key: alt+n
      settle: 12
    until_any:
    - changed: true
- name: customize
  repeat_until:
    attempts: 3
    settle: 12
    actions:
    - at:
      - 1757
      - 1058
      settle: 12
    - at:
      - 1757
      - 1058
      settle: 12
    - key: alt+n
      settle: 12
    until_any:
    - changed: true
- name: partitions - erase the disk
  at:
  - 208
  - 73
  settle: 4
- name: partitions
  repeat_until:
    attempts: 3
    settle: 15
    actions:
    - at:
      - 1757
      - 1058
      settle: 15
    - at:
      - 1757
      - 1058
      settle: 15
    - key: alt+n
      settle: 15
    until_any:
    - changed: true
- name: users - full name
  at:
  - 296
  - 52
  type: '{{ user }}'
  settle: 2
- name: users - login name
  at:
  - 296
  - 120
  type: '{{ user }}'
  settle: 2
- name: users - password
  at:
  - 296
  - 254
  type: '{{ password }}'
  settle: 2
- name: users - confirm password
  at:
  - 500
  - 254
  type: '{{ password }}'
  settle: 3
- name: log in automatically
  at:
  - 203
  - 297
  settle: 3
- name: users
  repeat_until:
    attempts: 3
    settle: 15
    actions:
    - at:
      - 1757
      - 1058
      settle: 15
    - at:
      - 1757
      - 1058
      settle: 15
    - key: alt+n
      settle: 15
    until_any:
    - changed: true
- name: summary - install
  at:
  - 1757
  - 1058
  settle: 12
- name: the confirmation dialog's install now
  at:
  - 1058
  - 535
  settle: 25
- name: the installer finishes
  until_any:
  - - all
    - done
  - - reboot
    - now
  - - restart
  timeout: 5400
  poll: 20
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
