name: kubuntu - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: kubuntu-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: kubuntu
  asset: linux_iso
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the calamares window
  loop:
    max: 120
    do:
    - at:
      - 420
      - 300
      wait_after: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - kubuntu
      - - choose
        - your
        - language
      - - erase
        - disk
    until:
      fact: done
- name: install kubuntu on the live desktop
  wait_after: 25
  do:
  - at:
    - 1326
    - 841
    wait_after: 0.8
  - at:
    - 1326
    - 841
    wait_after: 0.8
- name: welcome
  repeat_until:
    attempts: 3
    actions:
    - at:
      - 1757
      - 1058
      wait_after: 12
    - at:
      - 1757
      - 1058
      wait_after: 12
    - key: alt+n
      wait_after: 12
    until_any:
    - changed: true
    wait_after: 12
- name: location
  repeat_until:
    attempts: 3
    actions:
    - at:
      - 1757
      - 1058
      wait_after: 12
    - at:
      - 1757
      - 1058
      wait_after: 12
    - key: alt+n
      wait_after: 12
    until_any:
    - changed: true
    wait_after: 12
- name: keyboard
  repeat_until:
    attempts: 3
    actions:
    - at:
      - 1757
      - 1058
      wait_after: 12
    - at:
      - 1757
      - 1058
      wait_after: 12
    - key: alt+n
      wait_after: 12
    until_any:
    - changed: true
    wait_after: 12
- name: customize
  repeat_until:
    attempts: 3
    actions:
    - at:
      - 1757
      - 1058
      wait_after: 12
    - at:
      - 1757
      - 1058
      wait_after: 12
    - key: alt+n
      wait_after: 12
    until_any:
    - changed: true
    wait_after: 12
- name: partitions - erase the disk
  at:
  - 208
  - 73
  wait_after: 4
- name: partitions
  repeat_until:
    attempts: 3
    actions:
    - at:
      - 1757
      - 1058
      wait_after: 15
    - at:
      - 1757
      - 1058
      wait_after: 15
    - key: alt+n
      wait_after: 15
    until_any:
    - changed: true
    wait_after: 15
- name: users - full name
  at:
  - 296
  - 52
  type: '{{ user }}'
  wait_after: 2
- name: users - login name
  at:
  - 296
  - 120
  type: '{{ user }}'
  wait_after: 2
- name: users - password
  at:
  - 296
  - 254
  type: '{{ password }}'
  wait_after: 2
- name: users - confirm password
  at:
  - 500
  - 254
  type: '{{ password }}'
  wait_after: 3
- name: log in automatically
  at:
  - 203
  - 297
  wait_after: 3
- name: users
  repeat_until:
    attempts: 3
    actions:
    - at:
      - 1757
      - 1058
      wait_after: 15
    - at:
      - 1757
      - 1058
      wait_after: 15
    - key: alt+n
      wait_after: 15
    until_any:
    - changed: true
    wait_after: 15
- name: summary - install
  at:
  - 1757
  - 1058
  wait_after: 12
- name: the confirmation dialog's install now
  at:
  - 1058
  - 535
  wait_after: 25
- name: the installer finishes
  loop:
    max: 270
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - all
        - done
      - - reboot
        - now
      - - restart
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
