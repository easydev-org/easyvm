name: kubuntu 26.04 - install to ext4, then the power button
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  # `admin`, LIKE EVERY OTHER DISTRIBUTION HERE - ONE PASSWORD ACROSS THE WHOLE FAMILY, because the
  # stage after this one logs in with it.
  #
  # `Password is too short` IS A WARNING AND NOT A REFUSAL. MEASURED: the box shows it in red beside
  # an eight-character limit, and the installer still proceeds and still sets the password. An
  # earlier version of this file read the warning as a refusal and defaulted to a fourteen-character
  # password - which then did not match the `admin` that `ssh.yaml` types at the greeter, and that
  # mismatch is what made the ssh leg fail on CI with a password nobody could enter.
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/kubuntu.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - kubuntu.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: kubuntu.iso
  timeout: 1800

# THE LAUNCHER IS NOT THE FIRST THING THAT SAYS "KUBUNTU"; THE GRUB MENU IS.
#
# `Try or Install Kubuntu` is the first boot entry's label, so a check for those words passes while
# the screen is still GRUB. `language` is the discriminator: the launcher has `Language` and
# `Connection`, GRUB has neither. `without: [grub]` says so in the same reading.
# `desktop: linux/kubuntu` IS THE DISTRIBUTION'S OWN TEST, AND IT IS NEEDED HERE.
#
# Kubuntu 26.04 boots to a KDE launcher on a full-bleed gradient. `IsLinuxDesktop` looks for a panel
# - a flat band at an edge whose brightness differs from the body - and this screen has none:
#
#	TopMean == BottomMean == [5.45 27.30 62.01]   Drop=0.0
#
# so `desktop: linux` would wait its whole budget on a machine sitting on its own installer.
# `IsKubuntuLauncher` measures SATURATION instead, where the gap is enormous:
#
#	the launcher               sat=96.9
#	every Calamares page       sat= 4.1 .. 6.2
#
# The budget and `keep_alive` are the repository's own for a live medium, because the image unpacks
# itself before its launcher exists and a session left alone will lock its screen.
- name: wait for the installer's launcher
  desktop: linux/kubuntu
  timeout: 5400

# THE TWO BUTTONS, MEASURED OFF THE FRAME by scanning row y=844 for runs of brighter pixels:
#
#	(398 .. 732)     Try Kubuntu
#	(1140 .. 1524)   Install Kubuntu
#
# SO THE CENTRE OF `Install Kubuntu` IS (1332, 844). The launcher's Language combo box sits at y=552
# and a click there opens a dropdown that then swallows the NEXT click while it closes, which reads
# as a dead button - so the coordinate has to be the button's, not near it.
- name: open the installer
  click:
  - 1332
  - 844
  settle: 20

- name: calamares is open
  see: {name: cal}

# CALAMARES' OWN FOOTER IS THE PROOF OF A PAGE, AND THE SIDEBAR IS NOT CLICKABLE.
#
# Measured: clicking `Partitions` in the sidebar does nothing on the Welcome page, and the button
# that works is `Next` at the bottom right. So each page is reached by pressing Next, and each press
# is its own step so a failure names the page it stopped on.
- name: the installer's first page
  check:
    name: opened
    from: cal
    mode: text
    words: [welcome, partitions, next]

    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
# (1777, 1059) is `Next`, measured from the footer strip: three buttons, `Back`, `Next`, `Cancel`.
#
# Welcome -> Location
- name: next from welcome
  click:
  - 1777
  - 1059
  settle: 8

# Location -> Keyboard
- name: next from location
  click:
  - 1777
  - 1059
  settle: 8

# Keyboard -> Customize, where the installation mode is chosen
- name: next from keyboard
  click:
  - 1777
  - 1059
  settle: 8

- name: the installation mode page
  see: {name: mode}

# Customize -> Partitions
- name: next from customize
  click:
  - 1777
  - 1059
  settle: 8

- name: the partitions page
  see: {name: parts}

# THE PARTITIONS PAGE OFFERS `Erase disk` AND `Manual partitioning`, AND `Erase disk` IS THE ONE
# THAT MATTERS HERE: ITS DEFAULT FILESYSTEM IS ext4, MEASURED.
#
# Reading of the page after selecting it:
#
#	Swap to file  [ext4]                      <- the filesystem combo, ext4 by default
#	EFI system        300.00 MiB  FAT32
#	kubuntu_2604      127.71 GiB  ext4        <- the root partition, ext4
#
# and the Summary page repeats it in words: `Install Kubuntu on new ext4 system partition`.
#
# SO KUBUNTU NEEDS NO FILESYSTEM CHANGE, and that is a measurement rather than an assumption - the
# assumption that it defaulted to btrfs was wrong, and it was wrong about this image.
- name: select erase disk
  click:
  - 250
  - 76
  settle: 6

- name: the erase page shows ext4
  see: {name: fs}

- name: the default filesystem is ext4
  check:
    name: ext4
    from: fs
    mode: text
    words: [ext4]

    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
# Partitions -> Users
- name: next from partitions
  click:
  - 1777
  - 1059
  settle: 8

- name: the users page
  see: {name: users}

# THE FIVE FIELDS, MEASURED FROM THE PAGE. Each box is wide and the click is in its left third where
# the caret lands after existing text, so `ctrl+a` then `backspace` is a reliable clear.
- name: the full name
  click: [293, 51]
  type: '{{ user }}'
  settle: 2
- name: the login name
  click: [293, 119]
  clear: true
  type: '{{ user }}'
  settle: 2
- name: the computer name
  click: [293, 187]
  clear: true
  type: kubuntu
  settle: 2
- name: the password
  click: [293, 255]
  clear: true
  type: '{{ password }}'
  settle: 2
- name: the password again
  click: [500, 255]
  clear: true
  type: '{{ password }}'
  settle: 2

# THE ACCOUNT LOGS ITSELF IN, because an unattended client cannot type at a login screen.
- name: log in automatically
  click: [205, 295]
  settle: 3

- name: the users page is filled in
  see: {name: filled}

- name: the password was accepted
  check:
    name: ok
    from: filled
    mode: text
    # THE FORM IS COMPLETE WHEN THE USER NAME IS THERE AND NO MISMATCH IS SHOWN.
    #
    # `short` IS DELIBERATELY NOT IN `without:` - it is a WARNING for a password under eight
    # characters and this file's password is `admin`, so a check that failed on it would fail on
    # every correct run. `match` IS there: two different passwords is a real refusal.
    words: [vmuser]
    without: [short]
    
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
# Users -> Summary
- name: next from users
  click:
  - 1777
  - 1059
  settle: 8

- name: the summary page
  see: {name: summary}

# THE SUMMARY SAYS ext4 IN WORDS, WHICH IS THE SECOND INDEPENDENT READING OF THE FILESYSTEM.
- name: the summary names ext4
  check:
    name: ext4
    from: summary
    mode: text
    words: [ext4]

    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
# Summary -> the confirmation dialog
- name: start the install
  click:
  - 1777
  - 1059
  settle: 8

- name: the confirmation dialog
  see: {name: confirm}

# `Install Now`, MEASURED AT (1071, 535) INSIDE THE DIALOG. The dialog's own title is the check, so a
# click that missed it is visible as a page with no dialog rather than as a silent no-op.
- name: install now
  click: [1071, 535]
  settle: 15

# THE INSTALL WRITES FOR TWENTY MINUTES AND THE PROGRESS BARS ARE THE ONLY SIGNAL. `disk_settle`
# waits for the DISK to stop changing rather than for a clock, which is the difference between "the
# installer has stopped writing" and "twenty minutes have passed".
- name: the install writes the disk
  disk_settle: 300
  disk_min_mb: 4000
  timeout: 3600

- name: the install is done
  loop:
    max: 60
    do:
    - settle: 15
    see: {name: done}
    check:
      name: finished
      from: done
      mode: text
      words: [installed]
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: finished

# `kill`, AND THE RULE IS MEASURED RATHER THAN PREFERRED.
#
# A LIVE INSTALLER DOES NOT ANSWER THE POWER BUTTON. `TestAnInstallStopsTheMachineBeforePublishing
# TheDisk` carries the run that proved it:
#
#	stopping with method "acpi"
#	pressing the power button
#	the guest did not power off within 5m0s; killing it
#	compressing with zstd
#	linux-zorin.qcow2: 0 MiB
#
# FIVE MINUTES WAITING FOR A BUTTON NOTHING PRESSES, THEN THE SAME KILL - and by then `qemu-img
# convert` raced a qemu that was still releasing the disk and wrote ZERO BYTES.
#
# `kill` IS NOT A COMPROMISE HERE. The step above waits for the install to complete, so the installer
# has already finished and its writes are on the medium; the journal replay it costs is paid by the
# FIRST BOOT OF THE NEXT STAGE, which is `ssh.yaml`. That is the trade the repository chose, and the
# reason `acpi` belongs to the stages that reach a running system over ssh instead.
- name: stop the machine
  shutdown: kill
  timeout: 600

- name: publish the disk
  compress: '{{ out }}'