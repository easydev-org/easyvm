name: linux-kubuntu - sshd
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
# THE INSTALL STAGE TURNS AUTOLOGIN ON, SO THERE IS NO GREETER TO TYPE AT.
#
# MEASURED on a disk this repository's own install walk produced: the machine boots straight to the
# KDE desktop at 1920x1080, with `Welcome Center` up and the panel drawn. THERE IS NO LOGIN PROMPT.
#
# THIS FILE USED TO CLICK ONE, AND THAT IS WHY THE LEG FAILED ON CI IN TWO DIFFERENT WAYS:
#
#	on a disk WITHOUT autologin   the greeter draws at 640x480 while the session that follows is
#	                              1920x1080, so every coordinate below was refused -
#	                              `click (936, 628) is a coordinate measured at 1920x1080 but the
#	                              framebuffer is 640x480`
#	on a disk WITH autologin      there is no greeter, so the clicks landed on the Welcome Center
#	                              and the terminal never opened
#
# SO THE STEPS ARE GONE rather than made conditional: the phase this file exists for starts at a
# logged-in desktop, and the install stage is what puts it there.
- name: the session is up, which is what autologin is for
  loop:
    max: 40
    do:
    - settle: 10
    see: {name: desk}
    check:
      name: up
      from: desk
      mode: text
      words:
      - - applications
      - - welcome
      - - kubuntu
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: up
- name: open the terminal
  key: ctrl+alt+t
  settle: 20
- name: install openssh-server
  run: echo {{ password }} | sudo -S sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update -o DPkg::Lock::Timeout=600 && apt-get install -y -o DPkg::Lock::Timeout=600 openssh-server" 2>&1 | tail -6
  terminal_wait: 0
  settle: 90
- name: allow password authentication
  run: echo {{ password }} | sudo -S -p '' sh -c 'mkdir -p /etc/ssh/sshd_config.d; printf "PasswordAuthentication yes\n" > /etc/ssh/sshd_config.d/99-vm.conf; sed -i "s/^#\?\s*PasswordAuthentication.*/PasswordAuthentication yes/" /etc/ssh/sshd_config; grep
    -q "^PasswordAuthentication yes" /etc/ssh/sshd_config || printf "PasswordAuthentication yes\n" >> /etc/ssh/sshd_config' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: enable ssh at boot
  run: echo {{ password }} | sudo -S systemctl enable ssh 2>&1 | tail -3
  terminal_wait: 0
  settle: 8
- name: prove the setting took
  run: echo {{ password }} | sudo -S sh -c 'sshd -T 2>/dev/null | grep -i "^passwordauthentication" || echo PASSWORDAUTH-UNREADABLE' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: start ssh
  run: echo {{ password }} | sudo -S systemctl restart ssh 2>&1 | tail -3
  terminal_wait: 0
  settle: 10
- name: prove ssh is active
  run: systemctl is-active ssh
  terminal_wait: 0
  settle: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: ask the guest to power off
  ssh: printf '%s\n' '{{ password }}' | sudo -S -p '' poweroff
  timeout: 300
- name: wait for the machine to stop
  wait_until: stopped
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'