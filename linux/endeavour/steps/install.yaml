name: endeavour - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: endeavour-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: endeavour
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: pin the wizard's language to english
  run: sudo sed -i 's#https://geoip.kde.org/v1/ubiquity#http://127.0.0.1:9/x#' /etc/calamares/modules/welcome_offline.conf; exit
  terminal_wait: 10
  wait_after: 8
- name: close the terminal
  at:
  - 1402
  - 310
  wait_after: 6
- name: wait for the calamares window
  until_any:
  - - american
    - english
  - - erase
    - disk
  - - welcome
  timeout: 600
  poll: 5
  keep_alive: true
- name: start the installer
  at:
  - 735
  - 425
  wait_after: 20
- name: offline
  at:
  - 1069
  - 590
  expect_any:
  - - welcome
  - - location
  wait_after: 55
- name: welcome
  at:
  - 1406
  - 873
  wait_after: 20
- name: location
  at:
  - 1406
  - 873
  wait_after: 20
- name: keyboard
  at:
  - 1406
  - 873
  wait_after: 20
- name: bootloader
  at:
  - 1406
  - 873
  wait_after: 20
- name: partitions - erase the disk
  at:
  - 566
  - 258
  wait_after: 8
- name: partitions
  at:
  - 1406
  - 873
  wait_after: 22
- name: users - full name
  at:
  - 847
  - 302
  type: '{{ user }}'
  wait_after: 2
- name: users - login name
  at:
  - 847
  - 356
  type: '{{ user }}'
  wait_after: 2
- name: users - password
  at:
  - 700
  - 513
  type: '{{ password }}'
  wait_after: 2
- name: users - confirm password
  at:
  - 982
  - 513
  type: '{{ password }}'
  wait_after: 3
- name: users
  at:
  - 1406
  - 873
  wait_after: 22
- name: summary - install
  at:
  - 1406
  - 873
  wait_after: 18
- name: the install confirmation's install now
  at:
  - 1059
  - 542
  wait_after: 30
- name: the install runs, as measured
  wait: 2700
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
