name: nixos - the Calamares walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - nixos.iso
- name: start recording
  record: nixos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: nixos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
# THE CLICK THAT OPENS THE INSTALLER DOES NOT ALSO GET TO DECIDE WHETHER IT OPENED.
#
# MEASURED, on this medium: this step carried `expect_any: [welcome | language | install]` and an
# 8-second `wait_after`, and it FAILED with
#
#	open the installer: did not advance: wanted "welcome" or "language" or "install",
#	                   read "-_- Nov 17 13:30 mm O Q Type to search"
#
# - the reading was the DESKTOP's status bar, one frame before the window appeared. A screenshot
# taken right after showed `Welcome to the NixOS installer` plainly on screen. The window was
# opening; the verdict was taken too early, and it is a VERDICT, so the walk stopped there and the
# retry loop below (`calamares is up`, 30 attempts) never got to run.
#
# SO THIS STEP ONLY CLICKS. The waiting belongs to the loop, which is allowed to be wrong thirty
# times; a check on a single click is allowed to be wrong once and ends the run.
- name: open the installer
  wait_after: 8
  do:
  - click:
    - 960
    - 640
    wait_after: 3
  - click:
    - 960
    - 640
    wait_after: 3
- name: calamares is up
  loop:
    max: 30
    do:
    - click:
      - 420
      - 300
      wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 3
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
      - - language
      - - keyboard
    until:
      fact: done
# THE WELCOME PAGE'S `Next` IS GREY ON THE RUNNER UNTIL THE LANGUAGE COMBO COMMITS.
#
# MEASURED off the failing run's own frame (extracted from its recording): the Calamares window is
# 685x365 there - x 450..1470, y 296..852 on the 1920 frame - and `Next` at (1325, 836) is drawn in
# `rgb(239,239,239)`: DISABLED. The language combo above it reads `American English`, so a choice is
# shown but not committed, and Calamares will not advance until it is.
#
# SO THE COMBO IS OPENED AND ITS OWN ENTRY TAKEN, which is what commits it: the list opens on the
# current entry, so `ret` selects `American English` a second time and the change handler fires.
- name: the language combo, opened and taken
  # MEASURED off the failing run's frame: the combo's own border spans x=680..1422, y=727..745 on the
  # 1920 frame, so its centre is (1050, 736).
  click:
  - 1050
  - 736
  wait_after: 3

- name: take the current entry
  key: ret
  wait_after: 3

# THE FOOTER'S `Next` IS AT A DIFFERENT HEIGHT ON THE RUNNER AND ON THIS WORKSTATION, AND THE TWO
# BANDS ONLY OVERLAP IN SIX ROWS. MEASURED OFF BOTH FRAMES - the button's own interior, scanned as
# "pixels brighter than 240 at the button's centre column":
#
#	CI (runs 44245145223 and 44250596341)   y 826..845   centre 835
#	this workstation (the hand walk)        y 810..831   centre 820
#
# A SINGLE NUMBER CANNOT BE RIGHT FOR BOTH, and the two failures say exactly that:
#
#	(1329, 836)  welcome -> location WORKED on CI (836 is inside 826..845), then stopped.
#	(1335, 821)  FELL THROUGH ON CI - 821 is five rows ABOVE the button's top edge, the press landed
#	             on the page background, and the run's last frame is still `Welcome to the NixOS
#	             installer` with `Next` drawn and unpressed.
#
# 828 IS INSIDE BOTH BANDS (826..831), so it presses the same button on either window size. x=1330 is
# inside the button on both too - the button spans 1290..1365 on CI and 1300..1370 here.
#
# AND THE PRESS IS A LOOP, NOT THREE STEPS, BECAUSE A PRESS CAN BE DROPPED. The old three presses were
# fire-and-forget: each one logged `clicked (…)` and nothing checked that the page had moved, so a run
# that lost one press sat on `Location` for six minutes while the step after it waited for the Users
# page. The reading is `What is your name?` - the Users page's own first label - and the loop stops
# there. Pressing `Next` on that page is harmless anyway: the form is empty, so it is disabled.
- name: next through the pages, until the users page is up
  loop:
    max: 8
    do:
    - click:
      - 1330
      - 828
      wait_after: 8
    ocr:
      name: at_users
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      # THE READING IS ENLARGED, AND THAT IS WHAT MADE IT READABLE ON THE RUNNER.
      #
      # MEASURED on the failed run's own final frame: at `scale: 1` the whole 1920x1080 frame reads
      # 12 words - the desktop's own title bar and the sidebar - and the page's text is not among
      # them, so every gate that waited for a word on this page could only ever fail. The same frame
      # at `scale: 3` reads 42 words including `Region: America` and `Zone: New York`.
      scale: 3
      wait: 2
    check:
      name: here
      from: at_users
      mode: says_any
      # `name` IS THE USERS PAGE'S FIRST LABEL (`What is your name?`). The three pages before it carry
      # `Location`, `Keyboard` and the desktop - none of them the word.
      words:
      - - name
      - - Password
    until:
      fact: here
# THE USERS PAGE IS ALREADY UP: the loop above pressed `Next` until this page's own `What is your
# name?` was read back, so the fields are drawn before anything is typed into them.
#
# THAT WAIT USED TO BE A SEPARATE STEP - `the users page is drawn` - kept because on an earlier CI leg
# every field reported `typed N character(s)` while the first one stayed empty: `click:` followed
# immediately by `type:` is a press and then keystrokes, and a press that lands while the page is still
# laying itself out types into nowhere. Folding the wait into the press loop is what removes that gap -
# the loop cannot succeed without the page's label having been read.

# THE FIRST FIELD TAKES NO TEXT ON THE RUNNER, AND `clear:` IS WHAT MAKES THAT VISIBLE.
#
# MEASURED on the CI leg: `the users page is drawn` passed - the page WAS up - and then
#
#	=== users - what is your name
#	  typed 6 character(s)
#
# while the field stayed empty, so Calamares kept `Next` grey and the install never started. The
# press lands at (718, 377) and this workstation types into it; the runner's window is a few pixels
# elsewhere and the press misses the box.
#
# `clear:` MAKES THE STEP SELF-CORRECTING rather than merely visible: it selects the field's contents
# and deletes them before typing, which is a no-op on an empty box and puts the caret in it when the
# press DID land. Every other field on this page already does this; the first one did not, because it
# is the one that starts empty.
# THE FIRST FIELD NEVER TOOK THE TEXT ON THE RUNNER, AND THE FRAME SAYS WHY.
#
# MEASURED off the failing run's recording, the last frame before it gave up: the Users page with
# `Your Full Name` STILL DRAWN AS THE PLACEHOLDER in the first box, `vmuser` green-ticked in the second,
# and `Next` grey. So the press did not put the caret in the first box.
#
# AND THE OLD VERDICT COULD NOT SEE IT: it read a 60-row crop of the field and got
# `What is your name? [vmuser| T Qo What name do you want ...` - the SECOND box's `vmuser` was inside
# the crop, so `took = true` passed on a first box that was empty.
#
# THE BOX IS x=600..824, y=376..403 on that frame - centre (712, 390) - and the caret is put in it
# before anything is typed. The verdict now reads a crop that stops ABOVE the second box's label, so
# the only `vmuser` it can see is the one in the first field.
# THE FIRST FIELD IS PRESSED, CLEARED AND TYPED IN ONE LOOP, BECAUSE A PRESS AND A TYPE ARE NOT ONE
# ACTION UNLESS THEY ARE ONE STEP.
#
# MEASURED on run 44257075222: the first box still read `Your Full Name` - its PLACEHOLDER - after
# `typed 6 character(s)` was logged, and `Next` stayed disabled, so the run then pressed a disabled
# button five times. The press was at (712, 390) and the box occupies y 360..391 on the runner: 390 is
# its BOTTOM BORDER, so the caret never entered the field and the six characters went to the window.
#
# THE BOX IS x 624..831, y 360..391 ON THE RUNNER - centre (727, 375) - measured off that run's own
# frame. The old (712, 390) is 2 rows below the interior.
#
# AND THE VERDICT IS THE PLACEHOLDER BEING GONE. `Your Full Name` is drawn in the box only while it is
# EMPTY; once a character is typed it is replaced by the text. So the loop presses and types, and stops
# when the placeholder is no longer read. `clear:` is a no-op on an empty box and a correction on one
# that already holds text, which is what makes a retry safe.
- name: the full name field
  loop:
    max: 4
    do:
    # THE PRESS, THE CLEAR AND THE TYPING ARE ONE STEP, BECAUSE `clear:` ONLY RUNS WHEN THE STEP HAS
    # ITS OWN `click:` - it selects the box's contents and deletes them before typing. Split in two,
    # the clear is skipped and a retry APPENDS: MEASURED on run 44258269753, four attempts left
    # `vmuservmuservnusermuser` in the box.
    - click:
      - 727
      - 375
      clear: true
      type: '{{ user }}'
      wait_after: 2
    ocr:
      name: name_field
      # JUST THE BOX'S INTERIOR, ENLARGED. MEASURED on the runner's frames: with the border rows
      # included (y 360..391) the placeholder survives the read even when the box is full; with the
      # interior only (y 362..389) an empty box reads `Your Full Name |` and a filled one reads
      # `VITIUSe!` - the typed text, no placeholder. The crop also stops at the box's own right
      # border, so the second field's text cannot be read into this one.
      region: [626, 362, 829, 389]
      region_at: [1920, 1080]
      scale: 8
      wait: 1
    check:
      name: took
      from: name_field
      # THE USERNAME IS IN THE BOX, WHICH IS THE THING BEING ASKED FOR.
      #
      # MY FIRST VERDICT WAS `says_without` ON THE PLACEHOLDER AND IT WAS BACKWARDS: that mode requires
      # `words:` to be PRESENT and `without:` to be ABSENT, so `words: [Your]` + `without: [Full]` asks
      # for the placeholder to be there and sent the loop round four times on boxes that were already
      # filled. MEASURED, those four readings were
      #
      #	name_field: 3 word(s): vmuser I |
      #	name_field: 3 word(s): vmuservmuser| L |
      #	name_field: 2 word(s): vmuservmuservnuser |
      #
      # - the name, present and then doubled by the retries. So the test is the name itself.
      mode: says
      words:
      - - '{{ user }}'
    until:
      fact: took

# THE LOGIN NAME IS NOT TYPED, BECAUSE CALAMARES DERIVES IT AND THIS FILE WAS ERASING THE FULL NAME.
#
# MEASURED on run 44259246729's recording, frame by frame, with the first box read at each second:
#
#	t=110  box1 `Your Full Name`   box2 `login`      <- the form as it opens
#	t=112  box1 `vmuser`           box2 `vmuser`     <- the name went in, the login was derived
#	t=116  box1 `Your Full Name`   box2 `login`      <- BOTH cleared
#	t=124  box1 `Your Full Name`   box2 `vmuser`     <- the login retyped, the name gone forever
#
# - three steps sat here: `click (740,433)` + `ctrl+a`, `backspace`, then `click (740,433)` + type.
# The press at (740, 433) did NOT move the focus out of the first box, so `ctrl+a` and `backspace`
# selected and deleted THE FULL NAME - which is also why the run then pressed a disabled `Next` five
# times: Calamares keeps it disabled while the name is empty, and the name had just been deleted.
#
# AND THE LOGIN BOX DID NOT NEED ANY OF IT: it already read `vmuser` with its green tick, derived from
# the full name. That is this installer's own behaviour and the reason the fields are coupled.
#
# SO THE THREE STEPS ARE GONE. The name is typed once, the login follows it, and the password fields
# below are pressed by their own centres.

- name: users - allow a short password
  click:
  - 645
  - 537
  wait_after: 3
- name: users - password
  click:
  - 741
  - 495
  type: '{{ password }}'
  wait_after: 2
- name: users - repeat password
  click:
  - 959
  - 495
  type: '{{ password }}'
  wait_after: 2
- name: users - administrator password
  click:
  - 741
  - 609
  type: '{{ password }}'
  wait_after: 2
- name: users - administrator repeat password
  click:
  - 959
  - 609
  type: '{{ password }}'
  wait_after: 3
# THE FOUR PAGES BETWEEN THE USERS FORM AND THE SUMMARY ARE PRESSED BY ONE LOOP EACH, AND THE
# COORDINATE IS THE SAME 828 THE EARLIER PRESSES USE.
#
# THE FILE USED (1335, 821) HERE - 5 ROWS ABOVE THE RUNNER'S BUTTON (826..845) - and the consequence
# is in run 44255435468's own recording: the sidebar walked `Users -> Desktop -> Partitions -> Summary`
# while the PAGE NEVER LEFT `What is your name?`. Each press was logged as `clicked (1335, 821)` and
# each one landed on the page background. The reading after `summary - install` is the proof:

#	summary_after: 75 word(s): = Nov 18 07:06 ao) NixOS Installer x What is your name? ...

# - the Users page, six presses into a step that believed it was pressing `Install` on the summary.
#
# SO EVERY PRESS IS 828 (inside 826..845 on the runner and 810..831 here) AND EVERY STEP IS A LOOP
# THAT READS THE PAGE IT EXPECTS NEXT. A press that misses now costs one attempt instead of the run.
# ONE PRESS ADVANCES ONE PAGE, AND A PRESS THAT IS RETRIED OVERSHOOTS. THIS IS THE MEASUREMENT THAT
# MADE ALL THREE OF THE OLD STEPS WRONG.
#
# MEASURED on run 44260452757: `users -> desktop` pressed `Next` and read 73 words that were neither
# `GNOME` nor `Plasma`, three times, and its own final frame is the PARTITIONS page with `Erase disk`
# and `Manual partitioning` drawn. The three presses had each advanced a page -
# `Users -> Desktop -> Unfree software -> Partitions` - because a press that lands is not undone by
# pressing again, and the reading after each press saw the page AFTER the one it expected:
#
#	press 1 -> Desktop           the reading was taken as the page appeared, and by then press 2 was
#	press 2 -> Unfree software   already queued
#	press 3 -> Partitions        which is the frame the run ended on
#
# SO THE WHOLE RUN FROM THE USERS FORM TO THE SUMMARY IS ONE LOOP WITH ONE VERDICT: press `Next`, and
# stop when the SUMMARY page is up. Every page between them takes the same single press, including
# `Unfree software`, whose notes pane has nothing to select. The verdict is `overview` - the summary's
# own heading, `This is an overview of what will happen` - which none of the pages before it carries.
# THE PAGES BETWEEN THE USERS FORM AND THE PARTITIONS PAGE TAKE ONE PRESS EACH, AND ONE LOOP DOES
# ALL OF THEM. THIS IS THE MEASUREMENT THAT MADE THE OLD THREE STEPS WRONG.
#
# MEASURED on run 44260452757: `users -> desktop` pressed `Next` and read 73 words that were neither
# `GNOME` nor `Plasma`, three times - and its own final frame is the PARTITIONS page with `Erase disk`
# and `Manual partitioning` drawn. The three presses had each advanced a page
# (`Users -> Desktop -> Unfree software -> Partitions`), so each reading saw the page AFTER the one
# the step was waiting for, and the step could never pass.
#
# THE LOOP STOPS AT THE PARTITIONS PAGE AND NOT AT THE SUMMARY, because that page needs a choice
# before its own `Next` is enabled: its two radios - `Erase disk` and `Manual partitioning` - are both
# drawn EMPTY, and Calamares keeps the button disabled until one is picked. A single loop to the
# summary would press a disabled button there forever.
- name: next to the partitions page
  loop:
    max: 8
    do:
    - click:
      - 1330
      - 828
      wait_after: 6
    ocr:
      name: at_partitions
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      # ENLARGED: at `scale: 1` the runner's whole frame reads only the title bar and the sidebar.
      scale: 3
      wait: 2
    check:
      name: here
      from: at_partitions
      mode: says_any
      # `partitioning` IS THE PAGE'S SECOND CHOICE - `Manual partitioning` - and is one word, so it
      # matches as a token. `erase` is there for the case where the radio's label is read first.
      words:
      - - partitioning
      - - erase
    until:
      fact: here

# ERASE THE WHOLE DISK - THE FIRST RADIO, AND THE ONE THIS STAGE WANTS. MEASURED on the runner's own
# frame: the radio is at (633, 390), 58 pixels right of the page's left edge, and pressing it is what
# enables `Next`. `GNOME` NEEDS NO PRESS: Calamares draws it already selected on this medium, and the
# desktop page is passed with the same `Next` the loop presses.
- name: partitions - erase the disk
  click:
  - 633
  - 390
  wait_after: 6

- name: partitions -> summary
  loop:
    max: 6
    do:
    - click:
      - 1330
      - 828
      wait_after: 6
    ocr:
      name: at_summary
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 3
      wait: 2
    check:
      name: here
      from: at_summary
      mode: says_any
      # `overview` IS THE SUMMARY'S OWN HEADING - `This is an overview of what will happen once you
      # start the install procedure` - and none of the pages before it carries the word.
      words:
      - - overview
    until:
      fact: here

# THE SUMMARY PAGE'S `Install` IS 29 ROWS BELOW THE OTHER PAGES' `Next`, AND THE VERDICT IS THE
# PROGRESS PAGE'S OWN WORD - NOT THE SIDEBAR'S.
#
# MEASURED, both bands scanned as the button's own interior (pixels brighter than 240 at its centre
# column, between the two grey border rows 150..205):
#
#	                          runner            this workstation
#	ordinary pages' `Next`    y 826..845        y 810..831
#	summary's `Install`       y 855..874        y 839..860
#
# - the summary is 29 rows lower on each, because its content is taller and Calamares lays the footer
# out under it. 857 is inside both summary bands (855..874 and 839..860).
#
# AND THAT PRESS WORKS ON THE RUNNER: run 44263043882's own last frame is the PROGRESS page -
# `Installing NixOS...`, a 65% bar, the sidebar showing `Install` highlighted - so the install had
# been running for minutes while this step reported `gone = false` five times. THE VERDICT WAS WRONG,
# NOT THE PRESS: it was `says_without` with `without: [Summary]`, and THE SIDEBAR ON THAT PAGE STILL
# READS `Summary` - the wizard marks the current step in its sidebar and does not remove the entries
# of the ones behind it. A word that is permanently on screen can never be absent.
#
# SO THE TEST IS `Installing`, WHICH THE SUMMARY PAGE DOES NOT CARRY AND THE PROGRESS PAGE DOES.
# MEASURED: the summary page's OCR at 3x contains `overview` and no `Installing`; the progress page
# contains `Installing` and no `overview`.
- name: summary - install
  loop:
    max: 6
    do:
    - click:
      - 1328
      - 857
      wait_after: 12
    ocr:
      name: summary_after
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      # ENLARGED: at `scale: 1` the runner's whole frame reads only the title bar and the sidebar.
      scale: 3
      wait: 2
    check:
      name: begun
      from: summary_after
      mode: says_any
      words:
      - - Installing
    until:
      fact: begun

- name: the install is written
  disk_settle: 180
  disk_min_mb: 1024
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
