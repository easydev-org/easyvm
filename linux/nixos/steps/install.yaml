name: nixos - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: nixos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: nixos
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: open the installer
  expect_any:
  - - welcome
  - - language
  - - install
  wait_after: 8
  do:
  - at:
    - 960
    - 640
    wait_after: 3
  - at:
    - 960
    - 640
    wait_after: 3
- name: open the installer (desktop icon, if the window was not there)
  unless:
  - welcome
  - language
  wait_after: 8
  do:
  - at:
    - 88
    - 240
    wait_after: 3
  - at:
    - 88
    - 240
    wait_after: 3
- name: open the installer (desktop icon again)
  unless:
  - welcome
  - language
  wait_after: 25
  do:
  - at:
    - 88
    - 240
    wait_after: 3
  - at:
    - 88
    - 240
    wait_after: 3
- name: calamares is up
  loop:
    max: 30
    do:
    - at:
      - 420
      - 300
      wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      says_any:
      - - welcome
      - - language
      - - keyboard
    until:
      fact: done
- name: welcome
  at_bottom:
  - 1327
  - 15
  wait_after: 15
- name: location
  at_bottom:
  - 1327
  - 15
  wait_after: 15
- name: keyboard
  at_bottom:
  - 1327
  - 15
  wait_after: 15
- name: users - what is your name
  at:
  - 700
  - 377
  type: '{{ user }}'
  wait_after: 2
- name: users - login name, select all
  at:
  - 700
  - 429
  key: ctrl+a
  wait_after: 1
- name: users - login name, clear it
  key: backspace
  wait_after: 1
- name: users - login name
  at:
  - 700
  - 429
  type: '{{ user }}'
  wait_after: 2
- name: users - allow a short password
  at:
  - 630
  - 532
  wait_after: 3
- name: users - password
  at:
  - 700
  - 494
  type: '{{ password }}'
  wait_after: 2
- name: users - repeat password
  at:
  - 900
  - 494
  type: '{{ password }}'
  wait_after: 2
- name: users - administrator password
  at:
  - 700
  - 603
  type: '{{ password }}'
  wait_after: 2
- name: users - administrator repeat password
  at:
  - 900
  - 603
  type: '{{ password }}'
  wait_after: 3
- name: users
  at_bottom:
  - 1327
  - 15
  wait_after: 18
- name: choose gnome
  at:
  - 1000
  - 400
  wait_after: 4
- name: packagechooser
  at_bottom:
  - 1327
  - 15
  wait_after: 15
- name: unfree notes
  at_bottom:
  - 1327
  - 15
  wait_after: 12
- name: partitions - erase the disk
  at:
  - 633
  - 390
  wait_after: 6
- name: partitions
  at_bottom:
  - 1327
  - 15
  wait_after: 18
- name: summary - install
  at_bottom:
  - 1327
  - 15
  wait_after: 25
- name: the install is written
  disk_settle: 180
  disk_min_mb: 1024
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
