name: linux-nixos - configure the vm (name, share, guest agent)
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  hostname:
    from: args.hostname
    default: easyvm-vm
  host:
    from: args.host
    default: 172.30.0.1
  out:
    from: args.out
    default: out/vm-configure.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '1800'
ssh_user: vmuser
ssh_port: 2222
steps:
- name: start recording
  record: vm-configure.mp4
- name: take the input disk
  disk: disk.qcow2
- name: boot the disk
  boot: true
  os: linux
  timeout: '{{ boot_timeout }}'
- name: wait for sshd
  require_ssh: true
  timeout: '{{ boot_timeout }}'
- name: announce the machine's name
  ssh: echo "this machine will be named '{{ hostname }}'"
  timeout: 60
- name: declare the machine's name
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' awk -v name='{{ hostname }}' '\n  # PASS ONE: remember every line, and where the closing brace is.\n  { line[NR] = $0 }\n  $0 ~ /networking\\.hostName/\
    \ { skip[NR] = 1 }\n  $0 == \"}\" { closing = NR }\n  END {\n    if (closing == 0) { print \"no closing brace in configuration.nix\" > \"/dev/stderr\"; exit 1 }\n    for (i = 1; i <= NR; i++) {\n  \
    \    if (i == closing) printf \"  networking.hostName = \\\"%s\\\";\\n\", name\n      if (!skip[i]) print line[i]\n    }\n  }' /etc/nixos/configuration.nix > /tmp/configuration.nix.new\nprintf '%s\\\
    n' '{{ password }}' | sudo -S -p '' mv /tmp/configuration.nix.new /etc/nixos/configuration.nix\nprintf '%s\\n' '{{ password }}' | sudo -S -p '' grep -n 'networking.hostName' /etc/nixos/configuration.nix\n"
  timeout: 300
- name: prove the name is declared
  ssh: 'set -e

    grep -n "networking.hostName" /etc/nixos/configuration.nix

    grep -q ''networking.hostName.*{{ hostname }}'' /etc/nixos/configuration.nix

    '
  timeout: 60
- name: declare the guest agent and the cifs client
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' awk '\n  { line[NR] = $0 }\n  $0 ~ /environment\\.systemPackages/ { skip[NR] = 1 }\n  $0 ~ /services\\.qemuGuest\\.enable/ { skip[NR] = 1 }\n  $0\
    \ == \"}\" { closing = NR }\n  END {\n    if (closing == 0) { print \"no closing brace in configuration.nix\" > \"/dev/stderr\"; exit 1 }\n    for (i = 1; i <= NR; i++) {\n      if (i == closing) {\n\
    \        printf \"  environment.systemPackages = [ pkgs.cifs-utils ];\\n\"\n        printf \"  services.qemuGuest.enable = true;\\n\"\n      }\n      if (!skip[i]) print line[i]\n    }\n  }' /etc/nixos/configuration.nix\
    \ > /tmp/configuration.nix.new\nprintf '%s\\n' '{{ password }}' | sudo -S -p '' mv /tmp/configuration.nix.new /etc/nixos/configuration.nix\nprintf '%s\\n' '{{ password }}' | sudo -S -p '' grep -n -e\
    \ environment.systemPackages -e services.qemuGuest /etc/nixos/configuration.nix\n"
  timeout: 300
- name: rebuild
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' nixos-rebuild switch 2>&1 | tail -8

    '
  timeout: 1800
- name: enable the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' systemctl enable --now qemu-guest-agent 2>&1 | tail -3

    '
  timeout: 120
- name: prove the name
  ssh: 'echo "static:   $(hostnamectl --static)"

    echo "kernel:   $(hostname)"

    echo "declared: $(grep -c ''networking.hostName'' /etc/nixos/configuration.nix || true) line(s)"

    grep -n ''networking.hostName'' /etc/nixos/configuration.nix || echo "no networking.hostName line"

    echo "--- the tail of configuration.nix ---"

    tail -5 /etc/nixos/configuration.nix

    echo "--- the verdict ---"

    test "$(hostnamectl --static)" = "{{ hostname }}"

    '
  timeout: 60
- name: prove the guest agent is running
  ssh: 'systemctl is-active qemu-guest-agent &&

    ls -l /dev/virtio-ports/org.qemu.guest_agent.0 2>&1 &&

    systemctl show -p MainPID --value qemu-guest-agent

    '
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: mount the host share
  share_mount: true
  share_family: linux
  requires:
  - share
  timeout: 180
- name: prove the share is readable and writable
  ssh: 'sh -c ''

    echo "--- what is mounted ---"

    /sbin/mount | grep -i "cifs\|smb" || echo "(no cifs/smb line in mount output)"

    echo "--- the mount point ---"

    ls -la ~/shared || echo "(~/shared is not readable)"

    echo "--- the round trip ---"

    printf "written-by-the-guest\n" > ~/shared/from-guest.txt

    got=$(cat ~/shared/from-guest.txt)

    echo "read back: $got"

    test "$got" = "written-by-the-guest"

    echo "round trip ok"

    ''

    '
  timeout: 120
- name: write the launcher
  write: launcher
  family: linux
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: install the launcher
  ssh: 'set -e

    install -m 0755 /tmp/bootstrap-launcher.sh ~/bootstrap-launcher.sh

    mkdir -p ~/.config/systemd/user

    cat > ~/.config/systemd/user/org.vm.bootstrap.service <<''UNIT''

    [Unit]

    Description=Run ~/shared/bootstrap.sh at login


    [Service]

    Type=oneshot

    ExecStart=%h/bootstrap-launcher.sh


    [Install]

    WantedBy=default.target

    UNIT

    systemctl --user daemon-reload

    systemctl --user enable org.vm.bootstrap.service

    echo INSTALLED_FOR_NEXT_LOGIN

    '
  timeout: 300
- name: prove the launcher is installed
  ssh: 'set -e

    ls -l ~/bootstrap-launcher.sh ~/.config/systemd/user/org.vm.bootstrap.service

    grep -q bootstrap-launcher.sh ~/.config/systemd/user/org.vm.bootstrap.service

    systemctl --user is-enabled org.vm.bootstrap.service

    test "$(systemctl --user is-enabled org.vm.bootstrap.service)" = "enabled"

    '
  timeout: 60
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
