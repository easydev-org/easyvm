name: linux-nixos - sshd
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - wake the screen
  key: esc
  settle: 5
- name: greeter - the user tile
  click:
  - 960
  - 488
  settle: 4
- name: greeter - the password box
  click:
  - 936
  - 628
  type: '{{ password }}'
  clear: false
  settle: 4
- name: greeter - submit
  key: ret
  settle: 12
- name: let the session finish starting
  settle: 240
- name: skip the welcome dialog
  click:
  - 858
  - 748
  settle: 5
- name: clear anything left over
  key: esc
  settle: 2
- name: the desktop is up
  loop:
    max: 12
    do:
    - click:
      - 420
      - 300
      settle: 10
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - Dashboard
      - - Activities
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: desktop - give the shell focus
  click:
  - 960
  - 700
  settle: 2
- name: open the overview
  key: meta_l
  settle: 4
- name: search for the terminal
  type: terminal
  settle: 3
- name: wait for the Console result
  loop:
    max: 18
    do:
    - click:
      - 420
      - 300
      settle: 5
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - Console
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: open the terminal
  click:
  - 960
  - 160
  settle: 20
- name: declare openssh in configuration.nix
  run: 'echo {{ password }} | sudo -S sh -c ''sed -i "$ d" /etc/nixos/configuration.nix; printf "  services.openssh.enable = true;\n  services.openssh.settings.PasswordAuthentication = true;\n  networking.firewall.enable = false;\n}\n" >> /etc/nixos/configuration.nix''

    '
  terminal_wait: 0
  type_gap: 0.15
  settle: 6
- name: rebuild the system
  run: echo {{ password }} | sudo -S nixos-rebuild switch 2>&1 | tail -8
  terminal_wait: 0
  type_gap: 0.15
  settle: 300
- name: prove sshd is active
  run: systemctl is-active sshd
  terminal_wait: 0
  type_gap: 0.15
  settle: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: ask the guest to power off
  ssh: printf '%s\n' '{{ password }}' | sudo -S -p '' poweroff
  timeout: 300
- name: wait for the machine to stop
  wait_until: stopped
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'