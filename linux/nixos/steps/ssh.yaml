name: linux-nixos - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: nixos-ssh.mp4
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - wake the screen
  key: esc
  wait_after: 5
- name: greeter - the user tile
  click:
  - 960
  - 488
  wait_after: 4
- name: greeter - the password box
  click:
  - 936
  - 628
  type: '{{ password }}'
  clear: false
  wait_after: 4
- name: greeter - submit
  key: ret
  wait_after: 12
- name: let the session finish starting
  wait: 240
- name: skip the welcome dialog
  click:
  - 858
  - 748
  wait_after: 5
- name: clear anything left over
  key: esc
  wait_after: 2
- name: the desktop is up
  loop:
    max: 12
    do:
    - click:
      - 420
      - 300
      wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Dashboard
      - - Activities
    until:
      fact: done
- name: desktop - give the shell focus
  click:
  - 960
  - 700
  wait_after: 2
- name: open the overview
  key: meta_l
  wait_after: 4
- name: search for the terminal
  type: terminal
  wait_after: 3
- name: wait for the Console result
  loop:
    max: 18
    do:
    - click:
      - 420
      - 300
      wait_after: 5
    ocr:
      name: screen
      region:
      - 600
      - 60
      - 1330
      - 500
      region_at:
      - 1920
      - 1080
      scale: 3
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Console
    until:
      fact: done
- name: open the terminal
  click:
  - 960
  - 160
  wait_after: 20
- name: declare openssh in configuration.nix
  run: 'echo {{ password }} | sudo -S sh -c ''sed -i "$ d" /etc/nixos/configuration.nix; printf "  services.openssh.enable = true;\n  services.openssh.settings.PasswordAuthentication = true;\n  networking.firewall.enable = false;\n}\n" >> /etc/nixos/configuration.nix''

    '
  terminal_wait: 0
  type_gap: 0.15
  wait_after: 6
- name: rebuild the system
  run: echo {{ password }} | sudo -S nixos-rebuild switch 2>&1 | tail -8
  terminal_wait: 0
  type_gap: 0.15
  wait_after: 300
- name: prove sshd is active
  run: systemctl is-active sshd
  terminal_wait: 0
  type_gap: 0.15
  wait_after: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
