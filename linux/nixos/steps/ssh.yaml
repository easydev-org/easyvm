name: linux-nixos - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
steps:
- name: start recording
  record: nixos-ssh.mp4
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - wake the screen
  key: esc
  settle: 5
- name: greeter - the user tile
  at:
  - 960
  - 488
  settle: 4
- name: greeter - the password box
  at:
  - 936
  - 628
  type: '{{ password }}'
  clear: false
  settle: 4
- name: greeter - submit
  key: ret
  settle: 12
- name: let the session finish starting
  wait: 240
- name: skip the welcome dialog
  at:
  - 858
  - 748
  settle: 5
- name: clear anything left over
  key: esc
  settle: 2
- name: the desktop is up
  until_any:
  - - Dashboard
  - - Activities
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 2
  timeout: 120
  poll: 10
  keep_alive: true
- name: desktop - give the shell focus
  at:
  - 960
  - 700
  settle: 2
- name: open the overview
  key: meta_l
  settle: 4
- name: search for the terminal
  type: terminal
  settle: 3
- name: wait for the Console result
  until_any:
  - - Console
  region:
  - 600
  - 60
  - 1330
  - 500
  region_at:
  - 1920
  - 1080
  scale: 3
  timeout: 90
  poll: 5
  keep_alive: true
- name: open the terminal
  at:
  - 960
  - 160
  settle: 20
- name: declare openssh in configuration.nix
  run: 'echo {{ password }} | sudo -S sh -c ''sed -i "$ d" /etc/nixos/configuration.nix; printf "  services.openssh.enable = true;\n  services.openssh.settings.PasswordAuthentication = true;\n  networking.firewall.enable
    = false;\n}\n" >> /etc/nixos/configuration.nix''

    '
  terminal_wait: 0
  type_gap: 0.15
  settle: 6
- name: rebuild the system
  run: echo {{ password }} | sudo -S nixos-rebuild switch 2>&1 | tail -8
  terminal_wait: 0
  type_gap: 0.15
  settle: 300
- name: prove sshd is active
  run: systemctl is-active sshd
  terminal_wait: 0
  type_gap: 0.15
  settle: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop recording
  record: false
