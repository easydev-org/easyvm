name: opensuse-tumbleweed - the YaST2 walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: opensuse-tumbleweed-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: opensuse-leap-16.1
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: open yast2
  double:
  - 267
  - 34
  expect_any:
  - - installation
  - - upgrade
  - - language
  wait_after: 40
- name: open yast2 (once more, if it did not)
  unless_any:
  - - installation
  - - upgrade
  - - language
  double:
  - 267
  - 34
  wait_after: 45
- name: welcome
  at:
  - 1596
  - 859
  wait_after: 30
- name: online repositories - no
  at:
  - 1004
  - 614
  wait_after: 20
- name: role - desktop with kde plasma
  at:
  - 588
  - 333
  wait_after: 6
- name: system role
  at:
  - 1596
  - 859
  wait_after: 30
- name: suggested partitioning
  at:
  - 1596
  - 859
  wait_after: 25
- name: clock and time zone
  at:
  - 1596
  - 859
  wait_after: 22
- name: local user - full name
  at:
  - 1106
  - 418
  type: '{{ user }}'
  wait_after: 2
- name: local user - user name, select all
  at:
  - 1106
  - 483
  wait_after: 2
- name: local user - user name, clear it
  key: ctrl+a
  wait_after: 2
- name: local user - user name, delete the selection
  key: backspace
  wait_after: 2
- name: local user - user name
  type: '{{ user }}'
  wait_after: 2
- name: local user - password
  at:
  - 1106
  - 548
  type: '{{ password }}'
  wait_after: 2
- name: local user - confirm password
  at:
  - 1106
  - 614
  type: '{{ password }}'
  wait_after: 3
- name: local user
  at:
  - 1596
  - 859
  wait_after: 18
- name: accept the weak password
  key: ret
  wait_after: 22
- name: install
  at:
  - 1587
  - 859
  wait_after: 15
- name: the confirm installation dialog's install
  at:
  - 922
  - 707
  wait_after: 25
- name: the install runs, as measured
  wait: 1800
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
