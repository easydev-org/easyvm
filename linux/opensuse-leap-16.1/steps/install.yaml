name: opensuse-leap-16.1 - Agama, the storage editor, and ext4
notes: >
  Its installer is a form-only installer: Agama is a WEB UI the live session opens straight into, with
  no panel at any point. MEASURED, the two frames before the product chooser give `drop` 0.0 and 6.9
  where `IsLinuxDesktop` wants more than 15 - see TestAnInstallerIsWaitedForTheWayItAppears.
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  # THE GOAL'S PASSWORD IS NOT THE ONE THIS MEDIUM ACCEPTS UNCHANGED.
  #
  # MEASURED: Agama refuses `admin` twice - first `The password is shorter than 8 characters`, then,
  # at 8+, `The password fails the dictionary check - it is based on a dictionary word`. Its own
  # password field is what enforces this, and the check runs on the PASSWORD, not on the account:
  #
  #	admin        -> "shorter than 8 characters"
  #	admin1234    -> "fails the dictionary check"
  #	Qz7vLp2w     -> "The password is weak" (a WARNING, and the form is accepted)
  #
  # SO THIS FILE HAS ITS OWN DEFAULT and says why. It is still `{{ password }}`, so a caller that
  # passes a strong one gets it; the default exists because the shared one cannot be typed here.
  password:
    from: args.password
    default: Qz7vLp2w
  desktop_password:
    from: args.password
    default: Qz7vLp2w
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  require:
  - opensuse-leap-16.1.iso
- name: start recording
  record: opensuse-leap-16.1-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: opensuse-leap-16.1.iso
  timeout: 1800

# THIS MEDIUM IS AGAMA, NOT YaST, AND THE WHOLE FILE WAS WRITTEN FOR YaST.
#
# MEASURED: it boots to `Select a mode` - a product chooser - and then to an `Installation` summary
# page whose sections are System / Network / Storage / Language and region / Software /
# Authentication. There is no `yast2` window and no `Installation Settings` screen, so every
# coordinate the YaST file carried named a page that does not exist.
- name: wait for the installer's product chooser to draw
  loop:
    max: 40
    do:
    - wait: 6
    ocr:
      name: chooser
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: chooser
      mode: says_any
      words:
      - - Select
      - - mode
    until:
      fact: up

# THE MODE LIST. `Leap 16.1` AT (66,199), measured; the row then expands to reveal Standard/Immutable.
- name: choose the product
  click:
  - 66
  - 199
  wait_after: 5

# `Standard` IS THE ONE THAT CAN BE ext4: `Immutable` is an atomic image with a fixed layout.
- name: choose the Standard system
  click:
  - 94
  - 324
  wait_after: 3

- name: accept the licence
  click:
  - 47
  - 420
  wait_after: 3

- name: select it
  click:
  - 160
  - 470
  wait_after: 20

- name: wait for the installer's summary to draw
  loop:
    max: 40
    do:
    - wait: 6
    ocr:
      name: summary
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: summary
      mode: says_any
      words:
      - - Installation
      - - Storage
    until:
      fact: up

# STORAGE. This is the only page where the filesystem can be chosen, and it takes three clicks to
# reach: the section, the partition list, then the row's own menu.
# MEASURED: the Storage heading is at (42,387)-(120,387); the row `New partitions will be created for
# "/" and "swap"` has a double-arrow at (455,330) that opens the mount list.
- name: open the storage section
  click:
  - 120
  - 387
  wait_after: 10

- name: open the mount list
  click:
  - 455
  - 330
  wait_after: 6

- name: the root row's menu
  click:
  - 850
  - 420
  wait_after: 5

- name: edit it
  click:
  - 792
  - 458
  wait_after: 8

# THE FILE SYSTEM COMBO IS ON THIS DIALOG, AND ITS DEFAULT IS `Btrfs with snapshots`.
# MEASURED, the list it opens: Default / Btrfs with snapshots / Btrfs / Ext2 / Ext3 / Ext4 / XFS.
- name: open the filesystem list
  click:
  - 87
  - 502
  wait_after: 6

- name: choose ext4
  click:
  - 79
  - 744
  wait_after: 6

- name: accept the partition
  click:
  - 61
  - 632
  wait_after: 8

- name: back to the summary
  click:
  - 72
  - 29
  wait_after: 10

# AUTHENTICATION. Agama will not start without a user, a root password or a key, and the
# `Install` button stays grey until one exists:
#
#	Defining a user, setting the root password or a SSH public key is required
- name: open the authentication section
  click:
  - 758
  - 390
  wait_after: 3

- name: define an administrator user
  click:
  - 73
  - 275
  wait_after: 6

- name: the full name
  click:
  - 207
  - 366
  type: '{{ user }}'
  wait_after: 2

- name: the user name
  click:
  - 207
  - 460
  type: '{{ user }}'
  wait_after: 2

# THE PASSWORD FIELD IS LEFT OF THE EYE BUTTON AND ITS INTERIOR IS x=60..215, so (207, ...) is inside
# it and (400, ...) is not - measured, the wider click typed nothing.
- name: the password
  click:
  - 207
  - 553
  type: '{{ password }}'
  wait_after: 2

- name: the password again
  click:
  - 207
  - 673
  type: '{{ password }}'
  wait_after: 3

# THE FORM IS TALLER THAN THE PAGE, SO `Accept` HAS TO BE SCROLLED TO BEFORE IT CAN BE CLICKED.
#
# MEASURED: with the account filled in, the visible page ends at `Root login method [Disabled]` and
# `Accept` is BELOW the fold. A click at its layout position (92, 1016) lands on whatever is drawn
# there, which is not the button - and the run then sat on Authentication with the form complete and
# `Defining a user ... is required` still at the top, while the steps after it acted on a summary page
# that was never reached.
#
# THE SCROLL IS THE FOCUS: pressing Tab moves focus to the next control and the browser scrolls it
# into view, so the button arrives at a position that can be clicked. MEASURED by hand: ten Tabs put
# `Accept` on screen at (61, 677) in the 1280 view, which is (92, 1016) on this frame.
- name: scroll the form to its buttons, by tabbing focus down it
  key: tab
  wait_after: 1

- name: tab 1 of the scroll
  key: tab
  wait_after: 1

- name: tab 2 of the scroll
  key: tab
  wait_after: 1

- name: tab 3 of the scroll
  key: tab
  wait_after: 1

- name: tab 4 of the scroll
  key: tab
  wait_after: 1

- name: tab 5 of the scroll
  key: tab
  wait_after: 1

- name: tab 6 of the scroll
  key: tab
  wait_after: 1

- name: tab 7 of the scroll
  key: tab
  wait_after: 1

- name: tab 8 of the scroll
  key: tab
  wait_after: 1

- name: tab to Accept, which scrolls it into view
  key: tab
  wait_after: 2

- name: accept the account
  click:
  - 92
  - 1016
  wait_after: 10

- name: the changes are applied
  ocr:
    name: auth_applied
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

- name: changes were applied
  check:
    name: applied
    from: auth_applied
    mode: says_any
    words:
    - - applied
    - - successfully

- name: back to the summary, where install is now enabled
  click:
  - 177
  - 129
  wait_after: 10

- name: start the install
  click:
  - 110
  - 515
  wait_after: 20

- name: confirm, because this medium asks
  click:
  - 756
  - 669
  wait_after: 30

- name: the install is written
  disk_settle: 300
  disk_min_mb: 2000
  timeout: 3600
  poll: 20
  keep_alive: true

- name: the install finishes
  loop:
    max: 120
    do:
    - wait: 15
    ocr:
      name: done
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: finished
      from: done
      mode: says_any
      words:
      - - complete
      - - reboot
    until:
      fact: finished

- name: stop the machine
  shutdown: kill
  timeout: 600
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
