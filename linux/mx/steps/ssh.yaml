name: linux-mx - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: mx-ssh.mp4
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - the password box
  at:
  - 259
  - 568
  settle: 2
  optional: true
- name: greeter - log in
  type: '{{ password }}'
  settle: 3
  optional: true
- name: greeter - submit
  key: ret
  settle: 12
  optional: true
- name: open the terminal
  key: ctrl+alt+t
  settle: 20
- name: install openssh-server
  run: echo {{ password }} | sudo -S sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update -o DPkg::Lock::Timeout=600 && apt-get install -y -o DPkg::Lock::Timeout=600 openssh-server" 2>&1 | tail -6
  terminal_wait: 0
  settle: 90
- name: allow password authentication
  run: echo {{ password }} | sudo -S -p '' sh -c 'mkdir -p /etc/ssh/sshd_config.d; printf "PasswordAuthentication yes\n" > /etc/ssh/sshd_config.d/99-vm.conf; sed -i "s/^#\?\s*PasswordAuthentication.*/PasswordAuthentication yes/" /etc/ssh/sshd_config; grep
    -q "^PasswordAuthentication yes" /etc/ssh/sshd_config || printf "PasswordAuthentication yes\n" >> /etc/ssh/sshd_config' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: enable ssh at boot (SysVinit)
  run: echo {{ password }} | sudo -S update-rc.d ssh enable 2>&1 | tail -3
  terminal_wait: 0
  settle: 8
- name: prove the setting took
  run: echo {{ password }} | sudo -S sh -c 'sshd -T 2>/dev/null | grep -i "^passwordauthentication" || echo PASSWORDAUTH-UNREADABLE' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: start ssh (SysVinit)
  run: echo {{ password }} | sudo -S service ssh start 2>&1 | tail -3
  terminal_wait: 0
  settle: 10
- name: prove ssh is running
  run: echo {{ password }} | sudo -S service ssh status 2>&1 | tail -3
  terminal_wait: 0
  settle: 5
- name: open the firewall for ssh
  run: echo {{ password }} | sudo -S sh -c "ufw allow 22/tcp; ufw status | head -6" 2>&1 | tail -8
  terminal_wait: 0
  settle: 8
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
