name: linux-mx - configure the vm (name, share, guest agent)
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  hostname:
    from: args.hostname
    default: easyvm-vm
  host:
    from: args.host
    default: 172.30.0.1
  out:
    from: args.out
    default: out/vm-configure.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '1800'
ssh_user: vmuser
ssh_port: 2222
steps:
- name: start recording
  record: vm-configure.mp4
- name: take the input disk
  disk: disk.qcow2
- name: boot the disk
  boot: true
  os: linux
  timeout: '{{ boot_timeout }}'
- name: wait for sshd
  require_ssh: true
  timeout: '{{ boot_timeout }}'
- name: announce the machine's name
  ssh: echo "this machine will be named '{{ hostname }}'"
  timeout: 60
- name: set the machine's name
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  printf \"%s\\n\" \"{{ hostname }}\" > /etc/hostname\n  hostname \"{{ hostname }}\"'\n"
  timeout: 120
- name: point the loopback line at that name
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  if grep -q \"^127\\.0\\.1\\.1\" /etc/hosts; then\n    sed -i \"s/^127\\.0\\.1\\.1.*/127.0.1.1\\t{{ hostname }}/\" /etc/hosts\n  else\n\
    \    printf \"127.0.1.1\\t%s\\n\" \"{{ hostname }}\" >> /etc/hosts\n  fi'\n"
  timeout: 120
- name: prove the name
  ssh: 'set -e

    echo "file:   $(cat /etc/hostname)"

    echo "kernel: $(hostname)"

    echo "hosts:  $(grep -c ''{{ hostname }}'' /etc/hosts) line(s)"

    test "$(cat /etc/hostname)" = "{{ hostname }}"

    test "$(hostname)" = "{{ hostname }}"

    grep -q ''{{ hostname }}'' /etc/hosts

    '
  timeout: 60
- name: refresh the package index
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''DEBIAN_FRONTEND=noninteractive apt-get update -o DPkg::Lock::Timeout=600'' 2>&1 | tail -3

    '
  timeout: 600
- name: install the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-guest-agent 2>&1 | tail -5

    '
  timeout: 600
- name: enable the guest agent
  ssh: '# `update-rc.d` AND `service`, NOT `systemctl`: this is the same SysVinit fact as the name

    # above. `systemctl enable` would write a symlink and refuse `--now`, leaving nothing

    # running - which is exactly what mx/steps/ssh.yaml measured for sshd.

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''update-rc.d qemu-guest-agent defaults 2>&1; service qemu-guest-agent start 2>&1'' | tail -3

    '
  timeout: 120
- name: prove the guest agent is running
  ssh: 'ls -l /dev/virtio-ports/org.qemu.guest_agent.0 2>&1 &&

    pgrep -af ''qemu-ga''

    '
  timeout: 120
- name: install the cifs client
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' DEBIAN_FRONTEND=noninteractive apt-get install -y cifs-utils 2>&1 | tail -5

    '
  timeout: 600
- name: serve the host share
  share_serve: true
  timeout: 60
- name: mount the host share
  share_mount: true
  share_family: linux
  requires:
  - share
  timeout: 180
- name: prove the share is readable and writable
  ssh: 'sh -c ''

    echo "--- what is mounted ---"

    /sbin/mount | grep -i "cifs\|smb" || echo "(no cifs/smb line in mount output)"

    echo "--- the mount point ---"

    ls -la ~/shared || echo "(~/shared is not readable)"

    echo "--- the round trip ---"

    printf "written-by-the-guest\n" > ~/shared/from-guest.txt

    got=$(cat ~/shared/from-guest.txt)

    echo "read back: $got"

    test "$got" = "written-by-the-guest"

    echo "round trip ok"

    ''

    '
  timeout: 120
- name: write the launcher
  write: launcher
  family: linux
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: install the launcher
  ssh: 'set -e

    install -m 0755 /tmp/bootstrap-launcher.sh ~/bootstrap-launcher.sh

    mkdir -p ~/.config/autostart

    cat > ~/.config/autostart/org.vm.bootstrap.desktop <<''DESKTOP''

    [Desktop Entry]

    Type=Application

    Name=vm bootstrap

    Comment=Run ~/shared/bootstrap.sh at login

    Exec=%h/bootstrap-launcher.sh

    Terminal=false

    NoDisplay=true

    X-GNOME-Autostart-enabled=true

    DESKTOP

    echo INSTALLED_FOR_NEXT_LOGIN

    '
  timeout: 300
- name: prove the launcher is installed
  ssh: 'set -e

    ls -l ~/bootstrap-launcher.sh ~/.config/autostart/org.vm.bootstrap.desktop

    grep -q bootstrap-launcher.sh ~/.config/autostart/org.vm.bootstrap.desktop

    grep -q ''^Exec='' ~/.config/autostart/org.vm.bootstrap.desktop

    echo enabled

    '
  timeout: 60
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
