name: mx - the minstall walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - mx.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: mx.iso
  timeout: 1800

# THE MEDIUM STOPS AT ITS OWN BOOT MENU, EXACTLY AS MINT'S DOES, AND IT DOES NOT COUNT DOWN.
#
# MEASURED: after `boot:` the frame is MX's text menu -
#
#	Welcome to MX-25.3_Xfce (Infinity)!
#	===> Language - Keyboard - Timezone
#	  Language (lang=en_US)
#	  Keyboard (kbd=us)
#	  Timezone (tz=America/New_York)
#	  Reset
#	<=== Back to main menu
#	Use up and down. Hit >>ENTER<< to select/deselect.
#
# - `Language (lang=en_US)` is ALREADY highlighted, so one Return takes the default and boots. This
# walk waited out the whole desktop budget against that menu: MEASURED, thirteen minutes in
# `wait for the live desktop` with the disk at 0 MiB.
#
# AND THE RETURN IS NOT ENOUGH BY ITSELF: THIS FIRST MENU IS THE LANGUAGE SUBMENU, WHICH OPENS
# INSIDE THE BOOT MENU AND CANNOT BOOT ANYTHING.
#
# MEASURED, step by step on the live medium:
#
#	after boot:                `===> Language - Keyboard - Timezone` with `Language (lang=en_US)`
#	                           highlighted, footnoted `Hit >>ENTER<< to SELECT/DESELECT`
#	one `ret`:                 the highlight disappears - it toggled a checkbox, nothing booted
#	one `esc`:                 the REAL boot menu: `MX-25.3 Xfce x64 (sysvinit)` first,
#	                           then the same build as `(systemd)`, then `Check integrity`,
#	                           the language submenu, Advanced Options, Memory Test, Rescue
#	three `up` then `ret`:     the live desktop with the installer open
#
# so the sequence is esc (leave the submenu), up x3 (from the submenu entry back to `sysvinit`),
# then ret. MEASURED: with only the `ret`, fourteen minutes went by in `wait for the live desktop`
# with the disk at 0 MiB and the menu still up.
- name: the medium's boot menu is up
  ocr:
    name: mxmenu
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 5

- name: that menu is the language submenu this medium opens on
  check:
    name: is_mx_menu
    from: mxmenu
    mode: says_any
    words:
    - - Language
    - - Keyboard
    - - Timezone

- name: leave the language submenu for the real boot menu
  key: esc
  wait_after: 4

- name: up to the first entry, which is the live session
  key: up
  wait_after: 1

- name: up again
  key: up
  wait_after: 1

- name: and once more
  key: up
  wait_after: 1

- name: boot it
  key: ret
  wait_after: 25

- name: wait for the live desktop
  desktop: linux/xfce
  timeout: 5400
- name: desktop - installer
  settle: 28
  do:
  - click:
    - 81
    - 259
    settle: 3
  - click:
    - 81
    - 259
    settle: 3
- name: wait for the terms page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - terms
      - of
      - use
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: terms of use
  click:
  - 1482
  - 889
  settle: 14
- name: wait for the installation type page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - select
      - type
      - of
      - installation
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: installation type
  click:
  - 1482
  - 889
  settle: 16
- name: wait for the confirmation page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - final
      - review
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: installation confirmation - start
  click:
  - 1478
  - 889
  settle: 25
- name: dismiss the invalid settings modal if it is up
  click:
  - 1069
  - 583
  settle: 4
- name: wait for the swap file page
  loop:
    max: 40
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - create
      - a
      - swap
      - file
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: swap file
  click:
  - 1482
  - 889
  settle: 18
- name: wait for the computer identity page
  loop:
    max: 40
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - computer
      - identity
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: computer identity
  click:
  - 1482
  - 889
  settle: 18
- name: wait for the localization page
  loop:
    max: 40
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - localization
      - defaults
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: localization defaults
  click:
  - 1482
  - 889
  settle: 18
- name: wait for the account page
  loop:
    max: 30
    do:
    - settle: 6
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - default
      - user
      - login
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: account - login name
  click:
  - 1210
  - 342
  type: '{{ user }}'
  settle: 2
- name: account - password
  click:
  - 1210
  - 377
  type: '{{ password }}'
  settle: 2
- name: account - confirm password
  click:
  - 1210
  - 412
  type: '{{ password }}'
  settle: 3
- name: autologin
  click:
  - 700
  - 561
  settle: 4
- name: default user login
  click:
  - 1482
  - 889
  settle: 25
- name: the installer finishes
  loop:
    max: 90
    do:
    - click:
      - 420
      - 300
      settle: 20
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      words:
      - - congratulations
      - - completed
        - the
        - installation
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'