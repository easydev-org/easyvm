name: mx - the minstall walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: mx-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: mx
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: desktop - installer
  at:
  - 81
  - 259
  repeat:
  - 2
  - 3
  wait_after: 28
- name: wait for the terms page
  until:
  - terms
  - of
  - use
  region:
  - 690
  - 225
  - 1560
  - 265
  region_at:
  - 1920
  - 1080
  scale: 2
  timeout: 180
  poll: 6
- name: terms of use
  at:
  - 1482
  - 889
  wait_after: 14
- name: wait for the installation type page
  until:
  - select
  - type
  - of
  - installation
  region:
  - 690
  - 225
  - 1560
  - 265
  region_at:
  - 1920
  - 1080
  scale: 2
  timeout: 180
  poll: 6
- name: installation type
  at:
  - 1482
  - 889
  wait_after: 16
- name: wait for the confirmation page
  until:
  - final
  - review
  region:
  - 332
  - 248
  - 700
  - 285
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 180
  poll: 6
- name: installation confirmation - start
  at:
  - 1478
  - 889
  wait_after: 25
- name: dismiss the invalid settings modal if it is up
  at:
  - 1069
  - 583
  wait_after: 4
- name: wait for the swap file page
  until:
  - create
  - a
  - swap
  - file
  region:
  - 332
  - 248
  - 700
  - 285
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 240
  poll: 6
- name: swap file
  at:
  - 1482
  - 889
  wait_after: 18
- name: wait for the computer identity page
  until:
  - computer
  - identity
  region:
  - 332
  - 248
  - 700
  - 285
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 240
  poll: 6
- name: computer identity
  at:
  - 1482
  - 889
  wait_after: 18
- name: wait for the localization page
  until:
  - localization
  - defaults
  region:
  - 332
  - 248
  - 700
  - 285
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 240
  poll: 6
- name: localization defaults
  at:
  - 1482
  - 889
  wait_after: 18
- name: wait for the account page
  until:
  - default
  - user
  - login
  region:
  - 332
  - 248
  - 700
  - 285
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 180
  poll: 6
- name: account - login name
  at:
  - 1210
  - 342
  type: '{{ user }}'
  wait_after: 2
- name: account - password
  at:
  - 1210
  - 377
  type: '{{ password }}'
  wait_after: 2
- name: account - confirm password
  at:
  - 1210
  - 412
  type: '{{ password }}'
  wait_after: 3
- name: autologin
  at:
  - 700
  - 561
  wait_after: 4
- name: default user login
  at:
  - 1482
  - 889
  wait_after: 25
- name: the installer finishes
  until_any:
  - - congratulations
  - - completed
    - the
    - installation
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 1800
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
