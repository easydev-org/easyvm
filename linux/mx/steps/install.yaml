name: mx - the minstall walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: mx-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: mx
  asset: linux_iso
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: desktop - installer
  wait_after: 28
  do:
  - click:
    - 81
    - 259
    wait_after: 3
  - click:
    - 81
    - 259
    wait_after: 3
- name: wait for the terms page
  loop:
    max: 30
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 690
      - 225
      - 1560
      - 265
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - terms
      - of
      - use
    until:
      fact: done
- name: terms of use
  click:
  - 1482
  - 889
  wait_after: 14
- name: wait for the installation type page
  loop:
    max: 30
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 690
      - 225
      - 1560
      - 265
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - select
      - type
      - of
      - installation
    until:
      fact: done
- name: installation type
  click:
  - 1482
  - 889
  wait_after: 16
- name: wait for the confirmation page
  loop:
    max: 30
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 332
      - 248
      - 700
      - 285
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - final
      - review
    until:
      fact: done
- name: installation confirmation - start
  click:
  - 1478
  - 889
  wait_after: 25
- name: dismiss the invalid settings modal if it is up
  click:
  - 1069
  - 583
  wait_after: 4
- name: wait for the swap file page
  loop:
    max: 40
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 332
      - 248
      - 700
      - 285
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - create
      - a
      - swap
      - file
    until:
      fact: done
- name: swap file
  click:
  - 1482
  - 889
  wait_after: 18
- name: wait for the computer identity page
  loop:
    max: 40
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 332
      - 248
      - 700
      - 285
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - computer
      - identity
    until:
      fact: done
- name: computer identity
  click:
  - 1482
  - 889
  wait_after: 18
- name: wait for the localization page
  loop:
    max: 40
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 332
      - 248
      - 700
      - 285
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - localization
      - defaults
    until:
      fact: done
- name: localization defaults
  click:
  - 1482
  - 889
  wait_after: 18
- name: wait for the account page
  loop:
    max: 30
    do:
    - wait: 6
    ocr:
      name: screen
      region:
      - 332
      - 248
      - 700
      - 285
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - default
      - user
      - login
    until:
      fact: done
- name: account - login name
  click:
  - 1210
  - 342
  type: '{{ user }}'
  wait_after: 2
- name: account - password
  click:
  - 1210
  - 377
  type: '{{ password }}'
  wait_after: 2
- name: account - confirm password
  click:
  - 1210
  - 412
  type: '{{ password }}'
  wait_after: 3
- name: autologin
  click:
  - 700
  - 561
  wait_after: 4
- name: default user login
  click:
  - 1482
  - 889
  wait_after: 25
- name: the installer finishes
  loop:
    max: 90
    do:
    - click:
      - 420
      - 300
      wait_after: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - congratulations
      - - completed
        - the
        - installation
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
