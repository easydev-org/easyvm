name: manjaro - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: manjaro-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 64
- name: fetch the installer image
  fetch: linux_iso
  release: manjaro
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: let the desktop settle
  wait: 15
  keep_alive: true
- name: open the installer
  double:
  - 960
  - 760
  settle: 35
  expect_any:
  - - welcome
  - - location
- name: open the installer (once more, if it did not)
  unless:
  - welcome
  double:
  - 960
  - 760
  settle: 40
- name: welcome
  at:
  - 1325
  - 801
  settle: 18
- name: location
  at:
  - 1325
  - 801
  settle: 18
- name: keyboard
  at:
  - 1325
  - 801
  settle: 18
- name: partitions - erase the disk
  at:
  - 653
  - 340
  settle: 6
- name: partitions
  at:
  - 1325
  - 801
  settle: 20
- name: users - full name
  at:
  - 741
  - 320
  type: '{{ user }}'
  settle: 2
- name: users - login name
  at:
  - 741
  - 385
  type: '{{ user }}'
  settle: 2
- name: users - password
  at:
  - 724
  - 523
  type: '{{ password }}'
  settle: 2
- name: users - confirm password
  at:
  - 944
  - 523
  type: '{{ password }}'
  settle: 2
- name: users - root password
  at:
  - 741
  - 650
  type: '{{ password }}'
  settle: 2
- name: users - confirm root password
  at:
  - 944
  - 650
  type: '{{ password }}'
  settle: 3
- name: users
  at:
  - 1325
  - 801
  settle: 20
- name: office suite - no office suite
  at:
  - 700
  - 288
  settle: 6
- name: office suite
  at:
  - 1334
  - 794
  settle: 20
- name: summary - install
  at:
  - 1318
  - 799
  settle: 18
- name: the install confirmation's install now
  at:
  - 1055
  - 537
  settle: 30
- name: the installer finishes
  until_any:
  - - all
    - done
  - - you
    - may
    - now
  - - has
    - been
    - installed
  - - todo
    - listo
  - - ya
    - puede
  - - reiniciar
  - - instalación
    - completada
  - - instalacion
    - completada
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
