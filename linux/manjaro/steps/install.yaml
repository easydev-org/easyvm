name: manjaro - the Calamares walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  needs:
  - manjaro.iso
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: manjaro.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/kde
  timeout: 5400
- name: let the desktop settle
  settle: 15
- name: open the installer
  double:
  - 960
  - 760
  settle: 35
- name: open the installer - what is on screen
  see: {name: open_the_installer}
- name: open the installer - the screen says so
  check:
    name: asserted
    from: open_the_installer
    mode: text
    words:
    - [welcome]
    - [location]
    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
- name: open the installer (once more, if it did not)
  when_not:
  - welcome
  double:
  - 960
  - 760
  settle: 40
- name: welcome
  click:
  - 1325
  - 801
  settle: 18
- name: location
  click:
  - 1325
  - 801
  settle: 18
- name: keyboard
  click:
  - 1325
  - 801
  settle: 18
# `Erase disk` IS PRESELECTED ON THIS MEDIUM - unlike CachyOS and EndeavourOS, where both radio
# buttons start empty. Measured: the page opens with `Erase disk` already chosen and the panel under
# it showing `300.00 MiB FAT32  127.71 GiB btrfs`.
- name: partitions - erase the disk
  click:
  - 653
  - 340
  settle: 6

# AND THE FILESYSTEM COMBO DEFAULTS TO btrfs, WHICH THIS WALK DOES NOT WANT.
#
# MEASURED, with `Erase disk` selected:
#
#	[No swap ▾]  [btrfs ▾]
#	300.00 MiB FAT32    127.71 GiB Btrfs
#
# so accepting the default puts a COW filesystem on a COW disk image. The combo is at (955, 396) and
# its list is btrfs / ext4 / f2fs / xfs, with ext4 the second entry at (933, 459).
#
# THE THREE MEDIA DISAGREE AND EACH FILE SAYS WHICH: kubuntu and endeavouros default to ext4, cachyos
# and manjaro to btrfs.
- name: open the filesystem list
  click:
  - 955
  - 396
  settle: 5

- name: choose ext4
  click:
  - 933
  - 459
  settle: 6

- name: the partitions page after choosing ext4
  see: {name: fs}

- name: the root partition is ext4
  check:
    name: ext4
    from: fs
    mode: text
    words:
    - ext4

    rect: [0, 0, 1920, 1080]
    rect_at: [1920, 1080]
- name: partitions
  click:
  - 1325
  - 801
  settle: 20
- name: users - full name
  click:
  - 741
  - 320
  type: '{{ user }}'
  settle: 2
- name: users - login name
  click:
  - 741
  - 385
  type: '{{ user }}'
  settle: 2
- name: users - password
  click:
  - 724
  - 523
  type: '{{ password }}'
  settle: 2
- name: users - confirm password
  click:
  - 944
  - 523
  type: '{{ password }}'
  settle: 2
- name: users - root password
  click:
  - 741
  - 650
  type: '{{ password }}'
  settle: 2
- name: users - confirm root password
  click:
  - 944
  - 650
  type: '{{ password }}'
  settle: 3
- name: users
  click:
  - 1325
  - 801
  settle: 20
- name: office suite - no office suite
  click:
  - 700
  - 288
  settle: 6
- name: office suite
  click:
  - 1334
  - 794
  settle: 20
- name: summary - install
  click:
  - 1318
  - 799
  settle: 18
- name: the install confirmation's install now
  click:
  - 1055
  - 537
  settle: 30
- name: the installer finishes
  loop:
    max: 180
    do:
    - click:
      - 420
      - 300
      settle: 20
    see: {name: screen}
    check:
      name: done
      from: screen
      mode: text
      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
      words:
      - - all
        - done
      - - you
        - may
        - now
      - - has
        - been
        - installed
      - - todo
        - listo
      - - ya
        - puede
      - - reiniciar
      - - instalación
        - completada
      - - instalacion
        - completada
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'