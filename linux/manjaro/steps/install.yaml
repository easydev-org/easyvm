name: manjaro - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: manjaro-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: manjaro
  asset: linux_iso
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: let the desktop settle
  wait: 15
  keep_alive: true
- name: open the installer
  double:
  - 960
  - 760
  expect_any:
  - - welcome
  - - location
  wait_after: 35
- name: open the installer (once more, if it did not)
  unless:
  - welcome
  double:
  - 960
  - 760
  wait_after: 40
- name: welcome
  click:
  - 1325
  - 801
  wait_after: 18
- name: location
  click:
  - 1325
  - 801
  wait_after: 18
- name: keyboard
  click:
  - 1325
  - 801
  wait_after: 18
- name: partitions - erase the disk
  click:
  - 653
  - 340
  wait_after: 6
- name: partitions
  click:
  - 1325
  - 801
  wait_after: 20
- name: users - full name
  click:
  - 741
  - 320
  type: '{{ user }}'
  wait_after: 2
- name: users - login name
  click:
  - 741
  - 385
  type: '{{ user }}'
  wait_after: 2
- name: users - password
  click:
  - 724
  - 523
  type: '{{ password }}'
  wait_after: 2
- name: users - confirm password
  click:
  - 944
  - 523
  type: '{{ password }}'
  wait_after: 2
- name: users - root password
  click:
  - 741
  - 650
  type: '{{ password }}'
  wait_after: 2
- name: users - confirm root password
  click:
  - 944
  - 650
  type: '{{ password }}'
  wait_after: 3
- name: users
  click:
  - 1325
  - 801
  wait_after: 20
- name: office suite - no office suite
  click:
  - 700
  - 288
  wait_after: 6
- name: office suite
  click:
  - 1334
  - 794
  wait_after: 20
- name: summary - install
  click:
  - 1318
  - 799
  wait_after: 18
- name: the install confirmation's install now
  click:
  - 1055
  - 537
  wait_after: 30
- name: the installer finishes
  loop:
    max: 180
    do:
    - click:
      - 420
      - 300
      wait_after: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - all
        - done
      - - you
        - may
        - now
      - - has
        - been
        - installed
      - - todo
        - listo
      - - ya
        - puede
      - - reiniciar
      - - instalación
        - completada
      - - instalacion
        - completada
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
