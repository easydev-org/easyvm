name: popos - the pop installer walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: popos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: popos
  asset: linux_iso
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: open the installer from the dock
  at_button:
  - 1210
  - 1340
  - 1330
  - 1450
  at_fallback:
  - 1265
  - 1390
  wait_after: 20
- name: the installer window is up
  loop:
    max: 100
    do:
    - at:
      - 420
      - 300
      wait_after: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - select
        - a
        - language
      - - clean
        - install
      - - erase
        - and
        - install
      - - full
        - name
    until:
      fact: done
- name: select a language
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: language variants
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: keyboard layout
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: keyboard variants
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: clean install
  at:
  - 1180
  - 456
  wait_after: 8
- name: install
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 21
- name: select a drive
  at:
  - 1193
  - 498
  wait_after: 8
- name: erase and install
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 44
- name: wait for the account pane
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - Full
      - Name
      - User
    until:
      fact: done
- name: type the display name
  at:
  - 1188
  - 494
  type: VM User
  type_gap: 0.09
  wait_after: 2
- name: leave the field so it validates
  key: tab
  wait_after: 2
- name: create user account
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 22
- name: wait for the password pane
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Choose
        - Account
        - Password
      - - Account
        - Password
    until:
      fact: done
- name: dismiss anything a stray click opened
  key: esc
  wait_after: 2
- name: type the password
  at:
  - 1350
  - 447
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: confirm the password
  at:
  - 1350
  - 543
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: account password next
  at_button:
  - 1240
  - 755
  - 1430
  - 845
  wait_after: 25
- name: drive encryption - don't encrypt
  at:
  - 1081
  - 808
  wait_after: 35
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
