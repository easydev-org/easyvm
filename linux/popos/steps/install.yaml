name: popos - the pop installer walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - popos.iso
- name: start recording
  record: popos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: popos.iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux/gnome
  timeout: 5400
  poll: 5
  keep_alive: true
# THE DOCK ICON IS AT y=1050, NOT y=1340 - THOSE COORDINATES WERE FROM A 2560x1440 FRAME.
#
# MEASURED: this file declares `resolution: [1920, 1080]` and the previous values made the daemon
# refuse the step outright:
#
#	open the installer from the dock: pointer to (1265, 1390): outside a 1920x1080 frame
#
# 1390 IS 310 PIXELS BELOW THE BOTTOM OF A 1080 FRAME, so the numbers were taken on a taller screen
# and never rescaled. The dock was located by its own pixels on the 1920 frame: crop 700..1600 x
# 1020..1080 scaled 2x puts the installer's ring icon at (700+1022/2, 1020+60/2) = (1211, 1050).
#
# THE x RANGE WAS ALREADY RIGHT, which is what makes this a height error rather than a typo: the
# icon sits at x~1211 on both frames because the dock is centred and narrower than the screen.
- name: open the installer from the dock
  # THE ICON'S OWN CENTRE, (1211, 1050), MEASURED. The dock is centred and the installer's ring icon
  # sits at x~1211 on every frame; this file already carried that point as an `at_fallback`, and the
  # search that preceded it never found a fill inside [1190,1030 1235,1070] on CI - the log says
  # `no fill in [1190,1030 1235,1070]; using the measured fallback (1211,1050)` - so the fallback was
  # the only thing pressing anything. It is the press now.
  click:
  - 1211
  - 1050
  wait_after: 20
- name: the installer window is up
  loop:
    max: 100
    do:
    - click:
      - 420
      - 300
      wait_after: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      # ONE WORD PER SET, BECAUSE A SET IS AN AND AND OCR DROPS SHORT WORDS.
      #
      # MEASURED on run 44253267558: the installer WAS open from t=100s - the recording's frame at
      # that second reads `Select a Language` with the whole language list - and this loop still ran
      # 100 times and then failed, because the set `[select, a, language]` requires all three as whole
      # tokens and the runner's OCR never produced a lone `a`. The daemon's own readings say it:

      #	screen: 196 word(s): Workspaces Applications M11 18 7:28 AM uo om OO i . op ...
      #	the installer window is up [check]: done = false (none of "select a language" ...)

      # - 196 words, and not the three that were asked for. `says` compares whole tokens, so a set
      # containing a one-letter word is a set that only matches when the OCR happens to keep it.
      #
      # THE TITLE IS THE HONEST TEST: every page of this wizard carries `Install Pop!_OS 24.04 LTS`,
      # which is present from the moment the window opens and gone when it closes. The other entries
      # are the pages after it, one word each, so a retry that overshoots still passes.
      words:
      - - Install
      - - Language
      - - Clean
      - - Erase
      - - Account
    until:
      fact: done
# THE WIZARD, WALKED BY HAND ON THIS WORKSTATION, PAGE BY PAGE.
#
# EVERY COORDINATE AND COLOUR BELOW WAS TAKEN OFF A FRAME OF THE PAGE IT PRESSES, and the two things
# that made the previous version fail are both here:
#
#	A BUTTON IS DARK (rgb(50,50,50)) UNTIL IT IS ENABLED. `at_color` on the accent only ever finds a
#	button that is already pressable, so the STEP BEFORE each press must select whatever enables it.
#
#	`Erase and Install` IS RED (rgb(234,144,144)), NOT GREEN. The wizard's destructive action has its
#	own colour, and a search for the accent never sees it.
#
#	THE KEYBOARD PAGE CAN LAND ON `Arabic (Iraq)` AND THEN ALL TYPED TEXT BECOMES ARABIC - measured,
#	`VM User` came out as `سنتق`. So the keyboard's `Default` entry is chosen explicitly.
#
# THE FOOTER IS (1367, 811) ON EVERY PAGE OF THIS WIZARD, measured on four of them.
# THE LANGUAGE CHOOSER IS THREE SELECTS DEEP, NOT ONE, AND THAT IS WHAT THE LAST FOUR RUNS HIT.
#
# MEASURED ON THE CI RECORDING of run 44250623032 (375 seconds, every frame the same):
#
#	t=130s and t=190s are the SAME PAGE - header `Languages | English`, the list reading
#	`United States / Antigua and Barbuda / Australia / Botswana / Canada / ...`
#
# - the COUNTRY list, with `Select` still at the bottom right. The run had pressed `Select` ONCE
# (the step below), which takes the top-level language list (`Chinese Spanish French ...`) to the
# country list, and then sat there for six minutes waiting for a keyboard page that was two presses
# further away.
#
# MEASURED BY HAND FROM THE SAME INSTALLER, page by page:
#
#	press 1   `Chinese Spanish French Portuguese ...`   -> `United States / Antigua and Barbuda / ...`
#	press 2   the country list                          -> `English (US) / English (UK) / English (Australia) ...`
#	press 3   the variant list                          -> `Keyboard Layout` + `Input Language`
#
# SO THE PRESS AND THE READING ARE ONE LOOP: press the accent, read the pane, press again while the
# keyboard page is not there. `Select` IS THE SAME BUTTON ON ALL THREE PAGES - it is the wizard's
# accent, rgb(144,207,176) - so one `at_color` presses all of them, and the loop stops on the page
# rather than on a count of presses.
#
# THE READING IS IMMEDIATELY AFTER THE PRESS, so a press that lands on the keyboard page is the one
# that ends the loop and `Select` is never pressed again on the page that follows it. Each attempt
# waits six seconds - measured: these page changes are under a second.
- name: select the language, all the way to the keyboard page
  loop:
    max: 8
    do:
    - click:
      - 1367
      - 810
      wait_after: 6
    ocr:
      name: kb
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: kb
      mode: says_any
      # `Layout` IS THE KEYBOARD PAGE'S OWN WORD (its header reads `Keyboard Layout` and the column
      # reads `Input Language`); none of the three language pages above it carries it.
      words:
      - - Layout
    until:
      fact: there

- name: the keyboard page is up
  loop:
    max: 20
    do:
    - wait: 3
    ocr:
      name: kb
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: kb
      mode: says_any
      # `Layout` AND `Type to test` ARE THIS PAGE'S OWN; the language page above it has neither.
      words:
      - - Layout
      - - Type
    until:
      fact: there

# THE KEYBOARD'S OWN `Default` ENTRY, which is what keeps the layout US. MEASURED: the list's first
# entry reads `A user-defined custom Layout`, then alphabetical names, and `Default` sits at the top of
# the INPUT-LANGUAGE list behind the first entry. Choosing `Default` is what the hand run did before
# `VM User` typed correctly.
# THE KEYBOARD LIST SCROLLS, AND (1192, 285) IS NOT `Default` ON THE RUNNER - IT IS `Dari...`.
#
# MEASURED off run 44264518478's recording, its keyboard page at t=160s: the list is SCROLLED PAST
# the top, its visible entries read
#
#	Danish... / Dari... / Dhivehi / Dutch... / Dzongkha / English (Australia) / ...
#	English (UK)... / English (US)...        <- the last one, highlighted
#
# - and `Dari...` sits at y=286, which is exactly where this step pressed. DARI IS WRITTEN IN ARABIC
# LETTERS, so the layout became an Arabic one: the account page then received `VM User` as `سنتق`,
# which is the same corruption this file's own header describes from an earlier run. `English (US)...`
# was highlighted the whole time - the highlight shows what the list is scrolled TO, not what the
# keyboard is set to.
#
# SO THE ENTRY IS PICKED BY NAME, AT ITS OWN ROW: `English (US)...` is the LAST row of the list, at
# y=696 on the 1920 frame (x 966..1413, the full width of the list). A press anywhere on that row
# selects it, and the row is already highlighted, so the press cannot miss by highlighting something
# else first.
- name: the keyboard layout, which is US
  click:
  - 1190
  - 696
  wait_after: 3

# THE LAYOUT IS PROVEN BEFORE THE WIZARD LEAVES THE PAGE, BECAUSE ARABIC LETTERS FAIL SILENTLY.
#
# MEASURED: the corruption showed up four pages later, as `سنتق` in the account page's Full Name box -
# by which time the run had accepted a whole language and a whole keyboard and could not go back. The
# keyboard page carries its own test field, `Type to test your layout`, so the check belongs here.
#
# THE FIELD IS AT (1190, 757) on the 1920 frame - x 966..1353, y 741..772 - and the loop types `abc`
# into it and reads it back. LATIN LETTERS COME BACK AS LATIN LETTERS; an Arabic layout gives `ابث`.
- name: the layout types latin letters
  loop:
    max: 4
    do:
    - click:
      - 1190
      - 757
      clear: true
      type: abc
      type_gap: 0.12
      wait_after: 1
    ocr:
      name: layout_test
      region: [968, 743, 1351, 770]
      region_at: [1920, 1080]
      scale: 6
      wait: 1
    check:
      name: latin
      from: layout_test
      mode: matches
      # THE TEST IS "DID LATIN LETTERS COME BACK", NOT "DID THE EXACT WORD COME BACK" - OCR DROPS A
      # LETTER OF A THREE-LETTER WORD AND THAT IS NOT A FAILURE.
      #
      # MEASURED on run 44266698996: the field was typed `abc` and read back `abd` - LATIN, from a US
      # layout, with tesseract reading the closed `c` as a `d`. The first version of this gate asked
      # for `abc` exactly and failed four times on a layout that was correct all along.
      #
      # AN ARABIC LAYOUT GIVES ARABIC LETTERS - `ابث` - which this pattern cannot match at all, so the
      # distinction the gate exists for is preserved: three latin letters, in any spelling OCR picks.
      pattern: '^[a-z]{2,5}$'
    until:
      fact: latin

- name: take the keyboard layout
  click:
  - 1367
  - 810
  wait_after: 6

- name: the install page is up
  loop:
    max: 20
    do:
    - wait: 3
    ocr:
      name: inst
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: inst
      mode: says_any
      words:
      - - Clean
      - - Custom
    until:
      fact: there

# `Clean Install` IS A RADIO, AND NOTHING IS SELECTED WHEN THE PAGE OPENS - so `Next` is dark until it
# is pressed. MEASURED: the radio's own row spans y 415..455, x 990..1300; its centre is (1000, 433).
- name: clean install
  click:
  - 1000
  - 433
  wait_after: 3

- name: install
  click:
  - 1367
  - 810
  wait_after: 6

- name: the drive page is up
  loop:
    max: 20
    do:
    - wait: 3
    ocr:
      name: drv
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: there
      from: drv
      mode: says_any
      words:
      - - drive
      - - Virtio
    until:
      fact: there

# THE DISK MUST BE SELECTED before `Erase and Install` is drawn in its own colour. MEASURED: the row
# reads `Virtio Block Device /dev/vda 128.0 GB` and its centre is (1185, 497).
- name: select a drive
  click:
  - 1185
  - 497
  wait_after: 4

# `Erase and Install` IS RED - rgb(234,144,144), measured over its own box, 3436 pixels. IT IS THE
# WIZARD'S DESTRUCTIVE ACTION AND IT HAS ITS OWN COLOUR, so the accent search never sees it.
- name: erase and install
  click:
  - 1367
  - 810
  wait_after: 10

- name: wait for the account pane
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - Account
      - - User
    until:
      fact: done
# THE ACCOUNT PAGE'S FIELDS ARE 87 ROWS LOWER ON THE RUNNER THAN THE VALUES IN THIS FILE.
#
# MEASURED off run 44261873378's own recording (its account page, second by second):
#
#	Full Name box   x 966..1413,  y 516..543   -> centre (1190, 530)
#	User Name box   x 966..1413,  y 588..615   -> centre (1190, 602)
#	Next            x 1324..1410, y 804..828   -> centre (1367, 816)
#
# - while this file pressed (1195, 443) for the name and (1195, 445) for the password. 443 is 87 rows
# ABOVE the box, so the name was never typed, `Next` stayed disabled, and the press that followed
# went through it to the PAGE BEHIND.
#
# AND WHAT WAS BEHIND IT WAS THE AVATAR, WHICH OPENS A FILE CHOOSER. The run's last frame is a
# `Choose Icon` dialog over the wizard - `Recent / Home / Desktop / Other Locations`, `No Results
# Found` - because (1366, 811) is the avatar button as well as the disabled `Next`. Every retry opened
# it again, and the password pane it waited for was never reachable.
#
# SO THE NAME IS PRESSED AT ITS OWN CENTRE AND READ BACK, and the tab that was supposed to "let it
# validate" is gone: `Tab` moved focus to the avatar, and the press after it activated that instead.
# The wizard derives the user name from the full name, so nothing else needs typing.
- name: type the display name
  loop:
    max: 4
    do:
    - click:
      - 1190
      - 530
      clear: true
      type: VM User
      type_gap: 0.09
      wait_after: 2
    ocr:
      name: name_box
      # THE BOX'S OWN INTERIOR, ENLARGED, so the reading is the text inside it and not the label.
      region: [968, 518, 1411, 541]
      region_at: [1920, 1080]
      scale: 6
      wait: 1
    check:
      name: took
      from: name_box
      mode: says_any
      # `VM` IS THE FIRST TOKEN OF THE NAME TYPE: `VM User`. The empty box carries no text at all.
      words:
      - - VM
      - - User
    until:
      fact: took

# THE PRESS IS RETRIED UNTIL THE PASSWORD PANE APPEARS, AND THE VERDICT IS THAT PANE'S OWN LABELS.
#
# MEASURED: `Confirm` and `Password` are drawn on the password pane and nowhere on the account pane
# before it. A press that misses costs one attempt; the ESC below closes a file chooser if a stray
# press opened the avatar.
- name: create user account, and wait for the password pane
  loop:
    max: 6
    do:
    - click:
      - 1367
      - 816
      wait_after: 8
    ocr:
      name: pw_pane
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 3
      wait: 2
    check:
      name: there
      from: pw_pane
      mode: says_any
      words:
      - - Confirm
      - - Password
    until:
      fact: there

# THE `esc` THAT USED TO SIT HERE IS GONE. It was there to close a file chooser that a stray press
# on the avatar opened, and on run 44268828616 it closed nothing - the installer was the only window -
# so it entered the desktop's window overview and the wizard finished the run at x=452 with both
# password boxes empty. Nothing presses the avatar any more, so there is nothing to dismiss.
# THE PASSWORD FIELDS ARE AT x=1195, AND `Next` STAYS GREY WHILE THE FIRST ONE IS EMPTY.
#
# MEASURED on the live page. The field spans x=970..1425, so 1350 IS inside it and the click was
# never "outside the box" - but the box only takes the caret when the press lands while the field
# has focus, and a press into the right third of this one did not. Clicking the field's own centre
# and typing was measured working:
#
#	click (1195,445) then type -> "•••••  ⚠ The password is shorter than 8 characters"
#
# `admin` IS SHORT AND THAT IS NOT A REFUSAL: the warning is drawn and `Next` turns GREEN anyway,
# exactly as `Password is too short` is a warning in kubuntu's Calamares. The confirm field is the
# same box 102 pixels lower: (1195, 547).
# THE PASSWORD PANE IS A DIFFERENT SHAPE FROM THE NAME PANE, AND ITS BOXES ARE 200 PIXELS FURTHER RIGHT.
#
# MEASURED off run 44268828616's own frame of `Choose Account Password`:
#
#	Choose Account Password box   x 966..1434, y 430..466    centre (1200, 448)
#	Confirm Password box          x 966..1434, y 528..560    centre (1200, 544)
#
# - this pane does not carry the name form's two left-hand boxes at all: the labels sit above
# full-width fields on the right of the card. This file pressed (1190, 530) and (1190, 602), which is
# inside neither box, so NOTHING WAS TYPED and the run's last frame shows both fields empty with
# `Next` drawn grey.
#
# AND THE WINDOW ON THAT FRAME IS DRAGGED OFF-CENTRE, because the `esc` before this step did not close
# a dialog - it entered the desktop's window-overview and left the installer at x=452. THAT STEP IS
# GONE: the file no longer presses the avatar at all, so there is no file chooser to dismiss.
#
# `admin` IS SHORT AND THAT IS NOT A REFUSAL: the warning is drawn and `Next` turns green anyway,
# exactly as `Password is too short` is a warning in kubuntu's Calamares.
- name: type the password
  click:
  - 1200
  - 448
  clear: true
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: confirm the password
  click:
  - 1200
  - 544
  clear: true
  type: '{{ password }}'
  type_gap: 0.09
  wait_after: 2
- name: account password next
  click:
  - 1367
  - 810
  wait_after: 25

# THE PRESS IS FOLLOWED BY A VERDICT, FOR THE SAME REASON AS EVERY OTHER BUTTON IN THIS TREE.
#
# MEASURED on the CI leg: (1081, 808) was pressed and the run then waited an hour for a disk that never
# moved. The pop installer's own progress page says `Extracting files` - measured by hand - so that is
# what proves the press took, and the encryption page's `Encrypt` button is what must be gone.
# THE PRESS IS BY COLOUR, FOR THE SAME REASON AS NIXOS AND FEDORA.
#
# MEASURED: (1081, 808) is where the pop installer draws `Don't Encrypt` on this workstation and the
# install starts. On the runner the press left the page unchanged for an hour.
#
# THE POP INSTALLER'S PRIMARY BUTTON IS ITS OWN TEAL, not Calamares' blue: measured over that button's
# box it is `rgb(26, 188, 156)` - the accent the installer uses for `Select`, `Next` and `Install`.
- name: drive encryption - don't encrypt
  click:
  - 1367
  - 810
  wait_after: 15

- name: the install has started
  loop:
    max: 20
    do:
    - wait: 6
    ocr:
      name: started
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      # ENLARGED, BECAUSE `scale: 1` DOES NOT READ THIS WIZARD'S BODY ON THE RUNNER - measured on
      # nixos' leg, where the same setting read 12 words off a full page.
      scale: 3
      wait: 0
    check:
      name: begun
      from: started
      mode: says_any
      # THE PROGRESS PANE'S OWN WORD. `Extracting files` is what this installer prints while it writes,
      # and the encryption page before it - which is the one a missed press would leave on screen -
      # carries `Encrypt` instead.
      words:
      - - Extracting
      - - Installing
      - - Copying
    until:
      fact: begun
  wait_after: 35
- name: the install is written
  disk_settle: 180
  disk_min_mb: 512
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
