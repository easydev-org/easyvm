name: ubuntu - the subiquity walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ubuntu-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: ubuntu
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: wait for the installer window
  until_any:
  - - welcome
    - to
    - ubuntu
  - - choose
    - your
    - language
  timeout: 600
  poll: 5
  keep_alive: true
- name: welcome / language
  at:
  - 1355
  - 848
  settle: 12
- name: accessibility
  at:
  - 1355
  - 848
  settle: 12
- name: keyboard layout
  at:
  - 1355
  - 848
  settle: 12
- name: internet connection
  at:
  - 1355
  - 848
  settle: 14
- name: try or install
  at:
  - 1355
  - 848
  settle: 14
- name: type of installation
  at:
  - 1355
  - 848
  settle: 14
- name: applications
  at:
  - 1355
  - 848
  settle: 14
- name: proprietary software
  at:
  - 1355
  - 848
  settle: 14
- name: disk setup
  at:
  - 1355
  - 848
  settle: 20
- name: encryption
  at:
  - 1355
  - 848
  settle: 14
- name: create your account - full name
  at:
  - 1139
  - 393
  type: '{{ user }}'
  settle: 2
- name: create your account - username
  at:
  - 1139
  - 501
  type: '{{ user }}'
  settle: 2
- name: create your account - password
  at:
  - 1050
  - 563
  type: '{{ password }}'
  settle: 2
- name: create your account - confirm password
  at:
  - 1139
  - 616
  type: '{{ password }}'
  settle: 3
- name: clear 'require my password to log in'
  at:
  - 923
  - 670
  settle: 3
- name: create your account
  at:
  - 1355
  - 848
  settle: 12
- name: time zone - new york on the map
  at:
  - 762
  - 483
  settle: 4
- name: time zone
  at:
  - 1355
  - 848
  settle: 14
- name: ready to install - the green install button
  at:
  - 1355
  - 848
  settle: 30
- name: the installer finishes
  until_any:
  - - installed
    - and
    - ready
    - to
    - use
  - - restart
    - to
    - complete
    - the
    - installation
  - - restart
    - now
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 5400
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
