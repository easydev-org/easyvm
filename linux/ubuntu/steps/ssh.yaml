name: linux-ubuntu - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ubuntu-ssh.mp4
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - the password box
  click:
  - 936
  - 628
  wait_after: 3
- name: greeter - log in
  type: '{{ password }}'
  wait_after: 3
- name: greeter - submit
  key: ret
  wait_after: 12
- name: the first-login wizard is up, when this build shows one
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - ubuntu
      - - complete
        - your
        - setup
    until:
      fact: done
- name: walk the first-login pages to the end
  loop:
    max: 12
    do:
    - click:
      - 1464
      - 194
      wait_after: 4
    ocr:
      name: page
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: page
      mode: says_any
      words:
      - - software
        - updater
      - - updates
        - available
      - - activities
    until:
      fact: done
- name: open the terminal
  key: ctrl+alt+t
  wait_after: 20
- name: keep the screen on
  run: xset s off; xset -dpms; xset s noblank
  wait_after: 3
- name: sudo is unlocked for this session
  run: printf '%s\n' {{ password }} | sudo -S -v
  wait_after: 2
- name: install openssh-server
  run: sudo apt-get install -y openssh-server
  wait_after: 5
- name: allow password authentication
  run: sudo sed -i s/^#PasswordAuthentication.*/PasswordAuthentication\ yes/ /etc/ssh/sshd_config && grep -i ^PasswordAuthentication /etc/ssh/sshd_config
  wait_after: 3
- name: enable ssh at boot
  run: sudo systemctl enable --now ssh
  wait_after: 5
- name: prove ssh is active
  run: systemctl is-active ssh
  wait_after: 3
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
