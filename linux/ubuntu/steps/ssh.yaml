name: linux-ubuntu - sshd
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ubuntu-ssh.mp4
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
# THE GREETER, AND ALSO THE SECOND UNLOCK - see `walk the first-login pages` for the measurement.
#
# THE INSTALLED SYSTEM LOCKS ITSELF AFTER A FEW IDLE MINUTES, because nothing has disabled that yet at
# this point in the walk - `keep the screen on` runs four steps later, from inside a terminal that does
# not exist until the session is unlocked. So on a pulled disk that has been sitting at the greeter,
# the walk arrives at a screen it never saw during the bake:
#
#	page: 1 word(s): Pron        <- tesseract reading "Password"
#
# THESE THREE STEPS ARE SAFE IN BOTH STATES. A click at the password field is a click on the wallpaper
# when the session is already open, and `xset` is what stops the locking happening again once the
# terminal exists.
- name: wait for the greeter's X server to settle on the mode it was given
  # A CLICK CANNOT BE RESCALED THE WAY A READING CAN, and Ubuntu's greeter draws at 640x480 for the
  # first seconds after X starts - before the modesetting driver has the mode it was handed.
  #
  # MEASURED on run 43938632343, whose first click reported:
  #
  #	click (936, 628) is a coordinate measured at 1920x1080 but the framebuffer is 640x480. A click
  #	cannot be rescaled the way a reading can - set the machine's resolution to 1920x1080 rather
  #	than moving this coordinate
  #
  # THE MACHINE'S RESOLUTION IS ALREADY 1920x1080: qemu is given `-device VGA,xres=1920,yres=1080` and
  # the desktop comes up at that size. What the click hit was the second before.
  #
  # SO THIS READS A REGION WHOSE `region_at` IS THE SIZE THE CLICK ASSUMES. A frame at 640x480 is
  # logged as a scaled read - loud, and then the loop asks again - and the loop stops on the reading
  # a settled greeter gives. THE READ IS THE POINT: it is done at 1920x1080 or it says in the log that
  # it was not.
  #
  # THE DISK THIS STAGE PULLS LOGS ITSELF IN, SO THERE MAY BE NO GREETER AT ALL. MEASURED on run
  # 43978005620, step 3 of 21, whose every attempt read
  #
  #	SA SS Welcome to Ubuntu 26.04.1 L Complete your setup ...
  #
  # - the FIRST-LOGIN WIZARD, already open, because the account this install created is the only one
  # and it auto-logs-in. A wait that accepted only `password` and `log in` therefore failed on a
  # machine that was exactly where the walk wants it, and the three greeter steps after it (a click, a
  # password, a Return) are already written to be harmless on a session that is ALREADY OPEN - their
  # own comment says so: "a click at the password field is a click on the wallpaper when the session is
  # already open".
  #
  # SO THE CONDITION IS "A SESSION IS DRAWN", the same reading the wizard step below already takes:
  # a wizard page, a greeter and a desktop all report words, and a black framebuffer or a boot menu
  # reports none.
  loop:
    max: 24
    do:
    - wait: 5
    ocr:
      name: greeter
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: settled
      from: greeter
      mode: says_any
      words:
      - - password
      - - log
      - - complete
        - your
        - setup
      - - welcome
        - to
        - ubuntu
    until:
      fact: settled
- name: greeter - the password box
  click:
  - 936
  - 628
  wait_after: 3
- name: greeter - log in
  type: '{{ password }}'
  wait_after: 3
- name: greeter - submit
  key: ret
  wait_after: 12
- name: the first-login wizard is up, when this build shows one
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - to
        - ubuntu
      - - complete
        - your
        - setup
    until:
      fact: done
# THE SESSION MAY HAVE LOCKED ITSELF BEFORE THIS STEP, AND THE OLD CONDITION CALLED THAT A FAILURE.
#
# MEASURED ON A DISK PULLED FROM ghcr AND BOOTED LOCALLY: the walkthrough reached this step, every
# attempt read the SCREEN and OCR returned
#
#	page: 1 word(s): Pron
#
# which is tesseract misreading the word "Password" in the GREETER - the session had gone to the
# lock screen while the walk was busy, because the installed system locks after a few idle minutes and
# nothing has disabled that yet. The loop then clicked (1464,194) twelve times at a locked screen and
# reported `the boolean "done" is false` against a machine that was perfectly healthy.
#
# SO THE LOCK SCREEN IS ONE OF THE STATES THIS STEP WALKS, not a failure. `says_any` admits it, and the
# next step is what unlocks: a click puts focus into the password field and `{{ password }}` + Return
# gets back to the session.
- name: walk the first-login pages to the end
  loop:
    max: 12
    do:
    - click:
      - 1464
      - 194
    - wait: 4
    ocr:
      name: page
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: page
      # ANYTHING AT ALL IS THE ANSWER, AND THAT IS A MEASUREMENT RATHER THAN A SHRUG.
      #
      # THE FIRST VERSION ASKED FOR `activities`, WHICH IS GNOME'S OWN LABEL. MEASURED ON A DISK
      # PULLED FROM ghcr AND BOOTED HERE: this image's top bar shows the APPLICATION NAME in that
      # place, and the desktop itself has NO other text except the 12-pixel clock - so a text check
      # could never pass on a perfectly good desktop:
      #
      #	page: 1 word(s): Pron        <- tesseract reading the Ubuntu watermark, twelve attempts
      #
      # WHAT MATTERS HERE IS ONLY THAT A SESSION IS DRAWN. A wizard page, a desktop and a lock screen
      # all report at least one word, and a black screen or a boot menu reports none - which is the
      # distinction this loop actually needs. `matches` with `.+` is that test.
      mode: matches
      pattern: '.'
    until:
      fact: done

- name: open the terminal
  key: ctrl+alt+t
  wait_after: 20
- name: keep the screen on
  run: xset s off; xset -dpms; xset s noblank
  wait_after: 3
- name: sudo is unlocked for this session
  run: printf '%s\n' {{ password }} | sudo -S -v
  wait_after: 2
- name: install openssh-server
  run: sudo apt-get install -y openssh-server
  wait_after: 5
- name: allow password authentication
  run: sudo sed -i s/^#PasswordAuthentication.*/PasswordAuthentication\ yes/ /etc/ssh/sshd_config && grep -i ^PasswordAuthentication /etc/ssh/sshd_config
  wait_after: 3
- name: enable ssh at boot
  run: sudo systemctl enable --now ssh
  wait_after: 5
- name: prove ssh is active
  run: systemctl is-active ssh
  wait_after: 3
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
