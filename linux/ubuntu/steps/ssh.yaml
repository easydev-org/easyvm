name: linux-ubuntu - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
steps:
- name: start recording
  record: ubuntu-ssh.mp4
  poll: 20
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - the password box
  at:
  - 936
  - 628
  settle: 3
- name: greeter - log in
  type: '{{ password }}'
  settle: 3
- name: greeter - submit
  key: ret
  settle: 12
- name: the first-login wizard is up, when this build shows one
  until_any:
  - - welcome
    - to
    - ubuntu
  - - complete
    - your
    - setup
  timeout: 90
  poll: 3
- name: dismiss the first-login wizard
  at:
  - 1465
  - 196
  repeat:
  - 6
  - 3
  settle: 12
- name: the wizard is finished
  until_any:
  - - type
    - to
    - search
  - - show
    - applications
  timeout: 180
  poll: 3
- name: open the terminal
  key: ctrl+alt+t
  settle: 20
- name: install openssh-server
  run: echo {{ password }} | sudo -S sh -c "export DEBIAN_FRONTEND=noninteractive; apt-get update -o DPkg::Lock::Timeout=600 && apt-get install -y -o DPkg::Lock::Timeout=600 openssh-server" 2>&1 | tail
    -6
  terminal_wait: 0
  settle: 90
- name: allow password authentication
  run: echo {{ password }} | sudo -S -p '' sh -c 'mkdir -p /etc/ssh/sshd_config.d; printf "PasswordAuthentication yes\n" > /etc/ssh/sshd_config.d/99-vm.conf; sed -i "s/^#\?\s*PasswordAuthentication.*/PasswordAuthentication
    yes/" /etc/ssh/sshd_config; grep -q "^PasswordAuthentication yes" /etc/ssh/sshd_config || printf "PasswordAuthentication yes\n" >> /etc/ssh/sshd_config' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: enable ssh at boot
  run: echo {{ password }} | sudo -S systemctl enable ssh 2>&1 | tail -3
  terminal_wait: 0
  settle: 8
- name: prove the setting took
  run: echo {{ password }} | sudo -S sh -c 'sshd -T 2>/dev/null | grep -i "^passwordauthentication" || echo PASSWORDAUTH-UNREADABLE' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: start ssh
  run: echo {{ password }} | sudo -S systemctl restart ssh 2>&1 | tail -3
  terminal_wait: 0
  settle: 10
- name: prove ssh is active
  run: systemctl is-active ssh
  terminal_wait: 0
  settle: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop recording
  record: false
