name: linux-ubuntu - configure the vm (name, share, guest agent)
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  hostname:
    from: args.hostname
    default: easyvm-ubuntu
  timezone:
    from: args.timezone
    default: America/Los_Angeles
  locale:
    from: args.locale
    default: en_US.UTF-8
  host:
    from: args.host
    default: 172.30.0.1
  out:
    from: args.out
    default: out/vm-configure.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '1800'
ssh_user: vmuser
ssh_port: 2222
steps:
- name: start recording
  record: vm-configure.mp4
- name: take the input disk
  disk: disk.qcow2
- name: boot the disk
  boot: true
  os: linux
  timeout: '{{ boot_timeout }}'
- name: wait for sshd
  require_ssh: true
  timeout: '{{ boot_timeout }}'
- name: announce the machine's name
  ssh: echo "this machine will be named '{{ hostname }}'"
  timeout: 60
- name: set the machine's name
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' hostnamectl set-hostname {{ hostname }}

    '
  timeout: 120
- name: point the loopback line at that name
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  if grep -q \"^127\\.0\\.1\\.1\" /etc/hosts; then\n    sed -i \"s/^127\\.0\\.1\\.1.*/127.0.1.1\\t{{ hostname }}/\" /etc/hosts\n  else\n\
    \    printf \"127.0.1.1\\t%s\\n\" \"{{ hostname }}\" >> /etc/hosts\n  fi'\n"
  timeout: 120
- name: prove the name
  ssh: 'set -e

    echo "static: $(hostnamectl --static)"

    echo "kernel: $(hostname)"

    echo "hosts:  $(grep -c ''{{ hostname }}'' /etc/hosts) line(s)"

    test "$(hostnamectl --static)" = "{{ hostname }}"

    test "$(hostname)" = "{{ hostname }}"

    grep -q ''{{ hostname }}'' /etc/hosts

    '
  timeout: 60
- name: set the time zone
  # ONE ZONE FOR EVERY GUEST IN THIS REPOSITORY, so a log line and a screenshot timestamp mean the
  # same thing whichever machine produced them. `timedatectl` is systemd's own and needs no file
  # edited by hand.
  ssh: >-
    printf '%s\n' '{{ password }}' | sudo -S -p '' timedatectl set-timezone {{ timezone }} &&
    timedatectl show -p Timezone --value
  timeout: 120
- name: prove the time zone
  # READ IT BACK FROM THE SYSTEM, not from the command that set it: a `timedatectl` that answers 0 and
  # changes nothing is the kind of success this repository has been bitten by.
  ssh: >-
    sh -c 'echo "systemd = $(timedatectl show -p Timezone --value)"; echo "etc = $(readlink -f /etc/localtime)";
    test "$(timedatectl show -p Timezone --value)" = "{{ timezone }}" && echo TIMEZONE_OK'
  timeout: 60
- name: set the locale
  # THE LOCALE MUST EXIST IN THE IMAGE FIRST, and `locale-gen` is Debian's way to make sure. The
  # `|| true` is because a guest whose image already has en_US.UTF-8 treats a second generation as a
  # no-op and some builds answer non-zero for that. `update-locale` writes the file `/etc/profile`
  # reads, so the setting survives a new login instead of only this shell.
  ssh: >-
    printf '%s\n' '{{ password }}' | sudo -S -p '' sh -c
    'locale-gen {{ locale }} 2>/dev/null || true; update-locale LANG={{ locale }} LC_ALL={{ locale }}'
    && echo LOCALE_WRITTEN
  timeout: 180
- name: prove the locale in a new login shell
  # A VARIABLE EXPORTED IN THIS SHELL PROVES NOTHING: the question is what the NEXT session gets, and
  # `sh -lc` is that session's own startup path.
  ssh: sh -lc 'printf "LANG=%s\nLC_ALL=%s\n" "$LANG" "$LC_ALL"'
  timeout: 60
- name: refresh the package index
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''DEBIAN_FRONTEND=noninteractive apt-get update -o DPkg::Lock::Timeout=600'' 2>&1 | tail -3

    '
  timeout: 600
- name: install the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-guest-agent 2>&1 | tail -5

    '
  timeout: 600
- name: enable the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' systemctl enable --now qemu-guest-agent 2>&1 | tail -3

    '
  timeout: 120
- name: prove the guest agent is running
  ssh: 'systemctl is-active qemu-guest-agent &&

    ls -l /dev/virtio-ports/org.qemu.guest_agent.0 2>&1 &&

    systemctl show -p MainPID --value qemu-guest-agent

    '
  timeout: 120
- name: turn on automatic login, because an unattended client cannot type a password
  # A GUEST THAT BOOTS TO A PASSWORD PROMPT CANNOT BE DRIVEN BY ANYTHING UNATTENDED, and this is
  # issue easydev-org/easyvm#1's second ask. Ubuntu 26.04 runs gdm3, whose file is `/etc/gdm3/custom.conf`
  # and whose section is `[daemon]` - not `[Seat:*]`, which is lightdm's and is accepted silently by
  # nothing.
  #
  # `sed -i` RATHER THAN A REWRITE: the file exists with the commented-out lines gdm ships, and
  # replacing it with two lines would drop settings that are already there.
  #
  # THE TWO `sed` EXPRESSIONS ARE SEPARATE STEPS because the first can match a commented line and the
  # second must not: `s/^#*AutomaticLoginEnable=.*/...` turns `#AutomaticLoginEnable=false` into the
  # enabled form, and the same for the name. A single expression that assumed the lines were absent
  # appended duplicates instead of editing them.
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''sed -i "s/^#*AutomaticLoginEnable=.*/AutomaticLoginEnable=true/" /etc/gdm3/custom.conf; sed -i "s/^#*AutomaticLogin=.*/AutomaticLogin={{ user }}/" /etc/gdm3/custom.conf'' 2>&1 | tail -3

    '
  timeout: 120
- name: make sure those two lines exist even if gdm shipped neither
  # `grep -q` BEFORE `printf >>`: gdm's own file has both lines commented out, so the `sed` above is
  # what normally does the work - but a custom.conf that has neither line is a valid file that `sed`
  # leaves untouched, and the result is a guest that still asks for a password with a config that
  # looks like it was edited.
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''grep -q "^AutomaticLoginEnable=" /etc/gdm3/custom.conf || printf "AutomaticLoginEnable=true\n" >> /etc/gdm3/custom.conf; grep -q "^AutomaticLogin=" /etc/gdm3/custom.conf || printf "AutomaticLogin={{ user }}\n" >> /etc/gdm3/custom.conf'' 2>&1 | tail -3

    '
  timeout: 120
- name: prove automatic login is configured
  # THE FILE IS THE PROOF, because the effect only shows on the next boot - and `grep` on an
  # uncommented line is what distinguishes "written" from "written behind a #".
  ssh: grep -E "^AutomaticLogin(Enable)?=" /etc/gdm3/custom.conf
  timeout: 60
- name: turn off the idle lock screen
  # THE LOCK SCREEN IS WHAT A REMOTE VIEWER THEN SEES, and `xset` from the ssh stage does not fix it:
  # that call applies to the X server of the session it ran in and is lost at logout, while these are
  # the settings the session reads when it starts. All five keys are now MY OWN SESSION's
  # configuration and survive a reboot.
  #
  # `dbus-run-session` RATHER THAN PLAIN `gsettings`: `gsettings` needs a session bus, an ssh exec has
  # none, and without one every write fails with "Failed to commit changes to dconf: Could not
  # connect: No such file or directory" - which reads like a permissions problem.
  ssh: 'dbus-run-session -- gsettings set org.gnome.desktop.session idle-delay 0 && dbus-run-session -- gsettings set org.gnome.desktop.screensaver idle-activation-enabled false && dbus-run-session -- gsettings set org.gnome.desktop.screensaver lock-enabled false && dbus-run-session -- gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type nothing && echo LOCK_DISABLED

    '
  timeout: 180
- name: prove the idle lock is off
  # EACH KEY IS READ BACK, because `gsettings set` exits 0 for a key that does not exist on this
  # schema and for a write that went to a temporary bus that died with the command.
  ssh: 'dbus-run-session -- sh -c ''gsettings get org.gnome.desktop.session idle-delay; gsettings get org.gnome.desktop.screensaver lock-enabled; gsettings get org.gnome.desktop.screensaver idle-activation-enabled''

    '
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: prove the guest can fetch from the host share
  share_mount: true
  share_family: linux
  requires:
  - share
  timeout: 180
- name: show what the guest sees at the share
  # THE SHARE IS HTTP, SO THE GUEST'S OWN CLIENT IS THE PROOF. `share_mount:` fetches a sentinel the
  # host wrote and compares the bytes; this step is the readable version of the same answer, printed
  # so a person can see what happened rather than only whether it passed.
  #
  # IT USED TO CHECK A CIFS MOUNT AND A ROUND TRIP THROUGH ~/shared. Both are gone: there is no mount
  # any more, and a guest writing to its own home and reading it back proves the guest's filesystem.
  ssh: >-
    sh -c 'curl -fsS --max-time 20 http://172.30.0.1:8080/shared/ 2>&1 | head -20; echo "fetch exit = $?"'
  timeout: 120
- name: write the launcher
  write: launcher
  family: linux
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: install the launcher
  ssh: 'set -e

    install -m 0755 /tmp/bootstrap-launcher.sh ~/bootstrap-launcher.sh

    mkdir -p ~/.config/systemd/user

    cat > ~/.config/systemd/user/org.vm.bootstrap.service <<''UNIT''

    [Unit]

    Description=Run ~/shared/bootstrap.sh at login


    [Service]

    Type=oneshot

    ExecStart=%h/bootstrap-launcher.sh


    [Install]

    WantedBy=default.target

    UNIT

    systemctl --user daemon-reload

    systemctl --user enable org.vm.bootstrap.service

    echo INSTALLED_FOR_NEXT_LOGIN

    '
  timeout: 300
- name: prove the launcher is installed
  ssh: 'set -e

    ls -l ~/bootstrap-launcher.sh ~/.config/systemd/user/org.vm.bootstrap.service

    grep -q bootstrap-launcher.sh ~/.config/systemd/user/org.vm.bootstrap.service

    systemctl --user is-enabled org.vm.bootstrap.service

    test "$(systemctl --user is-enabled org.vm.bootstrap.service)" = "enabled"

    '
  timeout: 60
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
