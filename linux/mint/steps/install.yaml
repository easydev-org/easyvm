name: mint - the ubiquity walk
resolution:
- 1920
- 1080
vars:
  display_name: Vmuser User
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: mint-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 64
- name: fetch the installer image
  fetch: linux_iso
  release: mint
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: disable the screen saver, its lock and the dpms blank
  run: gsettings set org.cinnamon.desktop.session idle-delay 0; gsettings set org.cinnamon.desktop.screensaver lock-enabled false; gsettings set org.cinnamon.desktop.screensaver idle-activation-enabled false; xrandr --output Virtual-1 --mode 1920x1080
    2>/dev/null || xrandr --output Virtual1 --mode 1920x1080 2>/dev/null || xrandr -s 1920x1080 2>/dev/null || true; xset s off; xset -dpms; xset s noblank; ( for i in $(seq 1 1080); do xdotool mousemove_relative -- 1 0 2>/dev/null; xdotool mousemove_relative
    -- -1 0 2>/dev/null; sleep 20; done ) >/dev/null 2>&1 & exit
  terminal_wait: 8
  settle: 10
  type_gap: 0.15
- name: wait for the installer launcher
  until_any:
  - - welcome
    - to
    - linux
    - mint
  - - choose
    - your
    - language
  - - installation
    - type
  timeout: 600
  poll: 5
  keep_alive: true
- name: install linux mint
  double:
  - 114
  - 47
  settle: 25
  expect_any:
  - - welcome
  - - install
- name: welcome
  at:
  - 1306
  - 727
  settle: 12
- name: keyboard
  at:
  - 1306
  - 727
  settle: 12
- name: multimedia codecs
  at:
  - 1306
  - 727
  settle: 12
- name: installation type
  at:
  - 1306
  - 727
  settle: 15
- name: write the changes to disks
  at:
  - 1266
  - 663
  settle: 25
- name: installation type - install now, after the modal
  at:
  - 1307
  - 726
  settle: 30
- name: where are you
  at:
  - 1306
  - 727
  settle: 15
- name: who are you - full name
  at:
  - 965
  - 347
  type: '{{ display_name }}'
  settle: 2
- name: who are you - password
  at:
  - 877
  - 458
  type: '{{ password }}'
  settle: 2
- name: who are you - confirm password
  at:
  - 877
  - 492
  type: '{{ password }}'
  settle: 3
- name: who are you
  at:
  - 1306
  - 727
  settle: 20
- name: the install runs, as measured
  wait: 2400
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
