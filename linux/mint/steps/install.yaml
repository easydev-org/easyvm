name: mint - the ubiquity walk
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  display_name: Vmuser User
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - mint.iso
- name: start recording
  record: mint-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: mint.iso
  timeout: 1800
# THE MEDIUM STOPS AT ITS OWN GRUB MENU AND WAITS, WHICH IS WHY THIS STAGE USED TO TIME OUT.
#
# MEASURED on this ISO (Linux Mint 22.3 Cinnamon 64-bit): after `boot:` the screen is GRUB's menu
# with `Start Linux Mint 22.3 Cinnamon 64-bit` highlighted and the footnote `Press enter to boot the
# selected OS`. It does not count down. The `wait for the live desktop` step below then waited out
# its whole budget against a menu, and the CI leg failed at 1h30m with the disk never written.
#
# FIVE SECONDS IS NOT A TIMER TO OUTLAST, IT IS A MENU THAT NOBODY PRESSED. The keyboard already
# works at this point - GRUB draws it - so one `ret` is the whole fix, and it is a step of its own
# so the transcript says the menu was answered rather than that a wait merely succeeded.
- name: the medium's GRUB menu is up
  ocr:
    name: grub
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 5
- name: that menu names mint
  check:
    name: is_mint
    from: grub
    mode: says_any
    words:
    - - start
      - linux
      - mint
    - - linux
      - mint
- name: answer the menu, which does not count down
  key: ret
  wait_after: 20

- name: wait for the live desktop
  desktop: linux/cinnamon
  timeout: 5400
  poll: 5
  keep_alive: true
- name: disable the screen saver, its lock and the dpms blank
  run: gsettings set org.cinnamon.desktop.session idle-delay 0; gsettings set org.cinnamon.desktop.screensaver lock-enabled false; gsettings set org.cinnamon.desktop.screensaver idle-activation-enabled false; xrandr --output Virtual-1 --mode 1920x1080
    2>/dev/null || xrandr --output Virtual1 --mode 1920x1080 2>/dev/null || xrandr -s 1920x1080 2>/dev/null || true; xset s off; xset -dpms; xset s noblank; ( for i in $(seq 1 1080); do xdotool mousemove_relative -- 1 0 2>/dev/null; xdotool mousemove_relative
    -- -1 0 2>/dev/null; sleep 20; done ) >/dev/null 2>&1 & exit
  terminal_wait: 8
  type_gap: 0.15
  wait_after: 10
# THE DESKTOP ICON IS OBSERVED, THEN OPENED WITH THE KEYBOARD - `double:` DOES NOT OPEN IT.
#
# MEASURED, three attempts on the same frame:
#
#	double at (114,47)             nothing
#	double at (114,52)             nothing
#	click at (114,52)              the label turns blue, the icon is SELECTED
#	click at (114,52) then ret     the Install window is up
#
# The icon's disc was located by its own pixels: a pale blob with centroid (114,52), bounding box
# x=69..164 y=32..91 on the 1920 frame - so the coordinate was never wrong. CINNAMON'S DESKTOP IS
# CLICK-TO-SELECT, and the launcher opens on Return; a double-click is not one of its gestures here.
#
# THE WAIT IS THE SELECTION ITSELF: `Install Linux Mint` is the icon's LABEL, and it is already on
# screen before anything happens, so the loop waits for the label to be HIGHLIGHTED - which needs no
# colour test to state: the step after it presses Return and the Install window appearing IS the
# verdict that the selection took.
- name: the desktop's install icon is on screen
  ocr:
    name: desktop
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

- name: that icon names the installer
  check:
    name: launcher
    from: desktop
    mode: says
    # ONE TOKEN: `says` compares whole words, so a phrase here would never match. `Install` is the
    # label's first word and nothing else on an idle desktop carries it.
    words: [Install]

- name: select the installer's icon
  click: [114, 52]
  wait_after: 3

- name: open it with the keyboard, because a double-click does not
  key: ret
  wait_after: 25

- name: the installer window is up
  loop:
    max: 30
    do:
    - wait: 6
    ocr:
      name: installer
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 2
    check:
      name: up
      from: installer
      mode: says_any
      words:
      - - Welcome
      - - Keyboard
      - - Multimedia
    until:
      fact: up

- name: welcome
  click:
  - 1306
  - 727
  wait_after: 12
- name: keyboard
  click:
  - 1306
  - 727
  wait_after: 12
- name: multimedia codecs
  click:
  - 1306
  - 727
  wait_after: 12
- name: installation type
  click:
  - 1306
  - 727
  wait_after: 15
# UBIQUITY HAS NO FILESYSTEM SELECTOR, AND THIS DIALOG IS THE ONLY PLACE IT NAMES ONE.
#
# MEASURED on this image, verbatim:
#
#	The following partitions are going to be formatted:
#	partition #1 of Virtual disk 1 (vda) as ESP
#	partition #2 of Virtual disk 1 (vda) as ext4
#
# `Installation type` offers only `Erase disk and install Linux Mint` with
# `Advanced features... None selected`, and None means ext4 - so every page before this one is
# silent about the filesystem and a walk that accepted the default could publish a btrfs disk with
# nothing above noticing.
#
# THE RESULTING DISK WAS VERIFIED INDEPENDENTLY: s_magic=0xef53, incompat=0x000002c6,
# EXTENTS=True, 64BIT=True - the same signature zorin produces, which is the same installer.
- name: the dialog names the filesystem it will create
  ocr:
    name: format
    region:
    - 0
    - 0
    - 1920
    - 1080
    region_at:
    - 1920
    - 1080
    scale: 1
    wait: 0

- name: the root partition will be ext4
  check:
    name: ext4
    from: format
    mode: says
    words:
    - ext4

- name: write the changes to disks
  click:
  - 1266
  - 663
  wait_after: 25
- name: installation type - install now, after the modal
  click:
  - 1307
  - 726
  wait_after: 30
- name: where are you
  click:
  - 1306
  - 727
  wait_after: 15
- name: who are you - full name
  click:
  - 965
  - 347
  type: '{{ display_name }}'
  wait_after: 2
- name: who are you - password
  click:
  - 877
  - 458
  type: '{{ password }}'
  wait_after: 2
- name: who are you - confirm password
  click:
  - 877
  - 492
  type: '{{ password }}'
  wait_after: 3
- name: who are you
  click:
  - 1306
  - 727
  wait_after: 20
# THE INSTALL ENDS WHEN MINT SAYS SO, NOT WHEN FORTY MINUTES HAVE GONE BY.
#
# THIS WAS `wait: 2400` - a fixed forty minutes - and it is the one step in the tree that waits on
# the clock instead of on the machine. MEASURED: the disk stopped growing at 12519 MiB with
# `Installation Complete` on screen and the step then sat there for the remaining half hour, so a
# local run took forty minutes to do twenty minutes of work and a CI leg paid the same.
#
# THE VERDICT IS THE DIALOG'S OWN WORDS. Ubiquity ends at
#
#	Installation Complete
#	Installation has finished. You can continue testing Linux Mint now, ...
#
# - and `Complete` is the token that appears there and nowhere earlier in the run.
- name: the install finishes
  loop:
    max: 120
    do:
    - wait: 15
    ocr:
      name: finished
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: done
      from: finished
      mode: says
      # `Complete` IS THE DIALOG'S TITLE AND OCR DROPS IT. MEASURED on this dialog's own frame:
      #
      #	read: "Install Linux Mint oon but until you restart the computer, any changes you make"
      #
      # - the title `Installation Complete` came back as `oon`, so a check on it could never pass
      # while the dialog was plainly on screen. `restart` is from the sentence underneath, which is
      # the longest line on the dialog and the one OCR reads cleanly.
      words: [restart]
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
