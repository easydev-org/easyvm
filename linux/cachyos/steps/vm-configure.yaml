name: linux-cachyos - configure the vm (name, share, guest agent)
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  hostname:
    from: args.hostname
    default: easyvm-vm
  host:
    from: args.host
    default: 172.30.0.1
  out:
    from: args.out
    default: out/vm-configure.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '1800'
ssh_user: vmuser
ssh_port: 2222
steps:
- name: start recording
  record: vm-configure.mp4
- name: take the input disk
  disk: disk.qcow2
- name: boot the disk
  boot: true
  os: linux
  timeout: '{{ boot_timeout }}'
- name: wait for sshd
  require_ssh: true
  timeout: '{{ boot_timeout }}'
- name: announce the machine's name
  ssh: echo "this machine will be named '{{ hostname }}'"
  timeout: 60
- name: set the machine's name
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' hostnamectl set-hostname {{ hostname }}

    '
  timeout: 120
- name: point the loopback line at that name
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  if grep -q \"^127\\.0\\.1\\.1\" /etc/hosts; then\n    sed -i \"s/^127\\.0\\.1\\.1.*/127.0.1.1\\t{{ hostname }}/\" /etc/hosts\n  else\n\
    \    printf \"127.0.1.1\\t%s\\n\" \"{{ hostname }}\" >> /etc/hosts\n  fi'\n"
  timeout: 120
- name: prove the name
  ssh: "sh -c '\n  set -e\n  echo \"static: $(hostnamectl --static)\"\n  echo \"kernel: $(hostname)\"\n  echo \"hosts:  $(grep -c \"{{ hostname }}\" /etc/hosts) line(s)\"\n  test \"$(hostnamectl --static)\"\
    \ = \"{{ hostname }}\"\n  test \"$(hostname)\" = \"{{ hostname }}\"\n  grep -q \"{{ hostname }}\" /etc/hosts'\n"
  timeout: 60
- name: refresh the package index
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pacman -Sy 2>&1 | tail -3

    '
  timeout: 600
- name: install the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pacman -S --noconfirm qemu-guest-agent 2>&1 | tail -5

    '
  timeout: 600
- name: enable the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' systemctl enable --now qemu-guest-agent 2>&1 | tail -3

    '
  timeout: 120
- name: prove the guest agent is running
  ssh: 'systemctl is-active qemu-guest-agent &&

    ls -l /dev/virtio-ports/org.qemu.guest_agent.0 2>&1 &&

    systemctl show -p MainPID --value qemu-guest-agent

    '
  timeout: 120
- name: install the cifs client
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pacman -S --noconfirm cifs-utils 2>&1 | tail -5

    '
  timeout: 600
- name: serve the host share
  share_serve: true
  timeout: 60
- name: mount the host share
  share_mount: true
  share_family: linux
  requires:
  - share
  timeout: 180
- name: prove the share is readable and writable
  ssh: 'sh -c ''

    echo "--- what is mounted ---"

    /sbin/mount | grep -i "cifs\|smb" || echo "(no cifs/smb line in mount output)"

    echo "--- the mount point ---"

    ls -la ~/shared || echo "(~/shared is not readable)"

    echo "--- the round trip ---"

    printf "written-by-the-guest\n" > ~/shared/from-guest.txt

    got=$(cat ~/shared/from-guest.txt)

    echo "read back: $got"

    test "$got" = "written-by-the-guest"

    echo "round trip ok"

    ''

    '
  timeout: 120
- name: write the launcher
  write: launcher
  family: linux
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: install the launcher
  ssh: "sh -c '\n  set -e\n  install -m 0755 /tmp/bootstrap-launcher.sh \"$HOME/bootstrap-launcher.sh\"\n  mkdir -p \"$HOME/.config/systemd/user\"\n  UNIT=\"$HOME/.config/systemd/user/org.vm.bootstrap.service\"\
    \n  printf \"%s\\n\" \\\n    \"[Unit]\" \\\n    \"Description=Run ~/shared/bootstrap.sh at login\" \\\n    \"\" \\\n    \"[Service]\" \\\n    \"Type=oneshot\" \\\n    \"ExecStart=%h/bootstrap-launcher.sh\"\
    \ \\\n    \"\" \\\n    \"[Install]\" \\\n    \"WantedBy=default.target\" > \"$UNIT\"\n  systemctl --user daemon-reload\n  systemctl --user enable org.vm.bootstrap.service\n  echo INSTALLED_FOR_NEXT_LOGIN'\n"
  timeout: 300
- name: prove the launcher is installed
  ssh: "sh -c '\n  set -e\n  ls -l \"$HOME/bootstrap-launcher.sh\" \"$HOME/.config/systemd/user/org.vm.bootstrap.service\"\n  grep -q bootstrap-launcher.sh \"$HOME/.config/systemd/user/org.vm.bootstrap.service\"\
    \n  systemctl --user is-enabled org.vm.bootstrap.service\n  test \"$(systemctl --user is-enabled org.vm.bootstrap.service)\" = \"enabled\"'\n"
  timeout: 60
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
