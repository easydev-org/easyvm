name: cachyos - install to ext4, then the power button
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/cachyos.qcow2
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - cachyos.iso
- name: start recording
  record: cachyos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: linux
  iso: cachyos.iso
  timeout: 1800

# `desktop: linux/kde`, BECAUSE THIS MEDIUM'S PANEL IS EIGHT ROWS TALL AND THE BAND TEST
# CANNOT SEE IT - AND ITS KDE SIBLINGS DRAW A FORTY-EIGHT ROW PANEL THAT THE BAND TEST SEES FINE.
#
# MEASURED with the CachyOS Hello window open:
#
#	IsLinuxDesktop=false   drop=0.0   topVar=9.5   bottomVar=12.5
#
# `IsLinuxDesktop` averages the bottom 4.5% of the frame - about 48 rows - and looks for a flat band
# whose brightness differs from the body by more than 40. CachyOS draws its panel in the last EIGHT
# rows, so the average is forty rows of dark wallpaper plus eight of panel and the difference is gone.
#
# THE EDGE IS THERE WHEN IT IS MEASURED WHERE IT IS DRAWN:
#
#	1071: 22.1
#	1072: 39.1   d=+17.0   <- the panel's top edge
#	1073: 40.3 ... 46.6 at the bottom
#
# `screen.IsKDEDesktop` tries the band average and then the row step, so ONE branch answers for both
# heights: manjaro's 48-row panel and this one's 8-row panel are the same desktop environment drawn
# differently, and a test that answered differently for them would be measuring the panel's height
# rather than the desktop's existence.
- name: wait for the live desktop
  desktop: linux/kde
  timeout: 5400
  poll: 5
  keep_alive: true

- name: let the desktop settle
  wait: 15
  keep_alive: true

# CACHYOS HELLO IS THE FIRST WINDOW, AND `Launch installer` IS A BUTTON INSIDE IT - ONCE, NOT TWICE.
#
# MEASURED on this image: one click at (960, 743) does nothing visible, and TWO clicks 0.8s apart open
# Calamares. The button is a Qt push button, so the first click takes focus and the second activates.
- name: open the installer
  click: [960, 743]
  wait_after: 1

- name: open the installer, second click
  click: [960, 743]
  wait_after: 25

- name: the installer is on screen
  loop:
    max: 40
    do:
    - wait: 5
    ocr:
      name: cal
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: up
      from: cal
      mode: says_any
      # THE INSTALLER'S FIRST PAGE IS IN SIMPLIFIED CHINESE AND THIS WAIT RUNS BEFORE THE LANGUAGE
      # IS CHANGED, so it must accept the CHINESE title as well as the English one. MEASURED: the
      # page reads `欢迎使用 CachyOS 安装程序`, and a wait for `welcome installer` ran its whole
      # forty attempts against a page that was already up.
      words:
      - - welcome
        - installer
      - - 欢迎
      - - cachyos
        - 安装
    until:
      fact: up

# THE LANGUAGE COMBO IS DRIVEN BY ONE LETTER AND TWO STEPS, MEASURED AND REPRODUCIBLE.
#
# A PREFIX IS NOT ENOUGH. Typing `eng` or `american english` does NOT reach the row, because this
# combo's keyboard search matches ONE KEYSTROKE at a time: each letter jumps to its own entry, so a
# typed string lands wherever the LAST letter's match happens to be. MEASURED, twice:
#
#	typed `eng`                 -> ended on some unrelated row, and the installer came up in Hungarian
#	typed `american english`    -> ended on `euskara` (the last letter's match)
#
# WHAT DOES WORK is one letter that puts the list at the ENGLISH GROUP, then two steps up:
#
#	key `e`      the list jumps to `Esperanto`, and American English is TWO ROWS ABOVE it
#	key `up`     -> British English (United Kingdom)
#	key `up`     -> American English
#	key `ret`    accepts it
#
# THE MEASURED ROWS, in the order they appear:
#
#	Ελληνικά                          Greek
#	American English                  English        <- the target
#	British English (United Kingdom)  English (UK)
#	Esperanto                         Esperanto      <- where `e` lands
#
# SO THE STEPS ARE THREE KEYS, not a typed word, and the reason is the combo's search rather than the
# locale list's order.
# CHOOSING THE LANGUAGE IS A RETRY, NOT A KEY SEQUENCE THAT WORKED ONCE.
#
# MEASURED: two runs of this same file on the same medium produced an ENGLISH installer and then a
# CHINESE one - `CachyOS 安装程序`, `地区`, `区域`, `系统语言将设置为简体中文（中国）`. The five
# keypresses below are the sequence that works, but the combo's list is opened by a click and a click
# can miss, and when it does the keys go to the page instead of the list and the language never
# changes. Nothing noticed, because the check that was supposed to notice read the sidebar.
#
# SO THE WHOLE SEQUENCE IS THE LOOP'S `do:`, and the reading is the welcome page's own English body.
# Each attempt reopens the list from wherever the page is, so a missed click is simply retried.
- name: choose English, retrying until the page says so
  loop:
    max: 6
    do:
    - click: [980, 661]
      wait_after: 4
    - key: e
      wait_after: 2
    - key: up
      wait_after: 1
    - key: up
      wait_after: 1
    - key: ret
      wait_after: 6
    ocr:
      name: english
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: ok
      from: english
      mode: says
      words:
      - - program
      - - questions
    until:
      fact: ok

- name: next from welcome
  click: [1356, 751]
  wait_after: 8

# Location IS LEFT AS IT IS: Asia/Hong Kong and English (Hong Kong SAR China) are the defaults and
# nothing below depends on them. Location -> Keyboard
# `Next` IS NOT AT ONE HEIGHT ON EVERY PAGE, AND LOCATION IS THE ONE THAT MOVED.
#
# MEASURED on Location, row by row across the button's own x range:
#
#	y=770  35   background above
#	y=776  86   the button's top edge
#	y=791 110   the word `Next`
#	y=806  56   its bottom edge
#	y=809  35   background below
#
# SO THIS PAGE'S BUTTON IS CENTRED AT 791 WHILE WELCOME'S IS AT 753. The reason is the map: this page
# carries a 340-row world map between the title and the footer, and Calamares pushes the buttons down
# with it. A click at 753 lands on `The numbers and dates locale will be set to ...` - which selects a
# TIMEZONE on the map rather than advancing, and that is how a run reached Kerguelen.

- name: the location page arrives after welcome
  loop:
    max: 30
    do:
    - wait: 10
    ocr:
      name: at_location
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_location
      mode: says_any
      words:
      - - Region
      - - zone
    until:
      fact: here

- name: next from location
  click: [1356, 791]
  wait_after: 8

# Keyboard -> Bootloader. The Generic 105-key PC and Default layout are the defaults.
- name: the keyboard page arrives after location
  loop:
    max: 30
    do:
    - wait: 10
    ocr:
      name: at_keyboard
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_keyboard
      mode: says_any
      words:
      - - Keyboard
      - - Layout
    until:
      fact: here

# THE KEYBOARD PAGE'S `Next` IS NOT AT THE HEIGHT THE OTHER PAGES' ARE, AND THAT IS MEASURED.
#
# The wizard draws its footer at the bottom of the PAGE CONTENT, and the keyboard page is shorter
# than the partitions page - the same thing Calamares does, and the reason one `Next` coordinate
# does not serve a wizard. MEASURED on the live frame, crop 1150..1520 x 760..840 scaled 4x:
#
#	Back   (1150+500/4, 760+128/4) = (1275, 792)
#	Next   (1150+840/4, 760+128/4) = (1360, 792)      <- this page
#	Cancel (1150+1180/4, 760+128/4) = (1445, 792)
#
# - at y=792, not the y=834 this file used, which is the page-name strip below the footer. That
# click landed on `Keyboard`'s own sidebar entry, so the page never changed and the wait after it
# spent its whole budget: MEASURED, the frame sat on `Keyboard model: | Generic 105-key PC` with
# `next` never pressed.
- name: next from keyboard
  click: [1360, 792]
  wait_after: 8

- name: the bootloader page arrives after keyboard
  loop:
    max: 30
    do:
    - wait: 10
    ocr:
      name: at_bootloader
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_bootloader
      mode: says_any
      words:
      - - snapshot
      - - chainloading
    until:
      fact: here

- name: the bootloader page
  ocr:
    name: boot
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

# GRUB, NOT THE DEFAULT LIMINE, AND THE REASON IS THE FILESYSTEM THIS WALK INSTALLS.
#
# Limine's own description on this page advertises "Btrfs snapshot integration out of the box" - it is
# the choice for a btrfs system. This walk installs ext4, where GRUB is the bootloader that needs no
# btrfs-specific machinery. MEASURED: the list is GRUB / rEFInd / rEFInd + AI SDK / systemd-boot /
# Limine, Limine preselected, and GRUB is at (440, 313).
- name: choose grub
  click: [500, 305]
  wait_after: 5

- name: grub is selected
  ocr:
    name: grub
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

- name: the bootloader is grub
  check:
    name: ok
    from: grub
    mode: says
    words: [grub]

# Bootloader -> Partitions. THIS MEDIUM PRESELECTS NOTHING HERE, so `Erase disk` has to be clicked
# before it is selected - the opposite of Kubuntu, where it is already on.
- name: next from bootloader
  click: [1356, 791]
  wait_after: 10

- name: the partitions page arrives after the bootloader
  loop:
    max: 30
    do:
    - wait: 10
    ocr:
      name: at_partitions
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_partitions
      mode: says_any
      words:
      - - storage
      - - Erase
      - - Manual
    until:
      fact: here

# THE RADIO, NOT THE LABEL. MEASURED on the live frame, crop 400..1100 x 320..460 scaled 2x:
#
#	Erase disk's circle     (400+54/2, 320+92/2)  = (427, 366)
#	Manual partitioning's   (400+54/2, 320+226/2) = (427, 433)
#
# (533, 364) IS ON THE WORD `Erase` AND DOES NOTHING - `label` and `radio` are different widgets, and
# this one's label is not clickable. MEASURED: with that click the page stayed as it booted, `Erase
# disk` unselected and `Next` GREY, so `next from bootloader` pressed nothing and the wait after it
# spent its whole budget on a page that was already there.
- name: select erase disk
  click: [427, 366]
  wait_after: 8

- name: the partitions page with erase selected
  ocr:
    name: parts
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 4

# THE FILESYSTEM COMBO DEFAULTS TO btrfs AND THIS WALK REQUIRES ext4.
#
# MEASURED, and this is the reason the step exists at all: with `Erase disk` selected the page shows
#
#	512.00 MiB FAT32    127.50 GiB btrfs
#
# so accepting the default produces a COW filesystem on a COW disk image. The combo is at (532, 423)
# and its list is btrfs / xfs / ext4 / f2fs / zfs, with ext4 the third entry at (526, 516).
- name: open the filesystem list
  click: [543, 425]
  wait_after: 5

- name: choose ext4
  click: [527, 517]
  wait_after: 6

- name: the partitions page settles after the filesystem list closes
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: at_partitions_again
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_partitions_again
      mode: says_any
      words:
      - - storage
      - - Erase
      - - Manual
    until:
      fact: here

- name: the page after choosing ext4
  ocr:
    name: fs
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

- name: the root partition is ext4
  check:
    name: ext4
    from: fs
    mode: says
    words: [ext4]

# Partitions -> Desktop, where Plasma Desktop is preselected.
- name: next from partitions
  click: [1356, 793]
  wait_after: 10

- name: the desktop page
  ocr:
    name: desk
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

# Desktop -> Packages, where the CachyOS sets are already ticked.
- name: next from desktop
  click: [1356, 793]
  wait_after: 12

- name: the packages page
  ocr:
    name: pkgs
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

# Packages -> Users
- name: next from packages
  click: [1356, 793]
  wait_after: 12

- name: the users page arrives before anything is typed into it
  loop:
    max: 30
    do:
    - wait: 10
    ocr:
      name: at_users
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_users
      mode: says_any
      words:
      - - Computer
      - - Repeat
      - - Password
    until:
      fact: here

- name: the users page
  ocr:
    name: users
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 4

# THE FIVE FIELDS, MEASURED FROM THE PAGE. `Computer Name` IS NOT FILLED BY HAND: this installer
# derives `cachyos-x8664` from the live host name once the full name is typed, and overwriting it is a
# step that can only go wrong.
- name: the full name
  click: [515, 341]
  type: '{{ user }}'
  wait_after: 3

- name: the login name
  click: [515, 412]
  clear: true
  type: '{{ user }}'
  wait_after: 3

- name: the password
  click: [515, 550]
  type: '{{ password }}'
  wait_after: 2

- name: the password again
  click: [720, 552]
  type: '{{ password }}'
  wait_after: 3

- name: the users page is filled in
  ocr:
    name: filled
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

# THE FORM IS COMPLETE WHEN THE USER NAME IS THERE AND NO MISMATCH IS SHOWN.
#
# `Password is too short` IS A WARNING, NOT A REFUSAL - measured, the installer proceeds and sets it.
# So `short` is deliberately NOT in `without:`; `match` is, because two different passwords is a real
# refusal.
- name: the password was accepted
  check:
    name: ok
    from: filled
    mode: says_without
    words: [vmuser]
    without: [match]

# Users -> Summary
- name: next from users
  click: [1356, 793]
  wait_after: 10

- name: the summary page arrives before install is clicked
  loop:
    max: 30
    do:
    - wait: 10
    ocr:
      name: at_summary
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 3
    check:
      name: here
      from: at_summary
      mode: says_any
      words:
      - - overview
      - - happen
    until:
      fact: here

- name: the summary page
  ocr:
    name: summary
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 4

# THE SUMMARY SAYS ext4 IN WORDS, WHICH IS THE SECOND INDEPENDENT READING OF THE FILESYSTEM - the
# first being the partitions page after the combo was changed.
- name: the summary names ext4
  check:
    name: ext4
    from: summary
    mode: says
    words: [ext4]

# Summary -> the confirmation dialog. `Install` IS LOWER THAN `Next`: on the summary page the buttons
# sit at y=887 rather than y=791, measured - which is why a shared coordinate for both pages clicks
# the summary's progress text and nothing happens.
- name: start the install
  click: [1362, 872]
  wait_after: 10

- name: the confirmation dialog
  ocr:
    name: confirm
    region: [0, 0, 1920, 1080]
    region_at: [1920, 1080]
    scale: 1
    wait: 3

# `Install Now` INSIDE THE DIALOG, AT (1055, 616). The dialog's title is the check, so a click that
# missed it is visible as a page with no dialog rather than as a silent no-op.
- name: install now
  click: [1055, 617]
  wait_after: 25

# THE INSTALL WRITES FOR TWENTY MINUTES AND THE PROGRESS BAR IS THE ONLY SIGNAL. `disk_settle` waits
# for the DISK to stop changing rather than for a clock.
- name: the install writes the disk
  disk_settle: 300
  disk_min_mb: 4000
  timeout: 3600
  poll: 20
  keep_alive: true

- name: the install is done
  loop:
    max: 80
    do:
    - wait: 15
    ocr:
      name: done
      region: [0, 0, 1920, 1080]
      region_at: [1920, 1080]
      scale: 1
      wait: 0
    check:
      name: finished
      from: done
      mode: says
      words: [installed]
    until:
      fact: finished

# `kill`, AND THE RULE IS MEASURED RATHER THAN PREFERRED: a live installer does not answer the power
# button, and `TestAnInstallStopsTheMachineBeforePublishingTheDisk` carries the zorin run where five
# minutes of ACPI ended in the same kill - after which `qemu-img convert` read a disk qemu was still
# releasing and wrote ZERO BYTES.
- name: stop the machine
  shutdown: kill
  timeout: 600

- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
