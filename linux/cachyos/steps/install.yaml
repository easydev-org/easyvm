name: cachyos - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: cachyos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: cachyos
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: let the desktop settle
  wait: 15
  keep_alive: true
- name: open the installer
  at:
  - 960
  - 743
  repeat:
  - 2
  - 0.8
  settle: 35
  expect_any:
  - - welcome
  - - location
- name: open the installer (once more, if it did not)
  unless:
  - welcome
  at:
  - 960
  - 743
  repeat:
  - 2
  - 0.8
  settle: 40
- name: welcome
  at:
  - 1352
  - 747
  settle: 20
- name: location
  at:
  - 1352
  - 796
  settle: 20
- name: keyboard
  at:
  - 1352
  - 796
  settle: 22
- name: bootloader
  at:
  - 1352
  - 796
  settle: 22
- name: partitions - erase the disk
  at:
  - 465
  - 367
  settle: 10
- name: partitions
  at:
  - 1352
  - 796
  settle: 20
- name: the erase confirmation's continue (if it is shown)
  at:
  - 1010
  - 640
  settle: 3
- name: desktop
  at:
  - 1352
  - 796
  settle: 22
- name: packages
  at:
  - 1352
  - 796
  settle: 25
- name: users - full name
  at:
  - 516
  - 348
  type: '{{ user }}'
  settle: 2
- name: users - login name
  at:
  - 516
  - 413
  type: '{{ user }}'
  settle: 2
- name: users - password
  at:
  - 516
  - 546
  type: '{{ password }}'
  settle: 2
- name: users - confirm password
  at:
  - 729
  - 546
  type: '{{ password }}'
  settle: 3
- name: users
  at:
  - 1352
  - 796
  settle: 25
- name: summary - install
  at:
  - 1365
  - 902
  settle: 18
- name: the install confirmation's install now
  at:
  - 1018
  - 620
  settle: 30
- name: the installer finishes
  until_any:
  - - all
    - done
  - - you
    - may
    - now
  - - installation
    - complete
  - - reboot
    - now
  - - restart
    - now
  - - todo
    - listo
  - - instalación
    - completada
  region:
  - 0
  - 0
  - 1920
  - 1080
  region_at:
  - 1920
  - 1080
  scale: 1
  timeout: 3600
  poll: 20
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
