name: cachyos - the Calamares walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: cachyos-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: cachyos
  asset: linux_iso
- name: boot the installer
  boot: true
  os: linux
  iso: installer_iso
  timeout: 1800
- name: wait for the live desktop
  desktop: linux
  timeout: 5400
  poll: 5
  keep_alive: true
- name: let the desktop settle
  wait: 15
  keep_alive: true
- name: open the installer
  expect_any:
  - - welcome
  - - location
  wait_after: 35
  do:
  - at:
    - 960
    - 743
    wait_after: 0.8
  - at:
    - 960
    - 743
    wait_after: 0.8
- name: open the installer (once more, if it did not)
  unless:
  - welcome
  wait_after: 40
  do:
  - at:
    - 960
    - 743
    wait_after: 0.8
  - at:
    - 960
    - 743
    wait_after: 0.8
- name: welcome
  at:
  - 1352
  - 747
  wait_after: 20
- name: location
  at:
  - 1352
  - 796
  wait_after: 20
- name: keyboard
  at:
  - 1352
  - 796
  wait_after: 22
- name: bootloader
  at:
  - 1352
  - 796
  wait_after: 22
- name: partitions - erase the disk
  at:
  - 465
  - 367
  wait_after: 10
- name: partitions
  at:
  - 1352
  - 796
  wait_after: 20
- name: the erase confirmation's continue (if it is shown)
  at:
  - 1010
  - 640
  wait_after: 3
- name: desktop
  at:
  - 1352
  - 796
  wait_after: 22
- name: packages
  at:
  - 1352
  - 796
  wait_after: 25
- name: users - full name
  at:
  - 516
  - 348
  type: '{{ user }}'
  wait_after: 2
- name: users - login name
  at:
  - 516
  - 413
  type: '{{ user }}'
  wait_after: 2
- name: users - password
  at:
  - 516
  - 546
  type: '{{ password }}'
  wait_after: 2
- name: users - confirm password
  at:
  - 729
  - 546
  type: '{{ password }}'
  wait_after: 3
- name: users
  at:
  - 1352
  - 796
  wait_after: 25
- name: summary - install
  at:
  - 1365
  - 902
  wait_after: 18
- name: the install confirmation's install now
  at:
  - 1018
  - 620
  wait_after: 30
- name: the installer finishes
  loop:
    max: 180
    do:
    - at:
      - 420
      - 300
      wait_after: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - all
        - done
      - - you
        - may
        - now
      - - installation
        - complete
      - - reboot
        - now
      - - restart
        - now
      - - todo
        - listo
      - - instalación
        - completada
    until:
      fact: done
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
