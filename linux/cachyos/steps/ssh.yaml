name: linux-cachyos - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
steps:
- name: start recording
  record: cachyos-ssh.mp4
- name: boot the disk
  boot: true
  os: linux
  timeout: 900
- name: greeter - wake the screen
  key: esc
  settle: 5
  optional: true
- name: greeter - the user tile
  at:
  - 960
  - 488
  settle: 4
  optional: true
- name: greeter - the password box
  at:
  - 936
  - 628
  type: '{{ password }}'
  clear: false
  settle: 4
  optional: true
- name: greeter - submit
  key: ret
  settle: 12
  optional: true
- name: wait for the desktop
  desktop: linux
  timeout: 900
  poll: 5
- name: open the terminal
  key: ctrl+alt+t
  settle: 20
- name: install openssh
  run: echo {{ password }} | sudo -S pacman -Sy --noconfirm --needed openssh 2>&1 | tail -5
  terminal_wait: 0
  settle: 45
- name: allow password authentication
  run: echo {{ password }} | sudo -S -p '' sh -c 'mkdir -p /etc/ssh/sshd_config.d; printf "PasswordAuthentication yes\n" > /etc/ssh/sshd_config.d/99-vm.conf; sed -i "s/^#\?\s*PasswordAuthentication.*/PasswordAuthentication
    yes/" /etc/ssh/sshd_config; grep -q "^PasswordAuthentication yes" /etc/ssh/sshd_config || printf "PasswordAuthentication yes\n" >> /etc/ssh/sshd_config' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: enable sshd at boot
  run: echo {{ password }} | sudo -S systemctl enable sshd 2>&1 | tail -3
  terminal_wait: 0
  settle: 8
- name: prove the setting took
  run: echo {{ password }} | sudo -S sh -c 'sshd -T 2>/dev/null | grep -i "^passwordauthentication" || echo PASSWORDAUTH-UNREADABLE' 2>&1 | tail -3
  terminal_wait: 0
  settle: 3
- name: start sshd
  run: echo {{ password }} | sudo -S systemctl restart sshd 2>&1 | tail -3
  terminal_wait: 0
  settle: 10
- name: prove sshd is active
  run: systemctl is-active sshd
  terminal_wait: 0
  settle: 5
- name: open the firewall for ssh
  run: echo {{ password }} | sudo -S sh -c "ufw allow 22/tcp; ufw status | head -6" 2>&1 | tail -8
  terminal_wait: 0
  settle: 8
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: make sure the host keys exist
  ssh: 'set -e

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' mkdir -p /etc/ssh

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' ssh-keygen -A 2>&1 | tail -4

    echo "--- the keys ---"

    ls -l /etc/ssh/ssh_host_*_key | head -8

    echo "--- and the one sshd needs first ---"

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' test -s /etc/ssh/ssh_host_ed25519_key

    '
  timeout: 120
- name: restart sshd now that the keys are on disk
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' systemctl restart sshd 2>&1 | tail -3

    sleep 2

    systemctl is-active sshd

    ss -lnt 2>/dev/null | grep '':22 '' || apt-get --version >/dev/null 2>&1 || true

    '
  timeout: 180
- name: enable sshd again, over ssh, where the exit status is readable
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' systemctl enable --now sshd 2>&1 | tail -3

    systemctl is-enabled sshd

    test "$(systemctl is-enabled sshd)" = "enabled"

    '
  timeout: 180
- name: prove sshd will start at boot
  ssh: 'set -e

    echo "is-enabled: $(systemctl is-enabled sshd)"

    echo "is-active:  $(systemctl is-active sshd)"

    echo "wants:      $(ls /etc/systemd/system/multi-user.target.wants/sshd.service 2>&1)"

    test "$(systemctl is-enabled sshd)" = "enabled"

    test -L /etc/systemd/system/multi-user.target.wants/sshd.service

    '
  timeout: 120
- name: leave the sshd diagnosis where a later boot can read it
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  {\n    echo \"=== $(date) writing the diagnosis before the reboot ===\"\n    echo \"--- is-enabled / is-active / is-failed ---\"\n    systemctl\
    \ is-enabled sshd; systemctl is-active sshd; systemctl is-failed sshd\n    echo \"--- the unit that is enabled ---\"\n    systemctl cat sshd 2>&1 | head -30\n    echo \"--- the symlinks that would start\
    \ it ---\"\n    ls -l /etc/systemd/system/*.wants/sshd* /etc/systemd/system/sshd* 2>&1\n    echo \"--- masked? ---\"\n    systemctl is-enabled sshd 2>&1\n    echo \"--- host keys ---\"\n    ls -l /etc/ssh/ssh_host_*_key\
    \ 2>&1\n    echo \"--- the journal of this boot ---\"\n    journalctl -b -u sshd --no-pager 2>&1 | tail -20\n  } > /var/log/easyvm-sshd.txt 2>&1\n  chmod 644 /var/log/easyvm-sshd.txt\n  echo \"wrote\
    \ $(wc -l < /var/log/easyvm-sshd.txt) lines to /var/log/easyvm-sshd.txt\"'\n"
  timeout: 180
- name: enable the socket as well, for a boot where the service does not start
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  systemctl enable --now sshd.socket 2>&1 | tail -3\n  systemctl is-enabled sshd.socket 2>&1 || true'\n"
  timeout: 180
  optional: true
- name: restart the machine
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' systemctl reboot

    '
  timeout: 60
  optional: true
- name: come back up with sshd answering
  require_ssh: true
  ssh_after_reboot: true
  timeout: 900
- name: read what this boot did
  ssh: 'set -e

    echo "--- identity, over a connection that did not exist when sshd was installed ---"

    id -un; hostname

    echo "--- is-enabled / is-active ---"

    systemctl is-enabled sshd; systemctl is-active sshd

    echo "--- the unit''s own account of this start ---"

    journalctl -b -u sshd --no-pager 2>&1 | tail -12

    test "$(systemctl is-enabled sshd)" = "enabled"

    test "$(systemctl is-active sshd)" = "active"

    '
  timeout: 120
- name: stop recording
  record: false
