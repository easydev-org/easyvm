name: macos 26 ssh - the setup assistant, remote login, and a graceful shutdown
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    # `admin`, NOT `vmuser`, AND IT MATCHES macos15 ON PURPOSE. The two files had different defaults -
    # 15 used `admin` and 26 used `vmuser` - so a reader who had driven one chain would fail to log in
    # to the other's disk, and the failure looks like a wrong password rather than a wrong file.
    #
    # THE USER NAME IS `vmuser` IN BOTH and stays that way: `ssh_user: vmuser` is the account the stage
    # creates, and `id -un` over ssh answers that name.
    default: admin
  out:
    from: args.out
    default: out/macos26-ssh.qcow2
  shutdown:
    from: args.shutdown
    default: acpi
boot_disk: from_caller
steps:
- name: the media this stage boots from is already on disk
  require:
  - boot.img
  - macos.rom
  - macos.vars
- name: start recording
  record: macos26-ssh.mp4
- name: boot the disk
  boot: true
  os: macos
  # THE SAME 12288 THE SETUP STAGE USES, because this stage continues on the disk that one produced
  # and a guest that could install at 12 GiB must boot at 12 GiB. See macos/26/steps/setup.yaml for
  # the measurement: 16 GiB is killed on a 15 GiB runner, and a 12 GiB guest's qemu RSS plateaus at
  # 12.01 GiB with the install advancing normally.
  memory_mb: 12288
  timeout: 900
- name: answer the wizard until the desktop appears
  loop:
    # NINETY ATTEMPTS, BECAUSE THIS LOOP OWNS THREE THINGS THAT EACH COST A BOOT.
    #
    # MEASURED: forty was not enough and the failure said so - "the loop ran 40 attempt(s) and the
    # condition never held" - because the walkthrough spent its whole budget on Analytics (the
    # too-short wait this file no longer has) and never reached the panes after it. The loop also
    # answers the update pane by resetting the guest (issue #3's Defect 1: that pane never advances)
    # and then the login window, and each reset costs a full boot inside a single attempt.
    #
    # TWO HUNDRED NOW, BECAUSE THE WIZARD RUNS TWICE. MEASURED ON THIS STAGE'S OWN RUN: after the login
    # the Setup Assistant came back and asked Apple Account, Location Services, Analytics, FileVault and
    # the update pane AGAIN - issue #3 records the same thing ("on the run where Apple ID had NOT been
    # skipped, Continue went backwards to the Apple ID pane"), and it means one pass through this loop
    # answers about fifteen panes, then a reboot for the update pane, then a login, then ANOTHER fifteen.
    #
    # Ninety attempts was measured to run out mid-way: the run ended at the login window with
    # "the loop ran 90 attempt(s) and the condition never held" after the walk had already reached the
    # second pass's Update pane. Two hundred attempts at this step's pace is about eighty minutes, which
    # is the two passes plus two reboots.
    max: 200
    do:
    - name: read the pane
      ocr:
        name: pane
        region:
        - 0
        - 0
        - 1920
        - 1080
        region_at:
        - 1920
        - 1080
        scale: 1
        wait: 0
    - name: classify - country or region
      check:
        name: country
        from: pane
        mode: says
        words:
        - select
        - your
        - country
        - or
        - region
    - name: classify - transfer
      check:
        name: transfer
        from: pane
        mode: says
        words:
        - transfer
        - your
        - information
        - to
        - this
        - mac
    - name: classify - account
      check:
        name: account
        from: pane
        mode: says
        words:
        - create
        - a
        - mac
        - account
    - name: classify - apple account
      check:
        name: apple_account
        from: pane
        mode: says
        words:
        - sign
        - in
        - to
        - your
        - apple
        - account
    - name: classify - the apple account sheet
      check:
        name: apple_sheet
        from: pane
        mode: says
        words:
        - sure
        - skip
        - signing
    - name: classify - terms
      check:
        name: terms
        from: pane
        mode: says
        words:
        - terms
        - conditions
    - name: classify - age
      check:
        name: age
        from: pane
        mode: says
        words:
        - age
        - range
    - name: classify - location
      check:
        name: location
        from: pane
        mode: says
        words:
        - enable
        - location
        - services
    - name: classify - the location sheet
      check:
        name: location_sheet
        from: pane
        mode: says
        words:
        - find
        - my
        - available
    - name: classify - time zone
      check:
        name: time_zone
        from: pane
        mode: says
        words:
        - time
        - zone
    - name: classify - analytics
      check:
        name: analytics
        from: pane
        mode: says
        words:
        - analytics
        - improve
    - name: classify - data and privacy
      check:
        name: privacy_pane
        from: pane
        mode: says
        words:
        - privacy
        - fundamental
    - name: classify - spoken languages
      check:
        name: languages
        from: pane
        mode: says
        words:
        - spoken
        - languages
    - name: classify - accessibility
      check:
        name: accessibility
        from: pane
        mode: says
        words:
        - accessibility
        - individual
    - name: classify - screen time
      check:
        name: screen_time
        from: pane
        mode: says
        words:
        - screen
        - time
    - name: classify - filevault
      check:
        name: filevault
        from: pane
        mode: says
        words:
        - ready
        - encrypting
    - name: classify - the filevault sheet
      check:
        name: filevault_sheet
        from: pane
        mode: says
        words:
        - securely
        - encrypted
    - name: classify - look
      check:
        name: look
        from: pane
        mode: says
        words:
        - choose
        - your
        - look
    - name: classify - update
      check:
        name: update
        from: pane
        mode: says
        words:
        - update
        - mac
        - automatically
    - name: classify - keyboard
      check:
        name: keyboard
        from: pane
        mode: says
        words:
        - keyboard
        - assistant
    - name: spoken languages
      if: languages
      then:
      - name: languages continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: accessibility
      if: accessibility
      then:
      - name: accessibility not now
        click:
        - 1284
        - 799
        wait_after: 7
    - name: data and privacy
      if: privacy_pane
      then:
      - name: privacy continue
        click:
        - 1284
        - 799
        wait_after: 8
    - name: transfer your data
      if: transfer
      then:
      - name: choose not to transfer
        click:
        - 742
        - 712
        wait_after: 3
      - name: transfer continue
        click:
        - 1284
        - 799
        wait_after: 8
    - name: country or region
      if: country
      then:
      - name: focus the country list
        click:
        - 900
        - 470
        wait_after: 2
      - name: type the country
        type: united states
        wait_after: 3
      - name: country continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: the account, which is what this whole stage exists for
      if: account
      then:
      - name: account full name
        click:
        - 959
        - 496
        wait_after: 2
      - name: account full name text
        type: '{{ user }}'
        wait_after: 2
      - name: account short name
        click:
        - 959
        - 530
        wait_after: 2
      - name: clear the auto-filled short name
        key: meta_l+a
        wait_after: 1
      - name: delete it
        key: backspace
        wait_after: 1
      - name: account short name text
        type: '{{ user }}'
        wait_after: 2
      - name: account password
        click:
        - 841
        - 601
        wait_after: 2
      - name: account password text
        type: '{{ password }}'
        wait_after: 2
      - name: account verify
        click:
        - 1068
        - 601
        wait_after: 2
      - name: account verify text
        type: '{{ password }}'
        wait_after: 2
      - name: untick the apple account reset
        click:
        - 745
        - 663
        wait_after: 2
      - name: account continue
        click:
        - 1284
        - 799
        wait_after: 180
    - name: apple account - other sign-in options, then later
      if: apple_account
      then:
      - name: open other sign-in options
        click:
        - 620
        - 800
        wait_after: 4
      - name: sign in later
        click:
        - 682
        - 853
        wait_after: 7
    - name: the apple account confirmation sheet
      if: apple_sheet
      then:
      - name: skip the apple account
        click:
        - 1017
        - 644
        wait_after: 8
    - name: terms and conditions
      if: terms
      then:
      - name: terms agree
        click:
        - 1282
        - 799
        wait_after: 7
      - name: licence agree
        click:
        - 1019
        - 616
        wait_after: 8
    - name: age range
      if: age
      then:
      - name: choose adult
        click:
        - 959
        - 710
        wait_after: 7
    - name: location services
      if: location
      then:
      - name: location continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: the location confirmation sheet
      if: location_sheet
      then:
      - name: dont use location services
        click:
        - 959
        - 575
        wait_after: 7
    - name: time zone
      if: time_zone
      then:
      - name: time zone continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: analytics - untick sharing first
      if: analytics
      then:
      - name: untick share analytics
        # (742,521) IS THE CHECKBOX, MEASURED ON THE RUN THAT FAILED HERE: the blue tick spans
        # x=735..750, y=514..529 on a 1920x1080 frame, so (745,520) was inside it and the click was
        # never the problem - the WAIT was. `wait_after: 2` pressed Continue before the tick had been
        # taken, that press did nothing, and the loop spent all forty attempts on this pane:
        #
        #	answer the wizard until the desktop appears: the loop ran 40 attempt(s) and the
        #	condition never held
        #
        # Measured by hand on the same frame: one click unticked it and one press of Continue reached
        # Screen Time. Five seconds is the settle this workbench gives a checkbox.
        click:
        - 742
        - 521
        wait_after: 5
      - name: analytics continue
        click:
        - 1281
        - 799
        wait_after: 9
    - name: screen time
      if: screen_time
      then:
      - name: screen time later
        click:
        - 1131
        - 799
        wait_after: 7
    - name: filevault
      if: filevault
      then:
      - name: filevault not now
        click:
        - 1129
        - 799
        wait_after: 8
    - name: the filevault confirmation sheet
      if: filevault_sheet
      then:
      - name: continue without filevault
        click:
        - 1004
        - 598
        wait_after: 8
    - name: choose your look
      if: look
      then:
      - name: look continue
        click:
        - 1284
        - 799
        wait_after: 9
    - name: the keyboard assistant, which eats the next keystroke
      if: keyboard
      then:
      - name: keyboard quit
        # (1133,816), MEASURED ON THIS GUEST'S OWN FRAME. (1228,826) came from 15 and lands past the
        # Quit button on 26: the sheet's two buttons sit at x=1069..1196 and x=1211..1339, y=802..830,
        # so 1228 was inside CONTINUE - and a Continue there walks further into the keyboard setup
        # instead of dismissing it, leaving the dialog over System Settings for the rest of the run.
        click:
        - 1133
        - 816
        wait_after: 10
    - name: update mac automatically - reset past it
      if: update
      then:
      # THE UPDATE PANE NEVER ADVANCES, SO A RESET IS WHAT MOVES IT - AND THE LOGIN THAT FOLLOWS IS A
      # FIXED SEQUENCE, NOT SOMETHING THIS LOOP TRIES TO RECOGNISE.
      #
      # WHY FIXED AND NOT DETECTED, MEASURED ON THE RUN THAT REACHED THE LOGIN WINDOW: that window
      # shows a clock and two small words, and tesseract read the clock as "5: AS". The pattern
      # `[0-9]+[:.][0-9]+` that used to stand here therefore matched nothing, `at_login` was false on
      # every attempt, and the walk sat at the login window until its ceiling - the frame was fine,
      # the READING was not, and no word list fixes a clock read as noise.
      #
      # WHAT IS RELIABLE IS THE ORDER, because issue #3 measured it: resetting past the update pane
      # lands on the login window every time. So the reset is followed by a wait and then by the three
      # presses, unconditionally.
      #
      # ONE HUNDRED AND TWENTY SECONDS, NOT SIXTY. A CI runner boots this guest far slower than the
      # workbench does (the same install took ~40 minutes there against ~25 here), and typing into a
      # password field that does not exist yet spends the attempt and leaves the walk at a window it
      # can no longer see.
      - name: reset the guest
        reboot: true
        timeout: 300
      # THREE MINUTES, NOT TWO, AND THE MEASUREMENT IS THIS STAGE'S OWN FAILURE.
      #
      # At `wait: 120` the loop then pressed the password field and typed into it, and the login
      # window still had an EMPTY field at the end of the run - 90 attempts, all wasted:
      #
      #	answer the wizard until the desktop appears: the loop ran 90 attempt(s) and the condition
      #	never held
      #
      # The same machine accepted the same three presses BY HAND five minutes after the reset, so the
      # coordinates and the sequence were right and the WAIT was not: the field is drawn before it
      # accepts a keystroke, and the click that arrives too early leaves it unfocused.
      #
      # `esc` FIRST, because a login window that has just appeared can be behind a screen-saver style
      # fade that eats the first click.
      - name: let the login window come up
        # FIVE MINUTES, BECAUSE THREE WAS MEASURED TO BE TOO SHORT.
        #
        # At `wait: 180` the loop then pressed the field and typed into it, and the run ended with the
        # field EMPTY after ninety attempts. The same guest accepted the same presses BY HAND a few
        # minutes later. So the field is drawn long before it accepts a keystroke, and the window is
        # wider than three minutes on this host. Five is what the hand-run needed.
        wait: 300
      - name: wake the window before pressing it
        key: esc
        wait_after: 3
      - name: click the password field
        click:
        - 960
        - 983
        wait_after: 5
      - name: type the password
        type: '{{ password }}'
        wait_after: 2
      - name: press return
        key: ret
        wait_after: 30
    ocr:
      name: wizard
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: finished
      from: wizard
      mode: says_without
      words:
      - finder
      # `back` WAS IN THIS LIST AND IT IS NOT A WIZARD WORD ON A DESKTOP. MEASURED on this stage's own
      # run: the desktop read
      #
      #	@ Finder File Edit View Go Window Help ... Click Wallpaper to Show Desktop Items ...
      #	... Click again to bring windows BACK. You can change this in System Settings ...
      #
      # - macOS's own "Click Wallpaper to Show Desktop Items" bubble uses BACK, so the test answered
      # "a wizard page is on screen" about a desktop and the loop never ended. `continue` and `later`
      # are the wizard's BUTTON LABELS and appear on no desktop; `back` is ordinary English.
      without:
      - continue
      - later
    until:
      fact: finished
- name: wait for the desktop
  loop:
    max: 30
    do:
    - wait: 10
    - key: esc
    ocr:
      name: desk
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: ready
      from: desk
      mode: says_without
      words:
      - finder
      # `back` WAS IN THIS LIST AND IT IS NOT A WIZARD WORD ON A DESKTOP. MEASURED on this stage's own
      # run: the desktop read
      #
      #	@ Finder File Edit View Go Window Help ... Click Wallpaper to Show Desktop Items ...
      #	... Click again to bring windows BACK. You can change this in System Settings ...
      #
      # - macOS's own "Click Wallpaper to Show Desktop Items" bubble uses BACK, so the test answered
      # "a wizard page is on screen" about a desktop and the loop never ended. `continue` and `later`
      # are the wizard's BUTTON LABELS and appear on no desktop; `back` is ordinary English.
      without:
      - continue
      - later
    until:
      fact: ready
# THE DESKTOP HAS THREE WINDOWS ON IT AFTER THE FIRST LOGIN, AND NOTHING THIS FILE TRIED CLOSED
# THE ONE THAT MATTERED.
#
# MEASURED ON THIS STAGE'S OWN RUN, at the frame where `Cmd+F` was supposed to focus the settings
# search field: the screen held
#
#	Finder   "Searching This Mac" - a Finder SEARCH WINDOW, opened by `Cmd+F` itself
#	Keyboard Setup Assistant
#	System Settings, on General
#
# `Cmd+F` HAD GONE TO FINDER, not to Settings, because Finder was the key window. Its check had said
# the settings window was up - `says_any: [general] / [wi-fi]` matches the Finder sidebar's own
# `Applications`, `Desktop`, `Downloads` and a Settings window that was merely BEHIND - so the step
# believed it had a settings window and typed into a Finder search.
#
# THE FIX IS IN TWO PARTS, AND BOTH ARE NEEDED:
#
#  1. CLOSE EVERYTHING FIRST. `Cmd+Q` repeated, because each press closes one app and there are two
#     (Finder and the keyboard assistant). A press that closes nothing is harmless.
#  2. PROVE THE SETTINGS WINDOW HAS FOCUS before `Cmd+F`, by reading the MENU BAR - every app names
#     itself there, and that is the one part of the screen that does not move with any window.
# THE SETTINGS WINDOW IS TAKEN FULL SCREEN, AND THAT IS WHAT MAKES ITS COORDINATES FACTS.
#
# MEASURED, NINE RUNS: macOS remembers System Settings' origin from the previous session, so on this
# stage's own frames its search field sat at y=285, y=317 and y=345, and the "Remote login" result row
# at y=336, y=343, y=355, y=358, y=387 and y=389. EVERY coordinate inside the window was a guess about
# a position that had changed since the last boot. Three commits tried to correct the row's height, and
# the height was never the problem - the window was.
#
# THE GREEN BUTTON IS THE ONE PART OF THE WINDOW THAT DOES NOT MOVE, AND IT IS DRAWN IN A FIXED COLOUR.
# Measured on this guest's own frame: `rgb(52,199,89)`, a 12x12 blob at (669,223) on the run where the
# window sat at x=611. `at_color:` finds that blob wherever the window is, presses its centre, and the
# window fills the screen. AFTER THAT, EVERY COORDINATE IN THE PANE IS MEASURED ONCE AND HOLDS.
#
# THE OLD `(40,200,64)` THIS REPOSITORY QUOTES IS FROM A DIFFERENT macOS: on 26 the button is
# `(52,199,89)`, and `color_tolerance: 30` bridges the antialiasing between them.
#
# THE FINDER WINDOW IS CLOSED FIRST, BY ITS OWN RED BUTTON RATHER THAN `Cmd+Q` - a quit can close an
# app the walk still needs, and the red button closes one window. MEASURED: `Cmd+F` went to Finder
# because Finder was the key window, and the search was typed into a Finder search box.
- name: open spotlight
  key: meta_l+spc
  wait_after: 5
- name: type the settings app name
  type: system settings
  wait_after: 6
- name: open it
  key: ret
  wait_after: 16
- name: the settings window is up
  loop:
    max: 25
    do:
    - wait: 3
    ocr:
      name: menubar
      region:
      - 0
      - 0
      - 700
      - 40
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: menubar
      # `says_any`, NOT `says`, BECAUSE TESSERACT READS THE NAME AS ONE WORD.
      #
      # MEASURED on this stage's own run: the menu bar reading was
      #
      #	@ SystemSettings Edit View Window Help
      #
      # - `SystemSettings`, no space - and a `says: [system, settings]` check then matched nothing for
      # twenty-five attempts and failed the stage on a screen that was plainly correct. macOS draws the
      # app name as two words and the OCR joins them, so both spellings have to be accepted.
      mode: says_any
      words:
      - - systemsettings
      - - system
        - settings
    until:
      fact: done
# THE WINDOW IS FULL SCREEN NOW, SO NOTHING BELOW GUESSES WHERE IT IS.
#
# `at_color:` TAKES THE GREEN ZOOM CONTROL's fill, which macOS paints in a fixed colour on every run at
# every window height. The press is the window's own button, not a coordinate in it.
- name: take the settings window full screen
  at_color:
  - 52
  - 199
  - 89
  color_tolerance: 30
  # THE TOP OF THE WINDOW, AND THE BOTTOM EDGE OF THIS STRIP WAS MEASURED WRONG ONCE ALREADY.
  #
  # MEASURED ON THIS STAGE'S OWN RUN: `color_region: [0, 40, 1920, 260]` found NOTHING - no pixel within
  # tolerance on the whole screen - because the traffic lights sat at y=262..275 on that run and the
  # strip ended at 260, two pixels above them. The step then failed thirty times saying the control "is
  # not drawn", which reads as a wrong colour and was a wrong rectangle.
  #
  # 420 IS THE WHOLE TITLE AREA OF A WINDOW THAT CAN SIT ANYWHERE IN THE TOP HALF. The green also appears
  # in the menu bar's battery icon at y≈0..20 and in some pane icons, both ABOVE 420 and both inside the
  # window's own body - and the traffic lights are the largest green blob in this strip by an order of
  # magnitude, which is what `screen.FindColor` returns.
  color_region:
  - 0
  - 40
  - 1920
  - 420
  wait_after: 6
# A FULL-SCREEN WINDOW HAS NO TRAFFIC LIGHTS, SO THE NEXT RUN'S SEARCH STILL HAS TO WORK. `Cmd+F` is
# kept for the search field because a full-screen window has focus by construction - that was the whole
# reason `Cmd+F` used to fail.
- name: the window fills the screen
  loop:
    max: 15
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 120
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      # THE SAME JOINED WORD AS THE MENU BAR: measured `SystemSettings`. A full-screen window on 26
      # shows the name in the title strip, and tesseract reads it without the space.
      mode: says_any
      words:
      - - systemsettings
      - - system
        - settings
    until:
      fact: done
- name: focus the settings search field
  # `Cmd+F` IS THE SYSTEM SETTINGS SEARCH SHORTCUT, AND IT IS USED HERE BECAUSE THE FIELD MOVES.
  #
  # MEASURED ON TWO CONSECUTIVE RUNS OF THIS STAGE: the settings window landed with its search field at
  # y=285 on one boot and y=317 on the next, because the window remembers its own position and macOS
  # puts it wherever it last was. A press at (714,285) then lands in the sidebar instead of the field,
  # the typing goes nowhere, and `the remote login result is on screen` waits forty-five times for a
  # search nobody typed.
  #
  # A KEYBOARD SHORTCUT DOES NOT CARE WHERE THE WINDOW IS. `Cmd+F` focuses the search field on macOS
  # 13 and later, which is what this needs and what no absolute coordinate can promise.
  key: meta_l+f
  wait_after: 3
- name: search for remote login
  type: remote login
  clear: true
  modifier: meta_l
  wait_after: 10
# AFTER THE WINDOW IS FULL SCREEN, EVERY COORDINATE BELOW WAS MEASURED ONCE AND HOLDS.
#
# THESE ARE NOT THE NUMBERS THIS FILE USED TO CARRY, AND THE DIFFERENCE IS THE POINT. A maximised
# System Settings on macOS 26 puts the search field at y=104 and the `Remote login` result at
# (635,162) - where the windowed form had them at y=285..345 and y=336..389, differently on every
# boot. The full-screen step above is what makes these constants instead of guesses.
#
# MEASURED ON THIS STAGE'S OWN GUEST, dragged through by hand first and then written down:
#
#	search field        (668, 104)
#	Remote login row    (635, 162)
#	the switch          (1138, 348)
#	the sheet's user    (959, 543)     already filled with `vmuser`
#	the sheet's password(959, 584)
#	Modify Settings     (959, 632)     the button's centre, from its blue pixels
#	Done                (1140, 675)
- name: the remote login result is on screen
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 480
      - 60
      - 900
      - 260
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - sharing
        - remote
      - - remote
        - login
    until:
      fact: done
- name: open the remote login pane
  click:
  - 635
  - 162
  wait_after: 14
- name: the remote login pane is up
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      # THE LEFT EDGE IS THE POINT, AND 820 WAS TWENTY PIXELS TOO FAR RIGHT.
      #
      # MEASURED ON THIS STAGE'S OWN RUN, in the live panel: the reading was
      #
      #	ote Login: Off ... isk access for remote users
      #
      # - `Remote Login` and `Disk access` both missing their first letters, because the sheet starts at
      # x≈750 and this crop started at 820. The check then found no "allow full disk access" in a panel
      # that said it plainly, for thirty attempts.
      #
      # 720 IS THE SHEET'S OWN LEFT EDGE minus a margin, and 1250 is past its right.
      region:
      - 720
      - 250
      - 1250
      - 480
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - allow
        - full
        - disk
        - access
    until:
      fact: done
# THE SWITCH ASKS FOR THE ACCOUNT PASSWORD, AND THE SHEET'S OWN BUTTON IGNORES A CLICK.
#
# MEASURED BY HAND ON THIS GUEST, PRESS BY PRESS:
#
#	(959, 584)  put the password in the field   - the field is drawn before it accepts a keystroke, so
#	                                              the press is followed by FOUR SECONDS, and a press
#	                                              that types sooner leaves the field empty
#	(959, 632)  Modify Settings                 - a press here did nothing three times until the
#	                                              coordinate was the button's own CENTRE; 607 is
#	                                              twenty-five pixels high, between the field and it
#
# The user name field is already filled with `vmuser` by the system, and it is the ACCOUNT that matters
# here - the password is this stage's `{{ password }}`, which is `admin`.
# THE SHEET MOVES TOO, SO THE SWITCH IS PRESSED AT EACH HEIGHT IT HAS BEEN MEASURED AT.
#
# MEASURED ON TWO RUNS WITH THE WINDOW FULL SCREEN BOTH TIMES: the sheet's top edge was at y=305 on
# one and y=356 on the next, so its switch was at y=348 and then y=389 and its password field at 584
# and then 625. The sheet hangs in the window's body, and the body's height depends on how much of
# the title area the previous pane left - so the offset is not a constant either.
#
# THREE ATTEMPTS AT THE THREE MEASURED OFFSETS, with the same sensor between them: the sheet itself.
# `unless: [log, in, to, this, computer]` is false until the switch has taken, so a press that lands on
# nothing costs one attempt.
- name: turn remote login on - first offset
  unless: [log, in, to, this, computer]
  region: [720, 250, 1250, 560]
  region_at: [1920, 1080]
  scale: 2
  do:
  - name: press the switch (first)
    click: [1145, 348]
    wait_after: 5
  - name: authorise the change (first)
    click: [959, 584]
    wait_after: 5
  - name: type the password
    type: '{{ password }}'
    wait_after: 4
  - name: confirm
    click: [959, 632]
    wait_after: 15

- name: turn remote login on - second offset
  unless: [log, in, to, this, computer]
  region: [720, 250, 1250, 560]
  region_at: [1920, 1080]
  scale: 2
  do:
  - name: press the switch (second)
    click: [1145, 389]
    wait_after: 5
  - name: authorise the change (second)
    click: [959, 625]
    wait_after: 5
  - name: type the password
    type: '{{ password }}'
    wait_after: 4
  - name: confirm
    click: [959, 673]
    wait_after: 15

- name: turn remote login on - third offset
  unless: [log, in, to, this, computer]
  region: [720, 250, 1250, 560]
  region_at: [1920, 1080]
  scale: 2
  do:
  - name: press the switch (third)
    click: [1145, 420]
    wait_after: 5
  - name: authorise the change (third)
    click: [959, 656]
    wait_after: 5
  - name: type the password
    type: '{{ password }}'
    wait_after: 4
  - name: confirm
    click: [959, 704]
    wait_after: 15

- name: the switch reads on
  loop:
    max: 12
    do:
    - wait: 3
    ocr:
      name: screen
      region: [720, 250, 1250, 560]
      region_at: [1920, 1080]
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - log
        - in
        - to
        - this
        - computer
    until:
      fact: done
- name: close the pane
  click:
  - 1140
  - 675
  wait_after: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the build over ssh
  ssh: sw_vers -productVersion
- name: prove the account over ssh
  ssh: id -un
- name: prove disk utility works over ssh
  ssh: diskutil list | head -5
- name: name the machine
  ssh: printf '%s\n' "{{ password }}" | sudo -S scutil --set LocalHostName {{ user }}
- name: note what is absent
  ssh: command -v brew || true
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
