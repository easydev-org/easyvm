name: macos 26 ssh - the setup assistant, remote login, and a graceful shutdown
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: vmuser
  out:
    from: args.out
    default: out/macos26-ssh.qcow2
  shutdown:
    from: args.shutdown
    default: acpi
boot_disk: from_caller
steps:
- name: the media this stage boots from is already on disk
  require:
  - boot.img
  - macos.rom
  - macos.vars
- name: start recording
  record: macos26-ssh.mp4
- name: boot the disk
  boot: true
  os: macos
  # THE SAME 12288 THE SETUP STAGE USES, because this stage continues on the disk that one produced
  # and a guest that could install at 12 GiB must boot at 12 GiB. See macos/26/steps/setup.yaml for
  # the measurement: 16 GiB is killed on a 15 GiB runner, and a 12 GiB guest's qemu RSS plateaus at
  # 12.01 GiB with the install advancing normally.
  memory_mb: 12288
  timeout: 900
- name: answer the wizard until the desktop appears
  loop:
    # NINETY ATTEMPTS, BECAUSE THIS LOOP OWNS THREE THINGS THAT EACH COST A BOOT.
    #
    # MEASURED: forty was not enough and the failure said so - "the loop ran 40 attempt(s) and the
    # condition never held" - because the walkthrough spent its whole budget on Analytics (the
    # too-short wait this file no longer has) and never reached the panes after it. The loop also
    # answers the update pane by resetting the guest (issue #3's Defect 1: that pane never advances)
    # and then the login window, and each reset costs a full boot inside a single attempt.
    #
    # TWO HUNDRED NOW, BECAUSE THE WIZARD RUNS TWICE. MEASURED ON THIS STAGE'S OWN RUN: after the login
    # the Setup Assistant came back and asked Apple Account, Location Services, Analytics, FileVault and
    # the update pane AGAIN - issue #3 records the same thing ("on the run where Apple ID had NOT been
    # skipped, Continue went backwards to the Apple ID pane"), and it means one pass through this loop
    # answers about fifteen panes, then a reboot for the update pane, then a login, then ANOTHER fifteen.
    #
    # Ninety attempts was measured to run out mid-way: the run ended at the login window with
    # "the loop ran 90 attempt(s) and the condition never held" after the walk had already reached the
    # second pass's Update pane. Two hundred attempts at this step's pace is about eighty minutes, which
    # is the two passes plus two reboots.
    max: 200
    do:
    - name: read the pane
      ocr:
        name: pane
        region:
        - 0
        - 0
        - 1920
        - 1080
        region_at:
        - 1920
        - 1080
        scale: 1
        wait: 0
    - name: classify - country or region
      check:
        name: country
        from: pane
        mode: says
        words:
        - select
        - your
        - country
        - or
        - region
    - name: classify - transfer
      check:
        name: transfer
        from: pane
        mode: says
        words:
        - transfer
        - your
        - information
        - to
        - this
        - mac
    - name: classify - account
      check:
        name: account
        from: pane
        mode: says
        words:
        - create
        - a
        - mac
        - account
    - name: classify - apple account
      check:
        name: apple_account
        from: pane
        mode: says
        words:
        - sign
        - in
        - to
        - your
        - apple
        - account
    - name: classify - the apple account sheet
      check:
        name: apple_sheet
        from: pane
        mode: says
        words:
        - sure
        - skip
        - signing
    - name: classify - terms
      check:
        name: terms
        from: pane
        mode: says
        words:
        - terms
        - conditions
    - name: classify - age
      check:
        name: age
        from: pane
        mode: says
        words:
        - age
        - range
    - name: classify - location
      check:
        name: location
        from: pane
        mode: says
        words:
        - enable
        - location
        - services
    - name: classify - the location sheet
      check:
        name: location_sheet
        from: pane
        mode: says
        words:
        - find
        - my
        - available
    - name: classify - time zone
      check:
        name: time_zone
        from: pane
        mode: says
        words:
        - time
        - zone
    - name: classify - analytics
      check:
        name: analytics
        from: pane
        mode: says
        words:
        - analytics
        - improve
    - name: classify - data and privacy
      check:
        name: privacy_pane
        from: pane
        mode: says
        words:
        - privacy
        - fundamental
    - name: classify - spoken languages
      check:
        name: languages
        from: pane
        mode: says
        words:
        - spoken
        - languages
    - name: classify - accessibility
      check:
        name: accessibility
        from: pane
        mode: says
        words:
        - accessibility
        - individual
    - name: classify - screen time
      check:
        name: screen_time
        from: pane
        mode: says
        words:
        - screen
        - time
    - name: classify - filevault
      check:
        name: filevault
        from: pane
        mode: says
        words:
        - ready
        - encrypting
    - name: classify - the filevault sheet
      check:
        name: filevault_sheet
        from: pane
        mode: says
        words:
        - securely
        - encrypted
    - name: classify - look
      check:
        name: look
        from: pane
        mode: says
        words:
        - choose
        - your
        - look
    - name: classify - update
      check:
        name: update
        from: pane
        mode: says
        words:
        - update
        - mac
        - automatically
    - name: classify - keyboard
      check:
        name: keyboard
        from: pane
        mode: says
        words:
        - keyboard
        - assistant
    - name: spoken languages
      if: languages
      then:
      - name: languages continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: accessibility
      if: accessibility
      then:
      - name: accessibility not now
        click:
        - 1284
        - 799
        wait_after: 7
    - name: data and privacy
      if: privacy_pane
      then:
      - name: privacy continue
        click:
        - 1284
        - 799
        wait_after: 8
    - name: transfer your data
      if: transfer
      then:
      - name: choose not to transfer
        click:
        - 742
        - 712
        wait_after: 3
      - name: transfer continue
        click:
        - 1284
        - 799
        wait_after: 8
    - name: country or region
      if: country
      then:
      - name: focus the country list
        click:
        - 900
        - 470
        wait_after: 2
      - name: type the country
        type: united states
        wait_after: 3
      - name: country continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: the account, which is what this whole stage exists for
      if: account
      then:
      - name: account full name
        click:
        - 959
        - 496
        wait_after: 2
      - name: account full name text
        type: '{{ user }}'
        wait_after: 2
      - name: account short name
        click:
        - 959
        - 530
        wait_after: 2
      - name: clear the auto-filled short name
        key: meta_l+a
        wait_after: 1
      - name: delete it
        key: backspace
        wait_after: 1
      - name: account short name text
        type: '{{ user }}'
        wait_after: 2
      - name: account password
        click:
        - 841
        - 601
        wait_after: 2
      - name: account password text
        type: '{{ password }}'
        wait_after: 2
      - name: account verify
        click:
        - 1068
        - 601
        wait_after: 2
      - name: account verify text
        type: '{{ password }}'
        wait_after: 2
      - name: untick the apple account reset
        click:
        - 745
        - 663
        wait_after: 2
      - name: account continue
        click:
        - 1284
        - 799
        wait_after: 180
    - name: apple account - other sign-in options, then later
      if: apple_account
      then:
      - name: open other sign-in options
        click:
        - 620
        - 800
        wait_after: 4
      - name: sign in later
        click:
        - 682
        - 853
        wait_after: 7
    - name: the apple account confirmation sheet
      if: apple_sheet
      then:
      - name: skip the apple account
        click:
        - 1017
        - 644
        wait_after: 8
    - name: terms and conditions
      if: terms
      then:
      - name: terms agree
        click:
        - 1282
        - 799
        wait_after: 7
      - name: licence agree
        click:
        - 1019
        - 616
        wait_after: 8
    - name: age range
      if: age
      then:
      - name: choose adult
        click:
        - 959
        - 710
        wait_after: 7
    - name: location services
      if: location
      then:
      - name: location continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: the location confirmation sheet
      if: location_sheet
      then:
      - name: dont use location services
        click:
        - 959
        - 575
        wait_after: 7
    - name: time zone
      if: time_zone
      then:
      - name: time zone continue
        click:
        - 1284
        - 799
        wait_after: 7
    - name: analytics - untick sharing first
      if: analytics
      then:
      - name: untick share analytics
        # (742,521) IS THE CHECKBOX, MEASURED ON THE RUN THAT FAILED HERE: the blue tick spans
        # x=735..750, y=514..529 on a 1920x1080 frame, so (745,520) was inside it and the click was
        # never the problem - the WAIT was. `wait_after: 2` pressed Continue before the tick had been
        # taken, that press did nothing, and the loop spent all forty attempts on this pane:
        #
        #	answer the wizard until the desktop appears: the loop ran 40 attempt(s) and the
        #	condition never held
        #
        # Measured by hand on the same frame: one click unticked it and one press of Continue reached
        # Screen Time. Five seconds is the settle this workbench gives a checkbox.
        click:
        - 742
        - 521
        wait_after: 5
      - name: analytics continue
        click:
        - 1281
        - 799
        wait_after: 9
    - name: screen time
      if: screen_time
      then:
      - name: screen time later
        click:
        - 1131
        - 799
        wait_after: 7
    - name: filevault
      if: filevault
      then:
      - name: filevault not now
        click:
        - 1129
        - 799
        wait_after: 8
    - name: the filevault confirmation sheet
      if: filevault_sheet
      then:
      - name: continue without filevault
        click:
        - 1004
        - 598
        wait_after: 8
    - name: choose your look
      if: look
      then:
      - name: look continue
        click:
        - 1284
        - 799
        wait_after: 9
    - name: the keyboard assistant, which eats the next keystroke
      if: keyboard
      then:
      - name: keyboard quit
        # (1133,816), MEASURED ON THIS GUEST'S OWN FRAME. (1228,826) came from 15 and lands past the
        # Quit button on 26: the sheet's two buttons sit at x=1069..1196 and x=1211..1339, y=802..830,
        # so 1228 was inside CONTINUE - and a Continue there walks further into the keyboard setup
        # instead of dismissing it, leaving the dialog over System Settings for the rest of the run.
        click:
        - 1133
        - 816
        wait_after: 10
    - name: update mac automatically - reset past it
      if: update
      then:
      # THE UPDATE PANE NEVER ADVANCES, SO A RESET IS WHAT MOVES IT - AND THE LOGIN THAT FOLLOWS IS A
      # FIXED SEQUENCE, NOT SOMETHING THIS LOOP TRIES TO RECOGNISE.
      #
      # WHY FIXED AND NOT DETECTED, MEASURED ON THE RUN THAT REACHED THE LOGIN WINDOW: that window
      # shows a clock and two small words, and tesseract read the clock as "5: AS". The pattern
      # `[0-9]+[:.][0-9]+` that used to stand here therefore matched nothing, `at_login` was false on
      # every attempt, and the walk sat at the login window until its ceiling - the frame was fine,
      # the READING was not, and no word list fixes a clock read as noise.
      #
      # WHAT IS RELIABLE IS THE ORDER, because issue #3 measured it: resetting past the update pane
      # lands on the login window every time. So the reset is followed by a wait and then by the three
      # presses, unconditionally.
      #
      # ONE HUNDRED AND TWENTY SECONDS, NOT SIXTY. A CI runner boots this guest far slower than the
      # workbench does (the same install took ~40 minutes there against ~25 here), and typing into a
      # password field that does not exist yet spends the attempt and leaves the walk at a window it
      # can no longer see.
      - name: reset the guest
        reboot: true
        timeout: 300
      # THREE MINUTES, NOT TWO, AND THE MEASUREMENT IS THIS STAGE'S OWN FAILURE.
      #
      # At `wait: 120` the loop then pressed the password field and typed into it, and the login
      # window still had an EMPTY field at the end of the run - 90 attempts, all wasted:
      #
      #	answer the wizard until the desktop appears: the loop ran 90 attempt(s) and the condition
      #	never held
      #
      # The same machine accepted the same three presses BY HAND five minutes after the reset, so the
      # coordinates and the sequence were right and the WAIT was not: the field is drawn before it
      # accepts a keystroke, and the click that arrives too early leaves it unfocused.
      #
      # `esc` FIRST, because a login window that has just appeared can be behind a screen-saver style
      # fade that eats the first click.
      - name: let the login window come up
        # FIVE MINUTES, BECAUSE THREE WAS MEASURED TO BE TOO SHORT.
        #
        # At `wait: 180` the loop then pressed the field and typed into it, and the run ended with the
        # field EMPTY after ninety attempts. The same guest accepted the same presses BY HAND a few
        # minutes later. So the field is drawn long before it accepts a keystroke, and the window is
        # wider than three minutes on this host. Five is what the hand-run needed.
        wait: 300
      - name: wake the window before pressing it
        key: esc
        wait_after: 3
      - name: click the password field
        click:
        - 960
        - 983
        wait_after: 5
      - name: type the password
        type: '{{ password }}'
        wait_after: 2
      - name: press return
        key: ret
        wait_after: 30
    ocr:
      name: wizard
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: finished
      from: wizard
      mode: says_without
      words:
      - finder
      # `back` WAS IN THIS LIST AND IT IS NOT A WIZARD WORD ON A DESKTOP. MEASURED on this stage's own
      # run: the desktop read
      #
      #	@ Finder File Edit View Go Window Help ... Click Wallpaper to Show Desktop Items ...
      #	... Click again to bring windows BACK. You can change this in System Settings ...
      #
      # - macOS's own "Click Wallpaper to Show Desktop Items" bubble uses BACK, so the test answered
      # "a wizard page is on screen" about a desktop and the loop never ended. `continue` and `later`
      # are the wizard's BUTTON LABELS and appear on no desktop; `back` is ordinary English.
      without:
      - continue
      - later
    until:
      fact: finished
- name: wait for the desktop
  loop:
    max: 30
    do:
    - wait: 10
    - key: esc
    ocr:
      name: desk
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: ready
      from: desk
      mode: says_without
      words:
      - finder
      # `back` WAS IN THIS LIST AND IT IS NOT A WIZARD WORD ON A DESKTOP. MEASURED on this stage's own
      # run: the desktop read
      #
      #	@ Finder File Edit View Go Window Help ... Click Wallpaper to Show Desktop Items ...
      #	... Click again to bring windows BACK. You can change this in System Settings ...
      #
      # - macOS's own "Click Wallpaper to Show Desktop Items" bubble uses BACK, so the test answered
      # "a wizard page is on screen" about a desktop and the loop never ended. `continue` and `later`
      # are the wizard's BUTTON LABELS and appear on no desktop; `back` is ordinary English.
      without:
      - continue
      - later
    until:
      fact: ready
- name: dismiss anything over the desktop
  key: esc
  wait_after: 2
# THE KEYBOARD SETUP ASSISTANT COMES UP WITH THE FIRST DESKTOP SESSION AND IT IS BIGGER THAN THE
# WINDOW THAT LANDS ON TOP OF IT.
#
# MEASURED ON THIS STAGE'S OWN RUN: the walk reached System Settings and its search step pressed
# (714,285), and the frame showed the settings window with an EMPTY search field while the sheet
# reading `Keyboard Setup Assistant` was still visible BEHIND it. The assistant's Quit at (1133,816)
# was under the settings window's own content, so every press aimed at Quit landed on System
# Settings instead - and `the remote login result is on screen` then waited forty-five times for a
# search that had never been typed.
#
# `Cmd+Q` IS THE DISMISSAL THAT DOES NOT DEPEND ON WHICH WINDOW IS ON TOP: it closed System Settings
# in the same run, which exposed the assistant, and the press at (1133,816) then took Quit and left a
# clean desktop. So quit first, then press Quit, then let Spotlight open the settings app again.
- name: quit the window that is covering the keyboard assistant
  key: meta_l+q
  wait_after: 5
- name: quit the keyboard assistant itself
  click:
  - 1133
  - 816
  wait_after: 8
- name: open spotlight
  key: meta_l+spc
  wait_after: 4
- name: type the settings app name
  type: system settings
  wait_after: 7
- name: open it
  key: ret
  wait_after: 14
- name: the settings window is up
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - system
        - settings
      - - general
      - - wi-fi
    until:
      fact: done
# THE SEARCH FIELD HAS TO BE FOCUSED BEFORE ANYTHING IS TYPED, AND IT WAS NOT.
#
# MEASURED ON THIS STAGE'S OWN RUN: the walk clicked (715,267) and typed in one step, and the screen
# afterwards showed System Settings sitting on GAME CENTER with an EMPTY search field - the typing had
# gone nowhere, and `the remote login result is on screen` then waited forty-five times for a result
# that was never searched for.
#
# (714,285) IS THE FIELD, measured on that frame: the search box spans x=612..818 at y=274..296. The
# old (715,267) was nine pixels above it, inside the title bar.
#
# THE PRESS IS ITS OWN STEP so the field has settled before the text arrives - the same lesson as the
# two password fields, and the third time this file has learned it.
- name: focus the settings search field
  # `Cmd+F` IS THE SYSTEM SETTINGS SEARCH SHORTCUT, AND IT IS USED HERE BECAUSE THE FIELD MOVES.
  #
  # MEASURED ON TWO CONSECUTIVE RUNS OF THIS STAGE: the settings window landed with its search field at
  # y=285 on one boot and y=317 on the next, because the window remembers its own position and macOS
  # puts it wherever it last was. A press at (714,285) then lands in the sidebar instead of the field,
  # the typing goes nowhere, and `the remote login result is on screen` waits forty-five times for a
  # search nobody typed.
  #
  # A KEYBOARD SHORTCUT DOES NOT CARE WHERE THE WINDOW IS. `Cmd+F` focuses the search field on macOS
  # 13 and later, which is what this needs and what no absolute coordinate can promise.
  key: meta_l+f
  wait_after: 3
- name: search for remote login
  type: remote login
  clear: true
  modifier: meta_l
  wait_after: 10
- name: the remote login result is on screen
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 480
      - 240
      - 760
      - 420
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - sharing
        - remote
      - - allow
        - full
        - disk
        - access
    until:
      fact: done
# (672,387) IS THE RESULT ROW, MEASURED ON THIS STAGE'S OWN RUN, AND (703,336) IS NOT.
#
# MEASURED: the search results sat with `Sharing / Remote login` at y=387 in that frame - the window had
# come up lower than the run the old coordinate came from - so presses at (703,336) landed on the
# window's own title area and the panel never opened. The loop that follows then waited thirty times
# for "allow full disk access" behind a panel that was never shown.
#
# A press at (672,387) opened it on the first try, and the panel read `Remote Login: Off`.
- name: open the remote login pane
  click:
  - 672
  - 387
  wait_after: 12
# THE RESULT ROW MOVES BETWEEN BOOTS, SO THIS FILE TRIES THE THREE HEIGHTS IT HAS BEEN MEASURED AT.
#
# MEASURED ACROSS THREE RUNS OF THIS STAGE: `Sharing / Remote login` sat at y=336, then y=387, then
# y=343. The settings window's origin is remembered by macOS from the previous session, so the row's
# absolute height is not a property of macOS 26 - it is a property of the last window position.
#
# THREE PRESSES AT THE THREE MEASURED HEIGHTS IS WHAT THIS IS, and the sensor between them is the pane
# itself: each attempt is followed by the same `unless: allow full disk access` test, so a press that
# lands on nothing costs one attempt and the next height is tried. That is why the retry step exists at
# all - it is not a nicety, it is the mechanism that makes a remembered window position survivable.
- name: open the remote login pane again
  unless:
  - allow
  - full
  - disk
  - access
  region:
  - 726
  - 300
  - 1200
  - 715
  scale: 2
  click:
  - 672
  - 343
  wait_after: 12
  region_at:
  - 1920
  - 1080
- name: the remote login pane is up
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 726
      - 300
      - 1200
      - 715
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - allow
        - full
        - disk
        - access
    until:
      fact: done
- name: turn remote login on
  unless:
  - log
  - in
  - to
  - this
  - computer
  region:
  - 726
  - 300
  - 1200
  - 715
  scale: 2
  click:
  - 1145
  - 353
  wait_after: 4
  region_at:
  - 1920
  - 1080
# TURNING REMOTE LOGIN ON ASKS FOR THE ACCOUNT PASSWORD, AND THIS STEP IS WHY THE STAGE USED TO STOP
# HERE.
#
# MEASURED ON THIS STAGE'S OWN RUN, at the switch: macOS put up a sheet reading
#
#	Sharing
#	Remote Login is trying to modify system settings.
#	Enter your password to allow this.
#	[vmuser        ]
#	[ Password     ]
#	[ Modify Settings ]  [ Cancel ]
#
# The walk had no step for it, so `the switch reads on` looped ten times looking for "log in to this
# computer" behind an unanswered sheet and failed the stage. The sheet is the SYSTEM's authorisation,
# not a Setup Assistant pane - which is why the wizard loop never saw it either.
#
# THE COORDINATES ARE MEASURED FROM THAT FRAME: the password field at (960,584), the blue
# `Modify Settings` at (960,631). The user name is already filled in.
- name: authorise the change
  # ONLY WHEN THE SHEET IS UP. `unless:` skips these three presses when the switch took without
  # asking, which prsses into a password field that is not on screen would do nothing visible and
  # would look like a working step.
  unless:
  - modify
  - settings
  region:
  - 830
  - 400
  - 1090
  - 660
  scale: 2
  region_at:
  - 1920
  - 1080
  # THE SAME LESSON AS THE LOGIN WINDOW, MEASURED ON THE SAME RUN: this sheet's password field is
  # drawn before it accepts a keystroke. With `wait_after: 2` the typed password vanished, the sheet
  # stayed up, `the switch reads on` never saw "log in to this computer", and the stage failed.
  # Pressed by hand with five seconds between the click and the typing, the same presses filled the
  # field and `Modify Settings` took the change.
  click:
  - 960
  - 584
  wait_after: 5
- name: type the account password
  type: '{{ password }}'
  wait_after: 4
- name: confirm the change
  # `ret`, NOT A CLICK ON `Modify Settings`. MEASURED ON THIS STAGE'S OWN RUN: with the password
  # correctly in the field (six dots) a press at the button's centre - measured at (959,659) from that
  # frame's own blue pixels - did nothing at all, three times in a row. `ret` closed the sheet on the
  # first try and the panel then read `Remote Login: On`.
  #
  # This is the sheet's DEFAULT button, so Return is the same action without depending on a
  # coordinate that moves with the window.
  key: ret
  wait_after: 15
- name: the switch reads on
  loop:
    max: 10
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 726
      - 300
      - 1200
      - 715
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - log
        - in
        - to
        - this
        - computer
    until:
      fact: done
- name: close the pane
  click:
  - 1145
  - 679
  wait_after: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the build over ssh
  ssh: sw_vers -productVersion
- name: prove the account over ssh
  ssh: id -un
- name: prove disk utility works over ssh
  ssh: diskutil list | head -5
- name: name the machine
  ssh: printf '%s\n' "{{ password }}" | sudo -S scutil --set LocalHostName {{ user }}
- name: note what is absent
  ssh: command -v brew || true
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
