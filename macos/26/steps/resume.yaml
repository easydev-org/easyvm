name: macos 26 - start the disk that is already there
# THE DISK IS THIS STAGE'S INPUT, NOT SOMETHING IT MAKES. `--boot-disk` names it, and without this
# line a `boot:` with no `disk:` above it reads as a structural mistake rather than a resume.
boot_disk: from_caller
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080

# A RESUME FILE, AND IT EXISTS BECAUSE THE OBVIOUS WAY TO RESTART A GUEST DELETES IT.
#
# THE MEASUREMENT, AT THE COST OF A 37 GiB macOS INSTALL:
#
#	`create -file <setup.yaml>` runs every `disk:` step before it boots, and `createDisk` DELETES a
#	previous file rather than reusing it - by design, because "starting from whatever a failed run
#	left is how an install writes into half a system and reports success". So restarting a guest
#	from the file that built it starts over:
#
#		removing the disk a previous run left at /work/disk.qcow2
#		disk.qcow2: 221 MiB
#
#	and the 37 GiB that were there - a recovery that had formatted the disk, downloaded Tahoe and
#	written most of a system - were gone before the question "is it really using the disk from last
#	time" could be asked.
#
# SO THIS FILE HAS ONE STEP AND IT IS `boot:`. The disk is the artifact; the work is on it. A resume
# file that recreated the disk would be a file that cannot resume anything.
#
# THE TWO FILES ARE A PAIR AND THE NAMES SAY WHICH IS WHICH:
#
#	steps/setup.yaml    makes the disk and installs onto it. Run it ONCE per disk.
#	steps/resume.yaml   starts the disk that exists. Run it as often as the disk needs looking at.
#
# macOS 15 does not need this because its stages are separate already - `setup.yaml`, then `ssh.yaml`,
# then `vm-configure.yaml`, each booting a disk it did not make. 26 has two stages in
# `.github/workflows/macos26.yml` for the same reason, and neither of them is a `create`.

vars:
  out:
    from: args.out
    default: out/mac26.qcow2

steps:
  # THE RECOVERY IMAGE IS A PREPARED INPUT, LIKE EVERY OTHER MEDIUM HERE.
  #
  # `recovery:` takes a PATH as readily as an asset role, and a path is what this file names now:
  # the workflow pulls `macos-recovery-<release>` into the work directory before the walk starts, and
  # nothing below reaches the network. That is the same rule the install stages follow, and it is why
  # there is no `asset:` here - a walk that downloads is a walk whose duration a file cannot describe.
  - name: the recovery image this boot reads is already on disk
    needs:
    - recovery.dmg

  - name: boot the disk that is already there
    boot: true
    os: macos
    # THE RECOVERY IMAGE IS AN INPUT TO THE OPENCORE BUILD EVEN WHEN THE STAGE DOES NOT INSTALL -
    # `opencore.Build` extracts Apple's APFS driver out of it, and there is no other source for that
    # driver. `boot:` attaches it only when the step also installs.
    recovery: recovery.dmg
    # TWELVE GIBABYTES, LOWERED FROM 16384 BECAUSE THE CI RUNNER HAS 15 GiB IN TOTAL.
    #
    # MEASURED: at 4096 the macOS 26 install wrote 37 GiB and then stopped making progress - the
    # screen sat on "About 20 minutes remaining" with qemu at 200% CPU and the disk not growing.
    # macOS is not a guest that fits in the default: the installer keeps an APFS snapshot, a staging
    # volume and its own caches resident while it writes, and 4 GiB is Apple's stated MINIMUM rather
    # than a working figure.
    #
    # MEASURED THE OTHER WAY TOO: a 16 GiB guest on GitHub's standard `ubuntu-24.04` (MemTotal 15 GiB)
    # is killed by the OOM killer a few minutes into the copy - run 44122437321, where disk.qcow2
    # never grew past 194 KiB and the QMP connection became `write: broken pipe` with no error in any
    # log. On a host with room, a 12 GiB guest's qemu RSS plateaus at 12.01 GiB and the install runs
    # to "About 55 minutes remaining" and past it. So 12288 is the largest value that fits the runner.
    #
    # `macos/15/steps/setup.yaml` carries the default and is left alone here: it is the work that
    # proved the pipeline and changing it is a separate measurement.
    memory_mb: 12288
    timeout: 900
