name: macos 26 setup (recovery image to setup assistant)
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  out:
    from: args.out
    default: out/macos26.qcow2
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: the media this stage boots from is already on disk
  require:
  - recovery.dmg
  - boot.img
  - macos.rom
  - macos.vars
- name: start recording
  record: macos26-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery.dmg
  # TWELVE GIBABYTES, AND THE NUMBER IS SET BY THE CI RUNNER RATHER THAN BY THE GUEST.
  #
  # 16384 WAS THE VALUE UNTIL IT WAS MEASURED AGAINST THE RUNNER. GitHub's standard `ubuntu-24.04`
  # reports `MemTotal` of 15 GiB, and qemu allocates a guest's RAM on demand, so a 16 GiB guest boots,
  # looks healthy for three minutes, and is then killed once the copy touches enough pages:
  #
  #	run 44122437321   erase, licence and destination all passed; at look 1 attempt 10 the QMP
  #	                  connection became `write: broken pipe` and stayed that way, the daemon logged
  #	                  no error, the console had nothing after HANDOFF TO XNU, and disk.qcow2 was
  #	                  still 194 KiB - it had never grown at all
  #
  # MEASURED ON A HOST WITH ROOM: qemu's RSS during the copy climbs to 12.01 GiB for a 12 GiB guest
  # and plateaus there - the guest uses essentially all of what it is given - while the disk grew
  # 14.35 -> 16.81 -> 28.42 -> 29.63 -> 35.26 -> 37.85 GiB and the pane counted down "About 55
  # minutes remaining" to "About 22". So 12 GiB boots, erases, and installs, and it is the largest
  # request that leaves the runner room for qemu itself and the page cache.
  #
  # AND THE SAME RUN REACHED THE INSTALLER'S OWN FINAL RESTART, WHICH IS WHAT THE BLACK SCREEN WAS.
  #
  # An earlier version of this comment called that a stall and was WRONG. The evidence is a frame the
  # recorder kept, at 18:51:56 - the Apple logo, a progress bar about four fifths full, and the words
  # "About 21 minutes remaining...". The disk stopped growing at 37.95 GiB because the copy had
  # finished and the guest was waiting to restart. So the sequence at 12288 was
  #
  #	erase -> licence -> copy (37.95 GiB) -> installer restart -> progress bar, 21 minutes left
  #
  # BUT THAT RUN WAS STOPPED BY HAND WHILE THE PROGRESS BAR STILL READ 21 MINUTES, SO IT PROVES LESS
  # THAN IT LOOKS. Booting the 37.95 GiB disk it left behind reaches the Apple logo and a progress bar
  # that never advances - the disk is an UNFINISHED INSTALL, which is what stopping during the final
  # restart produces. So this run shows 12 GiB erases, copies and reaches the installer's restart; it
  # does not show 12 GiB reaching the Setup Assistant, because nothing waited for it.
  #
  # THE CI RUN AT THIS SIZE IS THE TEST OF THAT LAST STEP, and it is the only one that is.
  memory_mb: 12288
  timeout: 900
- name: the recovery menu's rows
  ocr:
    name: recovery
    region:
    - 760
    - 200
    - 1400
    - 560
    region_at:
    - 1920
    - 1080
    scale: 6
    wait: 5
- name: wait for the recovery menu
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: recovery
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 6
      wait: 0
    check:
      name: done
      from: recovery
      mode: says_any
      words:
      - - restore
        - time
        - machine
      - - reinstall
        - macos
      - - safari
      - - disk
        - utility
    until:
      fact: done
- name: select disk utility
  click:
  - 800
  - 523
  wait_after: 3
- name: open disk utility
  click:
  - 1148
  - 595
  wait_after: 8
- name: make disk utility full screen
  at_color:
  - 40
  - 200
  - 64
  color_tolerance: 45
  color_region:
  - 0
  - 30
  - 700
  - 400
  wait_after: 6
- name: select the first disk
  click:
  - 200
  - 132
  wait_after: 2
- name: is the selected disk the uninitialised one
  ocr:
    name: details
    region:
    - 360
    - 105
    - 1100
    - 200
    region_at:
    - 1920
    - 1080
    scale: 4
    wait: 0
- name: the first disk is the uninitialised one
  check:
    name: uninitialised
    from: details
    mode: contains
    text: Uninitialized
- name: select the second disk, when row 1 was the boot image
  if: uninitialised
  else:
  - name: click row 2
    click:
    - 200
    - 164
    wait_after: 2
  - name: is the second disk the uninitialised one
    ocr:
      name: details
      region:
      - 360
      - 105
      - 1100
      - 200
      region_at:
      - 1920
      - 1080
      scale: 4
      wait: 0
  - name: the second disk is the uninitialised one
    check:
      name: uninitialised
      from: details
      mode: contains
      text: Uninitialized
- name: erase - open the sheet
  loop:
    max: 6
    do:
    - click:
      - 1711
      - 56
    - wait: 3
    ocr:
      name: sheet
      region:
      - 720
      - 425
      - 1200
      - 680
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - erase
        - deleted
      - - free
        - space
      - - security
        - option
      - - cancel
        - erase
    until:
      fact: sheet_up
  wait_after: 4
- name: erase - clear the name field
  key: meta_l+a
  wait_after: 1
- name: erase - name the volume
  click:
  - 988
  - 542
  type: '{{ disk_name }}'
  wait_after: 4
- name: erase - confirm
  click:
  - 1154
  - 650
  wait_after: 5
- name: erase - wait for the report
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - erase
        - complete
      - - erase
        - process
    until:
      fact: done
- name: erase - done
  click:
  - 1147
  - 614
  wait_after: 5
- name: close disk utility
  key: meta_l+q
  wait_after: 12
- name: the recovery menu is back
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - reinstall
      - macos
    until:
      fact: done
- name: select reinstall macos
  click:
  - 837
  - 333
  wait_after: 3
- name: open the installer
  click:
  - 1142
  - 586
  wait_after: 20
- name: wait for the installer to load
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: instaload
      region:
      - 400
      - 560
      - 1520
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: loaded
      from: instaload
      mode: says_any
      words:
      - - agree
        - to
        - the
        - terms
      - - english
        - apple
      - - select
        - the
        - disk
      - - macos
    until:
      fact: loaded
- name: welcome continue
  click:
  - 960
  - 712
  wait_after: 5
- name: wait for the licence pane
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: licence
      region:
      - 660
      - 430
      - 1260
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: licence_up
      from: licence
      mode: says_any
      words:
      - - software
        - license
        - agreement
      - - please
        - read
        - this
    until:
      fact: licence_up
- name: agree to the licence
  click:
  - 1005
  - 713
  wait_after: 5
- name: wait for the licence sheet
  loop:
    max: 12
    do:
    - wait: 5
    ocr:
      name: sheet
      region:
      - 780
      - 330
      - 1140
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - read
        - and
        - agree
      - - disagree
        - agree
    until:
      fact: sheet_up
- name: agree in the sheet
  click:
  - 1018
  - 520
  wait_after: 10
- name: select the destination card
  click:
  - 850
  - 550
  wait_after: 5
- name: destination continue
  click:
  - 1005
  - 712
  wait_after: 10
- name: the copy runs, look 1 of at most 8
  loop:
    max: 270
    # NINETY MINUTES, AND A BLACK FRAME IS NOT AN ENDING - THAT WAS THE BUG IN THE RUN THAT
    # "SUCCEEDED".
    #
    # MEASURED ON RUN 44248083728, WHICH PUBLISHED A HALF-INSTALLED DISK: its own log ends with
    #
    #	=== the Setup Assistant is up
    #	the Setup Assistant is up: assistant = false (mode says_any: none of "select your country
    #	or region" ... in "e")
    #
    # and its reads tell the whole story:
    #
    #	26 words x 41   "macOS Tahoe will be installed on the disk"   the destination pane
    #	 5 words x 21   "About 29 -> 21 minutes remaining"            THE INSTALL IS RUNNING
    #	 1 word  x  8   "e"                                          the screen went black
    #
    # THE COUNTDOWN DECREASES ONE MINUTE PER MINUTE (29 at attempt 39, 21 at attempt 61), so when the
    # screen went black the install still had about 21 MINUTES TO RUN. It went black because the
    # installer swaps its own graphics, not because it had finished - and the pattern I had written
    # to accept a black frame as "done" then ended look 1, reset the guest, and killed the install.
    # Eight looks did that eight times. The disk that got published was the wreckage.
    #
    # SO A BLACK FRAME ENDS NOTHING HERE. The reading has to show a Setup Assistant pane; anything
    # else - black, the progress pane, OCR noise - means "still working, keep waiting".
    #
    # NINETY MINUTES IS THE CEILING AND IT IS THE HONEST ONE. The observed shape is ~21 minutes of
    # copying before the screen blanks (attempt 62 of 20 s each) on top of the ~21 minutes the
    # countdown still owed, so about 42 minutes to a first draw; ninety is that plus a wide margin
    # for a slow runner, and it is still inside the stage's own `timeout: 400`.
    #
    # WHEN THE CEILING IS REACHED THE RESET IS STILL RIGHT: by then the installer has had twice as
    # long as it needs, so a guest that is still not showing the Setup Assistant is wedged rather
    # than busy. The picker click covers the other measured shape - OpenCore's boot picker, whose
    # four icons sit at y=547 and whose first entry is "macOS Installer" at (731,547).
    every: 5400
    clock:
    - name: pick macOS Installer in OpenCore's picker, if that is what is up
      click:
      - 731
      - 547
      wait_after: 15
    - name: reset the guest
      reboot: true
      timeout: 300
    - name: give it time to come back
      wait: 60
    do:
    - wait: 20
    # THE COPY'S OWN CANCEL BUTTON SITS WHERE THE PREVIOUS STEP CLICKED, AND THE INSTALLER ASKS
    # "Are you sure you want to cancel" WHEN IT IS HIT.
    #
    # MEASURED ON RUN 44150638949, which is what this branch exists for: \`destination continue\`
    # clicks (1005,712) on the pane that says "macOS Tahoe will be installed on the disk", the copy
    # starts and the pane BECOMES the progress view - and on that view (1005,712) is the CANCEL
    # button. The pointer was still there, Cancel fired, and the installer put up
    #
    #	Are you sure you want to cancel the installation of macOS Tahoe?
    #	"Reinstall macOS" in the menu and "Continue" again.
    #	[Continue Installing]  [Quit]
    #
    # The frames prove the copy itself was healthy: 40% at t+300s, 85% at t+600s, "About 12 minutes
    # remaining" - and then the dialog, unchanged for the remaining 2.3 hours of the run.
    #
    # CONTINUE INSTALLING IS (960,508), measured from that frame. Answering it is the whole fix: the
    # copy resumes where it stopped rather than starting over.
    - name: read the pane for the cancel sheet
      ocr:
        name: cancelshot
        region:
        - 820
        - 300
        - 1100
        - 600
        region_at:
        - 1920
        - 1080
        scale: 1
        wait: 0
    - name: classify - the cancel confirmation
      check:
        name: cancel_sheet
        from: cancelshot
        mode: says
        words:
        - continue
        - installing
    - name: answer the cancel confirmation
      if: cancel_sheet
      then:
        - name: continue installing
          click:
          - 960
          - 508
          wait_after: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    # ONLY A SETUP ASSISTANT PANE ENDS A LOOK. A BLACK FRAME DOES NOT.
    #
    # MEASURED ON RUN 44248083728: the install was still counting down ("About 21 minutes remaining")
    # when the screen went black, and that run's own final check recorded `assistant = false` on a
    # reading of "e" - it published a disk whose install had been interrupted eight times by resets
    # this loop did not need to make. The countdown falls one minute per minute, so the install owed
    # another 21 minutes when the frame blanked.
    #
    # `matches` IS STILL THE MODE, because these panes are alternatives and a regex says so plainly.
    check:
      name: done
      from: screen
      mode: matches
      pattern: 'select your country or region|transfer your information to this mac|choose a wireless network|sign in with your apple id|update mac automatically|choose your look'
    until:
      fact: done
- name: reset the guest after look 1, because this installer stalls and a reset is what moves it
  reboot: true
  timeout: 300
- name: wait for the guest to be drawing again after reset 1
  loop:
    max: 40
    do:
    - wait: 10
    ocr:
      name: back1
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: anything1
      from: back1
      mode: matches
      pattern: .
    until:
      fact: anything1
- name: the copy runs, look 2 of at most 8
  loop:
    max: 30
    # TEN MINUTES, BECAUSE THE INSTALL IS OVER BY THE TIME THIS LOOK RUNS.
    #
    # LOOK 1 OWNS THE COPY. Its ninety minutes cover the measured shape - about 21 minutes of copying
    # before the installer blanks its own screen, plus the ~21 minutes its countdown still owed - so
    # by the time it ends the disk either has macOS on it or the guest is wedged. These later looks
    # exist only to give a reset the chance to draw the Setup Assistant, which takes well under ten
    # minutes: measured, a reset on this host shows the pane within one 15 s read.
    #
    # THEY KEEP THE CLOCK ANYWAY, so a look that is still staring at a black frame after ten minutes
    # asks for another reset instead of ending the walk on a frame that means nothing.
    every: 600
    clock:
    - name: pick macOS Installer in OpenCore's picker, if that is what is up
      click:
      - 731
      - 547
      wait_after: 15
    - name: reset the guest
      reboot: true
      timeout: 300
    - name: give it time to come back
      wait: 60
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: matches
      pattern: 'select your country or region|transfer your information to this mac|choose a wireless network|sign in with your apple id|update mac automatically|choose your look'

    until:
      fact: done
- name: reset the guest after look 2, because this installer stalls and a reset is what moves it
  reboot: true
  timeout: 300
- name: wait for the guest to be drawing again after reset 2
  loop:
    max: 40
    do:
