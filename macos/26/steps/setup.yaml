- name: the Setup Assistant is up, OR THIS STAGE FAILS
  # `until:` IS AN ASSERTION: IT READS THE SCREEN ONCE AND FAILS THE WALK IF THE WORDS ARE ABSENT.
  #
  # THIS STEP USED TO BE A `check:`, WHICH ONLY BINDS A BOOLEAN - and that is how run 44248083728
  # reported success while its own log said
  #
  #	the Setup Assistant is up: assistant = false (mode says_any: none of "select your country
  #	or region" ... in "e")
  #
  # It published a half-installed disk behind the `macos26` tag. A stage whose whole purpose is "the
  # installer has finished and the Setup Assistant is on screen" must FAIL when that is not what it
  # sees, and `until:` is the key in this vocabulary that fails.
  until_any:
  - - select
    - your
    - country
    - or
    - region
  - - how
    - do
    - you
    - want
    - to
    - connect
    - to
    - the
    - internet
  - - transfer
    - your
    - information
    - to
    - this
    - mac
  - - choose
    - a
    - wireless
    - network
  - - sign
    - in
    - with
    - your
    - apple
    - id
