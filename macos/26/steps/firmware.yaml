name: macos 26 - build the firmware once and publish it
recording_resolution:
- 1920
- 1080
# THE SAME BUILD AS `macos/15/steps/firmware.yaml`, FOR A DIFFERENT RECOVERY IMAGE, AND THAT IS THE
# WHOLE DIFFERENCE.
#
# MEASURED, by reading `internal/opencore` rather than by assuming: `opencore.Build` branches on
# `Release` in exactly one place - `if spec.Release == "" { spec.Release = "15" }` - and otherwise
# carries it into `identity.json` as a record. `WriteConfig` receives it and USES IT NOWHERE. The four
# pins (OpenCore 1.0.7, the LongQT template ISO, OVMF code, OVMF vars 1920x1080) are the same for both
# releases, and the 256 MiB FAT32 geometry is the same because it is OpenCore's, not Apple's.
#
# SO WHAT ACTUALLY MAKES A 26 BUILD DIFFERENT IS THE RECOVERY IMAGE: Apple's `apfs.efi` is extracted
# from it, and an image built from the wrong release carries a driver that has not been measured
# against the system it is asked to read. `recovery.dmg` is therefore the input that names the
# release, and it is pulled from `macos-recovery-tahoe` by the workflow that runs this file.
#
# WHY A SEPARATE FILE RATHER THAN A VARIABLE. `release:` on the build step is a literal - `doFetch`
# reads `s.Get("release")` and only falls back to `vars.release` when the step does not name one - and
# a matrix that swapped a variable underneath a shared file would make the published tag depend on how
# the job was invoked. Two files, each with its release written where it can be read, is the same
# choice `macos/15` and `macos/26` already make for their walkthroughs.
#
# THE IDENTITY IS DELIBERATELY FIXED AND TRAVELS WITH THE IMAGE, exactly as in the 15 file: macOS binds
# an installation to the serial it was installed under, and every stage that boots this disk has to
# present the same one. Publishing this image publishes ONE identity for the 26 disks.
vars:
  release:
    from: args.release
    default: '26'
steps:
- name: the recovery image this build reads is already on disk
  # THE ONE INPUT THE BUILD CANNOT DO WITHOUT, and the reason macOS differs from every other guest
  # here: Apple's APFS driver lives inside this image, OVMF has no APFS support of its own, and a boot
  # image built without it starts a firmware that cannot see the installed system - a picker listing
  # only `Reset NVRAM` and `Toggle SIP`, with nothing in any log to say why.
  needs:
  - recovery.dmg
- name: build the firmware the guest boots through
  release: '26'
  # A PATH, NOT AN ASSET ROLE. `recovery:` takes either, and this file names the file the workflow
  # placed rather than asking the asset layer to go and get it.
  recovery: recovery.dmg
  fetch: opencore
