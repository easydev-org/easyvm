name: macos 15 setup (recovery image to setup assistant)
resolution:
- 1920
- 1080
vars:
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: start recording
  record: macos15-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the recovery image
  fetch: recovery_macos
  release: '15'
- name: build OpenCore from the recovery image
  fetch: opencore
  release: '15'
  recovery: recovery_macos
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery_macos
  timeout: 900
- name: the recovery menu's rows
  ocr:
    name: recovery
    region:
    - 760
    - 200
    - 1400
    - 560
    region_at:
    - 1920
    - 1080
    scale: 6
    wait: 5
- name: wait for the recovery menu
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: recovery
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 6
      wait: 0
    check:
      name: done
      from: recovery
      says_any:
      - - restore
        - time
        - machine
      - - reinstall
        - macos
      - - safari
      - - disk
        - utility
    until:
      fact: done
- name: select disk utility
  at:
  - 837
  - 514
  wait_after: 3
- name: open disk utility
  at:
  - 1142
  - 586
  wait_after: 5
- name: choose the target disk by capacity
  loop:
    max: 8
    do:
    - key: up
      wait_after: 3
    ocr:
      name: disk
      region:
      - 690
      - 480
      - 1500
      - 700
      region_at:
      - 1920
      - 1080
      scale: 4
      wait: 3
    check:
      name: right_disk
      from: disk
      size_between:
      - 60
      - 200
    until:
      fact: right_disk
- name: erase - open the sheet
  at_window:
  - 1289
  - 15
  window_x: 500
  window_from: 180
  window_to: 400
  expect_any:
  - - erase
    - deleted
  - - free
    - space
  - - security
    - option
  wait_after: 6
- name: erase - clear the name field
  key: backspace
  wait_after: 3
- name: erase - name the volume
  at:
  - 960
  - 415
  type: '{{ disk_name }}'
  wait_after: 4
- name: erase - confirm
  at:
  - 1155
  - 646
  wait_after: 5
- name: erase - wait for the report
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      says_any:
      - - erase
        - complete
      - - erase
        - process
    until:
      fact: done
- name: erase - done
  at:
  - 1143
  - 601
  wait_after: 5
- name: close disk utility
  key: meta_l+q
  wait_after: 12
- name: the recovery menu is back
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      says:
      - reinstall
      - macos
    until:
      fact: done
- name: select reinstall macos
  at:
  - 837
  - 333
  wait_after: 3
- name: open the installer
  at:
  - 1142
  - 586
  wait_after: 20
- name: wait for the welcome pane
  wait: 10
- name: welcome continue
  at:
  - 960
  - 712
  wait_after: 5
- name: wait for the licence pane
  wait: 60
- name: agree to the licence
  at:
  - 1005
  - 713
  wait_after: 5
- name: wait for the licence sheet
  wait: 10
- name: agree in the sheet
  at:
  - 1060
  - 530
  wait_after: 10
- name: select the destination card
  at:
  - 850
  - 550
  wait_after: 5
- name: destination continue
  at:
  - 1005
  - 712
  wait_after: 10
- name: the copy runs until the Setup Assistant appears
  loop:
    max: 360
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      says_any:
      - - select
        - your
        - country
        - or
        - region
      - - how
        - do
        - you
        - want
        - to
        - connect
        - to
        - the
        - internet
      - - transfer
        - your
        - information
        - to
        - this
        - mac
      - - choose
        - a
        - wireless
        - network
      - - sign
        - in
        - with
        - your
        - apple
        - id
    until:
      fact: done
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: stop recording
  record: false
