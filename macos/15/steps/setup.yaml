name: macos 15 setup (recovery image to setup assistant)
resolution:
- 1920
- 1080
vars:
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: start recording
  record: macos15-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the recovery image
  release: '15'
  asset: recovery_macos
- name: build OpenCore from the recovery image
  release: '15'
  recovery: recovery_macos
  build: opencore
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery_macos
  timeout: 900
- name: the recovery menu's rows
  ocr:
    name: recovery
    region:
    - 760
    - 200
    - 1400
    - 560
    region_at:
    - 1920
    - 1080
    scale: 6
    wait: 5
- name: wait for the recovery menu
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: recovery
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 6
      wait: 0
    check:
      name: done
      from: recovery
      mode: says_any
      words:
      - - restore
        - time
        - machine
      - - reinstall
        - macos
      - - safari
      - - disk
        - utility
    until:
      fact: done
- name: select disk utility
  click:
  - 837
  - 514
  wait_after: 3
- name: open disk utility
  click:
  - 1142
  - 586
  wait_after: 5

# THE WINDOW IS MADE FULL SCREEN BEFORE ANYTHING IN IT IS CLICKED, AND THAT IS WHAT MAKES THE
# COORDINATES FIXED.
#
# MEASURED ACROSS RUNS: Disk Utility centres itself vertically and REMEMBERS ITS HEIGHT, so the same
# toolbar sat at y=255 on one run and y=294 on the next - 39 px of drift, which is more than a button is
# tall. `at_window` was the answer for that, and it needed the right brightness threshold and the right
# offset, and it took four attempts to get both.
#
# THE GREEN BUTTON REMOVES THE PROBLEM INSTEAD OF MEASURING IT. Full screen, the window is the screen:
#
#	Erase  (1681, 57)     First Aid  (1637, 57)     Partition  (1745, 57)
#	sidebar row 1 (100, 128) = the OpenCore boot image
#	sidebar row 2 (100, 153) = the target disk
#
# ONE FIXED SET OF NUMBER FOR EVERY RUN, which is worth more than a cleverer measurement.
#
# THE GREEN BUTTON'S OWN COORDINATE WAS WRONG ONCE: it is at (474, 281) - the traffic lights are
# saturated circles and a pixel scan puts red at (434, 281) and green at (474, 281). A click 5 px right
# and 10 px low missed the button and did nothing, which reads as "maximising is not supported".
- name: make disk utility full screen
  # BY COLOUR, BECAUSE THAT IS THE ONE THING THAT DOES NOT DEPEND ON WHERE THE WINDOW IS.
  #
  # Everything else was tried:
  #
  #	Ctrl+Cmd+F   opens the Window menu's "Fill" - MEASURED, and it did nothing to this window
  #	the menu item    same
  #	a fixed coordinate   wrong whenever the window opened somewhere else, which it does
  #	`at_window`      a brightness scan for the window's edge; needed a threshold, a column, a range
  #	                 and an offset, and was wrong four times
  #
  # MACOS PAINTS THE ZOOM BUTTON rgb(40,200,64) ON EVERY RUN, at every window height, in every Space.
  # That is a property of the compositor, not of this window's position, so one colour finds it:
  # MEASURED at (474,281) on a floating window and (65,50) once full screen - two completely different
  # places, one constant colour.
  at_color:
  - 40
  - 200
  - 64
  color_tolerance: 45
  # THE SEARCH IS LIMITED TO THE TOP-LEFT CORNER, WHERE A WINDOW'S TRAFFIC LIGHTS ALWAYS ARE.
  #
  # The colour is a fact, but it is not a UNIQUE fact: the recovery wallpaper, the desktop picture and
  # other applications all paint saturated greens, and a whole-frame search takes the LARGEST blob -
  # which on the wrong screen is somebody else's control. MEASURED: the zoom button is at (474,281) on
  # a floating window and (65,50) once full screen, and both are inside the first quarter of the frame,
  # so the region is the top-left corner and the decoys elsewhere cannot win.
  color_region:
  - 0
  - 30
  - 700
  - 400
  wait_after: 6
# THE DISK IS CHOSEN BY ITS DEVICE NAME, NOT BY ITS SIZE.
#
# MEASURED: the sidebar shows the virtio disk TWICE - the whole device and the partition the firmware
# left on it - and BOTH report `137.44 GB`. A capacity test cannot tell them apart, so the loop stopped
# on whichever the cursor happened to reach, and the details pane then said `Device: disk1`.
#
# ERASE ACTS ON THE WRONG ONE, OR ON NOTHING: the erase sheet never opened, and the step failed with
#
#	did not advance: wanted "erase deleted" or "free space" or "security option"
#
# against a pane showing a partition rather than a disk.
#
# `Device: disk0` IS THE WHOLE DEVICE and is what must be formatted; `disk1` is a child of it. That is a
# reading with ONE answer, which is the property a stop condition needs.
# THE TARGET IS FOUND BY ITS CAPACITY, AND THAT IS THE ONLY THING THAT WORKS HERE.
#
# THE SIDEBAR LISTS THREE DEVICES AND TWO OF THEM ARE NAMED `disk0`:
#
#	268.4 MB   the OpenCore boot image      <- what `contains: disk0` selected
#	137.44 GB  the target                   <- what must be erased
#	2.88 GB    the recovery volume, read-only
#
# The reference implementation recorded the same trap: "a fixed click erased the 268 MB boot image
# instead". A DEVICE NAME CANNOT DISTINGUISH THEM - the boot image is `disk0` precisely because it is
# bootindex 0 - so the reading has to be a CAPACITY, which is one number with one answer.
#
# AND IF NO DISK IS IN RANGE THE RUN STOPS, which is correct: erasing the wrong one installs macOS
# into a volume that is not the target, and that failure surfaces fifty minutes later.
# THE TARGET IS THE DISK THAT IS `Uninitialized`, AND THAT WORD IS THE ONE THING ONLY IT CAN SAY.
#
# Three devices are listed and TWO ARE NAMED `disk0`, because the OpenCore boot image is bootindex 0:
#
#	268.4 MB   the boot image       "Internal Physical Disk - GUID Partition Map"
#	137.44 GB  the target           "Uninitialized"
#	2.88 GB    the recovery volume  "Mac OS Extended"
#
# A CAPACITY TEST CANNOT TELL THEM APART WITHOUT A RANGE THAT IS TUNED TO THIS ONE IMAGE, and the range
# it was tuned to selected the 268 MB boot image on one run and the 137 GB disk on another. `Uninitialized`
# is a property of the disk that has never been formatted, which is exactly the disk to format, and no
# other device in this window is one.
# THE TARGET IS THE DISK THAT SAYS `Uninitialized`, AND NOTHING ELSE IN THIS WINDOW DOES.
#
# THE ROWS SWAP BETWEEN RUNS - measured by clicking each and reading its detail pane:
#
#	run A   row 1 = 137.44 GB  Uninitialized        row 2 = 268.4 MB   GUID Partition Map
#	run B   row 1 = 268.4 MB   GUID Partition Map   row 2 = 137.44 GB  Uninitialized
#
# so a POSITION is not a judgement. `Uninitialized` IS: it means the disk carries no partition map, which
# is exactly the disk to format, and the other two devices in this window cannot say it - the OpenCore
# boot image is a GUID Partition Map and the recovery volume is Mac OS Extended.
#
# AND IT IS A TEXT READING, NOT A NUMBER: a capacity comparison has to pick a range that happens to
# contain the target and exclude the decoys, and that range is a guess about THIS guest's disk size.
# The word is a fact about the disk's state.
#
# THE DETAIL PANE PRINTS IT ON THE LINE UNDER THE DISK'S NAME, WHICH IS WHY THE REGION IS THE HEADER
# BLOCK AND NOT THE CAPACITY TABLE:
#
#	Apple Inc. VirtIO Block Media
#	Uninitialized
#
# MEASURED AT x=370..660, y=125..140.
# THE ROWS ARE 28 px APART AND THE FIRST ONE STARTS AT y=105, MEASURED OFF THE FRAME'S TEXT BANDS:
#
#	y=105..114   first row    "Apple Inc. VirtIO Block Media"
#	y=133..142   second row   "Apple Inc. VirtIO Block Media"
#	y=184..211   third row    "disk2s1", the recovery volume
#
# `y=96` - the first value - is ABOVE the first row's text, so the click landed on nothing and the
# selection stayed wherever the window left it, which was `disk2s1`. The OCR then read
#
#	disk2s1 USB External Physical Volume - Mac OS Extended 2.88 GB
#
# and the step failed asking for `Uninitialized` on the RECOVERY VOLUME.
# THE ROW IS READ, AND ONLY THEN MOVED - THAT ORDER IS THE WHOLE STEP.
#
# `loop:` RUNS `do:` BEFORE `ocr:`, so a step whose `do:` is "press Down" read the SECOND row on its
# first attempt, then the third:
#
#	do:    key down        <- runs first
#	ocr:   read the header  <- reads the row AFTER the move
#	check: Uninitialized?
#
# MEASURED: six attempts, every one reading `disk2s1 ... Mac OS Extended`, because the loop had walked
# past both disks before it looked. The read has to come first and the movement second.
#
# SO THE FIRST READING IS ITS OWN STEP, and the loop only runs when that reading says no.
# THE ROW IS CLICKED UNTIL IT IS SELECTED, BECAUSE A CLICK ON A LIST THAT IS STILL LAYING OUT IS LOST.
#
# MEASURED: the pointer sits on the first row and `click:` does not select it, while the SAME click by
# hand, a moment later, does. The window has just been made full screen, and Disk Utility re-lays its
# sidebar out for the new width - a click that arrives during that is discarded rather than queued.
#
# SO THE CLICK IS REPEATED AND THE RESULT IS READ, which is the same shape as the GhostBSD checkbox:
# click, read the detail pane, and only stop when the pane says `Uninitialized`.
#
# `x=200` AND NOT `x=100` IS ALSO MEASURED: the sidebar's left margin holds the disk ICON, and the table
# treats the icon as its own widget - a click at x=100 selects nothing, which is why the selection stayed
# on `disk2s1` through six attempts:
#
#	disk2s1 USB External Physical Volume - Mac OS Extended 2.88 GB
# SIX ATTEMPTS, AND THE PANE SAID `GUID Partition Map` EVERY TIME - THE LOOP WAS RE-CLICKING A ROW IT
# HAD ALREADY SELECTED, WHILE THE TARGET WAS THE ONE BELOW IT.
#
# MEASURED, ON CONSECUTIVE RUNS OF THIS SAME STEP:
#
#	run A   row 1 = 137.44 GB  Uninitialized        row 2 = 268.4 MB   GUID Partition Map
#	run B   row 1 = 268.4 MB   GUID Partition Map   row 2 = 137.44 GB  Uninitialized
#
# so the first row is the target on some runs and not others, and a loop that only re-clicks row 1 can
# never find the other case. It reads `GUID Partition Map`, clicks row 1 again, reads the same thing,
# ten times:
#
#	click the first disk: the loop ran 10 attempt(s) and the condition never held
#
# THE LOOP MOVES AS WELL AS CLICKS. One `down` per attempt walks the list once; the reading decides when
# to stop, so both orders are covered without knowing which one this run has.
#
# `x=200` AND NOT `x=100`: the sidebar's left margin holds the disk ICON, and the table treats the icon
# as its own widget - a click at x=100 selects nothing.
- name: find the uninitialised disk
  loop:
    max: 8
    do:
    - click:
      - 200
      - 110
    - wait: 2
    # THE MOVE IS WHAT MAKES THE SEARCH A SEARCH: the second attempt clicks row 1 and steps to row 2,
    # the third steps to row 3, and the reading after each says whether to stop.
    - key: down
    - wait: 2
    ocr:
      name: details
      region:
      - 360
      - 100
      - 1000
      - 160
      region_at:
      - 1920
      - 1080
      scale: 4
      wait: 0
    check:
      name: uninitialised
      from: details
      mode: contains
      text: Uninitialized
    until:
      fact: uninitialised
# THE WINDOW'S POSITION MOVES BETWEEN RUNS, AND ITS BRIGHTNESS IS NOT 200.
#
# MEASURED ACROSS TWO RUNS, sampling column x=500 of the same dialog:
#
#	run 1   window top y=256   Erase button y=291
#	run 2   window top y=294   Erase button y=334
#
# SO THE OFFSET IS STABLE (36 px below the top) AND THE ABSOLUTE POSITION IS NOT. That is exactly what
# `at_window` is for, and it needs the right `window_brightness`: the desktop wallpaper there is
# luminance 21-23 and the window's title bar is 56, so the default threshold of 200 finds NOTHING in a
# dark-mode window and the search walks past it.
#
# A THRESHOLD BETWEEN THE TWO IS THE MEASUREMENT: 40 is above the wallpaper and below the title bar.
- name: erase - open the sheet
  # A FIXED COORDINATE, BECAUSE THE WINDOW IS THE SCREEN NOW.
  #
  # This used to be `at_window: [1289, 15]` with a brightness scan to find the window's top edge, and
  # every part of that was a measurement that could be wrong: the threshold, the scan column, the
  # offset, and whether the edge it found was the window or the wallpaper. It was wrong four times.
  #
  # After `make disk utility full screen` the toolbar is at y=57 on EVERY run, so the Erase icon is at
  # (1681, 57) and there is nothing left to measure. THE FULL-SCREEN STEP IS WHY THIS IS A CONSTANT.
  click:
  - 1681
  - 57
  expect_any:
  - - erase
    - deleted
  - - free
    - space
  - - security
    - option
  wait_after: 6
- name: erase - clear the name field
  key: backspace
  wait_after: 3
- name: erase - name the volume
  click:
  - 960
  - 415
  type: '{{ disk_name }}'
  wait_after: 4
- name: erase - confirm
  click:
  - 1150
  - 647
  wait_after: 5
- name: erase - wait for the report
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - erase
        - complete
      - - erase
        - process
    until:
      fact: done
- name: erase - done
  click:
  - 1143
  - 601
  wait_after: 5
- name: close disk utility
  key: meta_l+q
  wait_after: 12
- name: the recovery menu is back
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - reinstall
      - macos
    until:
      fact: done
- name: select reinstall macos
  click:
  - 837
  - 333
  wait_after: 3
- name: open the installer
  click:
  - 1142
  - 586
  wait_after: 20
# WAIT UNTIL THE PANE IS THERE, NOT FOR A NUMBER OF SECONDS THAT SOMEBODY HOPED WAS ENOUGH.
#
# MEASURED ON THIS GUEST, with timestamps off the frames:
#
#	16:27:42   Continue pressed, "Loading Installation Information..." appears
#	16:28:25   still loading                (+43 s)
#	16:29:39   the licence pane is up       (+117 s)
#
# so this transition is TWO MINUTES, and the step used to wait TEN SECONDS - it then clicked at a
# screen still showing a spinner and the next step found the licence text it had not waited for.
#
# A FIXED WAIT IS THE WRONG SHAPE FOR SOMETHING THIS VARIABLE: the same installer takes 40 s on a warm
# cache and two minutes on a cold one, and a number that is right for the first is a click into a
# spinner for the second. Waiting for the pane's own words is a question with one answer.
- name: wait for the installer to load
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: instaload
      region:
      - 440
      - 380
      - 1480
      - 500
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: loaded
      from: instaload
      mode: says_any
      words:
      - - agree
        - to
        - the
        - terms
      - - english
        - apple
      - - select
        - the
        - disk
      - - macos
        - sequoia
    until:
      fact: loaded
- name: welcome continue
  click:
  - 960
  - 712
  wait_after: 5
# THE PANE IS CONFIRMED, NOT ASSUMED. `wait: 60` was measured short at 117 s.
- name: wait for the licence pane
  loop:
    max: 24
    do:
    - wait: 10
    ocr:
      name: licence
      region:
      - 660
      - 430
      - 1260
      - 700
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: licence_up
      from: licence
      mode: says_any
      words:
      - - software
        - license
        - agreement
      - - please
        - read
        - this
    until:
      fact: licence_up
- name: agree to the licence
  click:
  - 1005
  - 713
  wait_after: 5
# THE SHEET IS A SEPARATE WINDOW, AND ITS OWN AGREE IS THE ONE THAT MATTERS.
#
# MEASURED OFF A FRAME OF THE SHEET ITSELF: its two buttons are the light runs y=509..536, `Disagree`
# at x=846..955 and `Agree` at x=964..1073 - CENTRE (1018, 520).
#
# THE OLD PAIR WAS (1060, 530), which is 42 px right of centre and 13 px from the button's edge. It
# worked when the sheet drew wide and missed when it did not, and a click on the sheet's title or its
# body does nothing and looks exactly like a button being ignored.
#
# AND IT IS WAITED FOR RATHER THAN ASSUMED: `wait: 10` was a hope. The sheet is confirmed by the words
# it puts on screen, so a run that is slow to draw waits instead of clicking the licence text
# underneath - which is the other way this step fails silently.
- name: wait for the licence sheet
  loop:
    max: 12
    do:
    - wait: 5
    ocr:
      name: sheet
      region:
      - 780
      - 330
      - 1140
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: sheet_up
      from: sheet
      mode: says_any
      words:
      - - read
        - and
        - agree
      - - disagree
        - agree
    until:
      fact: sheet_up
- name: agree in the sheet
  click:
  - 1018
  - 520
  wait_after: 10
- name: select the destination card
  click:
  - 850
  - 550
  wait_after: 5
- name: destination continue
  click:
  - 1005
  - 712
  wait_after: 10
- name: the copy runs until the Setup Assistant appears
  # `max` IS A COUNT OF ATTEMPTS AND EACH ONE WAITS 20 SECONDS, WHICH IS THE ARITHMETIC THAT MATTERS.
  #
  # MEASURED ON THIS GUEST: the installer's own estimate at the start of the copy is
  #
  #	macOS Sequoia will be installed on the disk "main".
  #	About 2 hours and 52 minutes remaining
  #
  # and `max: 360` x 20 s is EXACTLY 2 hours - so the loop would have given up 52 minutes before the
  # installer said it would finish, on a run that was working perfectly. A timeout shorter than the
  # thing it is timing out is a failure with a delayed fuse.
  #
  # 600 x 20 s IS 3 HOURS 20 MINUTES, which covers the estimate with room for a slower runner. The
  # ceiling is not a judgement about how long macOS takes; it is the estimate plus a margin, and the
  # number is written here so the next reader can see which of the two it is.
  loop:
    max: 600
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - select
        - your
        - country
        - or
        - region
      - - how
        - do
        - you
        - want
        - to
        - connect
        - to
        - the
        - internet
      - - transfer
        - your
        - information
        - to
        - this
        - mac
      - - choose
        - a
        - wireless
        - network
      - - sign
        - in
        - with
        - your
        - apple
        - id
    until:
      fact: done
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: stop recording
  record: false
