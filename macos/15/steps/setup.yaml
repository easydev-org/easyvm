name: macos 15 setup (recovery image to setup assistant)
resolution:
- 1920
- 1080
vars:
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: start recording
  record: macos15-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the recovery image
  fetch: recovery_macos
  release: '15'
- name: build OpenCore from the recovery image
  fetch: opencore
  release: '15'
  recovery: recovery_macos
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery_macos
  timeout: 900
- name: wait for the recovery menu
  region:
  - 760
  - 200
  - 1400
  - 560
  region_at:
  - 1920
  - 1080
  scale: 6
  timeout: 1800
  poll: 10
  until_any:
  - - restore
    - time
    - machine
  - - reinstall
    - macos
  - - safari
  - - disk
    - utility
- name: select disk utility
  at:
  - 837
  - 514
  settle: 3
- name: open disk utility
  at:
  - 1142
  - 586
  settle: 5
- name: choose the target disk by capacity
  repeat_until:
    attempts: 8
    settle: 3
    until_any:
    - number_between:
      - 60
      - 200
      unit: gb
    actions:
    - key: up
      settle: 3
  region:
  - 690
  - 480
  - 1500
  - 700
  region_at:
  - 1920
  - 1080
  scale: 4
- name: erase - open the sheet
  at_window:
  - 1289
  - 15
  window_x: 500
  window_from: 180
  window_to: 400
  settle: 6
  expect_any:
  - - erase
    - deleted
  - - free
    - space
  - - security
    - option
- name: erase - clear the name field
  key: backspace
  settle: 3
- name: erase - name the volume
  at:
  - 960
  - 415
  type: '{{ disk_name }}'
  settle: 4
- name: erase - confirm
  at:
  - 1155
  - 646
  settle: 5
- name: erase - wait for the report
  until_any:
  - - erase
    - complete
  - - erase
    - process
  timeout: 300
  poll: 5
- name: erase - done
  at:
  - 1143
  - 601
  settle: 5
- name: close disk utility
  key: meta_l+q
  settle: 12
- name: the recovery menu is back
  until:
  - reinstall
  - macos
  region:
  - 760
  - 200
  - 1400
  - 560
  region_at:
  - 1920
  - 1080
  scale: 2
  timeout: 300
  poll: 5
- name: select reinstall macos
  at:
  - 837
  - 333
  settle: 3
- name: open the installer
  at:
  - 1142
  - 586
  settle: 20
- name: wait for the welcome pane
  wait: 10
- name: welcome continue
  at:
  - 960
  - 712
  settle: 5
- name: wait for the licence pane
  wait: 60
- name: agree to the licence
  at:
  - 1005
  - 713
  settle: 5
- name: wait for the licence sheet
  wait: 10
- name: agree in the sheet
  at:
  - 1060
  - 530
  settle: 10
- name: select the destination card
  at:
  - 850
  - 550
  settle: 5
- name: destination continue
  at:
  - 1005
  - 712
  settle: 10
- name: the copy runs until the Setup Assistant appears
  until_any:
  - - select
    - your
    - country
    - or
    - region
  - - how
    - do
    - you
    - want
    - to
    - connect
    - to
    - the
    - internet
  - - transfer
    - your
    - information
    - to
    - this
    - mac
  - - choose
    - a
    - wireless
    - network
  - - sign
    - in
    - with
    - your
    - apple
    - id
  timeout: 7200
  poll: 20
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: stop recording
  record: false
