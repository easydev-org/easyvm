name: macos 15 setup (recovery image to setup assistant)
resolution:
- 1920
- 1080
vars:
  disk_name:
    default: main
  expected_gb:
    default: '68'
  shutdown:
    from: args.shutdown
    default: kill
steps:
- name: start recording
  record: macos15-setup.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the recovery image
  release: '15'
  asset: recovery_macos
- name: build OpenCore from the recovery image
  release: '15'
  recovery: recovery_macos
  build: opencore
- name: boot the recovery image
  boot: true
  os: macos
  recovery: recovery_macos
  timeout: 900
- name: the recovery menu's rows
  ocr:
    name: recovery
    region:
    - 760
    - 200
    - 1400
    - 560
    region_at:
    - 1920
    - 1080
    scale: 6
    wait: 5
- name: wait for the recovery menu
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: recovery
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 6
      wait: 0
    check:
      name: done
      from: recovery
      mode: says_any
      words:
      - - restore
        - time
        - machine
      - - reinstall
        - macos
      - - safari
      - - disk
        - utility
    until:
      fact: done
- name: select disk utility
  click:
  - 837
  - 514
  wait_after: 3
- name: open disk utility
  click:
  - 1142
  - 586
  wait_after: 5
- name: choose the target disk by capacity
  loop:
    max: 8
    do:
    - key: up
      wait_after: 3
    ocr:
      name: disk
      region:
      - 690
      - 480
      - 1500
      - 700
      region_at:
      - 1920
      - 1080
      scale: 4
      wait: 3
    check:
      name: right_disk
      from: disk
      mode: size_between
      range:
      - 60
      - 200
    until:
      fact: right_disk
# THE WINDOW'S POSITION MOVES BETWEEN RUNS, AND ITS BRIGHTNESS IS NOT 200.
#
# MEASURED ACROSS TWO RUNS, sampling column x=500 of the same dialog:
#
#	run 1   window top y=256   Erase button y=291
#	run 2   window top y=294   Erase button y=334
#
# SO THE OFFSET IS STABLE (36 px below the top) AND THE ABSOLUTE POSITION IS NOT. That is exactly what
# `at_window` is for, and it needs the right `window_brightness`: the desktop wallpaper there is
# luminance 21-23 and the window's title bar is 56, so the default threshold of 200 finds NOTHING in a
# dark-mode window and the search walks past it.
#
# A THRESHOLD BETWEEN THE TWO IS THE MEASUREMENT: 40 is above the wallpaper and below the title bar.
- name: erase - open the sheet
  at_window:
  - 1289
  - 36
  window_x: 500
  window_from: 180
  window_to: 400
  window_brightness: 40
  expect_any:
  - - erase
    - deleted
  - - free
    - space
  - - security
    - option
  wait_after: 6
- name: erase - clear the name field
  key: backspace
  wait_after: 3
- name: erase - name the volume
  click:
  - 960
  - 415
  type: '{{ disk_name }}'
  wait_after: 4
- name: erase - confirm
  click:
  - 1155
  - 646
  wait_after: 5
- name: erase - wait for the report
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - erase
        - complete
      - - erase
        - process
    until:
      fact: done
- name: erase - done
  click:
  - 1143
  - 601
  wait_after: 5
- name: close disk utility
  key: meta_l+q
  wait_after: 12
- name: the recovery menu is back
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 760
      - 200
      - 1400
      - 560
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says
      words:
      - reinstall
      - macos
    until:
      fact: done
- name: select reinstall macos
  click:
  - 837
  - 333
  wait_after: 3
- name: open the installer
  click:
  - 1142
  - 586
  wait_after: 20
- name: wait for the welcome pane
  wait: 10
- name: welcome continue
  click:
  - 960
  - 712
  wait_after: 5
- name: wait for the licence pane
  wait: 60
- name: agree to the licence
  click:
  - 1005
  - 713
  wait_after: 5
- name: wait for the licence sheet
  wait: 10
- name: agree in the sheet
  click:
  - 1060
  - 530
  wait_after: 10
- name: select the destination card
  click:
  - 850
  - 550
  wait_after: 5
- name: destination continue
  click:
  - 1005
  - 712
  wait_after: 10
- name: the copy runs until the Setup Assistant appears
  loop:
    max: 360
    do:
    - wait: 20
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - select
        - your
        - country
        - or
        - region
      - - how
        - do
        - you
        - want
        - to
        - connect
        - to
        - the
        - internet
      - - transfer
        - your
        - information
        - to
        - this
        - mac
      - - choose
        - a
        - wireless
        - network
      - - sign
        - in
        - with
        - your
        - apple
        - id
    until:
      fact: done
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: stop recording
  record: false
