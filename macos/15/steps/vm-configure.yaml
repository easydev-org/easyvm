name: macos 15 - configure the vm (share, login hook, guest agent)
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  hostname:
    from: args.hostname
    default: easyvm-macos15
  timezone:
    from: args.timezone
    default: America/Los_Angeles
  locale:
    from: args.locale
    default: en_US.UTF-8
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  host:
    from: args.host
    default: 172.30.0.1
  out:
    from: args.out
    default: out/distro.qcow2
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - boot.img
  - macos.rom
  - macos.vars
  - mac-guest-agent
- name: start recording
  record: macos15-vm-configure.mp4
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: wait for sshd
  require_ssh: true
  timeout: 900
- name: copy the agent into the guest
  # A PREPARED INPUT: the workflow pulls `macos-asset-mac-guest-agent` before this stage starts.
  # `mav2287/mac-guest-agent` is a native binary that speaks the same protocol Apple's does not
  # provide for this guest; it is a few MiB, but a download in the middle of a boot is a download
  # that can outlast the boot budget.
  scp:
  - mac-guest-agent
  - /tmp/mac-guest-agent
  requires:
  - ssh
  timeout: 300
- name: install the guest agent
  ssh: 'chmod +x /tmp/mac-guest-agent &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' /tmp/mac-guest-agent --install 2>&1 | tail -12 &&

    sleep 5 &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' launchctl print system/org.mav2287.mac-guest-agent 2>&1 | head -6 ||

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pgrep -fl mac-guest-agent

    '
  timeout: 600
- name: prove the guest agent answers
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pgrep -fl mac-guest-agent &&

    echo ''--- serial ports the agent can use ---'' &&

    ls -l /dev/cu.serial* 2>/dev/null &&

    echo ''--- what it logged ---'' &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' tail -8 /var/log/mac-guest-agent.log 2>/dev/null || true

    '
  timeout: 120
- name: set the machine's name
  # macOS HAS THREE NAMES AND THEY ARE NOT THE SAME THING. A walkthrough that sets only HostName gets
  # a guest whose prompt, Bonjour name and Finder label all still say the installer's default:
  #
  #	HostName        what `hostname` answers and what ssh reports
  #	LocalHostName   the Bonjour name - no dots, 63 characters, letters/digits/hyphens only
  #	ComputerName    the label a person sees
  #
  # `{{ hostname }}` has a hyphen and no dot, so the same string is legal for all three.
  ssh: >-
    printf '%s\n' '{{ password }}' | sudo -S -p '' sh -c
    'scutil --set HostName {{ hostname }};
    scutil --set LocalHostName {{ hostname }};
    scutil --set ComputerName {{ hostname }}'
  timeout: 180
- name: prove the name, all three of it
  ssh: >-
    sh -c 'for k in HostName LocalHostName ComputerName; do
    printf "%s = %s\n" "$k" "$(scutil --get $k)"; done;
    test "$(scutil --get HostName)" = "{{ hostname }}" && echo HOSTNAME_OK'
  timeout: 60
- name: set the time zone
  # `systemsetup -settimezone` NEEDS SUDO AND IS THE DOCUMENTED SWITCH; `ln -sf /var/db/timezone/...`
  # is what it does underneath and is two files rather than one. The list of legal names is
  # `/usr/share/zoneinfo/zone.tab`, the same database every other guest here uses.
  ssh: >-
    printf '%s\n' '{{ password }}' | sudo -S -p ''
    systemsetup -settimezone {{ timezone }}
  timeout: 180
- name: prove the time zone
  # `systemsetup -gettimezone` NEEDS ROOT - "You need administrator access to run this tool" - and an
  # ssh session as the unprivileged account is not root. MEASURED on run 43938667507, where the zone
  # WAS set correctly and this step failed anyway:
  #
  #	systemsetup = You need administrator access to run this tool... exiting!
  #	localtime   = /private/var/db/timezone/tz/2026f.1.0/zoneinfo/America/Los_Angeles
  #	date        = Mon Nov 16 11:42:04 PST 2026
  #
  # SO THE PROOF IS THE TWO FACTS THAT NEED NO PRIVILEGE: the symlink target, which is what the
  # system reads, and `date`, which prints the zone abbreviation. A check that fails on a correct
  # machine teaches the next reader to ignore it.
  ssh: >-
    sh -c 'local=$(readlink -f /etc/localtime); echo "localtime = $local"; echo "date = $(date)";
    printf "%s" "$local" | grep -q "{{ timezone }}" && echo TIMEZONE_OK'
  timeout: 60
- name: set the locale to American English with a UTF-8 terminal
  # macOS DOES NOT HAVE `locale-gen`: its locales are compiled in, and a guest asks for one by NAME in
  # `.GlobalPreferences`. Three separate defaults because they answer three questions - the UI
  # language, the measurement/format conventions, and the encoding a terminal uses.
  ssh: >-
    printf '%s\n' '{{ password }}' | sudo -S -p '' sh -c
    'defaults write NSGlobalDomain AppleLocale -string "en_US";
    defaults write NSGlobalDomain AppleLanguages -array "en-US" "en";
    defaults write NSGlobalDomain AppleMeasurementUnits -string "Inches";
    defaults write NSGlobalDomain AppleMetricUnits -bool false'
  timeout: 120
- name: prove the locale is the American one
  ssh: >-
    sh -c 'echo "AppleLocale = $(defaults read NSGlobalDomain AppleLocale)";
    echo "AppleLanguages = $(defaults read NSGlobalDomain AppleLanguages | tr -d "\n")";
    defaults read NSGlobalDomain AppleLocale | grep -q "en_US" && echo LOCALE_OK'
  timeout: 60
- name: serve the host share
  share_serve: true
  timeout: 60
- name: prove the guest can fetch from the host share
  share_mount: true
  share_family: macos
  requires:
  - share
  timeout: 180
- name: show what the guest sees at the share
  # THE SHARE IS HTTP, SO THE GUEST'S OWN CLIENT IS THE PROOF. `share_mount:` fetches a sentinel the
  # host wrote and compares the bytes; this step is the readable version of the same answer, printed
  # so a person can see what happened rather than only whether it passed.
  #
  # IT USED TO CHECK A CIFS MOUNT AND A ROUND TRIP THROUGH ~/shared. Both are gone: there is no mount
  # any more, and a guest writing to its own home and reading it back proves the guest's filesystem.
  ssh: >-
    sh -c 'curl -fsS --max-time 20 http://172.30.0.1:8080/shared/ 2>&1 | head -20; echo "fetch exit = $?"'
  timeout: 120
- name: write the launcher
  write: launcher
  family: macos
  timeout: 60
- name: write the login agent plist
  write: macos_agent_plist
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: copy the login agent plist in
  scp:
  - org.vm.bootstrap.plist
  - /tmp/bootstrap.plist
  timeout: 300
- name: install the login agent
  # THE LAUNCHDAEMON THAT MOUNTED THE SHARE IS GONE WITH THE SHARE'S TRANSPORT. It existed because a
  # macOS LaunchDaemon had to mount SMB as root - `mount_smbfs` refuses a non-root client against
  # this server - and something had to re-do it at every boot. The launcher now FETCHES its script
  # over HTTP, which needs no root, no mount and no daemon at boot: one LaunchAgent at login is the
  # whole mechanism.
  ssh: "set -e\nlaunchd_home=$(eval echo \"~$(id -un)\")\nmkdir -p \"$launchd_home/Library/LaunchAgents\"\ncp /tmp/bootstrap-launcher.sh \"$launchd_home/bootstrap-launcher.sh\"\nchmod +x \"$launchd_home/bootstrap-launcher.sh\"\nsed 's|__LAUNCHER__|'\"$launchd_home\"'/bootstrap-launcher.sh|' /tmp/bootstrap.plist > \"$launchd_home/Library/LaunchAgents/org.vm.bootstrap.plist\"\necho INSTALLED_FOR_NEXT_LOGIN\n"
  timeout: 300
- name: prove the login agent is installed and loads
  # THE PLIST IS LINTED AND THE JOB IS ASKED FOR BY NAME, because a LaunchAgent that exists and does
  # not parse is one that never fires - and the failure is silent.
  ssh: 'ls -l ~/Library/LaunchAgents/org.vm.bootstrap.plist ~/bootstrap-launcher.sh &&

    plutil -lint ~/Library/LaunchAgents/org.vm.bootstrap.plist &&

    launchctl print gui/$(id -u)/org.vm.bootstrap 2>&1 | head -6 || echo "not loaded yet; it loads at next login"

    '
  timeout: 120
- name: prove the launcher fetches, by running it now
  # THE AGENT RUNS AT LOGIN, SO ITS OWN SCRIPT IS RUN HERE IN THE SAME WAY. That is the difference
  # between "the file was installed" and "the file works": the fetch, the marker and the log are all
  # exercised, and the log is read back.
  ssh: sh -c '/bin/sh ~/bootstrap-launcher.sh 2>&1 | head -5; echo "--- log ---"; tail -8 ~/bootstrap.log 2>/dev/null || echo "(no log)"'
  timeout: 180
- name: prove the login hook is installed
  ssh: 'ls -l ~/Library/LaunchAgents/org.vm.bootstrap.plist ~/bootstrap-launcher.sh &&

    plutil -lint ~/Library/LaunchAgents/org.vm.bootstrap.plist &&

    grep -c bootstrap-launcher.sh ~/Library/LaunchAgents/org.vm.bootstrap.plist

    '
  timeout: 60
- name: write the automatic login password, which is XOR'd against Apple's fixed key
  # macOS HAS NO `autologin-user` FILE. Auto-login is a 12-byte file at `/etc/kcpassword` holding the
  # password XOR'd against a fixed key, plus one key in the loginwindow preferences - and missing
  # EITHER half leaves the machine at a password prompt. This is issue easydev-org/easyvm#1's second
  # ask, and macOS was the one guest of the four where neither half existed.
  #
  # THE KEY IS APPLE'S OWN, published in every write-up of this file:
  #
  #	0x7D 0x89 0x52 0x23 0xD2 0xBC 0xDD 0xEA 0xA3 0xB9 0x1F
  #
  # THE PADDING IS PART OF THE FORMAT: the payload is the password, then NULs, up to a multiple of 12
  # bytes - an 8-character password becomes 12. A file that is not a multiple of 12 has kcpassword's
  # own reader stop early, and the effect is a login that does not happen with no error anywhere.
  #
  # `perl` RATHER THAN `python3`: macOS 15 ships no python3 and this repository does not install one
  # (`python3` is refused by policy), while perl is in the base system on every macOS. `printf '%02x'`
  # and `hex()` are enough for XOR; no module is needed.
  #
  # `chmod 600 root:wheel` BECAUSE loginwindow REFUSES A FILE ANYONE ELSE CAN READ, and it refuses it
  # silently - the file is there, the password is right, and nothing logs in.
  ssh: 'printf ''%s'' ''{{ password }}'' | perl -e ''my $key = pack("C*", 0x7d,0x89,0x52,0x23,0xd2,0xbc,0xdd,0xea,0xa3,0xb9,0x1f); my $pw = <STDIN>; chomp $pw; my @b = unpack("C*", $pw); my $n = ((int(@b / 12) + 1) * 12); push @b, (0) x ($n - @b); my $k = 0; my $out = ""; for my $c (@b) { $out .= sprintf("%02x", $c ^ ord(substr($key, $k % 12, 1))); $k++ } print $out'' > /tmp/kcpassword.hex && printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''perl -e "print pack(q{H*}, do { local $/; <STDIN> })" < /tmp/kcpassword.hex > /etc/kcpassword && chown root:wheel /etc/kcpassword && chmod 600 /etc/kcpassword'' && ls -l /etc/kcpassword && echo KCPASSWORD_WRITTEN

    '
  timeout: 180
- name: give loginwindow the other half, without which macOS shows the lock screen anyway
  # `autoLoginUserScreenLocked = 0` IS THE SECOND HALF AND IT IS EASY TO MISS: without it macOS logs
  # the user in and then IMMEDIATELY presents the lock screen, which from the outside is
  # indistinguishable from auto-login not working at all. This is the same trap
  # `windows/11/answer/Autounattend.xml` records for `LogonCount=1`.
  #
  # `defaults write` AS THE USER, NOT AS ROOT: the preferences file lives in the user's own domain,
  # and a root write goes to /var/root/Library/Preferences where loginwindow never looks.
  ssh: 'defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser -string ''{{ user }}'' 2>&1 || printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser -string ''{{ user }}''; printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' defaults write /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked -bool false; echo AUTOLOGIN_CONFIGURED

    '
  timeout: 120
- name: prove both halves are in place
  # BOTH ARE READ BACK, because either one being wrong is a password prompt and neither one is an
  # error: `ls -l` shows the file exists, `stat -f%z` shows it is a multiple of 12, and the two
  # `defaults read` lines show the user and the screen-locked flag.
  ssh: 'stat -f "%z bytes" /etc/kcpassword && stat -f "%Sp %Su" /etc/kcpassword && sudo -n defaults read /Library/Preferences/com.apple.loginwindow autoLoginUser && sudo -n defaults read /Library/Preferences/com.apple.loginwindow autoLoginUserScreenLocked

    '
  timeout: 120
- name: turn off display sleep and the screen saver, which is what a viewer then sees
  # `pmset` NEEDS SUDO AND HAS NO UNPRIVILEGED FORM. The screen saver's idle time is a SEPARATE
  # domain - `com.apple.screensaver idleTime` - and setting only `pmset` leaves a guest whose display
  # stays on and whose saver still covers it.
  #
  # `defaults -currentHost` BECAUSE THAT IS WHERE macOS LOOKS for this key; a plain `defaults write
  # com.apple.screensaver` writes a file the saver does not read, and the write succeeds.
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pmset displaysleep 0 sleep 0; defaults -currentHost write com.apple.screensaver idleTime 0; echo SLEEP_DISABLED

    '
  timeout: 180
- name: prove the machine will not go to sleep
  # `pmset -g custom` PRINTS THE EFFECTIVE VALUES, which is what matters: the command above can exit 0
  # and be ignored if another profile overrides it.
  ssh: 'pmset -g custom | grep -iE "displaysleep|sleep" | head -4; defaults -currentHost read com.apple.screensaver idleTime

    '
  timeout: 120
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
