name: macos 15 - configure the vm (share, login hook, guest agent)
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  host:
    from: args.host
    default: 172.30.0.1
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: start recording
  record: macos15-vm-configure.mp4
- name: fetch the recovery image
  fetch: recovery_macos
  release: '15'
- name: build OpenCore from the recovery image
  fetch: opencore
  release: '15'
  recovery: recovery_macos
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: wait for sshd
  require_ssh: true
  timeout: 900
- name: fetch the guest agent on the host
  fetch: guest_agent
  family: macos
  timeout: 900
- name: copy the agent into the guest
  scp:
  - mac-guest-agent
  - /tmp/mac-guest-agent
  requires:
  - ssh
  timeout: 300
- name: install the guest agent
  ssh: 'chmod +x /tmp/mac-guest-agent &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' /tmp/mac-guest-agent --install 2>&1 | tail -12 &&

    sleep 5 &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' launchctl print system/org.mav2287.mac-guest-agent 2>&1 | head -6 ||

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pgrep -fl mac-guest-agent

    '
  timeout: 600
- name: prove the guest agent answers
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pgrep -fl mac-guest-agent &&

    echo ''--- serial ports the agent can use ---'' &&

    ls -l /dev/cu.serial* 2>/dev/null &&

    echo ''--- what it logged ---'' &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' tail -8 /var/log/mac-guest-agent.log 2>/dev/null || true

    '
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: mount the host share
  share_mount: true
  share_family: macos
  requires:
  - share
  timeout: 180
- name: prove the share is readable and writable
  ssh: 'ls -la ~/shared | head -20 && printf ''written-by-%s\n'' "$(hostname)" > ~/shared/from-guest.txt && cat ~/shared/from-guest.txt

    '
  timeout: 120
- name: write the launcher
  write: launcher
  family: macos
  timeout: 60
- name: write the login agent plist
  write: macos_agent_plist
  timeout: 60
- name: write the mount daemon script
  write: macos_mount_script
  timeout: 60
- name: write the mount daemon plist
  write: macos_mount_plist
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: copy the login agent plist in
  scp:
  - org.vm.bootstrap.plist
  - /tmp/bootstrap.plist
  timeout: 300
- name: copy the mount daemon in
  scp:
  - vm-smbmount.sh
  - /tmp/smbmount.sh
  timeout: 300
- name: copy the mount daemon plist in
  scp:
  - org.vm.smbmount.plist
  - /tmp/smbmount.plist
  timeout: 300
- name: install the login agent and the mount daemon
  ssh: "set -e\nlaunchd_home=$(eval echo \"~$(id -un)\")\nmkdir -p \"$launchd_home/Library/LaunchAgents\"\ncp /tmp/bootstrap-launcher.sh \"$launchd_home/bootstrap-launcher.sh\"\nchmod +x \"$launchd_home/bootstrap-launcher.sh\"\
    \nsed 's|__LAUNCHER__|'\"$launchd_home\"'/bootstrap-launcher.sh|' /tmp/bootstrap.plist > \"$launchd_home/Library/LaunchAgents/org.vm.bootstrap.plist\"\nprintf '%s\\n' '{{ password }}' | sudo -S -p ''\
    \ sh -c '\n  mkdir -p /Library/LaunchDaemons /usr/local/bin\n  cp /tmp/smbmount.sh /usr/local/bin/vm-smbmount.sh\n  chmod 700 /usr/local/bin/vm-smbmount.sh\n  chown root:wheel /usr/local/bin/vm-smbmount.sh\n\
    \  sed \"s|__SCRIPT__|/usr/local/bin/vm-smbmount.sh|\" /tmp/smbmount.plist > /Library/LaunchDaemons/org.vm.smbmount.plist\n  chmod 644 /Library/LaunchDaemons/org.vm.smbmount.plist\n  chown root:wheel\
    \ /Library/LaunchDaemons/org.vm.smbmount.plist'\nprintf '%s\\n' '{{ password }}' | sudo -S -p '' launchctl bootout system/org.vm.smbmount 2>/dev/null || true\nprintf '%s\\n' '{{ password }}' | sudo\
    \ -S -p '' launchctl bootstrap system /Library/LaunchDaemons/org.vm.smbmount.plist\necho INSTALLED_FOR_NEXT_LOGIN\n"
  timeout: 300
- name: prove the mount daemon is installed
  ssh: 'ls -l /Library/LaunchDaemons/org.vm.smbmount.plist /usr/local/bin/vm-smbmount.sh &&

    plutil -lint /Library/LaunchDaemons/org.vm.smbmount.plist &&

    printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' launchctl print system/org.vm.smbmount | head -12

    '
  timeout: 120
- name: prove the daemon mounted the share
  ssh: 'mount | grep '' on /Users/'' && ls -la ~/shared | head -10

    '
  timeout: 120
- name: prove the login hook is installed
  ssh: 'ls -l ~/Library/LaunchAgents/org.vm.bootstrap.plist ~/bootstrap-launcher.sh &&

    plutil -lint ~/Library/LaunchAgents/org.vm.bootstrap.plist &&

    grep -c bootstrap-launcher.sh ~/Library/LaunchAgents/org.vm.bootstrap.plist

    '
  timeout: 60
- name: stop recording
  record: false
