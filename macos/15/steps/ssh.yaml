- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the build over ssh
  ssh: sw_vers -productVersion
- name: prove the account over ssh
  ssh: id -un
- name: prove disk utility works over ssh
  # A TOOL THAT NEEDS THE GUI SUBSYSTEM. `diskutil list` walks the IOKit registry, so it answers only if
  # the session behind sshd is a real one - a daemon that came up without a window server fails here
  # rather than at the first thing that needs a device.
  ssh: diskutil list | head -5
- name: name the machine
  ssh: printf '%s\n' "{{ password }}" | sudo -S scutil --set LocalHostName {{ user }}
- name: note what is absent
  # HOME-BREW IS NOT INSTALLED, and saying so in the log is better than a later stage discovering it.
  ssh: command -v brew || true
# AND NOW THE MACHINE GOES DOWN OVER ITS OWN SSHD, WHICH IS WHY THE MERGE IS WORTH MORE THAN THE STEPS
# IT SAVES.
#
# `shutdown: kill` DISCARDED THE WIZARD'S WORK, and this stage's whole output is that work:
#
#	desktop stage:   diff written      878 MiB   flattened to desktop.qcow2
#	rebooted disk:   "Select Your Country or Region"       <- Setup Assistant, first pane
#	grep vmuser in the flattened disk's first 200 MiB -> 0
#
# `/var/db/.AppleSetupDone` and `/Users/vmuser` are written at the END of the wizard and were still in
# the page cache when qemu was killed, so APFS rolled back to a journal point before they existed. With
# sshd up, `shutdown: ssh` asks macOS to power off through its own init, which unmounts and closes the
# journal first - the same reason ghostbsd's `a39075b` replaced its kill.
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
