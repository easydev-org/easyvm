name: macos 15 remote login
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/macos15-ssh.qcow2
  shutdown:
    from: args.shutdown
    default: ssh
boot_disk: from_caller
steps:
- name: start recording
  record: install.mp4
- name: fetch the recovery image
  release: '15'
  asset: recovery_macos
- name: build OpenCore from the recovery image
  release: '15'
  recovery: recovery_macos
  build: opencore
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: wait for the login window
  wait_for: login_window
  timeout: 240
- name: dismiss anything over the login window
  key: esc
  wait_after: 2
- name: click the password field
  at:
  - 965
  - 981
  wait_after: 1
- name: type the password
  type: '{{ password }}'
  wait_after: 1
- name: press return
  key: ret
  wait_after: 20
- name: dismiss the overlays macOS puts up on a first login
  do:
  - at:
    - 1228
    - 826
    wait_after: 4
  - at:
    - 1228
    - 826
    wait_after: 4
  - at:
    - 1228
    - 826
    wait_after: 4
  - key: esc
    wait_after: 2
  - key: meta_l+q
    wait_after: 2
  - key: esc
    wait_after: 2
- name: wait for the desktop
  repeat_until:
    attempts: 10
    until_any:
    - desktop: macos
    actions:
    - key: esc
      wait_after: 1
    - key: meta_l+q
      wait_after: 1
    - key: esc
      wait_after: 1
    wait_after: 60
  timeout: 600
- name: dismiss anything over the desktop
  key: esc
  wait_after: 2
- name: open spotlight
  key: meta_l+spc
  wait_after: 4
- name: type the settings app name
  type: system settings
  wait_after: 7
- name: open it
  key: ret
  wait_after: 14
- name: the settings window is up
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - system
        - settings
      - - general
      - - wi-fi
    until:
      fact: done
- name: search for remote login
  at:
  - 715
  - 267
  type: remote login
  clear: true
  modifier: meta_l
  wait_after: 10
- name: the remote login result is on screen
  loop:
    max: 45
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 590
      - 240
      - 1210
      - 720
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - sharing
        - remote
      - - allow
        - full
        - disk
        - access
    until:
      fact: done
- name: open the remote login pane
  at:
  - 703
  - 336
  wait_after: 12
- name: open the remote login pane again
  unless:
  - allow
  - full
  - disk
  - access
  region:
  - 726
  - 300
  - 1200
  - 715
  scale: 2
  at:
  - 703
  - 336
  wait_after: 12
  region_at:
  - 1920
  - 1080
- name: the remote login pane is up
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 726
      - 300
      - 1200
      - 715
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - allow
        - full
        - disk
        - access
    until:
      fact: done
- name: turn remote login on
  unless:
  - log
  - in
  - to
  - this
  - computer
  region:
  - 726
  - 300
  - 1200
  - 715
  scale: 2
  at:
  - 1145
  - 353
  wait_after: 4
  region_at:
  - 1920
  - 1080
- name: the switch reads on
  loop:
    max: 10
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 726
      - 300
      - 1200
      - 715
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - log
        - in
        - to
        - this
        - computer
    until:
      fact: done
- name: close the pane
  at:
  - 1145
  - 679
  wait_after: 5
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the build
  ssh: sw_vers -productVersion
- name: prove the account
  ssh: id -un
- name: prove disk utility works over ssh
  ssh: diskutil list | head -5
- name: name the machine
  ssh: printf '%s\n' "{{ password }}" | sudo -S scutil --set LocalHostName {{ user }}
- name: note what is absent
  ssh: command -v brew || true
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
