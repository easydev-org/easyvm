name: macos 15 - every primitive, nothing expensive
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  host:
    from: args.host
    default: 172.30.0.1
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: fetch the recovery image
  release: '15'
  asset: recovery_macos
- name: build OpenCore from the recovery image
  release: '15'
  recovery: recovery_macos
  build: opencore
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: wait for sshd
  require_ssh: true
  ssh_probe: echo ok
  timeout: 900
- name: say what came up
  ssh: 'sw_vers && uname -a && id -un

    '
  timeout: 120
- name: write a script on the host
  write: demo_script
  timeout: 60
- name: copy it in
  scp:
  - demo.sh
  - /tmp/demo.sh
  timeout: 120
- name: prove the copied script arrived
  ssh: 'sh /tmp/demo.sh

    '
  timeout: 120
- name: capture the screen
  screenshot: after-boot.png
  timeout: 60
- name: start recording
  record: primitives.mp4
  timeout: 60
- name: do something worth recording
  ssh: 'uptime

    '
  timeout: 60
- name: stop recording
  record: false
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: mount the host share
  share_mount: true
  share_family: macos
  requires:
  - share
  timeout: 180
- name: prove the share is writable
  ssh: 'printf ''from-%s\n'' "$(hostname)" > ~/shared/primitives.txt && cat ~/shared/primitives.txt

    '
  timeout: 120
- name: reboot
  reboot: true
  timeout: 300
- name: wait for sshd again
  require_ssh: true
  ssh_probe: echo ok
  timeout: 900
- name: shut down through the agent
  shutdown: guest_agent
  requires:
  - qga
  timeout: 300
- name: stop whatever is left
  shutdown: kill
  timeout: 120
