name: macos 15 sequoia setup assistant
resolution:
- 1920
- 1080
ends:
- finder
ends_region:
- 0
- 0
- 700
- 34
ends_region_scale: 3
ends_at:
- name: the login window's password field
  region:
  - 880
  - 960
  - 1045
  - 1000
  scale: 6
  words:
  - enter
  - password
waits_for:
- - country
  - region
- - transfer
  - data
- - spoken
  - languages
- - accessibility
  - individual
- - data
  - privacy
- - create
  - mac
  - account
- - sign
  - in
  - to
  - your
  - apple
  - account
- - terms
  - conditions
- - location
  - services
- - time
  - zone
- - analytics
  - improve
- - screen
  - report
- - look
  - appearance
- - welcome
  - mac
- - keyboard
  - select
boot_timeout: 1800
boot_poll: 10
stuck_after: 20
pane_limit: 3
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  shutdown:
    from: args.shutdown
    default: ssh
boot_disk: from_caller
steps:
- name: fetch the recovery image
  fetch: recovery_macos
  release: '15'
- name: build OpenCore from the recovery image
  fetch: opencore
  release: '15'
  recovery: recovery_macos
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: analytics
  when:
  - analytics
  - improve
  do:
  - at:
    - 808
    - 513
    wait_after: 3
  - at:
    - 1306
    - 810
    wait_after: 10
- name: data and privacy
  when:
  - privacy
  - fundamental
  at:
  - 1306
  - 810
  wait_after: 8
- name: written and spoken languages
  when:
  - spoken
  - languages
  at:
  - 1306
  - 810
  wait_after: 8
- name: accessibility
  when:
  - accessibility
  - individual
  at:
  - 1306
  - 806
  wait_after: 12
- name: transfer your data
  when:
  - transfer
  - data
  do:
  - at:
    - 825
    - 669
    wait_after: 4
  - at:
    - 1306
    - 810
    wait_after: 10
- name: country or region
  when:
  - country
  - region
  do:
  - at:
    - 900
    - 500
    wait_after: 2
  - at:
    - 900
    - 500
    type: united states
    wait_after: 3
  - at:
    - 1306
    - 810
    wait_after: 8
- name: create a mac account
  when:
  - create
  - mac
  - account
  once: true
  region:
  - 300
  - 300
  - 1620
  - 340
  region_at:
  - 1920
  - 1080
  scale: 2
  do:
  - at:
    - 945
    - 447
    type: '{{ user }}'
    modifier: meta_l
    wait_after: 3
  - at:
    - 850
    - 531
    type: '{{ password }}'
    modifier: meta_l
    wait_after: 3
  - at:
    - 1086
    - 531
    type: '{{ password }}'
    modifier: meta_l
    wait_after: 3
  - at:
    - 1306
    - 810
    wait_after: 180
- name: enable location services
  when:
  - approximate
  - location
  do:
  - at:
    - 1306
    - 810
    wait_after: 6
  - at:
    - 960
    - 632
    wait_after: 3
  - key: ret
    wait_after: 6
- name: screen time
  when:
  - screen
  - report
  at:
  - 619
  - 806
  wait_after: 8
- name: time zone
  when:
  - time
  - zone
  at:
  - 1306
  - 806
  wait_after: 10
- name: choose your look
  when:
  - look
  - appearance
  at:
  - 1306
  - 805
  wait_after: 12
- name: terms and conditions
  when:
  - terms
  - conditions
  do:
  - at:
    - 1298
    - 806
    wait_after: 8
  - at:
    - 1019
    - 616
    wait_after: 10
- name: welcome to mac
  when:
  - welcome
  - mac
  at:
  - 960
  - 990
  wait_after: 12
- name: keyboard
  when:
  - keyboard
  - assistant
  at:
  - 1222
  - 818
  wait_after: 12
- name: sign in to apple account
  when:
  - sign
  - in
  - to
  - your
  - apple
  - account
  region:
  - 300
  - 420
  - 1620
  - 460
  region_at:
  - 1920
  - 1080
  scale: 2
  do:
  - at:
    - 620
    - 811
    wait_after: 2
  - key: ret
    wait_after: 3
  - at:
    - 1026
    - 634
    wait_after: 2
  - key: ret
    wait_after: 2
- name: the apple account pane is gone
  expect_any:
  - - update
    - automatically
  - - choose
    - a
    - look
  - - welcome
    - to
    - mac
  timeout: 60
- name: update mac automatically
  when:
  - update
  - automatically
  at:
  - 1306
  - 810
  optional: true
  wait_after: 15
- name: click the password field
  at:
  - 965
  - 981
  skip_when_unfinished: true
  wait_after: 1
- name: type the password
  type: '{{ password }}'
  skip_when_unfinished: true
  wait_after: 1
- name: press return
  key: ret
  skip_when_unfinished: true
  wait_after: 20
- name: dismiss the overlays macOS puts up on a first login
  do:
  - at:
    - 1228
    - 826
    wait_after: 4
  - at:
    - 1228
    - 826
    wait_after: 4
  - at:
    - 1228
    - 826
    wait_after: 4
  - key: esc
    wait_after: 2
  - key: meta_l+q
    wait_after: 2
  - key: esc
    wait_after: 2
  optional: true
  skip_when_unfinished: true
- name: wait for the desktop
  desktop: macos
  timeout: 300
  skip_when_unfinished: true
- name: stop the machine
  shutdown: '{{ shutdown }}'
  timeout: 300
