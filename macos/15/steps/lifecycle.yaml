name: macos 15 - the machine's own lifecycle
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
ssh_user: vmuser
ssh_port: 2222
boot_disk: from_caller
steps:
- name: fetch the recovery image
  release: '15'
  asset: recovery_macos
- name: build OpenCore from the recovery image
  release: '15'
  recovery: recovery_macos
  build: opencore
- name: boot the disk
  boot: true
  os: macos
  timeout: 900
- name: wait for sshd
  require_ssh: true
  ssh_probe: echo ok
  timeout: 900
- name: say what came up
  ssh: 'sw_vers && uname -a && id -un

    '
  timeout: 120
- name: reboot into the same system
  reboot: true
  timeout: 900
- name: prove it came back
  require_ssh: true
  ssh_probe: echo ok
  timeout: 900
- name: say what came up the second time
  ssh: 'uptime && sw_vers

    '
  timeout: 120
- name: shut it down
  shutdown: kill
