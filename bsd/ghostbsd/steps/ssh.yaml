name: bsd-ghostbsd-mate - sshd
resolution:
- 1920
- 1080
vars:
  password:
    from: args.password
    default: admin
  user:
    from: args.user
    default: vmuser
steps:
- name: start recording
  record: ghostbsd-ssh.mp4
- name: boot the disk
  boot: true
  os: bsd
  timeout: 900
- name: greeter - the password box
  at:
  - 259
  - 568
  settle: 2
  optional: true
- name: greeter - log in
  type: '{{ password }}'
  settle: 3
  optional: true
- name: greeter - submit
  key: ret
  settle: 20
  optional: true
- name: wake the screen
  key: esc
  settle: 3
- name: open the Applications menu
  key: alt+f1
  settle: 4
- name: choose System Tools
  key: down
  settle: 1
- name: choose System Tools 2
  key: down
  settle: 1
- name: choose System Tools 3
  key: down
  settle: 1
- name: choose System Tools 4
  key: down
  settle: 1
- name: choose System Tools 5
  key: down
  settle: 1
- name: choose System Tools 6
  key: down
  settle: 2
- name: open the System Tools submenu
  key: right
  settle: 3
- name: choose MATE Terminal 1
  key: down
  settle: 1
- name: choose MATE Terminal 2
  key: down
  settle: 1
- name: choose MATE Terminal 3
  key: down
  settle: 1
- name: choose MATE Terminal 4
  key: down
  settle: 1
- name: choose MATE Terminal 5
  key: down
  settle: 1
- name: choose MATE Terminal 6
  key: down
  settle: 2
- name: open MATE Terminal
  key: ret
  settle: 15
- name: enable sshd at boot
  run: echo {{ password }} | sudo -S sysrc sshd_enable=YES 2>&1 | tail -3
  terminal_wait: 0
  settle: 5
- name: allow password authentication
  run: echo {{ password }} | sudo -S sh -c 'printf "PasswordAuthentication yes\n" >> /etc/ssh/sshd_config; grep -c "^PasswordAuthentication yes" /etc/ssh/sshd_config' 2>&1 | tail -3
  terminal_wait: 0
  settle: 5
- name: start sshd
  run: echo {{ password }} | sudo -S sh -c 'service sshd restart || service sshd start' 2>&1 | tail -3
  terminal_wait: 0
  settle: 20
- name: prove sshd is listening
  run: echo {{ password }} | sudo -S sh -c 'service sshd status; sockstat -4 -l | grep sshd' 2>&1 | tail -6
  terminal_wait: 0
  settle: 8
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
  timeout: 120
- name: prove the account over ssh
  ssh: id -un; hostname
  timeout: 120
- name: stop recording
  record: false
