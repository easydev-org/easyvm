name: bsd-ghostbsd - configure the vm (name, share, guest agent)
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  hostname:
    from: args.hostname
    default: easyvm-vm
  host:
    from: args.host
    default: 172.30.0.1
  share_name:
    from: args.share_name
    default: shared
  out:
    from: args.out
    default: out/vm-configure.qcow2
  boot_timeout:
    from: args.boot_timeout
    default: '1800'
ssh_user: vmuser
ssh_port: 2222
steps:
- name: start recording
  record: vm-configure.mp4
- name: take the input disk
  disk: disk.qcow2
- name: boot the disk
  boot: true
  os: bsd
  timeout: '{{ boot_timeout }}'
- name: wait for sshd
  require_ssh: true
  timeout: '{{ boot_timeout }}'
- name: announce the machine's name
  ssh: echo "this machine will be named '{{ hostname }}'"
  timeout: 60
- name: set the machine's name in rc.conf
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sysrc hostname="{{ hostname }}"

    '
  timeout: 120
- name: set the running name
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' hostname "{{ hostname }}"

    '
  timeout: 180
- name: point the loopback line at that name
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  if grep -q \"^127\\.0\\.1\\.1\" /etc/hosts; then\n    sed -i \"\" \"s/^127\\.0\\.1\\.1.*/127.0.1.1 {{ hostname }}/\" /etc/hosts\n  else\n\
    \    printf \"127.0.1.1\\t%s\\n\" \"{{ hostname }}\" >> /etc/hosts\n  fi'\n"
  timeout: 120
- name: prove the name
  ssh: "sh -c '\n  set -e\n  echo \"rc.conf: $(sysrc -n hostname)\"\n  echo \"kernel:  $(hostname)\"\n  test \"$(sysrc -n hostname)\" = \"{{ hostname }}\"\n  test \"$(hostname)\" = \"{{ hostname }}\"'\n"
  timeout: 60
- name: install the guest agent
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pkg install -y qemu-guest-agent 2>&1 | tail -5

    '
  timeout: 900
- name: enable the guest agent at boot
  ssh: "printf '%s\\n' '{{ password }}' | sudo -S -p '' sh -c '\n  sysrc qemu_guest_agent_enable=YES 2>&1\n  service qemu-guest-agent start 2>&1 | tail -3'\n"
  timeout: 180
- name: prove the guest agent is running
  ssh: "sh -c '\n  echo \"--- the process ---\"\n  PIDS=$(pgrep -f qemu-ga 2>/dev/null || true)\n  echo \"${PIDS:-none}\"\n  echo \"--- a virtio console, whichever path this kernel uses ---\"\n  CONS=$(ls\
    \ -d /dev/vtcon/* /dev/virtio-ports/* 2>/dev/null || true)\n  echo \"${CONS:-none}\"\n  test -n \"$PIDS\"\n  test -n \"$CONS\"'\n"
  timeout: 120
- name: install the userspace smb client
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' pkg install -y fusefs-smbnetfs 2>&1 | tail -5

    '
  timeout: 900
- name: load the fuse module
  ssh: 'printf ''%s\n'' ''{{ password }}'' | sudo -S -p '''' sh -c ''kldload fusefs 2>&1 || true; kldstat | grep -c fusefs''

    '
  timeout: 120
- name: serve the host share
  share_serve: true
  timeout: 60
- name: prove the guest can reach the server on 445
  ssh: "sh -c '\n  echo \"--- the address this guest has ---\"\n  ifconfig | grep \"inet \" | head -4\n  echo \"--- the route to the host ---\"\n  route -n get {{ host }} 2>&1 | head -6\n  echo \"--- can\
    \ it open 445 ---\"\n  timeout 10 nc -z -v {{ host }} 445 2>&1 || timeout 10 nc {{ host }} 445 </dev/null 2>&1 || true\n  echo \"--- and can it resolve nothing? (the mount takes an address, not a name)\
    \ ---\"\n  getent hosts {{ host }} 2>&1 || true'\n"
  timeout: 120
  optional: true
- name: write the smb client's configuration
  write: smb_conf
  timeout: 60
- name: copy smb.conf in
  scp:
  - smb.conf
  - /tmp/smb.conf
  timeout: 300
- name: copy smbnetfs.conf in
  scp:
  - smbnetfs.conf
  - /tmp/smbnetfs.conf
  timeout: 300
- name: mount the host share
  ssh: "sh -c '\n  set -e\n  MOUNT=\"$HOME/shared\"\n  mkdir -p \"$MOUNT\"\n  printf \"%s\\n\" \"{{ password }}\" | sudo -S -p \"\" sh -c \"\n    mkdir -p /root/.smb\n    cp /tmp/smb.conf /root/.smb/smb.conf\n\
    \    cp /tmp/smbnetfs.conf /root/.smb/smbnetfs.conf\n    chmod 600 /root/.smb/smb.conf /root/.smb/smbnetfs.conf\n    echo \\\"--- the conf smbnetfs will read ---\\\"\n    cat -e /root/.smb/smbnetfs.conf\n\
    \    echo \\\"--- end ---\\\"\n    rm -f /tmp/smbnetfs.log /tmp/smbnetfs.out\n    smbnetfs -o allow_other \\\"$MOUNT\\\" >/tmp/smbnetfs.out 2>&1\n    sleep 2\"\n  echo \"--- what smbnetfs said on its\
    \ own streams ---\"\n  printf \"%s\\\\n\" \"{{ password }}\" | sudo -S -p \"\" tail -12 /tmp/smbnetfs.out 2>&1 || true\n  echo \"--- waiting for the tree ---\"\n  n=0\n  while [ $n -lt 30 ]; do\n  \
    \  if [ -n \"$(ls -A \\\"$MOUNT\\\" 2>/dev/null)\" ]; then\n      echo \"the tree appeared after $((n * 2))s\"\n      break\n    fi\n    n=$((n + 1))\n    sleep 2\n  done\n  echo \"--- what appeared\
    \ ---\"\n  ls -la \"$MOUNT\" 2>&1 | head -10\n  find \"$MOUNT\" -maxdepth 3 -type d 2>/dev/null | head -12\n  # TOUCH THE SHARE, NOT JUST THE TREE. `stat` is fabricated by smbnetfs (it answers 0777\n\
    \  # for any name in its own tree without asking the server), so only a readdir or a write\n  # can provoke the session setup. Doing it HERE means the refusal, if there is one, lands\n  # while this\
    \ step is running, so the witness step after it can read the server log.\n  #\n  # NO APOSTROPHE IN THESE FOUR LINES, AND THAT IS NOT STYLE. They sit INSIDE the single\n  # quoted body of `sh -c`, and\
    \ one possessive closed that quote early - which is what fish\n  # reported as `Expected a command, but found an incomplete token`, one line from the end.\n  echo \"--- a first attempt at the share\
    \ itself ---\"\n  ls \"$MOUNT\"/{{ host }}/{{ share_name }} 2>&1 | head -5'\n"
  optional: true
  timeout: 600
- name: print the server's account of the session
  host_log: smbd
  optional: true
  timeout: 60
- name: prove the share is readable and writable
  ssh: "sh -c '\n  set +e\n  MOUNT=\"$HOME/shared\"\n  echo \"--- the tree smbnetfs built ---\"\n  find \"$MOUNT\" -mindepth 1 -maxdepth 4 -type d 2>/dev/null | head -12\n  SHARE=\"$MOUNT/{{ host }}/{{\
    \ share_name }}\"\n  [ -d \"$SHARE\" ] || \\\n    SHARE=$(find \"$MOUNT\" -mindepth 1 -maxdepth 4 -type d -name {{ share_name }} 2>/dev/null | head -1)\n  echo \"--- the share ---\"\n  echo \"$SHARE\"\
    \n  rc=0\n  echo \"--- ls ---\"\n  ls -la \"$SHARE\" 2>&1 | head -20 || rc=1\n  echo \"--- write ---\"\n  if printf \"written-by-the-guest\\n\" > \"$SHARE/from-guest.txt\" 2>/tmp/write.err; then\n \
    \   cat \"$SHARE/from-guest.txt\" 2>&1 | head -3\n    [ \"$(cat \"$SHARE/from-guest.txt\" 2>/dev/null)\" = \"written-by-the-guest\" ] || rc=1\n  else\n    cat /tmp/write.err 2>/dev/null | head -3\n\
    \    rc=1\n  fi\n  echo \"--- the client log, taken AFTER the attempt (unfiltered) ---\"\n  printf \"%s\\n\" \"{{ password }}\" | sudo -S -p \"\" \\\n    tail -50 /tmp/smbnetfs.log 2>&1\n  echo \"---\
    \ the streams smbnetfs wrote ---\"\n  printf \"%s\\n\" \"{{ password }}\" | sudo -S -p \"\" \\\n    tail -20 /tmp/smbnetfs.out 2>&1\n  echo \"--- round trip rc=$rc ---\"\n  [ $rc -eq 0 ] && echo \"\
    round trip ok\"\n  exit $rc'\n"
  timeout: 180
- name: write the launcher
  write: launcher
  family: linux
  timeout: 60
- name: copy the launcher in
  scp:
  - bootstrap-launcher.sh
  - /tmp/bootstrap-launcher.sh
  timeout: 300
- name: install the launcher
  ssh: "sh -c '\n  set -e\n  install -m 0755 /tmp/bootstrap-launcher.sh \"$HOME/bootstrap-launcher.sh\"\n  touch \"$HOME/.xinitrc\"\n  grep -q bootstrap-launcher.sh \"$HOME/.xinitrc\" || \\\n  printf \"\
    \\n%s\\n\" \"sh $HOME/bootstrap-launcher.sh &\" >> \"$HOME/.xinitrc\"\n  echo INSTALLED_FOR_NEXT_LOGIN\n  tail -3 \"$HOME/.xinitrc\"'\n"
  timeout: 300
- name: prove the launcher is installed
  ssh: "sh -c '\n  set -e\n  ls -l \"$HOME/bootstrap-launcher.sh\" \"$HOME/.xinitrc\"\n  grep -q bootstrap-launcher.sh \"$HOME/.xinitrc\"\n  echo enabled'\n"
  timeout: 60
- name: stop the machine
  shutdown: ssh
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
