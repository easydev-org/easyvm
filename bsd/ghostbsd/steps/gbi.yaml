name: ghostbsd gbi
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
steps:
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: ghostbsd
- name: boot the installer
  boot: true
  os: bsd
  iso: installer_iso
  timeout: 1800
- name: choose the X driver, when the menu appears
  until_any:
  - - start
    - desktop
    - with
  - - failed
    - to
    - auto
  timeout: 300
  poll: 5
  optional: true
- name: reach scfb with four downs
  key: down
  repeat:
  - 4
  - 1.0
  settle: 2
- name: choose scfb
  key: ret
  settle: 25
- name: wait for the live desktop
  until_any:
  - - install
    - ghostbsd
  - - applications
  timeout: 1800
  poll: 10
- name: welcome
  at: &id001
  - 1293
  - 781
  settle: 12
  expect: keyboard
- name: keyboard
  at: *id001
  settle: 12
- name: time zone
  at: *id001
  settle: 12
- name: installation type
  at: *id001
  settle: 14
- name: tick the zfs disk
  at:
  - 592
  - 495
  settle: 5
- name: zfs configuration
  at: *id001
  settle: 14
- name: boot option
  at: *id001
  settle: 14
- name: real name
  at:
  - 959
  - 457
  type: '{{ user }}'
- name: user name
  at:
  - 959
  - 503
  type: '{{ user }}'
- name: password
  at:
  - 959
  - 595
  type: '{{ password }}'
- name: verify password
  at:
  - 959
  - 643
  type: '{{ password }}'
- name: install
  at: *id001
  settle: 25
- name: installation runs
  wait: 1800
  keep_alive: true
