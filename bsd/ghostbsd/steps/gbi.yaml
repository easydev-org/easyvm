name: ghostbsd gbi
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ghostbsd-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: ghostbsd
  asset: linux_iso
- name: boot the installer
  boot: true
  os: bsd
  iso: installer_iso
  timeout: 1800
  # 8 GiB, AND THE NUMBER IS MEASURED RATHER THAN GENEROUS.
  #
  # GhostBSD's installation media does not run from the ISO - it copies its whole system image into a
  # SWAP-BASED MEMDISK and runs from there. On the 26.3 image that copy is 1909 MiB, and 4096 MiB
  # leaves it short:
  #
  #	==> Replicate system image to swap-based memdisk
  #	cannot receive new filesystem stream: out of space 114.024s, 27 MB/s
  #	Enter full pathname of shell or RETURN for /rescue/sh:
  #
  # THE SCREEN AFTER THAT IS THE TRAP: the failure looks like a hang, because the walk was waiting for
  # an X-driver menu that the installer never reached, and reported `choose the X driver` sixty times
  # while the machine sat at a rescue prompt.
  #
  # 4096 WAS RIGHT FOR 24.10.1, whose image is smaller - the reference implementation's own
  # `--mem 4096` is what this number started as. The release is pinned to 26.3 here, so the number
  # moves with it: the memdisk needs the image plus the kernel plus the copy's own working set, and
  # 8 GiB is that with room, on a runner that has 16.
  memory_mb: 8192
# THE MENU'S OWN COUNTDOWN IS THE THING TO READ, AND IT IS READ ON THE SCREEN.
#
# `until_console: any other key for boot menu` WATCHED THE SERIAL PORT, and the serial port is not
# where the countdown is: it printed the menu and then `Exiting menu!` while this file was still
# waiting, so the `3` that followed landed on a kernel that had already started. MEASURED, from the
# console log of the run that failed at `welcome` with a click that did nothing:
#
#	[Enter] boot now, any other key for boot menu... 2
#	Welcome to GhostBSD
#	1. Boot Multi user [Enter]  2. Boot Single user  3. Escape to loader prompt  ...
#	Exiting menu!
#
# AND THE UNTIL THAT FOLLOWED CHECKED THE WRONG THING. `the loader prompt is up` looked for the words
# `detailed help` / `list of commands`, which are the LOADER's help text - and it "succeeded" on a
# screen reading `sd Plt Ned Probie 2 Lect LO ee es ene`: kernel output, read as if it were a prompt.
# Everything typed after that went into a booting kernel, `hw.usb.usbhid.enable=1` was never set, and
# THE FIRST CLICK OF THE INSTALLER LANDED NOWHERE - which is the failure this file was chasing.
#
# SO THE MENU IS CONFIRMED BY ITS OWN WORDS BEFORE THE HOTKEY IS PRESSED, which is what the reference
# implementation does in the same place (`if "multi user" in joined and "escape" in joined`).
- name: wait for the boot menu
  loop:
    max: 120
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: menu_up
      from: screen
      mode: says_any
      words:
      # THE MENU SAYS `Boot Multi user` AND A BARE `Escape`, and the reference implementation's own
      # note is that the menu carries no `loader` word at all.
      - - multi
        - user
      - - escape
        - to
        - loader
    until:
      fact: menu_up
- name: escape to the loader prompt
  key: '3'
  wait_after: 3
- name: wait for the loader prompt
  loop:
    max: 30
    do:
    - wait: 3
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: prompt_up
      from: screen
      mode: says_any
      words:
      # THE PROMPT IS `OK` AND NOTHING ELSE, so the evidence is the help line the loader prints under
      # it. `Type '?' for a list of commands` is on every FreeBSD loader prompt and on no other
      # screen of this boot.
      - - list
        - of
        - commands
      - - type
        - for
        - a
        - list
    until:
      fact: prompt_up
- name: clear the loader command line
  key: ctrl+u
  wait_after: 1
- name: set the usb hid setting
  type: set hw.usb.usbhid.enable=1
  type_gap: 0.15
  wait_after: 2
- name: run the setting
  key: ret
  wait_after: 3
- name: the loader accepted the setting
  loop:
    max: 30
    do:
    - wait: 2
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - detailed
        - help
      - - list
        - of
        - commands
    until:
      fact: done
- name: boot the live system
  type: boot
  type_gap: 0.15
  wait_after: 1
- name: start the boot
  key: ret
  wait_after: 10
# THE X DRIVER MENU MAY NEVER APPEAR, AND WAITING FOR IT IS NOT THE SAME AS WAITING FOR THE DESKTOP.
#
# MEASURED, on the local pod at 26.3: the machine boots to a fully drawn MATE desktop, X starts on the
# default driver, and gbi opens its own "Welcome to GhostBSD / Please select your language" window. THE
# MENU IS NOT SHOWN, because it exists only when X CANNOT start - and the old version of this file
# waited sixty times for a title that was never going to be drawn.
#
# THE REFERENCE IMPLEMENTATION SAYS SO IN ITS OWN WORDS: "IT MAY NOT APPEAR, and that is not a
# failure: the menu is shown when X cannot start on the default driver ... the driver treats 'the
# desktop is already up' and 'the menu was answered' as the same success."
#
# SO THE QUESTION IS ASKED FIRST AND THE ANSWER PICKS THE PATH. A `check:` produces a boolean, an
# `if:` branches on it, and each branch does one thing - which is why this is three steps rather than
# one that waits for either.
- name: wait for the desktop or the X driver menu
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: booted
      from: screen
      mode: says_any
      words:
      # THE INSTALLER'S OWN FIRST WINDOW, WHICH IS WHAT ACTUALLY APPEARS.
      #
      # MEASURED ON THE LOCAL POD: X starts on the default driver, the MATE desktop is drawn, and gbi
      # opens `Welcome to GhostBSD / Please select your language` by itself - the X driver menu is
      # never shown, because it only exists when X FAILS.
      #
      # `welcome` AND `ghostbsd` TOGETHER are the pair a reader can trust: `ghostbsd` alone is on the
      # loader's own output and on the desktop's wallpaper, and `welcome` alone is a word any dialog
      # may carry.
      - - welcome
        - ghostbsd
      # THE DESKTOP WITHOUT THE INSTALLER, for a boot that comes up to a panel and no window. `install
      # ghostbsd` is gbi's menu entry; `applications` is the MATE panel, which the reference
      # implementation reads as `places` because OCR turns `Applications` into `Ppplications`.
      - - install
        - ghostbsd
      - - places
      # THE MENU, WHICH ONLY EXISTS WHEN X FAILED TO START.
      - - start
        - desktop
        - with
      - - failed
        - to
        - auto
    until:
      fact: booted
# ONE STEP DOES ONE THING: an `ocr:` reads and a `check:` decides, and THEY ARE SEPARATE STEPS.
#
# THEY WERE ONE, and the second half never ran: the dispatcher's first branch is `case s.Has("ocr")`,
# which calls `doOCR` and RETURNS - so the `check:` in the same step was read from the file, accepted
# by the vocabulary, and silently skipped. The next step then failed with
#
#	`if: menu` names a boolean no `check:` step has made
#
# which is a true statement about a file that looks like it made one.
- name: read the screen again
  ocr:
    name: screen
    region:
    - 0
    - 0
    - 1920
    - 1080
    region_at:
    - 1920
    - 1080
    scale: 1
    # NO PAUSE: the loop above has just read this screen and the question is about THAT reading. A
    # `wait:` here would be a second look at a later frame, and the two answers could disagree.
    wait: 0
- name: is the X driver menu the thing on screen
  check:
    name: menu
    from: screen
    mode: says_any
    words:
    - - start
      - desktop
      - with
    - - failed
      - to
      - auto
- name: choose scfb, when the menu is the thing on screen
  if: menu
  then:
  # FOUR DOWNS REACH scfb. The menu's entries are the driver list, and scfb - the UEFI framebuffer -
  # is the one that works on this machine. `failed to auto` picks the same entry, because the menu
  # defaults to the first row.
  - name: reach scfb
    do:
    - key: down
      wait_after: 1
    - key: down
      wait_after: 1
    - key: down
      wait_after: 1
    - key: down
      wait_after: 1
  - name: choose scfb
    key: ret
    wait_after: 25
- name: wait for the live desktop
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - ghostbsd
      - - install
        - ghostbsd
      - - places
    until:
      fact: done
- name: welcome
  at:
  - 1293
  - 781
  expect: keyboard
  wait_after: 12
- name: keyboard
  at:
  - 1293
  - 781
  wait_after: 12
- name: time zone
  at:
  - 1293
  - 781
  wait_after: 12
- name: installation type
  at:
  - 1293
  - 781
  wait_after: 14
- name: tick the zfs disk
  at:
  - 592
  - 495
  wait_after: 5
- name: zfs configuration
  at:
  - 1293
  - 781
  wait_after: 14
- name: boot option
  at:
  - 1293
  - 781
  wait_after: 14
- name: real name
  at:
  - 959
  - 457
  type: '{{ user }}'
- name: user name
  at:
  - 959
  - 503
  type: '{{ user }}'
- name: password
  at:
  - 959
  - 595
  type: '{{ password }}'
- name: verify password
  at:
  - 959
  - 643
  type: '{{ password }}'
- name: install
  at:
  - 1293
  - 781
  wait_after: 25
- name: installation runs
  wait: 1800
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
