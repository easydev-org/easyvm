name: ghostbsd gbi
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ghostbsd-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  release: ghostbsd
  asset: linux_iso
- name: boot the installer
  boot: true
  os: bsd
  iso: installer_iso
  timeout: 1800
  # 8 GiB, AND THE NUMBER IS MEASURED RATHER THAN GENEROUS.
  #
  # GhostBSD's installation media does not run from the ISO - it copies its whole system image into a
  # SWAP-BASED MEMDISK and runs from there. On the 26.3 image that copy is 1909 MiB, and 4096 MiB
  # leaves it short:
  #
  #	==> Replicate system image to swap-based memdisk
  #	cannot receive new filesystem stream: out of space 114.024s, 27 MB/s
  #	Enter full pathname of shell or RETURN for /rescue/sh:
  #
  # THE SCREEN AFTER THAT IS THE TRAP: the failure looks like a hang, because the walk was waiting for
  # an X-driver menu that the installer never reached, and reported `choose the X driver` sixty times
  # while the machine sat at a rescue prompt.
  #
  # 4096 WAS RIGHT FOR 24.10.1, whose image is smaller - the reference implementation's own
  # `--mem 4096` is what this number started as. The release is pinned to 26.3 here, so the number
  # moves with it: the memdisk needs the image plus the kernel plus the copy's own working set, and
  # 8 GiB is that with room, on a runner that has 16.
  memory_mb: 8192
# THE MENU IS TWO SECONDS LONG, SO IT IS PRESSED AT RATHER THAN WAITED FOR.
#
# MEASURED, from this machine's console log:
#
#	[Enter] boot now, any other key for boot menu... 2
#	1. Boot Multi user [Enter]  2. Boot Single user  3. Escape to loader prompt  ...
#	Exiting menu!
#
# TWO SECONDS. A loop that WAITS and then reads - `wait: 3`, then an OCR, then a check - spends longer
# than the window deciding whether the window is open, and the machine autoboots past it while the
# walk is still reading. The first version of this file did exactly that, and the `3` that followed
# landed in a booting kernel.
#
# SO EVERY ROUND PRESSES AND THEN READS, which is what the reference implementation does in
# `_press_until_prompt`: press the menu's own hotkey, look, and repeat until the prompt is there. The
# key is safe outside the menu - `3` means nothing to OVMF, nothing to the kernel's console, and at
# the loader prompt it is one character that the next step clears with ctrl+u.
#
# THE PROMPT IS `OK` AND NOTHING ELSE, so the evidence is the help line under it. `list of commands`
# is printed on every FreeBSD loader prompt and on no other screen of this boot - and, unlike the
# kernel output that fooled the first version, it cannot be mistaken for a complaint.
# THE COUNTDOWN IS THREE SECONDS, AND ONE HOTKEY IS ALL IT TAKES - IF IT ARRIVES IN TIME.
#
# MEASURED, on this machine's serial console:
#
#	[Enter] boot now, any other key for boot menu... 2
#	[Enter] boot now, any other key for boot menu... 1
#	[Enter] boot now, any other key for boot menu... 0
#	Loading kernel...
#
# THREE TICKS. The previous version pressed `3` once, waited two seconds, took a screenshot and read
# it - and one OCR round trip is longer than the whole window, so the machine was loading a kernel
# while the walk was deciding whether the menu had appeared. It never had.
#
# SO THE PRESSES ARE SEPARATE FROM THE READING, AND THE PRESSES ARE A BURST. A keypress costs
# milliseconds; the reading costs seconds. Pressing `3` ten times over five seconds spans the window
# with presses and nothing else, and `3` is harmless outside the menu: OVMF ignores it, the loader
# prompt takes it as one character that the next step clears, and the kernel ignores it.
#
# ONLY THEN IS THE RESULT VERIFIED. A prompt that is still not there after the burst is a real
# failure and says so, rather than pressing into a booting kernel for sixty rounds.
# NO LOADER ROUND TRIP AT ALL, AND THAT IS MEASURED RATHER THAN ASSUMED.
#
# THIS FILE USED TO REACH THE LOADER PROMPT AND SET `hw.usb.usbhid.enable=1`, and the reason was the
# reference implementation, which does exactly that - because it gives its guest a `usb-tablet` and
# FreeBSD's `ums(4)` declines a HID tablet until usbhid is enabled.
#
# MEASURED ON 26.3, WITH THE SAME usb-tablet AND NO LOADER AT ALL: the pointer moved to an absolute
# position and every click landed. The language dialog's Next button advanced the installer. FreeBSD 14
# and later enable usbhid by default, so the setting is not needed on this release - and the whole
# dance it required was the worst kind of cost:
#
#	THE COUNTDOWN IS THREE SECONDS, and pressing `3` through it meant a burst of blind keys before any
#	reading could happen. Three runs were spent on that race, and one of them typed nine `3`s into the
#	installer's search box because the machine had already autobooted past the menu.
#
# SO THE INSTALLER IS BOOTED AND THE DESKTOP IS WAITED FOR, which is what the other walkthroughs do.
# The device is still `usb-tablet` on a BSD - see `internal/daemon/driver.go` for why it cannot be
# `virtio-tablet-pci` - and that is the only part of this that had to change.
- name: wait for the desktop or the X driver menu
  loop:
    max: 60
    do:
    - wait: 5
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: booted
      from: screen
      mode: says_any
      words:
      # THE INSTALLER'S OWN FIRST WINDOW, WHICH IS WHAT ACTUALLY APPEARS.
      #
      # MEASURED ON THE LOCAL POD: X starts on the default driver, the MATE desktop is drawn, and gbi
      # opens `Welcome to GhostBSD / Please select your language` by itself - the X driver menu is
      # never shown, because it only exists when X FAILS.
      #
      # `welcome` AND `ghostbsd` TOGETHER are the pair a reader can trust: `ghostbsd` alone is on the
      # loader's own output and on the desktop's wallpaper, and `welcome` alone is a word any dialog
      # may carry.
      - - welcome
        - ghostbsd
      # THE DESKTOP WITHOUT THE INSTALLER, for a boot that comes up to a panel and no window. `install
      # ghostbsd` is gbi's menu entry; `applications` is the MATE panel, which the reference
      # implementation reads as `places` because OCR turns `Applications` into `Ppplications`.
      - - install
        - ghostbsd
      - - places
      # THE MENU, WHICH ONLY EXISTS WHEN X FAILED TO START.
      - - start
        - desktop
        - with
      - - failed
        - to
        - auto
    until:
      fact: booted
# ONE STEP DOES ONE THING: an `ocr:` reads and a `check:` decides, and THEY ARE SEPARATE STEPS.
#
# THEY WERE ONE, and the second half never ran: the dispatcher's first branch is `case s.Has("ocr")`,
# which calls `doOCR` and RETURNS - so the `check:` in the same step was read from the file, accepted
# by the vocabulary, and silently skipped. The next step then failed with
#
#	`if: menu` names a boolean no `check:` step has made
#
# which is a true statement about a file that looks like it made one.
- name: read the screen again
  ocr:
    name: screen
    region:
    - 0
    - 0
    - 1920
    - 1080
    region_at:
    - 1920
    - 1080
    scale: 1
    # NO PAUSE: the loop above has just read this screen and the question is about THAT reading. A
    # `wait:` here would be a second look at a later frame, and the two answers could disagree.
    wait: 0
- name: is the X driver menu the thing on screen
  check:
    name: menu
    from: screen
    mode: says_any
    words:
    - - start
      - desktop
      - with
    - - failed
      - to
      - auto
- name: choose scfb, when the menu is the thing on screen
  if: menu
  then:
  # FOUR DOWNS REACH scfb. The menu's entries are the driver list, and scfb - the UEFI framebuffer -
  # is the one that works on this machine. `failed to auto` picks the same entry, because the menu
  # defaults to the first row.
  - name: reach scfb
    do:
    - key: down
      wait_after: 1
    - key: down
      wait_after: 1
    - key: down
      wait_after: 1
    - key: down
      wait_after: 1
  - name: choose scfb
    key: ret
    wait_after: 25
- name: wait for the live desktop
  loop:
    max: 180
    do:
    - wait: 10
    ocr:
      name: screen
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: done
      from: screen
      mode: says_any
      words:
      - - welcome
        - ghostbsd
      - - install
        - ghostbsd
      - - places
    until:
      fact: done
# A SETTLE AFTER THE WINDOW APPEARS, BECAUSE THE FIRST FRAME THAT SAYS "welcome ghostbsd" IS NOT YET
# A WINDOW THAT TAKES A CLICK.
#
# MEASURED: the wait above satisfied on its FIRST attempt - one OCR read `welcome ghostbsd` - and the
# click that followed did nothing, while the SAME click by hand, a minute later, advanced the dialog to
# Keyboard Setup. GTK has drawn the window and its buttons by then, but the toolkit needs its main loop
# to run before it maps input to widgets, and a click that arrives in that gap is discarded - not
# queued, so retrying later is the only way to see it.
#
# TEN SECONDS is the reference implementation's own settle for this pane, and it is measured rather
# than chosen: gbi's window appears well before it responds.
# THE FIRST CLICK IS RETRIED, BECAUSE A WINDOW THAT HAS BEEN DRAWN IS NOT YET A WINDOW THAT TAKES A
# CLICK, AND THERE IS NO READING THAT TELLS THE TWO APART.
#
# MEASURED, ON ONE MACHINE, TWICE IN A ROW: the walk's click at (1331,785) did nothing and the step
# failed with "did not advance: wanted keyboard, read Welcome to GhostBSD"; the SAME click by hand, on
# the SAME machine minutes later, advanced the dialog - first to Keyboard Setup, then to Network Setup.
#
# So the coordinates are right, the device is right, and the event arrives; what differs is WHEN. GTK
# has drawn the window before its main loop accepts input, and a press that arrives in that gap is
# discarded rather than queued - which is why waiting a fixed ten seconds did not help and retrying
# does.
#
# A LOOP RATHER THAN `expect:`, because `expect:` ASSERTS and this is a question with two answers. The
# click and the reading are separate steps, which is the rule the whole DSL rests on: `do:` clicks,
# `ocr:` reads, `check:` decides, `until:` stops.
- name: press Next until the keyboard page appears
  loop:
    max: 20
    do:
    - click:
      - 1331
      - 785
    - wait: 3
    ocr:
      name: screen
      region:
      - 560
      - 260
      - 1360
      - 400
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: advanced
      from: screen
      mode: says_any
      words:
      - - keyboard
        - setup
      - - keyboard
        - layout
    until:
      fact: advanced
- name: welcome
  wait_after: 2
- name: keyboard
  click:
  - 1331
  - 785
  wait_after: 12
- name: time zone
  click:
  - 1331
  - 785
  wait_after: 12
- name: installation type
  click:
  - 1331
  - 785
  wait_after: 14
- name: tick the zfs disk
  click:
  - 592
  - 495
  wait_after: 5
- name: zfs configuration
  click:
  - 1331
  - 785
  wait_after: 14
- name: boot option
  click:
  - 1331
  - 785
  wait_after: 14
- name: real name
  click:
  - 959
  - 457
  type: '{{ user }}'
- name: user name
  click:
  - 959
  - 503
  type: '{{ user }}'
- name: password
  click:
  - 959
  - 595
  type: '{{ password }}'
- name: verify password
  click:
  - 959
  - 643
  type: '{{ password }}'
- name: install
  click:
  - 1331
  - 785
  wait_after: 25
- name: installation runs
  wait: 1800
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
