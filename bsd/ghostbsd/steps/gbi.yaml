name: ghostbsd gbi
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ghostbsd-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: fetch the installer image
  fetch: linux_iso
  release: ghostbsd
- name: boot the installer
  boot: true
  os: bsd
  iso: installer_iso
  timeout: 1800
- name: the loader prompt appears
  repeat_until:
    attempts: 60
    until_any:
    - - detailed
      - help
    - - list
      - of
      - commands
    actions:
    - key: '3'
      wait_after: 2
    wait_after: 2
  timeout: 200
- name: clear the loader command line
  key: ctrl+u
  wait_after: 1
- name: set the usb hid setting
  type: set hw.usb.usbhid.enable=1
  type_gap: 0.15
  wait_after: 2
- name: run the setting
  key: ret
  wait_after: 3
- name: the loader accepted the setting
  until_any:
  - - detailed
    - help
  - - list
    - of
    - commands
  timeout: 60
  poll: 2
- name: boot the live system
  type: boot
  type_gap: 0.15
  wait_after: 1
- name: start the boot
  key: ret
  wait_after: 10
- name: choose the X driver, when the menu appears
  until_any:
  - - start
    - desktop
    - with
  - - failed
    - to
    - auto
  timeout: 300
  poll: 5
- name: reach scfb with four downs
  key: down
  repeat:
  - 4
  - 1.0
  wait_after: 2
- name: choose scfb
  key: ret
  wait_after: 25
- name: wait for the live desktop
  until_any:
  - - install
    - ghostbsd
  - - applications
  timeout: 1800
  poll: 10
- name: welcome
  at: &id001
  - 1293
  - 781
  expect: keyboard
  wait_after: 12
- name: keyboard
  at: *id001
  wait_after: 12
- name: time zone
  at: *id001
  wait_after: 12
- name: installation type
  at: *id001
  wait_after: 14
- name: tick the zfs disk
  at:
  - 592
  - 495
  wait_after: 5
- name: zfs configuration
  at: *id001
  wait_after: 14
- name: boot option
  at: *id001
  wait_after: 14
- name: real name
  at:
  - 959
  - 457
  type: '{{ user }}'
- name: user name
  at:
  - 959
  - 503
  type: '{{ user }}'
- name: password
  at:
  - 959
  - 595
  type: '{{ password }}'
- name: verify password
  at:
  - 959
  - 643
  type: '{{ password }}'
- name: install
  at: *id001
  wait_after: 25
- name: installation runs
  wait: 1800
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
