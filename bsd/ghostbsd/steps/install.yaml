name: ghostbsd-mate - the gbi walk
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
steps:
- name: start recording
  record: ghostbsd-install.mp4
- name: boot the installer
  boot: true
  os: bsd
  timeout: 1800
- name: wait for the live desktop
  wait: 45
  keep_alive: true
- name: install ghostbsd
  at_button:
  - 30
  - 40
  - 160
  - 420
  at_fallback:
  - 88
  - 240
  double: true
  wait_after: 25
- name: welcome
  click:
  - 1293
  - 781
  wait_after: 12
- name: keyboard setup
  click:
  - 1293
  - 781
  wait_after: 12
- name: time zone selection
  click:
  - 1293
  - 781
  wait_after: 12
- name: installation type
  click:
  - 1293
  - 781
  wait_after: 14
- name: zfs configuration - tick the disk
  click:
  - 592
  - 495
  wait_after: 5
- name: zfs configuration
  click:
  - 1293
  - 781
  wait_after: 14
- name: boot option
  click:
  - 1293
  - 781
  wait_after: 14
- name: user admin - real name
  click:
  - 959
  - 457
  type: '{{ user }}'
  wait_after: 2
- name: user admin - user name
  click:
  - 959
  - 503
  type: '{{ user }}'
  wait_after: 2
- name: user admin - password
  click:
  - 959
  - 595
  type: '{{ password }}'
  wait_after: 2
- name: user admin - verify password
  click:
  - 959
  - 643
  type: '{{ password }}'
  wait_after: 3
- name: user admin - install
  click:
  - 1293
  - 781
  wait_after: 25
- name: the install runs, as measured
  wait: 1800
  keep_alive: true
- name: stop the machine
  shutdown: kill
  timeout: 120
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
