name: freebsd 15.1 - bsdinstall, to an installed system
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/distro.qcow2
  shutdown:
    from: args.shutdown
    # `kill` IS WHAT `TestAnInstallStopsTheMachineBeforePublishingTheDisk` REQUIRES OF EVERY INSTALL
    # LEG, and the reason is the installer rather than this stage: a LIVE installer's init ignores
    # ACPI, so `acpi` waits out its timeout for a power-off nobody performs and the disk is still
    # being released when `qemu-img convert` reads it.
    #
    # THAT ARGUMENT SAYS NOTHING ABOUT DURABILITY, AND DURABILITY IS THE BUG THIS FILE HAD. MEASURED,
    # on the disk CI published for run 43631122683 - install leg: 48 of 48 steps, success:
    #
    #	file /usr/local/bin/sudo          setuid data
    #	od -An -tx1 -N16 /usr/local/bin/sudo
    #	                                  00 00 00 00 ...   ALL ZEROS, 228312 of them
    #	od -An -tx1 -N16 /bin/sh          7f 45 4c 46 ...   ELF, correct
    #	pkg install -f pkg                Segmentation fault
    #
    # `pkg` wrote the packages into page cache and the machine was killed before any of it reached the
    # medium. The base system survived because it was written minutes earlier and had been synced.
    #
    # SO THE FLUSH IS ITS OWN STEP, just above, and this line stays `kill`. `sync` returns only when
    # the kernel has handed the dirty blocks over, which makes the shutdown method irrelevant to
    # whether the disk is complete.
    default: kill
steps:
- name: the media this stage boots from is already on disk
  # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
  # forty minutes into a run. Every one of these files is declared by this leg's
  # `assets:` in its workflow and placed here by `pull-artifact.sh` before
  # `easyvm run` is called; nothing in this file downloads.
  require:
  - freebsd.iso
- name: start recording
  record: freebsd-install.mp4
- name: create the empty disk
  disk: disk.qcow2
  disk_gb: 128
- name: boot the installer
  boot: true
  os: bsd
  # THE MEDIUM HAS TO BE NAMED, AND ITS ABSENCE IS SILENT. `fetch:` puts the file in the work directory
  # and the asset layer keeps its path under this role, but `boot:` mounts only what its `iso:` names.
  # MEASURED on the first attempt at this file, whose qemu command line had the target disk and NO
  # optical device:
  #
  #	BdsDxe: No bootable option or device was found.
  #
  # The earlier BSD walkthrough needed this same line to reach its installer at all; without it the
  # guest falls to the firmware's boot menu and every key press lands on the firmware.
  iso: freebsd.iso
  # EIGHT GIGABYTES, AND THIS IS A REQUIREMENT OF ZFS RATHER THAN A PREFERENCE.
  #
  # MEASURED: the 4 GiB default got the installer through partitioning and the base-system extraction
  # and then left the machine to swap against itself; ZFS allocates its ARC out of the same memory and
  # the install is the worst case for it - a whole pool being written while the installer's own
  # processes run.
  memory_mb: 8192
  timeout: 1800

# `bsdinstall` IS A bsddialog INSTALLER: EVERY PANE IS A TEXT BUTTON ROW, AND THE KEYS ARE THE NAVIGATION.
#
# THAT IS THE OPPOSITE OF THE GUI WALKTHROUGHS IN THIS REPOSITORY, and it changes two things:
#
#	PRESELECTION IS THE DEFAULT ANSWER. Almost every pane opens with the right button highlighted, so
#	`key: ret` alone advances it. A click at a coordinate would be a guess about a font.
#
#	LETTERS ARE SHORTCUTS INSIDE A LIST. In `ZFS Configuration`, `T` opens the pool editor and `P` cycles
#	the partition scheme - so a stray letter is an ACTION, not nothing. MEASURED: an `esc` sent to leave
#	that list aborted the running install and put up
#
#		ZFS setup failed
#		An installation step has been aborted. Would you like to restart the installation, or exit?
#
#	which is why this file presses nothing it has not been measured to need.
#
# THE SEQUENCE BELOW IS THE ONE THAT WAS WALKED BY HAND ON THIS GUEST, pane by pane, and every `name:`
# is the title or the highlighted row that was on screen at that moment.
- name: wait for the installer menu
  loop:
    max: 60
    do:
    - wait: 10
    ocr:
      name: pane
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: menu_up
      from: pane
      mode: says_any
      words:
      - - install
      - - live
        - system
    until:
      fact: menu_up

- name: welcome - Install is preselected
  # `Welcome to FreeBSD! Would you like to begin an installation or use the live system?`
  # [ Install ] [ Shell ] [ Live System ]
  key: ret
  wait_after: 10
- name: keymap - continue with the default
  # `Keymap Selection` -> `>> Continue with default keymap`, preselected.
  key: ret
  wait_after: 8
- name: hostname
  # `Please choose a hostname for this machine.` - an INPUT FIELD, so the text has to be cleared.
  # The field is focused on arrival; typing appends to nothing because it starts empty.
  type: freebsd
  wait_after: 2
- name: accept the hostname
  key: ret
  wait_after: 8
# `PACKAGES (TECH PREVIEW)` IS THE OFFLINE PATH, AND THIS FILE HAD IT BACKWARDS.
#
# THE COMMENT HERE USED TO SAY "DISTRIBUTION SETS, NOT PACKAGES: the tech preview path fetches from
# the network and this stage deliberately does not depend on it." THE OPPOSITE IS TRUE, AND THE
# MEDIUM SAYS SO:
#
#	xorriso -indev disc1.iso -find /usr/freebsd-dist
#	  '/usr/freebsd-dist/MANIFEST'          <- a manifest
#	  .txz files: 0                          <- and NOT ONE DISTRIBUTION SET
#	xorriso -indev disc1.iso -find /usr/freebsd-packages/offline
#	  328 packages                           <- base, kernel and the rest of the system
#
# So `Distribution Sets` cannot unpack anything from this disc: `fetchmissingdists` goes to a mirror,
# which is the `Mirror Selection` pane and its `http://download.freebsd.org` list. MEASURED, on a
# local replay: choosing Distribution Sets put that pane on screen within seconds.
#
# `Packages` is pkgbase, and pkgbase unpacks the 328 packages ALREADY ON THE DISC through
# `BSDINSTALL_PKG_REPOS_DIR=/usr/freebsd-packages/repos/`, which is the "Offline (Limited Packages)"
# answer to the question after this one.
#
# THE PARTITIONING MENU IS INDEPENDENT OF THIS CHOICE - ZFS is chosen on its own pane either way - so
# what this actually decides is whether the install touches the network at all.
- name: installation type - packages, which is pkgbase
  # `Would you like to install the base system using legacy distribution sets or packages?`
  #   [ Distribution Sets ]  [ Packages ]
  #
  # `PACKAGES` IS ALREADY HIGHLIGHTED. From usr.sbin/bsdinstall/scripts/auto, when the medium carries
  # /usr/freebsd-packages/repos (disc1 does):
  #
  #	PKGBASE_DEFAULT_BUTTON=--default-no
  #	bsddialog --yes-label "Distribution Sets" --no-label "Packages" --yesno $PKGBASE_DEFAULT_BUTTON
  #
  # and MEASURED by OCR on the pane, it opens as `Packages (Tech Preview) 1]` - the No button - so a
  # bare Return takes it.
  key: ret
  wait_after: 10

- name: offline, so pkgbase does not reboot before the chroot runs
  # THE CHOICE IS DRIVEN BY WHAT HAPPENS AFTER THE BASE SYSTEM LANDS, NOT BY WHERE IT COMES FROM.
  #
  # MEASURED THREE TIMES: with `Network`, pkgbase unpacks the base system from pkg.FreeBSD.org and then
  # REBOOTS INTO IT. The machine that comes back has no /boot/loader.conf - this stage cannot have
  # written one, because its chroot steps run after the post-install menu - so its console is the VGA
  # adapter and ttyu0 receives exactly one question, forever:
  #
  #	Welcome to FreeBSD!
  #	Please choose the appropriate terminal type for your system.
  #	Console type [vt100]:
  #
  # The serial line is `-serial file:...`, which is WRITE-ONLY, so that question cannot be answered -
  # and `bsdinstall auto` is gone by then, so `bsdinstall config`, `finalconfig` and the CHROOT SHELL
  # never run at all.
  #
  # `Offline` DOES NOT REBOOT. The base system comes from the 328 packages on disc1, the installer
  # walks the post-install menu this file drives, and the chroot shell is finally available - which is
  # the ONLY place with root and the only place xorg, xfce, lightdm and sudo can be installed.
  #
  # ITS ONE WEAKNESS - the disc's repository is base-only - is handled IN the chroot, by the
  # `point pkg at the network repository` step. That step needed a working DNS and a working proxy to
  # succeed, and both were broken until now: the proxy was TCP-only (so the guest's UDP 53 was
  # dropped) and dnsmasq served no DNS at all. Both are fixed in internal/net, and verified on an
  # Ubuntu guest whose desktop reports 95 updates available.
  do:
  - key: right
    wait_after: 1
  - key: ret
    wait_after: 10
- name: partitioning - automatic ufs
  # THE MENU, AND NOTHING ELSE: THE KEYSTROKE IS SENT BY THE STEP AFTER THIS ONE.
  #
  # THE FIRST VERSION OF THIS PAIR SENT `down` IMMEDIATELY, AND THAT KEY WENT TO THE PANE BEFORE THE
  # MENU. MEASURED on a local replay, whose next step then read
  #
  #	Would you like to use this entire disk (vtbd0) for FreeBSD or partition it to share it ...
  #
  # - the `Entire Disk` dialog, which belongs to the ZFS path and is NOT what
  #   `Auto (UFS)` leads to. So the Return had been eaten by the pane above, the menu opened and
  #   closed unseen, and the walk was already somewhere else.
  #
  # WHAT THIS STAGE ASKS FOR, ON THE USER'S INSTRUCTION: `Auto (UFS)`.
  wait: 12

- name: wait for the partitioning menu before choosing on it
  # THE FIRST KEY OF THIS SECTION WAS SENT BLIND, AND THE OCR READ IT BACK.
  #
  # MEASURED on CI, run 43657195812, whose `wait for the zfs configuration menu` loop reported:
  #
  #	wait for the zfs configuration menu [check]: zfs_showing = false
  #	  (none of "pool" or "partition scheme" in
  #	   "puto C2FS)sGuided Root-on-2F5 uto CUFS) anual hell OK")
  #
  # that string is `Auto (ZFS) / Auto (UFS) / Manual / Shell / OK` - THE PARTITIONING MENU ITSELF,
  # still on screen after the `down` and the `ret`. So the pane had not been drawn when those keys
  # were sent, they went to the pane before it, and the menu then sat waiting with `Auto (UFS)`
  # highlighted. That is the same UFS outcome by a different route.
  #
  # `down` THEN `ret` IS STILL THE RIGHT PAIR - `Auto (UFS)` is the first row and `Auto (ZFS)` is the
  # second - but only once the list exists.
  loop:
    max: 25
    do:
    - wait: 6
    ocr:
      name: partmenu
      region:
      - 740
      - 420
      - 1200
      - 660
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: part_showing
      from: partmenu
      # THE CHECK MUST LOOK FOR WHAT THE OCR ACTUALLY READS, NOT WHAT TESSERACT READS BY HAND.
      #
      # MEASURED, on the same frame, twice:
      #
      #	my hand:  tesseract on a Pillow crop    "How would you like to partition your disk? ..."
      #	the run:  the step's own read            "puto C2FS)siGuided Root-on-2F5 uto CUFS) anual hell OK"
      #
      # The headline is read by one and dropped by the other - `scale: 2` plus `--psm 6` on a wide,
      # mostly-empty dialog does that, and the dialog's first line is the casualty.
      #
      # SO THE WORDS ARE TAKEN FROM THE BODY, WHICH THE RUN DID READ: `Guided` and `Manual` and
      # `Shell` are the three rows of this menu and they survive the scaling. A check that names the
      # question fails on a screen where the question was merely hard to read, and that is a bug in
      # the check rather than a pane that never arrived.
      mode: says
      words:
      - guided
      - manual
    until:
      fact: part_showing

- name: choose auto ufs
  # `UFS`, ON THE USER'S INSTRUCTION, AND IT IS ALSO THE SIMPLER PATH ON THIS MEDIUM.
  #
  # THE LIST ON amd64, from usr.sbin/bsdinstall/scripts/auto: it PREPENDS ZFS for architectures that
  # can boot it, so the order is
  #
  #	>> Auto (ZFS)   Guided Root-on-ZFS       FIRST, and preselected
  #	   Auto (UFS)   Guided UFS Disk Setup    <- one `down`
  #	   Manual       Manual Disk Setup (experts)
  #	   Shell        Open a shell and partition by hand
  #
  # MEASURED BOTH WAYS on this guest, by reading the partition editor afterwards:
  #
  #	down + ret   ->  vtbd0p2  124 GB  freebsd-ufs     UFS, and no ZFS panes follow
  #	ret alone    ->  ZFS Configuration -> Virtual Device type -> disk list -> 'Updating repositories'
  #
  # THE ZFS PATH ALSO ASKS TWO QUESTIONS THIS FILE HAS NO BUSINESS ANSWERING - `Entire Disk or
  # Partition` and `Select a partition scheme` - and then tries to update a pkg repository before it
  # installs anything, which on a medium with an offline repository is a network call that can fail:
  #
  #	Updating repositories failed, try again?
  #	Installation of base system packages failed
  #
  # UFS asks neither of those. It partitions, unpacks, and moves on.
  do:
  - key: down
    wait_after: 1
  - key: ret
    wait_after: 10

- name: entire disk, not a shared partition
  # `Auto (UFS)` ASKS THIS BEFORE IT PARTITIONS, AND THE FILE DID NOT KNOW - SO EVERY KEY AFTER THIS
  # POINT WENT TO THE WRONG PANE.
  #
  # MEASURED on a local replay, immediately after choosing `Auto (UFS)`:
  #
  #	Would you like to use this entire disk (vtbd0) for FreeBSD or partition it to
  #	share it with other operating systems?  Using the entire disk will erase any
  #	data currently stored there.
  #
  #	[ Entire Disk ]  [ Partition ]
  #
  # `Entire Disk` IS ALREADY HIGHLIGHTED and is the right answer for a single empty disk: sharing it
  # would create a slice and leave the rest unusable, which is not what a golden disk wants.
  #
  # THIS IS NOT A ZFS PANE. The earlier note in this file blamed it on the ZFS path; `autopart` asks
  # the same question, and the scripted `Auto` mode does not.
  key: ret
  wait_after: 10

- name: partition scheme - GPT, which is what makes this disk UEFI bootable
  # THE SECOND QUESTION `Auto (UFS)` ASKS, AND THE ONE THAT DECIDES WHETHER THE DISK BOOTS.
  #
  # MEASURED on a local replay, immediately after `Entire Disk`:
  #
  #	Partition Scheme
  #	  Select a partition scheme for this volume:
  #	    APM  Apple Partition Map
  #	    BSD  BSD Labels
  #	 >> GPT  GUID Partition Table          <- ALREADY HIGHLIGHTED
  #	    MBR  DOS Partitions
  #	  [ OK ]  [ Cancel ]
  #	Bootable on most x86 systems and EFI aware ARM64
  #
  # `GPT` IS PRESELECTED and the footer names why: it is the only scheme here that is bootable on
  # EFI, and this guest has UEFI firmware. `MBR` would produce a disk the firmware cannot start.
  #
  # THIS PANE BELONGS TO `autopart` AS MUCH AS TO `zfsboot` - the earlier note in this file called it
  # ZFS-only, and that is why it was missing from the UFS path.
  key: ret
  wait_after: 10

- name: wait for the partition editor
  # UFS GOES STRAIGHT FROM THE MENU TO `Partition Editor`, with the layout already made:
  #
  #	Partition Editor
  #	  vtbd0p1  260 MB  efi           /boot/efi
  #	  vtbd0p2  124 GB  freebsd-ufs   /
  #	  vtbd0p3  4.4 GB  freebsd-swap  none
  #	  [Create] [Delete] [Modify] [Revert] [Auto] [Finish]
  #
  # `Finish` IS THE BUTTON THAT ACCEPTS IT, and it is the last one in the row, so the key is `tab`
  # until it is highlighted rather than a fixed number of rights - the row has six buttons and the
  # focus starts on `Create`.
  loop:
    max: 25
    do:
    - wait: 6
    ocr:
      name: parted
      region:
      - 740
      - 350
      - 1260
      - 720
      region_at:
      - 1920
      - 1080
      scale: 2
      wait: 0
    check:
      name: parted_showing
      from: parted
      # THE CHECK MUST SURVIVE THE OCR'S OWN SPELLING, AND `freebsd-ufs` DOES NOT.
      #
      # MEASURED: the run read
      #
      #	Please review the disk setup. ... 264 MB efi /boot/efi 124 GB freebsd-ufs / ...
      #
      # and `says` normalises each word by dropping everything that is not a letter or a digit - so
      # `freebsd-ufs` becomes `freebsdufs` and does NOT equal `freebsd`. The pane was on screen and
      # the check said it was not, which is the third time in this file that a correct screen failed
      # a check written for it.
      #
      # `finish` AND `delete` are whole words on the button row, so no normalisation can split them.
      mode: says
      words:
      - finish
      - delete
    until:
      fact: parted_showing

- name: accept the partitioning
  # SIX `tab` PRESSES, COUNTED ON THE SCREEN RATHER THAN GUESSED.
  #
  # The button row is
  #
  #	[Create] [Delete] [Modify] [Revert] [ Auto ] [Finish]
  #
  # with `Create` holding the focus when the editor opens. MEASURED, by pressing tab and cropping the
  # row after each press:
  #
  #	0  [Create] highlighted
  #	3  [Modify] highlighted
  #	6  [Finish] highlighted      <- and a Return now accepts the layout
  #
  # THE FIRST VERSION OF THIS STEP SAID FIVE, from counting the buttons rather than the presses: six
  # buttons means five MOVES only if the focus starts OUTSIDE the row, and it starts on the first.
  do:
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: ret
    wait_after: 10

- name: commit the layout
  # `Finish` ASKS ONE MORE QUESTION, AND ITS DEFAULT IS ALREADY THE RIGHT ANSWER.
  #
  # MEASURED, immediately after the Return on `Finish`:
  #
  #	Your changes will now be written to disk. If you have chosen to overwrite existing
  #	data, it will be PERMANENTLY ERASED. Are you sure you want to commit your changes?
  #
  #	[ Commit ]  [ Revert & Exit ]  [ Back ]
  #
  # `Commit` IS HIGHLIGHTED, so this is a bare Return. `Revert & Exit` would throw away the layout the
  # previous steps just agreed to.
  key: ret
  wait_after: 15

- name: distribution select - accept the default set
  # THE COMPONENT CHECKLIST, WHICH ONLY THE PKGBASE PATH SHOWS, AND ITS CURSOR IS ALREADY ON `OK`.
  #
  # MEASURED, on the screen the partition steps hand over to:
  #
  #	Distribution Select
  #	  A minimal set of packages suitable for a multi-user system is always installed.
  #	  Select additional packages you wish to install:
  #	    [ ] base   [ ] debug   [ ] devel   [X] lib32   [ ] optional   [ ] src   [ ] tests
  #	    [ OK ]
  #
  # `lib32 32-bit compatibility libraries` comes ticked on this medium and nothing here needs it; the
  # rest are optional and this disk is a desktop, so the default set is taken as it stands.
  #
  # WITHOUT THIS RETURN the install never starts: `wait for the install to finish` reads this pane's
  # text for up to forty-five minutes and reports a phrase nobody wrote.
  key: ret
  wait_after: 15

- name: wait for the install to finish
  # The partitioner runs, the base system is extracted, and the installer finally reports
  # `Installation Completed` - this is the long wait, and it is a READING rather than a duration.
  loop:
    max: 180
    do:
    - wait: 15
    ocr:
      name: done
      # THE DIALOG, NOT THE WHOLE SCREEN, AND `scale: 3` BECAUSE THE TEXT IS SIXTEEN PIXELS.
      #
      # AT `scale: 1` OVER THE FULL FRAME THE READING WAS ONE LINE - the window's own title:
      #
      #	wait for the install to finish [check]: finished = false (none of "installation completed"
      #	  or "root password" or "system management account" or "add user" or "manual configuration"
      #	  in "FreeBSD Installer —")
      #
      # so the check could never be answered on a machine that had finished installing. MEASURED: the
      # dialog occupies x=600..940 y=340..580 at 1920x1080, and at 3x tesseract returns
      #
      #	Please select a passwort / account (root) / The password cannot be ... / Password
      #
      # (its own misspelling of "password" included, which is why the word list below does not depend
      # on that word alone).
      region:
      - 600
      - 340
      - 940
      - 580
      region_at:
      - 1920
      - 1080
      scale: 3
      wait: 0
    check:
      name: finished
      from: done
      # THE INSTALLER MOVES ON TO ITS POST-INSTALL MENU, AND THAT IS THE REAL END OF THE EXTRACTION.
      #
      # `Installation Completed` IS A LINE IT MAY NOT SHOW AT ALL. MEASURED ON THIS STAGE'S OWN RUN:
      # the loop spent forty-five minutes on a machine that had already finished, because the pane
      # that was on screen was
      #
      #	Please select a password for the system management account (root).
      #	Password:        [***********]
      #	Repeat password: [***********]
      #	                     [ OK ]  [ Help ]
      #
      # - the FIRST pane of the post-install menu. The base system was on the disk and the installer
      # was waiting for a person, which is the same shape as GhostBSD's `Installation Completed` and
      # was read past for the same reason: the words being waited for were not the words on screen.
      #
      # SO THE TEST IS THE POST-INSTALL MENU ITSELF, in any of the forms it takes - the root password
      # prompt first, then the menu with `Add User` and `Exit`.
      mode: says_any
      words:
      # `console type` IS THE PKGBASE PATH'S "THE BASE SYSTEM IS ON THE DISK" - pkgbase unpacks
      # and REBOOTS, so the post-install menu this loop was written for never appears. The
      # installed system has no /boot/loader.conf yet, so ttyu0 shows only this question.
      - - console
      - - installation
        - completed
      - - account
        - root
      - - system
        - management
        - account
      - - repeat
        - password
      - - add
        - user
      - - manual
        - configuration
    until:
      fact: finished

# ==========================================================================================
# THE POST-INSTALL MENU, WHICH IS WHERE THE ACCOUNT AND THE BOOT LOADER ARE FINISHED
# ==========================================================================================
#
# `Installation Completed` IS NOT THE END OF THE INSTALLER. What follows is a sequence of panes, and
# THE ORDER WAS MEASURED BY HAND on this guest:
#
#	root password  ->  Add User  ->  ...  ->  network  ->  time zone  ->  ...  ->  Exit
#
# AND A `Return` IN A PASSWORD PANE SUBMITS IT. That is the opposite of what a GUI would do, and it is
# what made the first version of this file fail:
#
#	Please select a password for the system management account (root).
#	The passwords do not match.
#
#	Password:        [***********]
#	Repeat password: [***********]
#
# TWO FIELD PAIRS, EACH FILLED AND THEN MOVED PAST WITH `tab`, AND `tab` IS THE MOVE. `Return` at the
# end of the first field is a SUBMIT of a half-filled form - the error above is exactly what that looks
# like, and it does not clear when the second field is then filled.
# ==========================================================================================
# THE POST-INSTALL SEQUENCE, IN THE ORDER `bsdinstall auto` ACTUALLY RUNS IT
# ==========================================================================================
#
# THE ORDER IS NOT A GUESS. It is read from `usr.sbin/bsdinstall/scripts/auto`, which ends with:
#
#	bsdinstall rootpass || error "Could not set root password"
#	if [ "$NETCONFIG_DONE" != yes ]; then bsdinstall netconfig; fi
#	[ -z "$BSDINSTALL_SKIP_TIME" ]     && bsdinstall time
#	[ -z "$BSDINSTALL_SKIP_SERVICES" ] && bsdinstall services
#	[ -z "$BSDINSTALL_SKIP_HARDENING" ] && bsdinstall hardening
#	[ -z "$BSDINSTALL_SKIP_FIRMWARE" ] && bsdinstall firmware
#	[ -z "$BSDINSTALL_SKIP_USERS" ] && bsddialog --title "Add User Accounts" --yesno \
#	    "Would you like to add users to the installed system now?" 0 0 && bsdinstall adduser
#	[ -z "$BSDINSTALL_SKIP_FINALCONFIG" ] && bsdinstall finalconfig
#	bsdinstall config  || error "Failed to save config"
#	... "Manual Configuration" yesno -> chroot shell
#
# SO THERE ARE EIGHT PANES BETWEEN "the base system is on the disk" and "here is a root shell",
# AND THE EARLIER VERSION OF THIS FILE DID NOT KNOW THAT. It answered whatever was on screen with
# `ret` in a loop and stopped when it saw the word `exit`, which failed three ways:
#
#	Add User Accounts defaults to YES, so a blind Return launched adduser's prompt chain, and every
#	Return after that was an empty username:
#
#		adduser: ERROR: You must enter a username
#		Username: _
#
#	services is a CHECKLIST whose first entry is `sshd`, preselected. A Return there opens nothing
#	and the loop has already spent an attempt.
#
#	time is THREE panes (region, country, confirm) plus a date and a time box, so a blind Return
#	walks into a calendar the loop cannot read its way out of.
#
# THE ANSWER IS TO DRIVE EACH PANE BY NAME, in the order the script runs them, one step per pane.

# --- rootpass ------------------------------------------------------------------------------
#
# `Skip` IS A BUTTON, AND IT TAKES THREE KEYS TO REACH. MEASURED ON THIS PANE:
#
#	field --tab--> repeat field --tab--> [ OK ] --right--> [ Skip ] --ret--> out
#
# `right` ALONE DOES NOT WORK ONCE THE FIELDS HOLD TEXT: the focus is inside the password input, so
# right moves the CARET. The pane then sits on `The passwords do not match.` forever.
#
# AND THE FIELDS DO HOLD TEXT, because the walkthrough types into them - that is how `bsdinstall` is
# told the account password. What it does with that text is why this pane is skipped at all:
#
#	Password:        [***********]
#	Repeat password: [***********]
#	The passwords do not match.
#
# both halves filled from the same variable and the pane still reports a mismatch. `bsddialog`'s
# password widget echoes a fixed run of stars regardless of what it holds, so there is nothing to read
# back and no way to tell which half is wrong. The password is set later, in a root shell, with `pw`.
- name: the root password - first field
  type: '{{ password }}'
  wait_after: 2
- name: the root password - tab to the second field
  key: tab
  wait_after: 1
- name: the root password - second field
  type: '{{ password }}'
  wait_after: 2
- name: skip the root password pane
  do:
  - key: tab
    wait_after: 1
  - key: tab
    wait_after: 1
  - key: right
    wait_after: 1
  - key: ret
    wait_after: 8

# --- netconfig -----------------------------------------------------------------------------
#
# `Please select a network interface and configuration mode:` with `[ Auto ] [ Manual ]`. `Auto` is
# the default and is what runs `dhclient` on the virtio NIC - and `Auto` is also what makes the rest
# of netconfig non-interactive:
#
#	if [ ${IPV4_AVAIL} -eq 1 -a -z "$AUTO" ]; then    # only asks when NOT auto
#	    bsddialog --yesno 'Would you like to configure IPv4 for this interface?'
#
# so ONE Return here answers the whole netconfig stage. A guest that takes IPv6 as well is fine: the
# walkthrough does not depend on it.
- name: network - auto, which is the interface menu's default button
  key: ret
  wait_after: 15

# --- time ----------------------------------------------------------------------------------
#
# `tzsetup -s`, THEN a date box, THEN a time box, and BOTH boxes are `--default-no` with `Skip` as
# their cancel label. THE REGION LIST IS THE FIRST PANE OF `tzsetup`, and `UTC` is reached by
# choosing `UTC` in the region list rather than by walking into a country.
#
# THE DATE AND TIME BOXES ARE SKIPPED ON PURPOSE AND THAT IS NOT A SHORTCUT: a QEMU guest with
# `-rtc base=utc` already has the right time from the host, and a walkthrough that sets it by hand
# sets it to whenever the bake ran. `Skip` leaves the clock alone, which is the correct answer.
- name: time zone - the region list opens on UTC, which is the first entry
  key: ret
  wait_after: 6
- name: time zone - the date box, skipped
  # `--default-no` PUTS THE FOCUS ON `Skip`, so this Return takes it. That is the opposite of the
  # root password pane, where `Skip` needed `right` - the difference is `--default-no`, which
  # preselects the cancel button.
  key: ret
  wait_after: 4
- name: time zone - the time box, skipped
  key: ret
  wait_after: 4

# --- services ------------------------------------------------------------------------------
#
# `System Configuration: Choose the services you would like to be started at boot:`
#
#	[X] sshd          Secure shell daemon
#	[ ] ntpd          Synchronize system and network time
#	[X] dumpdev       Enable kernel crash dumps to /var/crash
#
# `sshd` IS PRESELECTED (its default is `on` in `services`), so the correct answer is to accept the
# list as it stands - which is the `[ OK ]` button, and it is where the focus already is.
#
# THIS IS ALSO THE PANE THE WHOLE SSH CHAIN DEPENDS ON. Measured on the disk this produces, booted
# with no CD: `Starting sshd` and a `login:` prompt, with `PasswordAuthentication` set by the chroot
# block further down.
- name: services - sshd is already ticked, so accept the list
  key: ret
  wait_after: 6

# --- hardening -----------------------------------------------------------------------------
#
# A CHECKLIST OF `hide_gids`, `hide_jail`, `read_msgbuf`, `proc_debug`, ... The repo's disk needs none
# of them and the list is all unchecked, so the `[ OK ]` button accepts an unmodified system.
- name: hardening - nothing to hide on a throwaway guest, so accept
  key: ret
  wait_after: 6

# --- firmware ------------------------------------------------------------------------------
#
# `Install Firmware (requires network)` is a `--no-cancel` menu whose only entries are `Skip` and
# `OK` in effect, and firmware packages are a hundred megabytes of wireless blobs for hardware this
# machine does not have.
- name: firmware - skip it
  key: ret
  wait_after: 10

# --- Add User Accounts ---------------------------------------------------------------------
#
# `Would you like to add users to the installed system now?`  [ Yes ]  [ No ]
#
# NO. THE ACCOUNT IS CREATED IN THE CHROOT SHELL INSTEAD, AND THIS IS THE PANE THAT BROKE THE
# EARLIER VERSION OF THIS FILE: this dialog DEFAULTS TO `Yes`, so a blind Return started
# `bsdinstall adduser` - a prompt CHAIN (`Username`, `Full name`, `Uid`, `Login class`, `Shell`,
# `Home`, `Home permissions`, ...) that aborts with
#
#	adduser: ERROR: You must enter a username
#
# if a Return arrives before a name is typed, and then sits at a SECOND `Username:` prompt no step
# was going to answer.
#
# `No` IS THE RIGHT BUTTON AND `right` REACHES IT, because this yesno's focus starts on `Yes`.
- name: do not add a user here - the chroot shell does it
  # `YES` IS THE HIGHLIGHTED BUTTON, AND A BARE RETURN STARTED `adduser` AND SILENTLY ATE THE WHOLE
  # REST OF THIS STAGE.
  #
  # MEASURED, BY PLAYING THE STAGE'S OWN RECORDING (`ffmpeg -ss N` on freebsd-install.mp4):
  #
  #	240s  Services  [X] sshd ...                          <- the pane before this one
  #	265s  Add Users / Username:                           <- adduser was ALREADY running
  #	272s  adduser: ERROR: You must enter a username!
  #	310s  Uid (Leave empty for default): printf '%s\n' 'admin' | pw usermod root -h 0
  #	325s  ... pw useradd -n vmuser -m -s /bin/csh -G wheel -h 0
  #	590s  Login group: sync does not exist!  /  exit does not exist!
  #
  # EVERY COMMAND AFTER THIS PANE WAS TYPED INTO `adduser`'s PROMPT CHAIN AND REFUSED. So root's
  # password, the account, `PasswordAuthentication`, `sysrc sshd_enable`, `pkg install sudo`, the
  # sudoers file and the final `exit` NEVER RAN - which is why the disk has no /etc/fstab, why the
  # UFS superblock was never marked clean, and why the ssh stage could never log in.
  #
  # A PREVIOUS VERSION OF THIS STEP READ `key: ret` AND ITS COMMENT CLAIMED `No` WAS HIGHLIGHTED. THAT
  # WAS READ OFF THE LAST FRAME OF A FAILED RUN - a frame that already shows the adduser prompt, not
  # the dialog - and it was wrong. The dialog opens on `Yes`.
  #
  # `left` REACHES `No`, the same rule as the destroy-confirm and the installation-type question.
  do:
  - key: left
    wait_after: 1
  - key: ret
    wait_after: 8

- name: final configuration - Finish is the first entry
  key: ret
  wait_after: 10

# --- the chroot shell ----------------------------------------------------------------------
#
# `The installation is now finished. Before exiting the installer, would you like to open a shell in
# the new system to make any final manual modifications?`  [ Yes ]  [ No ]
#
# THIS DIALOG IS `--default-no`, so `No` holds the focus and `left` moves to `Yes`. MEASURED: the
# pane opens with `[ Yes ] [ No ]` and NO highlighted, and `left` then `ret` gets the root shell.
#
# THIS IS THE ONLY PLACE IN THE WHOLE WALKTHROUGH WHERE A REAL ROOT SHELL EXISTS, which is why every
# privileged setting is written here rather than through a dialog.
- name: open a shell in the new system
  # `Manual Configuration` -> `[ Yes ] [ No ]`, AND `No` IS HIGHLIGHTED (`--default-no`), so `left`
  # reaches Yes. MEASURED on the pane.
  do:
  - key: left
    wait_after: 1
  - key: ret
    wait_after: 12

- name: prove the chroot shell is actually up before typing into it
  # THIS STEP EXISTS BECAUSE NOTHING ELSE IN THE STAGE COULD TELL, AND THAT COST A WHOLE RUN.
  #
  # MEASURED on freebsd-install.mp4: `adduser` was running at 265s, every command after it was typed
  # into its prompt chain and refused, and the stage still reported 51 of 51 step(s) because a `type:`
  # that lands in the wrong program fails SILENTLY - the text is accepted, echoed, and rejected by
  # something else.
  #
  #	Login group: sync does not exist!
  #	Login group: exit does not exist!
  #
  # The chroot shell's prompt is `root@:/ #` and the installer's panes have no `#` prompt at all, so
  # reading the screen for a `#` after the word root is the cheapest proof that the NEXT twenty steps
  # will run where they are meant to.
  loop:
    max: 20
    do:
    - wait: 5
    ocr:
      name: chroot
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: shell_up
      from: chroot
      # THE PROMPT ON THIS PANE IS NOT `root@:/ #`, AND THAT IS MEASURED RATHER THAN ASSUMED.
      #
      # The screen after `Yes` on Manual Configuration reads, in full:
      #
      #	This shell is operating in a chroot in the new system. When finished making
      #	configuration changes, type "exit"
      #	in|
      #
      # - the installer's `echo`, then `sh -l`'s PROMPT, and the prompt is `in` because the chroot's
      # /etc/motd has not been written by `bsdinstall config` yet (that runs AFTER this shell exits).
      #
      # SO `root` IS NEVER ON THIS SCREEN and a check for it waits out its twenty tries on a pane that
      # is exactly right - which is what happened on the first run of this step:
      #
      #	prove the chroot shell is actually up [check]: shell_up = false
      #	  (mode says: missing from "This shell is operating in a chroot in the new ...")
      #
      # `chroot` IS THE WORD THAT CANNOT BE A FALSE POSITIVE HERE. It is printed by the branch of
      # `bsdinstall auto` that has already run `chroot $BSDINSTALL_CHROOT /bin/sh -l`, so seeing it
      # means the shell exists - and no other pane in this installer prints it.
      mode: says
      words:
      - chroot
    until:
      fact: shell_up

# ROOT GETS THE PASSWORD THE INSTALLER WAS TOLD, VIA A TOOL THAT CANNOT DISAGREE WITH ITSELF.
#
# `pw usermod -h 0` READS THE PASSWORD FROM STDIN, which is why `printf` pipes into it: the tool does
# not take a password argument, on purpose - an argument is visible in `ps`.
- name: set the root password
  do:
  # `pw usermod -h 0` READS THE PASSWORD FROM STDIN, AND A HEREDOC IS THE FORM THAT WORKS.
  #
  # MEASURED, and this is why four disks came out with no usable password: `openssl passwd -6` in
  # this chroot produced NOTHING - a grep of the whole disk for `$6$` found zero occurrences, only
  # the command text - so `pw usermod -H "$H"` was handed an empty string and refused it.
  #
  # FreeBSD's own answer, from its mailing list and the pw(8) man page, is the heredoc: `-h0` takes
  # the password on stdin and the heredoc supplies exactly one line of it.
  #
  # THE HEREDOC IS ON ONE PHYSICAL LINE, because `type:` cannot send a newline: `<<<` is not POSIX
  # sh, so the words are separated by a semicolon inside a single-quoted command instead.
  - type: printf '%s' '{{ password }}' | pw usermod root -h0 && echo ROOT_PW_SET
    wait_after: 10
  - key: ret
- name: create the account
  # `pw useradd` WITH `-h 0` AND A PIPE DOES NOT SET THE PASSWORD, AND THE FIELD IS LEFT AS `*`.
  #
  # MEASURED TWICE, on two disks:
  #
  #	pw usershow vmuser    vmuser:*:1001:1001::0:0:User &:...
  #	                              ^ a `*` is "no password", not a hash
  #
  # `-h 0` reads the password from stdin, and the pipe is closed before `pw` gets to read it - the
  # console keystroke that follows the command is what it finds instead. A locked account cannot
  # authenticate, PAM refuses it, and lightdm's autologin falls through to the greeter with nothing
  # said in any log.
  #
  # SO THE PASSWORD IS NOT PIPED. It is set in a SECOND command, with `-H` and a hash computed on the
  # guest by `openssl passwd -6` - crypt(3)'s SHA-512, the same `$6$` form `pw` itself writes. Nothing
  # reads stdin, so nothing can read at the wrong moment.
  #
  # THE HASH IS NEVER PRINTED: `pw usershow` shows a hidden field as `*` anyway, and a walkthrough
  # must not write a credential to a log.
  do:
  - type: pw useradd -n {{ user }} -m -s /bin/csh -G wheel
    wait_after: 10
  - key: ret
  # THE SAME HEREDOC FORM AS THE ROOT PASSWORD ABOVE, and for the same measured reason: the openssl
  # route wrote no hash onto this disk at all.
  - type: printf '%s' '{{ password }}' | pw usermod {{ user }} -h0 && echo PASSWORD_SET
    wait_after: 10
  - key: ret
- name: prove the account exists
  # THE OUTPUT IS THE EVIDENCE, and a walkthrough that creates an account without reading it back is
  # one that discovers the mistake at the ssh stage instead of here.
  do:
  - type: pw usershow {{ user }}
    wait_after: 2
  - key: ret
    wait_after: 4

# SSHD REFUSES PASSWORDS UNTIL TOLD OTHERWISE, AND THIS SHELL IS THE ONLY PLACE THAT CAN SAY SO.
#
# MEASURED at the ssh stage: `the port is open but no shell answers: ssh: unable to authenticate,
# attempted methods [none keyboard-interactive]`. The port answered because `services` enabled sshd;
# the REFUSAL is FreeBSD's default `PasswordAuthentication no`, and a guest whose only credential is
# a password cannot be driven at all.
#
# `PermitRootLogin` IS LEFT ALONE ON PURPOSE. Its default is `prohibit-password`, which is right: the
# stages log in as the unprivileged account, and root over ssh is not a door this walkthrough opens.
#
# `sed -i ''` IS BSD SED'S FORM: the empty backup suffix is not optional, and a Linux `sed -i` here
# consumes the next argument as its suffix and edits nothing.
- name: allow password authentication over ssh
  do:
  - type: sed -i '' 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
    wait_after: 3
  - key: ret
    wait_after: 4

- name: prove the setting took
  # `grep -c` PRINTS A NUMBER, so the log says `1` rather than only that the command exited 0.
  do:
  - type: grep -c '^PasswordAuthentication yes' /etc/ssh/sshd_config
    wait_after: 2
  - key: ret
    wait_after: 4

- name: make sure sshd starts at every boot
  do:
  - type: sysrc sshd_enable=YES
    wait_after: 2
  - key: ret
    wait_after: 4

# SUDO, BECAUSE `su` CANNOT WORK ON AN SSH CHANNEL AND `pkg` NEEDS ROOT.
#
# MEASURED TWICE, ON DIFFERENT DISKS:
#
#	the ssh stage, with `pkg install` as the unprivileged account:
#		pkg: Insufficient privileges to install packages
#
#	the console, piping the root password into `su`:
#		BAD SU vmuser to root on /dev/pts/0
#
# The second one is the one that decides the design. FreeBSD's `su` reads the password from
# `/dev/tty` - NOT stdin - and an `ssh:` command has no terminal, so `printf pw | su -c ...` is
# answered with `su: Sorry` even when the password is correct. `script -q /dev/null` was tried too,
# because it does allocate a pty: still `BAD SU`, because PAM's `pam_group` sees the request arriving
# before the pty has a controlling terminal.
#
# THE BASE SYSTEM HAS NO OTHER OPTION: `sudo` and `doas` are both in ports, not in base. So the one
# place a real root shell exists - this chroot - is where the escalation tool has to be installed.
#
# AND IT IS THE SAME ANSWER EVERY OTHER SYSTEM HERE ALREADY GIVES. Ubuntu's autoinstall writes
# /etc/sudoers.d/90-... with NOPASSWD; macOS uses `printf pw | sudo -S -p ''`; the reference
# implementation's FreeBSD bake does exactly this (`pkg install sudo` plus a NOPASSWD sudoers file).
# Root over ssh stays closed: `PermitRootLogin` keeps its `prohibit-password` default, so the stages
# log in as the unprivileged account and escalate, which is the shape the other three already use.
#
# THE PARTITIONER IS ALREADY SEEDED, because `pkg` on a fresh install has no database. That is also
# what makes the later `pkg install xfce` a download of its own rather than a re-bootstrap.
- name: give the chroot a resolver, without which pkg cannot reach a mirror
  # `bsdinstall auto` NEVER WRITES /etc/resolv.conf INTO THE NEW SYSTEM BEFORE THE POST-INSTALL SHELL.
  #
  # The order in usr.sbin/bsdinstall/scripts/auto is:
  #
  #	chroot "$BSDINSTALL_CHROOT" /bin/sh -l        <- this shell, and the guest has no resolver yet
  #	...
  #	bsdinstall config                             <- runs AFTER the shell exits
  #
  # `script` mode copies it explicitly (`cp /etc/resolv.conf $BSDINSTALL_CHROOT/etc/resolv.conf`);
  # `auto` mode does not, because in auto mode netconfig has usually run on the INSTALLER and the copy
  # is somebody else's job.
  #
  # THE EFFECT, MEASURED: `pkg install -y sudo` in this shell printed nothing useful and the disk came
  # out with NO SUDO AT ALL - the ssh stage then reported
  #
  #	sudo: Command not found.
  #
  # while `wait for sshd` had already passed, which proves the OTHER chroot steps ran. A resolver the
  # guest can use is the difference between a chroot that can install a package and one that cannot.
  #
  # THE ADDRESSES ARE THE ONES THE INSTALLER ITSELF USED - DHCP handed this guest 172.30.0.1 with
  # 1.1.1.1 and 8.8.8.8, and they are reachable from the bridge.
  do:
  # `172.30.0.1` IS THE BRIDGE, AND IT IS THE ONLY RESOLVER THE GUEST CAN REACH.
  #
  # THIS STEP USED TO WRITE `nameserver 1.1.1.1` AND `8.8.8.8`, AND THOSE ARE THE ADDRESSES THAT DO
  # NOT ANSWER FROM INSIDE A GUEST HERE. MEASURED, with a hand-built A query so the answer cannot
  # depend on /etc/resolv.conf:
  #
  #	container -> 1.1.1.1:53      answered, 5 records
  #	container -> 8.8.8.8:53      answered, 5 records
  #	guest     -> 1.1.1.1:53      never answered
  #
  # The transparent proxy is TCP-only (`iptables -t nat -S | grep -i udp` is empty, because mihomo's
  # 7890 speaks HTTP CONNECT), so the guest's UDP query bypasses it, is MASQUERADEd at the bridge and
  # leaves by a path that is dropped.
  #
  # dnsmasq now answers on the bridge and forwards to the container's own resolver, so the bridge
  # address is the one DNS server this shell can use - and it is the same one the DHCP lease hands the
  # installed system.
  - type: echo cHJpbnRmICclc1xuJyAnbmFtZXNlcnZlciAxNzIuMzAuMC4xJyA+IC9ldGMvcmVzb2x2LmNvbmY= | base64 -d | sh
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: cat /etc/resolv.conf
    wait_after: 3
  - key: ret
    wait_after: 5

- name: point pkg at the network repository, because the disc has no ports packages
  # THE OFFLINE INSTALL LEAVES pkg LOOKING AT THE DISC, AND THE DISC HAS NOTHING THIS STAGE NEEDS.
  # Measured on disc1.iso: 328 packages under /usr/freebsd-packages/offline, all FreeBSD base sets,
  # and not one ports package among them. So the network repository is what this stage must use.
  #
  # ONE PHYSICAL LINE, BECAUSE type: CANNOT SEND A NEWLINE, AND THAT COST A WHOLE RUN.
  #
  # Measured on the stage's own recording: the seven-line printf this step used to carry was typed
  # as 404 characters with five newlines reported as untypable, so the shell received an
  # unterminated command and sat inside a quote - and every later command was swallowed as part of
  # that string. That is why a run reported PAM: Authentication error for ILLEGAL USER vmuser: the
  # account had been created and then a broken shell ate the rest of the stage.
  #
  # The command is base64 so no quoting rule can change it in transit.
  do:
  - type: echo cHJpbnRmICclc1xuJyAnRnJlZUJTRDogeycgJyAgdXJsOiAicGtnK2h0dHBzOi8vcGtnLkZyZWVCU0Qub3JnLyR7QUJJfS9xdWFydGVybHkiLCcgJyAgbWlycm9yX3R5cGU6ICJzcnYiLCcgJyAgZW5hYmxlZDogeWVzJyAnfScgPiAvdXNyL2xvY2FsL2V0Yy9wa2cvcmVwb3MvRnJlZUJTRC5jb25m | base64 -d | sh
    wait_after: 5
  - key: ret
  - type: cat /usr/local/etc/pkg/repos/FreeBSD.conf
    wait_after: 3
  - key: ret
- name: bootstrap pkg, which is a stub until it downloads itself once
  # ON A FRESH FREEBSD `/usr/sbin/pkg` IS A PLACEHOLDER that fetches the real pkg on first use. Inside
  # a chroot that fetch needs the resolver written above, and it is a separate step so a failure here
  # says "no network" rather than "sudo did not install".
  do:
  - type: env ASSUME_ALWAYS_YES=yes pkg bootstrap -f
    wait_after: 4
  - key: ret
    wait_after: 60
  - type: pkg -vv
    wait_after: 3
  - key: ret
    wait_after: 6

- name: install the desktop, sudo and their packages while this shell is root
  # THIS IS THE ONE PLACE WITH ROOT AND A WORKING NETWORK AT THE SAME TIME, SO EVERYTHING GOES HERE.
  #
  # THE ALTERNATIVE WAS TO INSTALL xorg/xfce FROM THE ssh STAGE, AND IT CANNOT WORK: that stage logs in
  # as the unprivileged account, `pkg` needs root, and the only two ways to become root over ssh are
  # both closed -
  #
  #	`PermitRootLogin yes`   refused by the project: root over ssh is not a door to open
  #	`su` on an ssh channel  MEASURED, it cannot work: FreeBSD's su reads the password from
  #	                        /dev/tty, an ssh: command has no terminal, and `script -q /dev/null`
  #	                        does not help - `printf pw | script -q /dev/null su -c ...` answers
  #	                        `su: Sorry` because pam_group sees the request before the pty has a
  #	                        controlling terminal
  #
  # So `sudo` has to be installed from a shell that is ALREADY root, and this chroot is the only one.
  # Once sudo exists the ssh stage can use it - but it no longer NEEDS to, because the packages a
  # desktop needs are installed here.
  #
  # `xorg` IS NOT PULLED IN BY `xfce`: the meta-port is the session and the panel, not the server they
  # draw on. MEASURED on a disk whose /etc/rc.conf was correct and whose lightdm existed:
  #
  #	/usr/local/bin/Xorg          No such file or directory
  #	/var/log/Xorg.0.log          No such file or directory
  #	pgrep -x lightdm             never up
  #
  # AND `lightdm-gtk-greeter` IS SEPARATE FROM `lightdm`: without it lightdm starts to a black screen.
  do:
  # `xf86-video-scfb` IS THE DRIVER THIS GUEST NEEDS AND IT IS NOT PULLED IN BY ANYTHING ABOVE.
  #
  # MEASURED, on a disk where every other piece was correct - lightdm, Xorg, xfce.desktop,
  # dbus_enable, devfs_system_ruleset all present - and the session still would not start:
  #
  #	Fatal server error:
  #	(EE) Cannot run in framebuffer mode. Please specify busIDs for all framebuffer devices
  #
  # QEMU presents a plain VGA adapter with no GPU driver behind it, so X has to draw through the
  # kernel's framebuffer - `scfb`, the "simple framebuffer" driver. FreeBSD's `xorg` meta-port does
  # not depend on it, and without it every X start exits on the first line of the log.
  #
  # `xf86-input-libinput` IS THE OTHER HALF: scfb gives X something to draw on, and libinput is what
  # gives it the keyboard and the usb-tablet. A session with a display and no input device starts and
  # ignores every click.
  - type: env ASSUME_ALWAYS_YES=yes pkg install -y sudo xorg xf86-video-scfb xf86-input-libinput xfce lightdm lightdm-gtk-greeter
    wait_after: 4
  - key: ret
    wait_after: 60
  # THE POLL IS THE PROOF, NOT THE WAIT. `pkg info` is the package manager's own registration record,
  # which only exists once unpacking finished - a fixed wait is what produced a TRUNCATED sudo earlier
  # in this chain (`Exec format error` three stages later).
  - type: sh -c 'i=0; while [ $i -lt 60 ]; do pkg info xfce >/dev/null 2>&1 && pkg info sudo >/dev/null 2>&1 && break; sleep 10; i=$((i+1)); done; pkg info sudo xfce xorg lightdm 2>&1 | grep -E "^(Name|Version)" | head -8'
    wait_after: 3
  - key: ret
    wait_after: 40

- name: prove the desktop actually landed
  # THE ARTIFACT, READ BACK FROM THE DISK THAT WILL BE PUBLISHED. A step count is not a verdict; these
  # three files are what the next stages and a human look for.
  #
  #	/usr/local/share/xsessions/xfce.desktop      the session lightdm offers
  #	/usr/local/bin/Xorg                          the server that session draws on
  #	/usr/local/sbin/lightdm                      the display manager
  do:
  - type: ls -l /usr/local/share/xsessions/xfce.desktop /usr/local/bin/Xorg /usr/local/sbin/lightdm
    wait_after: 3
  - key: ret
    wait_after: 5
  - type: ls -l /usr/local/bin/sudo
    wait_after: 2
  - key: ret
    wait_after: 4

- name: let the account escalate without a password
  # THE MODE IS 0440 BECAUSE SUDO REFUSES A SUDOERS FILE ANYONE ELSE CAN READ, and the DIRECTORY is
  # created by the package - so this runs after the install above, never before it.
  #
  # `{{ user }}` RATHER THAN A FIXED NAME: the account is a variable of this walkthrough, and a
  # sudoers line that names a different one is a permission error at the first privileged command.
  do:
  - type: printf '%s\n' '{{ user }} ALL=(ALL) NOPASSWD:ALL' > /usr/local/etc/sudoers.d/90-{{ user }}
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: chmod 0440 /usr/local/etc/sudoers.d/90-{{ user }}
    wait_after: 2
  - key: ret
    wait_after: 3

- name: prove sudo works, as the account will use it
  # `su -m {{ user }} -c ...` RUNS IT AS THE ACCOUNT rather than as root, so this is the real question
  # and not a weaker one. `sudo -n` means "never prompt", so a sudoers file that did not take fails
  # here instead of hanging at a password prompt in the next stage.
  do:
  - type: su -m {{ user }} -c 'sudo -n id -un'
    wait_after: 3
  - key: ret
    wait_after: 6

- name: install the guest agent, which is what lets the host shut this machine down
  # `qemu-guest-agent` IS THE FOURTH SHUTDOWN PATH, and the other three guests all have it.
  #
  # WHY IT IS HERE AND NOT IN vm-configure: this shell is ROOT INSIDE THE CHROOT, which is the only
  # place in the whole chain with both root and a network. The ssh stage is the unprivileged account
  # and vm-configure runs against a live guest, so `pkg install` belongs to this stage - the same
  # argument that puts xfce here.
  #
  # ONE SHORT COMMAND, BECAUSE THE KEYBOARD HAS A LIMIT: the line that installs xfce is 119
  # characters and adding this package would make it 136, past the point where the translator starts
  # dropping characters. `type:` has no newline, so it cannot be wrapped either - it gets its own step.
  do:
  - type: env ASSUME_ALWAYS_YES=yes pkg install -y qemu-guest-agent
    wait_after: 4
  - key: ret
    wait_after: 45
  # THE POLL IS THE PROOF, NOT THE WAIT, for the same measured reason as the xfce step above.
  - type: sh -c 'i=0; while [ $i -lt 40 ]; do pkg info qemu-guest-agent >/dev/null 2>&1 && break; sleep 5; i=$((i+1)); done; pkg info qemu-guest-agent 2>&1 | grep -E "^(Name|Version)"'
    wait_after: 3
  - key: ret
    wait_after: 20

- name: prove the guest agent's device and enable it at every boot
  # THE PACKAGE IS NOT THE SERVICE. Installing it puts the binary on the disk; `sysrc` is what makes
  # init start it, and without that the socket `/dev/virtio-ports/org.qemu.guest_agent.0` exists but
  # nothing has opened it - so `shutdown: guest_agent` would wait out its timeout on a guest whose
  # agent was never running.
  #
  # `-f /dev/virtio-ports/...` IS THE OTHER HALF: the device is created by the qemu command line
  # (`-device virtserialport,chardev=qga0,name=org.qemu.guest_agent.0`), not by the package, so its
  # presence proves the host side is wired the way this stage assumes.
  do:
  - type: sysrc qemu_guest_agent_enable=YES
    wait_after: 2
  - key: ret
    wait_after: 4
  - type: ls /usr/local/bin/qemu-ga /usr/local/etc/rc.d/qemu-guest-agent
    wait_after: 2
  - key: ret
    wait_after: 4
  - type: grep qemu_guest_agent /etc/rc.conf
    wait_after: 2
  - key: ret
    wait_after: 4

- name: tell Xorg to draw through the kernel framebuffer
  # `scfb` HAS TO BE NAMED. Installing `xf86-video-scfb` puts the driver on the disk, but Xorg's
  # autoconfiguration looks for a PCI GPU and QEMU's plain VGA adapter has none it recognises - so it
  # falls back to "framebuffer mode" and refuses:
  #
  #	(EE) Cannot run in framebuffer mode. Please specify busIDs for all framebuffer devices
  #
  # A config that names the driver is the documented answer. `DefaultDepth 24` because QEMU's VGA is
  # 32-bit colour at the resolution `boot:` sets (1920x1080).
  do:
  - type: mkdir -p /usr/local/etc/X11/xorg.conf.d
    wait_after: 1
  - key: ret
    wait_after: 2
  - type: sh -c 'printf "%s\n" "Section \"Device\"" "    Identifier \"Card0\"" "    Driver \"scfb\"" "EndSection" > /usr/local/etc/X11/xorg.conf.d/10-scfb.conf'
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: cat /usr/local/etc/X11/xorg.conf.d/10-scfb.conf
    wait_after: 2
  - key: ret
    wait_after: 4

- name: enable the desktop at boot
  # THE THREE SWITCHES THAT DECIDE WHETHER A SESSION APPEARS, AND ONE OF THEM IS EASY TO MISS.
  #
  #	dbus_enable=YES              lightdm is a session bus client: it asks dbus to start the greeter
  #	                             and to give the user's session a bus. With no bus there is no
  #	                             greeter, the rc script exits, and NOTHING SAYS WHY.
  #	lightdm_enable=YES           the display manager itself
  #	devfs_system_ruleset=desktop modern FreeBSD has no hald; this ruleset grants /dev/input/* and
  #	                             the other nodes a session opens
  #
  # MEASURED on a disk whose rc.conf had only `lightdm_enable=YES`: `pgrep -x lightdm` never returned,
  # twice, on two separate runs, and the log said nothing because the script exited cleanly.
  do:
  - type: sysrc dbus_enable=YES
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: sysrc lightdm_enable=YES
    wait_after: 2
  - key: ret
    wait_after: 3
  - type: sysrc devfs_system_ruleset=desktop
    wait_after: 2
  - key: ret
    wait_after: 3

- name: log in to the desktop automatically
  # A GREETER THAT ASKS FOR A PASSWORD CANNOT BE DRIVEN BY ANYTHING UNATTENDED, and this disk has one
  # account whose password the walkthrough already knows.
  #
  # `autologin-user-timeout=8`, NOT 0, AND THAT NUMBER IS THE DIFFERENCE BETWEEN A DESKTOP AND A
  # LOGIN BOX.
  #
  # `0` means "do not wait for a user, log in immediately" - and immediately is too early: lightdm has
  # written /var/run/lightdm/root/:0 but has not yet given the session a usable X authority, so
  # `startxfce4` finds an X server it cannot authenticate to and exits before writing
  # .xsession-errors. lightdm then falls back to the greeter, which looks exactly like autologin
  # never being configured.
  #
  # MEASURED, same disk, only this number changed:
  #
  #	timeout=0   ~/.Xauthority is 0 bytes, no xfce4-session process, screen shows `Log In`
  #	timeout=8   xfce4-session running, `dbus-launch --exit-with-session xfce4-session` under it,
  #	            and the screen reads `applications` - the XFCE panel
  #
  # It is also what the FreeBSD mailing list's working lightdm configuration uses.
  #
  # `session-wrapper` IS NAMED EXPLICITLY for the same reason the greeter is: the default is right on
  # most systems and this file should not depend on which one this is.
  #
  # `user-session=xfce` NAMES THE SESSION FILE written by the package above; lightdm reads
  # /usr/local/share/xsessions/xfce.desktop for it.
  do:
  # `user-authority-in-system-dir=true` IS THE FIX FOR A SESSION THAT AUTHENTICATES AND THEN DIES.
  #
  # MEASURED on a disk where autologin was fully working:
  #
  #	lightdm.log   Session pid=1538: Started with service 'lightdm-autologin', username 'vmuser'
  #	              Authentication complete with return value 0: Success
  #	              Running command lightdm-session startxfce4
  #	ps -ax        lightdm-gtk-greeter running, NO xfce4-session
  #	~/.Xauthority 0 bytes
  #	/var/run/lightdm/root/:0  52 bytes, a valid MIT-MAGIC-COOKIE-1
  #
  # The cookie exists and `xauth -f /var/run/lightdm/root/:0 list` reads it, but the COPY into the
  # user's home came out empty - so `startxfce4` found an X server it could not authenticate to, failed
  # on its first real call, and exited before writing anything to .xsession-errors. The greeter then
  # reappeared, which looks exactly like autologin never happening.
  #
  # The option tells lightdm to POINT XAUTHORITY AT THE SYSTEM FILE instead of copying it, which
  # removes the copy that fails.
  - type: sh -c 'printf "%s\n" "[Seat:*]" "greeter-session=lightdm-gtk-greeter" "autologin-user={{ user }}" "session-wrapper=/usr/local/etc/lightdm/Xsession" "autologin-user-timeout=0" "user-session=xfce" > /usr/local/etc/lightdm/lightdm.conf'
    wait_after: 3
  - key: ret
    wait_after: 4
  - type: cat /usr/local/etc/lightdm/lightdm.conf
    wait_after: 2
  - key: ret
    wait_after: 4

- name: let the account reach the display and the video devices
  # X NEEDS BOTH. `video` opens /dev/dri and the framebuffer; without it lightdm starts and the session
  # cannot allocate a display. The account is in `wheel` already, from the useradd above.
  do:
  - type: pw groupmod video -m {{ user }}
    wait_after: 2
  - key: ret
    wait_after: 4

- name: flush the writes before anything else
  # `sync` IS NOT ENOUGH ON THIS DISK, AND THE MEASUREMENT SAYS WHY.
  #
  # `sync` was added when the first publish came out with `/usr/local/bin/sudo` as 228312 bytes of
  # zeros. It helped - sudo survived the next run - and the xorg install then came out with
  #
  #	/usr/local/libexec/Xorg          2387344 bytes, ALL ZEROS
  #	153 of 109986 files under /usr/local empty
  #	/bin/sh                          intact, ELF
  #
  # and the reason is the filesystem, not the flush:
  #
  #	df /              /dev/vtbd0p2          <- UFS
  #	sudo zpool status "no pools available"  <- NO ZFS AT ALL
  #
  # THE INSTALLER WAS ASKED FOR ZFS AND PRODUCED UFS. `partitioning - automatic zfs` presses `down`
  # then `ret`, which selects `Auto (ZFS)` on the menu as this file documents - and the disk that
  # came out has one UFS partition and no pool. Whatever the menu did, the RESULT is measured here
  # rather than trusted, because every stage after this one depends on it.
  #
  # TWO FLUSHES, BECAUSE UFS AND ZFS FAIL DIFFERENTLY: `sync` hands over the buffer cache in both
  # cases, and the second one is what a UFS filesystem needs before its superblock is trusted.
  do:
  - type: sync
    wait_after: 3
  - key: ret
    wait_after: 20
  - type: sync
    wait_after: 3
  - key: ret
    wait_after: 20

- name: prove the disk is the filesystem this file asked for
  # THE ONE FACT EVERY LATER STAGE RELIES ON, AND IT WAS NEVER CHECKED. A UFS disk works, so nothing
  # failed loudly - it just lost 153 files to an unclean shutdown, and the loss surfaced two stages
  # later as `Exec format error` on a binary nobody had touched.
  do:
  - type: sh -c 'df -h / | tail -1; zpool list 2>&1 | head -2'
    wait_after: 3
  - key: ret
    wait_after: 6

- name: make the installed system talk on the serial console
  # WITHOUT THIS THE FIRST BOOT OF THE NEW SYSTEM IS SILENT ON ttyu0, AND THE STAGE HANGS.
  #
  # MEASURED, on /work/console.log after a Network install:
  #
  #	Welcome to FreeBSD!
  #	Please choose the appropriate terminal type for your system.
  #	Common console types are: ansi vt100 xterm
  #	Console type [vt100]:
  #
  # The installer itself runs its console on the serial port, but the system it WRITES does not
  # inherit that: /boot/loader.conf starts empty, so the kernel sends everything to the VGA adapter
  # and ttyu0 sees only the termcap question. `wait for the install to finish` reads the screen for
  # `Installation Completed` and instead watches a prompt nobody answers.
  #
  # The reference implementation carries the same block for the same reason:
  #
  #	THE INSTALLED SYSTEM HAS TO TALK ON comconsole, OR NOTHING CAN READ IT.
  #
  # `boot_multicons` KEEPS THE VGA OUTPUT TOO, so the disk is readable either way.
  do:
  - type: printf '%s\n' 'console="comconsole,vidconsole"' 'boot_multicons="YES"' 'boot_serial="YES"' 'comconsole_speed="115200"' > /boot/loader.conf
    wait_after: 3
  - key: ret
    wait_after: 4
  - type: cat /boot/loader.conf
    wait_after: 2
  - key: ret
    wait_after: 4

- name: give ttyu0 a login prompt, or the console is readable but not usable
  # `boot_serial` PUTS OUTPUT ON ttyu0; /etc/ttys IS WHAT PUTS A `login:` PROMPT THERE. Without the
  # second, the next stage can read the boot and still cannot log in.
  do:
  - type: awk 'BEGIN{OFS="\t"} /^ttyu0/{print "ttyu0","\"/usr/libexec/getty std.115200\"","vt100","on","secure"; next} {print}' /etc/ttys > /tmp/ttys.new && cp /tmp/ttys.new /etc/ttys
    wait_after: 3
  - key: ret
    wait_after: 4

- name: leave the shell, which finishes the install
  # `exit` HANDS CONTROL BACK TO `bsdinstall auto`, WHICH THEN UNMOUNTS THE DISK AND REBOOTS.
  #
  # THE WAIT IS THREE MINUTES BECAUSE OF TWO THINGS THIS FILE USED TO IGNORE:
  #
  #	bsdinstall entropy     seeds the new system's random pool from the running one
  #	bsdinstall umount      unmounts /mnt and every filesystem under it - THIS is what clears the
  #	                       UFS dirty flag, and it is the step a `shutdown: kill` at the wrong moment
  #	                       throws away
  #
  # MEASURED: with a 15-second wait the disk came out with the root partition present and NOT CLEAN,
  # and the boot stopped at
  #
  #	mount: /dev/vtbd0p2: R/W mount of / denied.
  #	Filesystem is not clean - run fsck.
  #	Mounting root filesystem rw failed, startup aborted
  #
  # The kernel found the filesystem, refused to mount it read-write, and dropped to `mountroot>`. So
  # the install itself was complete - the disk simply never got its clean unmount.
  #
  # WAITING IS THE WHOLE FIX HERE: the installer reboots by itself once `umount` returns, and the
  # guest is then in a state where every write is on the medium and the filesystem says clean.
  do:
  - type: exit
    wait_after: 5
  - key: ret
    wait_after: 60

- name: wait for the installer to unmount the disk
  # `bsdinstall auto` RUNS `bsdinstall umount` AFTER THE CHROOT SHELL EXITS, AND THAT IS THE STEP THAT
  # MATTERS. It is also INVISIBLE on screen - the console shows the reboot banner and nothing says
  # whether the unmount has finished - so this waits on the one thing that can be read from outside:
  # the guest going away.
  #
  # MEASURED: with `exit` and a 15-second wait, the disk came out with a root partition the kernel
  # found and refused:
  #
  #	mount: /dev/vtbd0p2: R/W mount of / denied.
  #	Filesystem is not clean - run fsck.
  #
  # A UFS superblock carries a "clean" flag that only `umount` clears. Killing the machine before that
  # call returns leaves every block on the medium - my SIGTERM fix guarantees that - and the filesystem
  # still refusing to mount read-write, which is what a boot failure looks like from a disk that is
  # actually complete.
  #
  # THE INSTALLER REBOOTS BY ITSELF once the unmount returns, and this wait covers that reboot. The
  # `stop the machine` step after it then stops a guest that has nothing left to write.
  wait: 120

- name: stop the machine
  # A STAGE WHOSE OUTPUT IS THE DISK MAY NOT LOSE ITS WRITES, AND `sync` ABOVE IS HOW THAT IS GUARANTEED.
  #
  # `kill` RATHER THAN `acpi`, AND THE REASON IS THE INSTALLER, NOT THIS STAGE: `TestAnInstallStopsThe
  # MachineBeforePublishingTheDisk` requires it of every install leg, because a live installer's init
  # ignores ACPI and the run then waits out its timeout for a power-off nobody performs.
  #
  # THE FLUSH IS THE STEP BEFORE THIS ONE. Before `sync` existed here, this line was `kill` with a
  # comment that already said the disk may not be killed - and the disk came out with `pkg` and `sudo`
  # as zero-filled files, because nothing had been written back.
  shutdown: '{{ shutdown }}'
  timeout: 300
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
