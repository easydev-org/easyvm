name: freebsd 15.1 - sshd, XFCE, and a desktop
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/freebsd-ssh.qcow2
  # `acpi`, AND NOT `ssh`, BECAUSE THE DISK THIS STAGE PUBLISHES HAS TO BOOT.
  #
  # MEASURED, on two disks published with `shutdown: ssh`:
  #
  #	/dev/vtbd0p2: UNEXPECTED SOFT UPDATE INCONSISTENCY; RUN fsck MANUALLY.
  #	Automatic file system check failed; help!
  #	ERROR: ABORTING BOOT ... Enter full pathname of shell or RETURN for /bin/sh:
  #
  # `poweroff` over ssh asks init to stop, and on this guest init reaches power-off before UFS's clean
  # flag is written - that flag belongs to the unmount, not to `sync`, and remounting read-only is
  # refused because lightdm and Xorg hold the filesystem (`Device busy`). The ACPI power button is the
  # orderly shutdown the installer itself produces. The step below reads this variable.
  shutdown:
    from: args.shutdown
    default: acpi
steps:
- name: start recording
  record: freebsd-ssh.mp4
- name: boot the disk
  boot: true
  os: bsd
  memory_mb: 8192
  timeout: 900

# SSHD, THE ACCOUNT AND `PasswordAuthentication` ARE ALL SET BY THE INSTALL STAGE, IN ITS CHROOT
# SHELL. This stage used to type into the console to unlock password authentication, and that route
# was measured and failed: `su: Sorry` before the account was in `wheel`, and
# `/etc/ssh/sshd_config: Permission denied` after, because a console login as the unprivileged user
# cannot edit a root-owned file.
#
# SO THIS STAGE STARTS BY EXPECTING THE RESULT. `require_ssh` below is the proof, and a failure there
# means the install stage's chroot block regressed rather than that this stage forgot something.
- name: wait for sshd
  require_ssh: true
  timeout: 600
- name: prove the kernel over ssh
  ssh: uname -a
- name: prove the account over ssh
  ssh: id -un

# ==========================================================================================
# XFCE, FROM FREEBDS'S OWN REPOSITORY
# ==========================================================================================
#
# NO REPOSITORY FILE IS WRITTEN AND NONE IS NEEDED. The base system ships
# `/etc/pkg/FreeBSD.conf`, which points at `pkg+https://pkg.FreeBSD.org/${ABI}/quarterly`, and a
# run that touches nothing uses it. An override under `/usr/local/etc/pkg/repos/` would shadow that
# file with a copy of itself - a second place the answer is written down, and one that goes stale the
# day FreeBSD changes its own default.
#
# A MIRROR WAS TRIED AND REMOVED. The route out of this lab to pkg.freebsd.org is slow (measured:
# 38-68 KB/s direct from the pod, and the guest's own rate is the same, so nothing about the guest is
# wrong), and a public mirror answers the same file in under a second. But a bake that points at a
# mirror is a bake that measures a different machine than CI runs, and the whole reason these files
# are byte-identical to CI's is that a local success has to mean something. The slow route is a fact
# about the lab, not about FreeBSD.
- name: install xfce and the display manager
  # `sudo` IS THE ESCALATION, AND IT IS THE SAME ONE THE OTHER THREE SYSTEMS USE.
  #
  # MEASURED, at this step, on run 43628836904:
  #
  #	pkg: Insufficient privileges to install packages
  #
  # `pkg` needs root, and this account is not root. `su` cannot substitute for `sudo` here, and that
  # is measured rather than assumed: FreeBSD's `su` reads the password from `/dev/tty`, not stdin, and
  # an `ssh:` command has no terminal - `printf pw | su -c ...` answers `BAD SU` even with the right
  # password. `script -q /dev/null` was tried to provide a pty and failed the same way.
  #
  # SO `sudo` IS INSTALLED BY THE INSTALL STAGE, in the one place a root shell exists (its chroot),
  # with a NOPASSWD sudoers file for this account.
  #
  # `xorg` IS IN THE LIST AND `xfce` DOES NOT PULL IT IN. MEASURED, on the disk CI published for run
  # 43640668746 - every switch was right and the session still never started:
  #
  #	/etc/rc.conf          lightdm_enable="YES", dbus_enable="YES", devfs_system_ruleset="desktop"
  #	/usr/local/sbin/lightdm      present, 254912 bytes
  #	/usr/local/share/xgreeters/  lightdm-gtk-greeter.desktop    present
  #	/var/log/Xorg.0.log          No such file or directory
  #
  # X never ran, because there was no X to run. The reference implementation carries `xorg` beside
  # `xfce` in the same list and this file had dropped it - a desktop meta-port is the session and the
  # panel, not the server they draw on.
  ssh: sudo env ASSUME_ALWAYS_YES=yes pkg install -y xorg xfce lightdm lightdm-gtk-greeter
  timeout: 5400

- name: prove xfce is installed
  # THE ARTIFACT, NOT A PHRASE FROM THE INSTALLER'S OUTPUT: the session file is what lightdm reads to
  # offer `Xfce Session`, so its presence is the thing this stage needs.
  #
  # `ls` RATHER THAN `test -f`: `test` succeeds silently, and a step whose log line is an exit status
  # says nothing about WHAT is on the disk. `ls` prints the file and its size, so the log carries the
  # evidence rather than only the verdict. A missing file makes `ls` exit non-zero, which is the same
  # failure with more to read.
  ssh: ls -l /usr/local/share/xsessions/xfce.desktop
  timeout: 120

- name: enable the display manager at boot
  # `sudo` BECAUSE sysrc WRITES /etc/rc.conf, WHICH IS ROOT-OWNED. MEASURED on run 43635376123:
  #
  #	/usr/sbin/sysrc: cannot create /etc/rc.conf: Permission denied
  #
  # The xfce install above needed sudo for the same reason, and so does every write below this line.
  ssh: sudo sysrc lightdm_enable=YES
  timeout: 120

- name: enable dbus, without which there is no session
  # `lightdm_enable=YES` ALONE PRODUCES A MACHINE WHERE LIGHTDM NEVER RUNS. MEASURED TWICE, on runs
  # 43637282104 and 43638592624, whose vm leg both failed with:
  #
  #	ssh: pgrep -x lightdm -> 1
  #
  # and the second of those ran against a disk that had been shut down gracefully, so it was not a
  # missing write - the configuration itself was short one daemon.
  #
  # DBUS IS THE MISSING DAEMON. lightdm is a session bus client: it asks dbus to start the greeter and
  # to hand the user's session its bus, and with no bus there is no greeter and no session - the rc
  # script exits and nothing says why. The reference implementation puts it in the same breath as
  # lightdm for exactly this reason ("Without dbus the session starts and every panel applet fails to
  # talk to anything, which looks like a broken desktop rather than a missing daemon").
  #
  # `devfs_system_ruleset=desktop` IS THE OTHER HALF FOR INPUT: modern FreeBSD has no `hald`, and the
  # device nodes an X session needs (/dev/input/*, /dev/video*) are granted by that devfs ruleset
  # rather than by the packages. Without it the desktop starts and the keyboard does not work.
  #
  # `pw groupmod video` is what lets the session open /dev/dri and the framebuffer.
  ssh: |
    sudo sysrc dbus_enable=YES
    sudo sysrc devfs_system_ruleset=desktop
    sudo pw groupmod video -m {{ user }}
    sysrc -a
  timeout: 180

- name: set the account's password so PAM will authenticate it
  # THE ONE THING THE INSTALL STAGE CANNOT RELIABLY DO, DONE HERE WHERE IT CAN BE REPEATED.
  #
  # MEASURED, on three disks: `pw useradd ... -h 0` and `pw usermod ... -h 0` fed by a pipe leave the
  # field as `*`, because -h reads stdin and the pipe is closed before pw reads it. `*` means "no
  # password", PAM refuses the account, lightdm's autologin silently falls through to the greeter, and
  # the disk boots to a LOGIN BOX instead of a session:
  #
  #	sshd-session[1570]: error: PAM: Authentication error for vmuser from 172.30.0.1
  #
  # Fixing that inside the installer's chroot costs a whole 25-minute reinstall to test. Fixing it
  # here costs one run of THIS stage - and this stage can reach the disk over ssh, where a mistake is
  # a failed command rather than a dead disk.
  #
  # `-H` WITH A HASH COMPUTED ON THE GUEST avoids stdin entirely: `openssl passwd -6` is crypt(3)'s
  # SHA-512, the same `$6$` form `pw` writes itself. `sudo -n` works because the install stage wrote a
  # NOPASSWD sudoers file, so this needs no password to start with.
  #
  # AND THE RESULT IS READ BACK: `pw usershow` prints a hidden field as `*` either way, so the check
  # is `grep` on /etc/master.passwd for a `$6$` - the only way to tell a real hash from a locked field.
  ssh: |
    sudo sh -c 'cp=$(openssl passwd -6 -salt "$(date +%s%N | tail -c 17)" "{{ password }}") && pw usermod {{ user }} -H "$cp"'
    sudo grep "^{{ user }}:" /etc/master.passwd | cut -d: -f2 | cut -c1-3
  timeout: 180

- name: prove the password is a hash and not a locked field
  # `$6$` IS THE ONLY ACCEPTABLE ANSWER. A `*` here means PAM will refuse the account and the desktop
  # will never start, and it is worth failing THIS step rather than discovering it from a screenshot
  # of a login box after the next stage boots.
  ssh: sh -c 'grep "^{{ user }}:" /etc/master.passwd | case "$(cat)" in *:*\$6\$*) echo HASH_SET ;; *) echo LOCKED ;; esac'

- name: point lightdm at the greeter and autologin
  # THE GREETER IS NAMED EXPLICITLY, because lightdm's default is `lightdm-gtk-greeter` on some builds
  # and a missing one on others - and a missing greeter is a black screen.
  #
  # `autologin-user` IS SET HERE RATHER THAN IN THE INSTALLER: the installed system has one account and
  # a walkthrough that has to type a password at a greeter cannot be driven by anything unattended.
  # `autologin-user-timeout=0` IS NOT A DELAY OF ZERO - it means "do not show the greeter at all", and
  # without it lightdm still draws the prompt for its default ten seconds.
  #
  # `echo` RATHER THAN A MULTI-LINE `printf` WITH A TRAILING `\`: those are the lines csh rejected with
  # `Unmatched '''`, because a single-quoted string may not span lines and every continuation put one
  # there. Nothing here needs a continuation.
  #
  # THIS ONE COMMAND IS HANDED TO `sh`, BECAUSE THE LOGIN SHELL IS `csh` AND CSH REFUSES A PIPE WITH A
  # REDIRECT. MEASURED on run 43640155201, whose ssh leg reached this stage and then reported:
  #
  #	Ambiguous output redirect.
  #
  # `echo x | sudo tee f > /dev/null` is the exact shape csh cannot parse: it has one redirection
  # namespace and a pipe plus `>` in the same command is ambiguous to it. `sh -c` is what the other
  # csh-sensitive steps in this file use, for the same reason.
  #
  # AND `tee` RATHER THAN `>` IS STILL RIGHT: the redirect in `sudo echo x > f` is performed by the
  # CALLING shell, which is the unprivileged one, so it fails as a permission error that reads as if
  # sudo did nothing.
  ssh: |
    sudo mkdir -p /usr/local/etc/lightdm
    sudo sh -c 'printf "%s\n" "[Seat:*]" "greeter-session=lightdm-gtk-greeter" "autologin-user={{ user }}" "autologin-user-timeout=0" "session-wrapper=/usr/local/etc/lightdm/Xsession" "user-session=xfce" > /usr/local/etc/lightdm/lightdm.conf'
    cat /usr/local/etc/lightdm/lightdm.conf
  timeout: 120

- name: prove lightdm will start
  ssh: grep -c autologin-user /usr/local/etc/lightdm/lightdm.conf
  timeout: 120

- name: flush the writes before anything else
  # `sync` BEFORE THE SHUTDOWN, AND IT IS NOT REDUNDANT WITH IT.
  #
  # MEASURED on run 43637282104, whose ssh leg SUCCEEDED and still printed:
  #
  #	the guest did not power off within 5m0s; killing it - the disk will need a journal replay
  #
  # A guest that is killed while a pool is open leaves its writes to be replayed, and a disk that
  # needs a replay is a disk whose next boot may or may not find what this stage wrote. `sync` asks
  # the kernel to hand every dirty block over NOW, so what the stage produced is on the medium before
  # anything decides how the machine ends.
  #
  # `sudo` BECAUSE THE ACCOUNT IS UNPRIVILEGED. It is in the NOPASSWD sudoers file the install stage
  # wrote, so this is one command with no prompt.
  ssh: sudo sync
  timeout: 300

- name: flush the writes before the machine stops
  # THE SAME `sync` THE INSTALL STAGE NEEDS, FOR THE SAME MEASURED REASON.
  #
  # MEASURED: a disk published by this stage without it booted to
  #
  #	FILE SYSTEM INCONSISTENCY; RUN fsck MANUALLY.
  #	Automatic file system check failed; help!
  #	ERROR: ABORTING BOOT
  #	Enter full pathname of shell or RETURN for /bin/sh:
  #
  # because the packages this stage installed were still in the page cache when the machine stopped,
  # and UFS's clean flag is written by the unmount that follows a flush.
  ssh: sudo sync
  timeout: 300

- name: stop the machine
  # `acpi`, NOT `ssh`, AND THE REASON IS THE FILESYSTEM THE NEXT STAGE HAS TO MOUNT.
  #
  # THE VARIABLE'S DEFAULT IS `acpi` AND THE REASON IS WRITTEN WHERE IT IS DECLARED, because it is a
  # statement about what this stage's OUTPUT is: a disk the next stage has to mount.
  #
  # TEN MINUTES RATHER THAN FIVE, because this guest has just written xfce and a display manager and
  # its shutdown path touches every one of those files. The five-minute default ran out on a machine
  # that was shutting down correctly, only slowly.
  shutdown: '{{ shutdown }}'
  timeout: 600
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
