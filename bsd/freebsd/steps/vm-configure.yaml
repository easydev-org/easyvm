name: freebsd 15.1 - the desktop is up
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080
ssh_user: vmuser
ssh_port: 2222
vars:
  hostname:
    from: args.hostname
    default: easyvm-freebsd
  timezone:
    from: args.timezone
    default: America/Los_Angeles
  locale:
    from: args.locale
    default: en_US.UTF-8
  user:
    from: args.user
    default: vmuser
  password:
    from: args.password
    default: admin
  out:
    from: args.out
    default: out/freebsd-vm-configure.qcow2
  # `acpi` AND NOT `ssh`, FOR THE REASON THE SSH STAGE ALREADY LEARNED THE HARD WAY.
  #
  # MEASURED on run 43775237750, this stage:
  #
  #	stopping with method "ssh"
  #	asking the guest to shut down over ssh
  #	the guest did not power off within 5m0s; killing it - the disk will need a journal replay
  #
  # and the same on two earlier disks, where the next boot said
  #
  #	/dev/vtbd0p2: UNEXPECTED SOFT UPDATE INCONSISTENCY; RUN fsck MANUALLY.
  #
  # `poweroff` over ssh asks init to stop, and on this guest init reaches power-off before UFS's clean
  # flag is written - that flag belongs to the unmount, not to `sync`. The ACPI power button is the
  # orderly shutdown the installer itself produces.
  shutdown:
    from: args.shutdown
    default: acpi
steps:
- name: start recording
  record: freebsd-vm-configure.mp4
- name: boot the disk
  boot: true
  os: bsd
  memory_mb: 8192
  timeout: 900
- name: wait for sshd
  require_ssh: true
  timeout: 600

# THE DESKTOP IS THE VERDICT ON THE WHOLE CHAIN, AND IT IS A PICTURE RATHER THAN A PHRASE.
#
# `desktop: bsd` WOULD BE THE OBVIOUS TEST AND IT DOES NOT EXIST: `internal/screen` has
# `IsWindowsDesktop`, `IsLinuxDesktop` and `IsMacOSDesktop`, and a BSD desktop with XFCE draws the same
# panel a Linux XFCE does - so `IsLinuxDesktop` is the right measurement, and the boot menu behind it
# is what makes the distinction meaningless at this point (xfce's own panel is the thing being looked
# for, not the kernel).
- name: the session is running
  # `startx` IS NOT USED: lightdm starts the session at boot because `lightdm_enable=YES` and
  # `autologin-user` were set by the ssh stage. What this asks is whether lightdm actually got there.
  # `sh -c` BECAUSE THE LOGIN SHELL IS `csh`, WHICH HAS NO `&&` AND NO `>/dev/null` IN THAT POSITION.
  ssh: sh -c 'pgrep -x lightdm >/dev/null && echo LIGHTDM_UP'
  timeout: 180

- name: wait for the desktop
  loop:
    max: 40
    do:
    - wait: 10
    ocr:
      name: desk
      region:
      - 0
      - 0
      - 1920
      - 1080
      region_at:
      - 1920
      - 1080
      scale: 1
      wait: 0
    check:
      name: ready
      from: desk
      # AN XFCE SESSION DRAWS `Applications` IN ITS PANEL AND SITS ON A DESKTOP WHOSE CONTEXT MENU SAYS
      # `Desktop`. Both are absent from the boot log, from a login prompt and from a black screen -
      # which is what the three failure modes look like.
      mode: says_any
      words:
      - - applications
      - - desktop
      - - xfce
    until:
      fact: ready

- name: the desktop is not a login prompt
  # A GREETER ALSO DRAWS TEXT, so "something is on screen" is not enough: `/etc/issue` and the greeter's
  # own `Password:` line are what a session that never started looks like, and this fails the stage on
  # them rather than publishing a disk that boots to a prompt.
  ocr:
    name: greeter
    region:
    - 0
    - 0
    - 1920
    - 1080
    region_at:
    - 1920
    - 1080
    scale: 1
    wait: 0
- name: check there is no login prompt
  # `words:` IS WHAT MUST BE THERE AND `without:` IS WHAT MUST NOT, so this asks for both halves of
  # the verdict at once: the panel that only a session draws, and the absence of the greeter's own
  # words. MEASURED on run 43779389910, where the reading was
  #
  #	% Applications = 20 ee L° User Vmuser Home File System Trash ...
  #
  # and this step returned false because it had been written the other way round - it demanded the
  # word `freebsd`, which is the CONSOLE's banner and is not on the desktop at all. A check that is
  # false on a correct screen is worse than no check: it teaches the next reader to ignore the line.
  check:
    name: no_prompt
    from: greeter
    mode: says_without
    words:
    - applications
    without:
    - login
    - password

- name: the guest agent answers, which is what makes a graceful shutdown possible
  # THE OTHER THREE GUESTS PROVE THIS TOO, and this is the same question asked in FreeBSD's own
  # vocabulary.
  #
  # `/dev/vtcon/org.qemu.guest_agent.0` AND NOT LINUX'S `/dev/virtio-ports/...`. MEASURED: the Linux
  # path does not exist here, and asking for it reported a working agent as missing. qemu's own source
  # says why, in the #ifdef every Linux guide omits:
  #
  #	#ifdef __FreeBSD__
  #	#define QGA_VIRTIO_PATH_DEFAULT "/dev/vtcon/org.qemu.guest_agent.0"
  #	#else
  #	#define QGA_VIRTIO_PATH_DEFAULT "/dev/virtio-ports/org.qemu.guest_agent.0"
  #
  # and on this guest `/dev/vtcon/` holds exactly one entry per channel:
  #
  #	lrwxr-xr-x  org.qemu.guest_agent.0 -> ../ttyV0.1
  #
  # `readlink -f` BECAUSE THE ENTRY IS A SYMLINK, and a bare `-e` on a dangling link is a different
  # failure from a link that resolves to a node that is not a character device.
  ssh: sh -c 'pgrep -f qemu-ga >/dev/null && readlink -f /dev/vtcon/org.qemu.guest_agent.0 && echo GUEST_AGENT_UP'
  timeout: 180

- name: the agent's rc.conf line, which is what starts it at every boot
  ssh: grep qemu_guest_agent /etc/rc.conf
  timeout: 60

- name: set the machine's name
  # `hostname=` IN rc.conf IS WHAT MAKES IT SURVIVE A REBOOT; `hostname` alone changes the running
  # kernel and is lost at the next boot. Both are done, because a stage that only wrote the file
  # would have a guest answering to the new name after a restart and the old one now.
  ssh: sh -c 'printf "%s\n" "{{ password }}" | sudo -S -p "" sh -c "sysrc hostname={{ hostname }} && hostname {{ hostname }}"'
  timeout: 120
- name: point the loopback line at that name
  ssh: sh -c 'printf "%s\n" "{{ password }}" | sudo -S -p "" sh -c "grep -q \"{{ hostname }}\" /etc/hosts || printf \"127.0.1.1\t{{ hostname }}\n\" >> /etc/hosts"'
  timeout: 60
- name: prove the name
  ssh: sh -c 'echo "kernel = $(hostname)"; echo "rc.conf = $(sysrc -n hostname)"; echo "hosts = $(grep -c "{{ hostname }}" /etc/hosts) line(s)"; test "$(hostname)" = "{{ hostname }}" && echo HOSTNAME_OK'
  timeout: 60
- name: set the time zone
  # `tzsetup -s ZONE` IS THE INTERACTIVE TOOL IN ITS SCRIPTED FORM, and it is what bsdinstall itself
  # drives. A `cp /usr/share/zoneinfo/... /etc/localtime` would also work; this is the tool that
  # keeps `/var/db/zoneinfo` consistent with the symlink, which is what makes a later `tzsetup`
  # re-entrant.
  ssh: sh -c 'printf "%s\n" "{{ password }}" | sudo -S -p "" sh -c "tzsetup -s {{ timezone }}" 2>&1 | tail -3'
  timeout: 120
- name: prove the time zone
  ssh: sh -c 'echo "localtime = $(readlink -f /etc/localtime)"; echo "zoneinfo = $(cat /var/db/zoneinfo 2>/dev/null)"; echo "date = $(date)"; grep -q "{{ timezone }}" /var/db/zoneinfo && echo TIMEZONE_OK'
  timeout: 60
- name: set the locale in /etc/profile, which is what a login shell reads
  # TWO PLACES DECIDE THIS ON FREEBSD AND THEY ANSWER DIFFERENT QUESTIONS, so both are written:
  #
  #	/etc/profile      sourced by a LOGIN shell - an interactive session, and the XFCE session that
  #	                  lightdm starts inherits it from there
  #	/etc/login.conf   the lang capability, applied by login(1) to everything a login starts
  #
  # THIS STEP DOES /etc/profile AND NOTHING ELSE. It used to call `sysrc lua_load=1` and
  # `sysrc -f /etc/login.conf`, and BOTH WERE WRONG: lua_load is the Lua loader for rc scripts and has
  # nothing to do with locales, and `sysrc -f` changes which FILE rc.conf is read from rather than
  # editing login.conf. Neither touched the locale, and both made the step look like it did more.
  #
  # `grep -q` BEFORE THE APPEND, because a second run would otherwise add a second pair of lines and
  # the file grows every time a stage is retried.
  ssh: >-
    sh -c 'printf "%s\n" "{{ password }}" | sudo -S -p "" sh -c
    "grep -q \"^LANG={{ locale }}\" /etc/profile ||
    printf \"LANG={{ locale }}\nLC_ALL={{ locale }}\n\" >> /etc/profile"'
  timeout: 120
- name: add the locale to login.conf and rebuild its database
  # /etc/login.conf IS NOT A FILE OF LINES YOU CAN APPEND TO. Its `default` class is a MULTI-LINE entry
  # joined with trailing backslashes, so there is no line to rewrite - and the first attempt here used
  # a sed that matched the line's PREFIX and matched NOTHING, because the line begins `default:` with
  # no leading colon. MEASURED on the disk this stage produced:
  #
  #	default:\
  #		:passwd_format=sha512:\
  #		:copyright=/etc/COPYRIGHT:\
  #		:welcome=/var/run/motd:\
  #		:setenv=BLOCKSIZE=K:\
  #		:path=/sbin /bin /usr/sbin /usr/bin ...
  #
  #	--- grep -n '^:default' /etc/login.conf ---
  #	(no output)
  #
  # THE OUTER SHELL IS csh AND IT EATS TWO THINGS, EACH FOUND THE HARD WAY:
  #
  #	P=admin: Command not found.      csh has no `var=value`
  #	d: Event not found.              csh expands `!` as history, even inside single quotes
  #
  # So the body is ONE `sh -c` (which fixes the assignment) and the awk program avoids `!` entirely
  # by counting instead of negating. `pgrep -x lightdm` in this file already records the first lesson;
  # the second was found by this step failing after that one was fixed.
  #
  # awk RATHER THAN sed: the capability goes in as a NEW LINE beside setenv, with its own trailing
  # backslash so the class stays one entry, and awk matches on content rather than on a line number -
  # the file's comment block is twenty lines of prose that would shift.
  #
  # cp FIRST AND mv AFTER, never `sed -i` or an awk inplace extension: FreeBSD's awk has none, and
  # this is a file whose damage would show up as a machine nobody can log in to.
  #
  # cap_mkdb IS NOT OPTIONAL: login(1) reads login.conf.db, and a file edited without rebuilding the
  # database is one nothing reads - the quietest way to have a setting that looks present.
  ssh: >-
    printf '%s\n' '{{ password }}' | sudo -S -p '' sh -c
    'if grep -q "LANG={{ locale }}" /etc/login.conf; then echo ALREADY_SET; else
    cp /etc/login.conf /etc/login.conf.easymv-bak;
    awk "/:setenv=BLOCKSIZE=K:/ { if (seen == 0) { printf \"\t:LANG={{ locale }}:\\\\\n\"; seen = 1 } } { print }"
    /etc/login.conf > /tmp/lc.new;
    test -s /tmp/lc.new && cp /tmp/lc.new /etc/login.conf && echo INSERTED;
    fi;
    cap_mkdb /etc/login.conf'
  timeout: 180
- name: prove the locale in a new login shell, and in the login database
  # THE FIRST PART IS THE ONE THAT MATTERS AND IT WAS BEING CUT OFF. On FreeBSD a login shell prints
  # its own welcome text - three or four lines of `find` examples - so a `head -4` showed the WELCOME
  # and never the values. The filter is on the LANG lines instead of on a line count.
  #
  # `cap_mkdb -l` IS NOT THE WAY TO READ THE DATABASE and this step used to try: `usage: cap_mkdb
  # [-b | -l] [-v] [-f outfile] file ...` prints nothing useful without `-f`, so the check reported
  # zero for a database that was correct. MEASURED, the database really does hold the capability:
  #
  #	strings /etc/login.conf.db | grep -i lang
  #	... :LANG=en_US.UTF-8:  :setenv=BLOCKSIZE=K:  :mail=/var/mail/$: ...
  #
  # and it appears in every class that inherits from default - `root`, `daemon`, `russian`.
  #
  # `getcap` IS THE READER, and `-f /etc/login.conf` asks the SOURCE file while the default asks the
  # compiled database. This checks the database because that is what login(1) consumes.
  #
  # ONE `sh -c` FOR THE SAME REASON AS THE STEP ABOVE: the login shell is csh.
  ssh: >-
    sh -c 'sh -lc "printf \"LANG=%s\nLC_ALL=%s\n\" \"\$LANG\" \"\$LC_ALL\"" 2>/dev/null
    | grep -E "^(LANG|LC_ALL)=" ;
    echo "source file ---" ;
    grep -c "LANG={{ locale }}" /etc/login.conf || true ;
    echo "compiled database ---" ;
    strings /etc/login.conf.db | grep -c "LANG={{ locale }}" || true'
  timeout: 120
- name: serve the host share
  # THE DIRECTORY IS SERVED BY THE DAEMON'S OWN HTTP LISTENER, on the port that already answers
  # `/api/state` and `/screen.png`, at `/shared/`.
  #
  # NOTHING IS INSTALLED FOR THIS AND NOTHING IS MOUNTED. It was SMB until a capture on this guest's
  # vtnet0 settled why that could not work here: freebsd's mount_smbfs dials NetBIOS 139 because
  # netsmb implements SMB1, and the server offers SMB3 on 445 - so the kernel got a TCP RST, which the
  # library reported as `syserr = Connection refused`, and that sentence sent nine hypotheses down the
  # wrong path before the packet was read. The proof below is a fetch with `fetch` or `curl`, both of
  # which this guest has without installing anything.
  share_serve: true
  timeout: 60

- name: prove the guest can fetch from the host share
  # `share_family: bsd` SELECTS THE GUEST'S OWN FETCHER: `curl`, and `fetch` as the fallback because
  # curl is not guaranteed on a base FreeBSD image while `fetch` is.
  #
  # THE PROOF IS ON THE HOST SIDE. The daemon writes a sentinel into the served directory and has the
  # GUEST fetch it, because a guest that writes to its own home and reads it back proves only its own
  # filesystem - measured once on manjaro, where the mount had never happened and the round-trip check
  # passed anyway.
  share_mount: true
  share_family: bsd
  timeout: 180

- name: flush the writes before anything else
  # `sync` BEFORE THE SHUTDOWN, AND IT IS NOT REDUNDANT WITH IT.
  #
  # MEASURED on run 43637282104, whose ssh leg SUCCEEDED and still printed:
  #
  #	the guest did not power off within 5m0s; killing it - the disk will need a journal replay
  #
  # A guest that is killed while a pool is open leaves its writes to be replayed, and a disk that
  # needs a replay is a disk whose next boot may or may not find what this stage wrote. `sync` asks
  # the kernel to hand every dirty block over NOW, so what the stage produced is on the medium before
  # anything decides how the machine ends.
  #
  # `sudo` BECAUSE THE ACCOUNT IS UNPRIVILEGED. It is in the NOPASSWD sudoers file the install stage
  # wrote, so this is one command with no prompt.
  ssh: sudo sync
  timeout: 300

- name: stop the machine
  # TEN MINUTES RATHER THAN FIVE, because this guest has just written xfce and a display manager and
  # its shutdown path touches every one of those files. The five-minute default ran out on a machine
  # that was shutting down correctly, only slowly.
  shutdown: '{{ shutdown }}'
  timeout: 600
- name: publish the disk
  compress: '{{ out }}'
- name: stop recording
  record: false
