# ANDROID: the same machine as Linux, with an adapter that provides a DRM node.
#
# ANDROID-X86 IS A LINUX GUEST. Its INSTALLED disk boots through UEFI and GRUB like any other; only
# the video adapter differs, and it differs for a reason that took three runs of 240, 600 and 600
# seconds to find.

name: android
description: "UEFI, virtio disk, virtio-vga - the adapter that gives Android its /dev/dri/card0"

firmware:
  kind: ovmf
  code: "{{.Code}}"
  vars: "{{.Vars}}"

cpu: {}
smp:
  format: plain

# `virtio`, BECAUSE `std` VGA PROVIDES NO DRM NODE AND ANDROID CANNOT DRAW WITHOUT ONE.
#
# MEASURED, and it is the difference between a desktop and what looks like a hang. The installed
# system runs Android's HWC with `HWC=drm_minigbm`, which opens /dev/dri/card0:
#
#	-device VGA          a framebuffer and NO DRM device. Android brings up no display at all, and
#	                     the screen STOPS ON INITRD'S LAST LINE for as long as you wait - measured at
#	                     240 s, 600 s and 600 s again before the cause was found. Nothing in the
#	                     console says what is wrong.
#	-device virtio-vga   the real KMS driver, so /dev/dri/card0 exists and the launcher draws.
#
# It applies to the INSTALLER too: the same kernel runs in both, with the same HWC argument out of the
# same grub.cfg. And `virtio` reaches the daemon as `-device virtio-vga,xres=...`, which is the one
# form that can carry the resolution the panes were measured at.
#
# IT IS NOT OVERRIDABLE, AND THE REFUSAL IS IN `Validate`: a caller that asked for `std` on an android
# guest would get a black screen that reports nothing.
video:
  kind: virtio

audio: hda
smc: false
install_medium: iso
extra_args: []

media:
  iso: true
  recovery: false