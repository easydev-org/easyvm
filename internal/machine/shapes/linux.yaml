# LINUX: UEFI firmware, a virtio disk, a VGA adapter at the resolution the coordinates were measured
# at. This is the shape most guests here use, and the one every other shape is a deviation from.

name: linux
description: "UEFI, virtio disk, VGA at 1920x1080 - what every Linux installer here expects"

firmware:
  kind: ovmf
  # THE TWO PFLASH SLOTS ARE TEMPLATES because the DAEMON chooses the files: the container image
  # carries one OVMF build and a run may point `OVMF_CODE` elsewhere. `{{.Code}}` is what the caller
  # passed and `{{.Vars}}` is the writable copy made per run.
  code: "{{.Code}}"
  vars: "{{.Vars}}"

cpu: {}
smp:
  format: plain

# `vga` IS THE `-device VGA,xres=1920,yres=1080,vgamem_mb=32` FORM, and it is not a preference:
# `-vga std` cannot carry a resolution, so a guest given it comes up at qemu's own 1280x800 and every
# coordinate measured on 1920x1080 lands somewhere else. MEASURED: `linux-nixos-ssh` failed with
# "`region_at` is [1920, 1080] but this frame is 1280x800".
#
# `vgamem_mb=32` IS NOT TUNING. The adapter's default is 8 MiB and 1920x1080 at 32 bits is 7.91 MiB
# before double buffering, so the default cannot hold a frame and the symptom is a black screen from
# the first capture with no error at all.
video:
  kind: vga

# HDA, because that is what Windows, Linux and the BSDs bind out of the box.
audio: hda

smc: false

# AN ISO IS WHAT MARKS AN INSTALL for this family.
install_medium: iso

extra_args: []

media:
  iso: true
  recovery: false
# THE RAW QEMU COMMAND LINE. See `QEMUProfile` in internal/machine/shape.go.
#
# THIS IS THE SHAPE EVERY OTHER ONE IS A DEVIATION FROM, so its list is the reference: q35, a
# virtio-blk disk on PCI, a `-device VGA` at the resolution the coordinates were measured at, HDA
# audio, and a usb-tablet on its own xHCI controller.
#
# ONE PROFILE, because a Linux guest is started the same way whether it installs, boots an installed
# disk or runs a stage that only types.
# TWO PROFILES, BECAUSE AN INSTALL AND AN INSTALLED SYSTEM ARE DIFFERENT MACHINES.
#
# THE DIFFERENCE IS NOT A PLACEHOLDER: an install boots the MEDIUM and its target disk is second in
# the boot order; an installed system has no medium at all, so the disk must be FIRST. That is not a
# cosmetic reordering - a device with no `bootindex` is not in the boot order, and OVMF then reports
# it could not load Boot0001 rather than booting anything.
#
# `discard=unmap` differs too, and for the reason measured on macOS: during an install the guest's own
# staging data is deallocated under it, and the progress freezes. An installed system is the opposite -
# discard is exactly what keeps a published qcow2 small.
qemu:
  default: disk

  profiles:
    # ------------------------------------------------------------- install
    install:
      machine: "q35,accel=kvm,vmport=off"

      args:
        # THE AGENT'S PORT. `server=on,wait=off` so qemu starts without a client.
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "virtio-serial"]
        - ["-device", "virtserialport,chardev=qga0,name=org.qemu.guest_agent.0"]

        # THE SCREEN. `-device VGA` is the only form that carries a resolution, and `vgamem_mb=32` is
        # not tuning: the default 8 MiB cannot hold 1920x1080 at 32 bits, and the symptom is a black
        # screen from the first capture with no error at all.
        - ["-device", "VGA,xres=1920,yres=1080,vgamem_mb=32"]

        # THE USB CONTROLLER COMES FIRST, because every device below that names `bus=xhci.0` needs it
        # to exist: qemu resolves `bus=` as it parses. The pointer and the keyboard ride it, and a
        # q35 guest has no PS/2.
        - ["-device", "qemu-xhci,id=xhci"]
        - ["-device", "usb-tablet,bus=xhci.0"]
        - ["-device", "usb-kbd,bus=xhci.0"]

        # THE MEDIUM, FIRST IN THE BOOT ORDER. A fresh OVMF_VARS has no saved entry, so an implicit
        # scan is the firmware's own choice rather than a request - and measured it chose nothing:
        # fifteen minutes of `drop=+0.0 ratio=0.0x sat=+0.00` on a black machine.
        - ["-drive", "file={{iso}},media=cdrom,readonly=on,if=none,id=media0"]
        - ["-device", "ide-cd,drive=media0,bootindex=0"]

        # THE ANSWER CD, THEN THE TARGET, THEN THE DRIVERS - AND THAT ORDER IS MEASURED.
        #
        # "The install ISO is first so the firmware boots it. The drivers travel on the answer CD,
        # which keeps the virtio disk at index 0." A CD-ROM does not take a disk index - Windows
        # numbers only fixed disks - so the disk after the CDs is still DiskID 0. The driver CD sits
        # LAST because only the INSTALLED system reads it.
        #
        # THE TWO EXTRA CDS ARE ON USB because q35's IDE controller has exactly one unit:
        # `-device ide-cd,drive=media1,bootindex=1` is "Can't create IDE unit 1, bus supports only
        # 1 units".
        - ["-drive", "file={{answer}},media=cdrom,readonly=on,if=none,id=media1"]
        - ["-device", "usb-storage,bus=xhci.0,drive=media1"]

        # THE TARGET, WITHOUT `discard`: the installer is writing to it.
        - ["-drive", "file={{disk}},if=none,format=qcow2,id=target"]
        - ["-device", "virtio-blk-pci,drive=target,bootindex=1"]

        - ["-drive", "file={{driver}},media=cdrom,readonly=on,if=none,id=media2"]
        - ["-device", "usb-storage,bus=xhci.0,drive=media2"]

        # THE SOUND CARD. `-audiodev` must precede the device that names it, or qemu fails with
        # `audiodev snd0 not found`. `hda-duplex` carries line-out AND line-in.
        - ["-audiodev", "none,id=snd0"]
        - ["-device", "ich9-intel-hda"]
        - ["-device", "hda-duplex,audiodev=snd0"]

        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-pci,netdev=net0,mac=52:54:00:56:4d:01,romfile=,host_mtu=1450"]

    # ---------------------------------------------------------------- disk
    disk:
      machine: "q35,accel=kvm,vmport=off"

      args:
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "virtio-serial"]
        - ["-device", "virtserialport,chardev=qga0,name=org.qemu.guest_agent.0"]

        - ["-device", "VGA,xres=1920,yres=1080,vgamem_mb=32"]

        - ["-device", "qemu-xhci,id=xhci"]
        - ["-device", "usb-tablet,bus=xhci.0"]
        - ["-device", "usb-kbd,bus=xhci.0"]

        # NO MEDIUM. THE DISK IS FIRST IN THE BOOT ORDER, because there is nothing else to try.
        #
        # `discard=unmap` IS ON HERE, and it is what keeps a published disk small: the guest's TRIMs
        # reach the qcow2 instead of leaving blocks `qemu-img convert -c` cannot remove.
        - ["-drive", "file={{disk}},if=none,format=qcow2,discard=unmap,id=target"]
        - ["-device", "virtio-blk-pci,drive=target,bootindex=0"]

        - ["-audiodev", "none,id=snd0"]
        - ["-device", "ich9-intel-hda"]
        - ["-device", "hda-duplex,audiodev=snd0"]

        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-pci,netdev=net0,mac=52:54:00:56:4d:01,romfile=,host_mtu=1450"]
