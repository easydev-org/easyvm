# MICROVM: THE SMALLEST MACHINE THAT BOOTS A MODERN LINUX KERNEL.
#
# No firmware, no boot sector, no PCIe bus, no IDE, no USB. qemu is handed the kernel and an initramfs
# directly, and the disk arrives holding a root filesystem. 512-768 MiB of RAM instead of 4 GiB, and
# seconds instead of forty minutes.
#
# WHAT THAT BUYS AND WHAT IT COSTS. A distribution installer needs UEFI, a virtio-blk disk, a VGA
# adapter and a USB tablet; a walk whose job is "drive a guest and read its screen" pays for all four
# and needs none. A microvm is for the second kind.
#
# THE THREE PROFILES ARE THE THREE THINGS A GUEST CAN RUN, and they differ in more than the adapter -
# which is why each is written out rather than selected by a placeholder:
#
#	serial    no adapter at all, serial only. `see:` reads nothing and a recording is blank.
#	          pcie=off, `pci=off` on the kernel line.
#	terminal  a text-mode ISA VGA the guest draws its TTY on. A recording of a headless guest is a
#	          PICTURE of its console. pcie=off.
#	desktop   a virtio-gpu on a PCIe bus that is turned ON for it, which is the only way a compositor
#	          gets a KMS output and a render node on one card. It is also the one profile that does
#	          NOT carry `pci=off`, because that would hide the bus the GPU is attached to.
#
# A walk selects one with `microvm_display:` on its `boot:` step. The three are the same qemu machine
# type; what separates them is the adapter, the bus, and - for `desktop` - what the guest runs.
name: microvm
description: "no firmware, no PCIe, no display - a kernel and an initramfs handed to qemu by the host"

# A MICROVM HAS NO FIRMWARE AT ALL, which is the whole point of the machine type: no pflash, no boot
# order, no UEFI, and one fewer thing that can fail before the guest is up.
firmware:
  kind: none

cpu: {}
smp:
  format: plain
video:
  kind: absent
audio: none
smc: false
qga: isa-serial
install_medium: none
extra_args: []
media:
  iso: false
  iso_reason: "a microvm has no firmware to boot an ISO; it is handed a kernel and an initramfs by the host, and its disk arrives holding a root filesystem"
  recovery: false

# THE RAW QEMU COMMAND LINES, ONE PER CONFIGURATION. See `QEMUProfile` in internal/machine/shape.go.
qemu:
  default: terminal

  profiles:
    # ---------------------------------------------------------------- serial
    serial:
      # `acpi=on` IS NOT A DISPLAY OPTION AND IT IS NOT OPTIONAL FOR SOME DISTRIBUTIONS. A microvm
      # with `pcie=off` delivers its disks as virtio-over-MMIO, and qemu can name those devices on the
      # kernel command line or in an ACPI table. Debian 6.12's kernel is built without
      # CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES, so it refuses the command-line form (`virtio_mmio: unknown
      # parameter 'device' ignored`, then `ALERT! /dev/vda does not exist`). `acpi=on` makes qemu
      # describe the same devices in a DSDT, which every one of those kernels can read.
      #
      # `pic=on` and `rtc=on` come with it because a machine with no ACPI has none of its own timer,
      # and a guest that reaches userspace with no working timer logs a clock that never advances.
      machine: "microvm,accel=kvm,acpi=on,pic=on,rtc=on,pcie=off,graphics=off"

      args:
        # THE AGENT'S PORT. `virtio-serial` is a PCI device and this machine has no PCI bus:
        #
        #	-device virtio-serial: No 'PCI' bus found for device 'virtio-serial-pci'
        #
        # so the agent talks over an ISA serial port instead.
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "isa-serial,chardev=qga0"]

        # THE DISK, ON THE MMIO BUS. `virtio-blk-device`, not `virtio-blk-pci`: there is no PCI bus.
        - ["-drive", "file={{disk}},if=none,format=qcow2,id=target{{discard}}"]
        - ["-device", "virtio-blk-device,drive=target"]

        # THE NETWORK, ALSO MMIO. `virtio-net-device` has NEITHER `romfile=` NOR `host_mtu=`:
        #
        #	-device virtio-net-device,netdev=net0,...,romfile=: Property 'virtio-net-device.romfile'
        #	not found
        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-device,netdev=net0,mac=52:54:00:56:4d:01"]

      kernel_args:
        - ["-kernel", "{{kernel}}"]
        - ["-initrd", "{{initrd}}"]
        - ["-append", "{{append}}"]

    # -------------------------------------------------------------- terminal
    terminal:
      # `graphics=on` IS FOR A TEXT CONSOLE ONLY: the guest draws its TTY on an ISA adapter, and a
      # recording of a headless guest is then a PICTURE of its console rather than a black field.
      machine: "microvm,accel=kvm,acpi=on,pic=on,rtc=on,pcie=off,graphics=on"

      args:
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "isa-serial,chardev=qga0"]

        # `isa-vga` IS THE ADAPTER A `microvm` CAN ACTUALLY CREATE, and `-vga std` is not:
        #
        #	warning: A -vga option was passed but this machine type does not use that option;
        #	No VGA device has been created
        #
        # MEASURED, after switching to `-device isa-vga`: a screendump of the running microvm returns
        # a 720x400 frame reading SeaBIOS, `Welcome to Alpine Linux 3.21` and `localhost login:` -
        # which is what `see:` measures. `vgamem_mb=16` is enough for a text console and a quarter of
        # what a full machine's adapter takes.
        - ["-device", "isa-vga,vgamem_mb=16"]

        - ["-drive", "file={{disk}},if=none,format=qcow2,id=target{{discard}}"]
        - ["-device", "virtio-blk-device,drive=target"]

        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-device,netdev=net0,mac=52:54:00:56:4d:01"]

      kernel_args:
        - ["-kernel", "{{kernel}}"]
        - ["-initrd", "{{initrd}}"]
        - ["-append", "{{append}}"]

    # --------------------------------------------------------------- desktop
    desktop:
      # PCIe IS ON, AND ONLY FOR A DESKTOP. MEASURED: `virtio-gpu-device` on the virtio-MMIO bus
      # attaches but its driver never binds (status 0x83, NEEDS_RESET, no `/dev/dri/card0`), while
      # `pcie=on` with `virtio-gpu-pci` gives
      #
      #	[drm] Initialized virtio_gpu 0.1.0 for 0000:00:01.0 on minor 0
      #	/sys/class/drm: card0 card0-Virtual-1 renderD128
      #
      # - a KMS output and a render node on one device, which a compositor needs. The disk and network
      # stay on virtio-MMIO: measured, the mixed command line boots to `login:` with /dev/vda mounted.
      machine: "microvm,accel=kvm,acpi=on,pic=on,rtc=on,pcie=on,graphics=off"

      args:
        - ["-chardev", "socket,id=qga0,path={{work}}/qga.sock,server=on,wait=off"]
        - ["-device", "isa-serial,chardev=qga0"]

        # `graphics=off` ABOVE IS NOT AN OVERSIGHT: an ISA VGA beside a virtio-gpu would be a second,
        # unused display that `see:` might photograph.
        #
        # THE RESOLUTION IS STATED so the guest's single output has a mode `see:` can name.
        - ["-device", "virtio-gpu-pci,xres=1024,yres=768"]

        # THE SOUND CARD ATTACHES HERE AND NOWHERE ELSE, because `ich9-intel-hda` is a PCI device and
        # this is the one profile with a PCIe bus. `-audiodev` must precede the device naming it.
        - ["-audiodev", "none,id=snd0"]
        - ["-device", "ich9-intel-hda"]
        - ["-device", "hda-duplex,audiodev=snd0"]

        - ["-drive", "file={{disk}},if=none,format=qcow2,id=target{{discard}}"]
        - ["-device", "virtio-blk-device,drive=target"]

        - ["-netdev", "tap,id=net0,ifname=qemutap0,script=no,downscript=no"]
        - ["-device", "virtio-net-device,netdev=net0,mac=52:54:00:56:4d:01"]

      # NO `kernel_args` `pci=off`: this profile HAS a PCI bus, and declaring none would hide the bus
      # the GPU is attached to and the GPU would vanish. The kernel line's own default is used.
      kernel_args:
        - ["-kernel", "{{kernel}}"]
        - ["-initrd", "{{initrd}}"]
        - ["-append", "{{append}}"]
