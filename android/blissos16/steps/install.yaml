name: android 13 (blissos 16.9.7) - install onto a disk this file makes
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080

# BLISSOS INSTALLS ITSELF FROM ITS OWN BOOTABLE ISO, THE WAY EVERY OTHER INSTALLER HERE DOES.
#
# THE ISO IS A BOOTABLE MEDIUM UNDER BOTH FIRMWARES, AND THAT IS A MEASUREMENT RATHER THAN AN
# ASSUMPTION. Its El Torito catalog, read out of the file:
#
#	entry 0: x86 BIOS   bootable    image at LBA 7735  (isolinux)
#	section: UEFI
#	entry 2: (UEFI)     bootable    image at LBA 55    (30720 sectors = boot/grub/efi.img)
#
# so firmware finds a loader by itself, exactly as it does for Windows and every Linux here. There is
# no `-kernel` on this path and there is no reason for one: a guest handed a kernel by the host never
# runs the boot chain it is supposed to be proving.
#
# THE PARTITIONS ARE WRITTEN BEFORE QEMU STARTS, AND THAT IS THE MEASURED CHOICE RATHER THAN THE
# tidier-looking one. Android's first pane lists the partitions it FINDS:
#
#	with no table    it offers "Create/Modify partitions" and the run is handed to cgdisk - seventeen
#	                 line prompts that take `260M`, `EF00` and a name as TYPED TEXT, where one
#	                 misaligned key silently retypes the ESP as "Linux filesystem" (measured) and the
#	                 install then has no ESP at all
#	with this table  it shows `vda1 0.25GB` already selected and ten key presses finish the install
#
# easydiskbake partitions the same way and for the same reason; `disk_gpt:` is that act here.
#
# THE ONE PLATFORM FACT THIS FILE'S `os:` ADDS IS THE VIDEO ADAPTER, AND IT IS NOT COSMETIC.
# Android's HWC runs with `HWC=drm_minigbm` and opens /dev/dri/card0. A `-device VGA` provides a
# framebuffer and NO DRM device, so Android brings up no display at all and the screen STOPS ON
# INITRD'S LAST LINE - measured at 240 s, 600 s and 600 s again before the cause was found, with
# nothing in the console saying what was wrong. `-device virtio-vga` is the real KMS driver, and
# `machine.Boot.VGA` returns it for this family and refuses any other value.
#
# THE PANES ARE ANSWERED BY KEY AND SETTLE, NOT BY OCR. Two DIFFERENT dialogs read back identically
# to tesseract on a whole frame:
#
#	Please select a filesystem to format vda1:   ->  ... | format | udal:
#	Please select a filesystem to format vda2:   ->  ... | format | udaz:
#
# and a crop that captures a one-line question loses the body of a confirm dialog. A `dialog` TUI
# does not need to be searched for: its rows never move, its focus order is fixed, and its
# accelerators are one letter each. The panes that DECIDE something still get an OCR check.

vars:
  out:
    from: args.out
    default: out/blissos16.qcow2
  # 128 GiB, WHICH IS THIS REPOSITORY'S SIZE FOR EVERY DISK. The installer draws the result as
  # "119.2GB" rather than the "31.75GB" easydiskbake measured on a 32 GiB disk; nothing in the ten
  # key presses reads a capacity, which is why the change is safe. The artifact stays ~4 GiB because
  # a qcow2 is sparse.
  disk_gb:
    from: args.disk_gb
    default: "128"
  # 260 MiB is what `sgdisk --new=1::+260M` produces and what the installer draws as "0.25GB".
  esp_mib:
    from: args.esp_mib
    default: "260"

steps:
  - name: the media this stage boots from is already on disk
    # FIRST STEP, BECAUSE A MISSING INPUT MUST FAIL IN THE FIRST SECOND INSTEAD OF
    # forty minutes into a run. Every one of these files is declared by this leg's
    # `assets:` in its workflow and placed here by `pull-artifact.sh` before
    # `easyvm run` is called; nothing in this file downloads.
    needs:
    - blissos-16.9.7.iso
  - name: start recording

  # =======================================================================================
  # 1. THE DISK, BEFORE THE MACHINE
  # =======================================================================================
  #
  # A GPT with a 260 MiB ESP typed EF00 at LBA 2048 and Linux on the rest. Both numbers were
  # measured by getting them wrong:
  #
  #	vda1 started at LBA 34     no partitions listed, and the installer answers
  #	                           "No ESP is selected, setup will use the old detection method"
  #	wrong ESP type GUID        "This is not an EFI System Partition, please check again"
  - name: give the installer a disk with its ESP already there
    disk: disk.qcow2
    disk_gb: '{{ disk_gb }}'
    disk_gpt: true
    disk_esp_mib: '{{ esp_mib }}'

  - name: boot the installer
    boot: true
    os: android
    iso: blissos-16.9.7.iso
    memory_mb: 4096
    timeout: 900

  # THE MENU DRAWS AT ABOUT 12 s AND TIMES OUT INTO THE LIVE SYSTEM AT 30 s, both measured with
  # `scripts/watch.py`, which screenshots this guest once a second and prints what it reads:
  #
  #	 0-17 s   the menu
  #	 18 s     the kernel is up (SELinux's own log line)
  #	 20 s     initrd
  #
  # A walkthat waited 55 s photographed the live desktop's "Select a Home app"; one that waited 14 s
  # photographed a black frame. 20 s is inside the window with both edges accounted for, and the
  # check below is what proves the frame really is the menu.
  - name: let the menu draw
    settle: 20

  - name: read the menu
    see: {name: menu}
  - name: the menu offers Installation
    check:
      name: has_install
      from: menu
      mode: text
      words:
      - installation

      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
  # "BlissOS-16.9.7 2024-10-11 Installation" is the fifth row under UEFI's graphical menu; the four
  # above it are the Live entries. THE ROW COUNT IS THE UEFI MENU'S, measured on that menu.
  # `key:` TAKES ONE QCODE, NOT A LIST - measured: `key: [down, down, down, down]` fails with
  # "empty key", because the vocabulary's value is a string and a sequence is a different shape.
  # Four presses are therefore four steps, which is also what makes a lost key visible: the menu
  # draw is a picture and each step is one row.
  - name: down to the second row
    key: down
    settle: 1
  - name: down to the third row
    key: down
    settle: 1
  - name: down to the fourth row
    key: down
    settle: 1
  - name: down to Installation
    key: down
    settle: 1
  - name: start the installer
    key: ret
    settle: 45

  # =======================================================================================
  # 3. THE PANES, WHICH ARE THE SAME TEN EASYdiskbake MEASURED
  # =======================================================================================
  #
  # The partition list now holds `vda1  unknown  0.25GB` selected and `vda2  31.75GB` (or 119.2GB on
  # a 128 GiB disk) beneath it - the table this file wrote.

  # "Choose Partition / UEFI System detected !" with vda1 on a solid bar.
  - name: open the ESP's filesystem question
    key: ret
    settle: 15

  # "Please select a filesystem to format vda1: Do not re-format / Fat32 (CAREFUL)". The default is
  # Do not re-format, which would leave the table's bytes with no filesystem on them - and an ESP
  # with no FAT is one the firmware cannot read.
  - name: choose FAT32
    key: f
    settle: 3
  - name: confirm the filesystem
    key: ret
    settle: 10
  # The label field already holds ESP; Return keeps it.
  - name: keep the ESP label
    key: ret
    settle: 12
  # "Are you sure to format the partition vda1?" with <Yes> <No> and NO preselection.
  - name: select Yes for the ESP format
    key: left
    settle: 2
  - name: format the ESP
    key: ret
    settle: 30

  # The same window, now listing the formatted ESP as vfat/ESP and asking for the system partition.
  - name: move to the system partition
    key: down
    settle: 3
  - name: open vda2
    key: ret
    settle: 15
  # Six rows; `e` is ext4, the first row starting with e, and dialog takes the first match.
  - name: choose ext4
    key: e
    settle: 3
  - name: confirm the filesystem for vda2
    key: ret
    settle: 10
  - name: keep the system volume label
    key: ret
    settle: 12
  - name: select Yes for the system format
    key: left
    settle: 2

  # THE LONGEST SETTLE IN THIS FILE. This formats the data partition and then copies 2.25 GB into it
  # - measured a little over four minutes on the disk that produced the numbers below, and the copy
  # keeps running after the pane advances, which is why the bootloader step's settle is generous too.
  - name: format vda2 and copy the system
    key: ret
    settle: 300

  # "This operation will double the system size" - declining keeps one copy. The default is Yes and
  # `right` is what says No; a second copy of a 2.25 GiB system is not what this artifact is for.
  # THE PICTURE AFTER `right` IS WHAT PROVES THE HIGHLIGHT MOVED, measured on a run that pressed
  # `right, ret` and got an OTA-prepared disk anyway because the pane had not drawn yet.
  - name: decline the OTA preparation
    key: right
    settle: 3
  - name: confirm the OTA answer
    key: ret
    settle: 40

  # =======================================================================================
  # 4. THE BOOTLOADER
  # =======================================================================================
  #
  # "Choose EFI Boot / Since you are using UEFI, we offer two boot options for the OS: rEFInd Boot
  # Manager or Grub2 EFI Bootloader." Grub2 is the first row and preselected, and it writes
  # /EFI/BOOT/BOOTX64.EFI into the ESP this file made.
  #
  # THIS PANE ONLY EXISTS BECAUSE `AUTO_INSTALL` IS NOT SET. The installer's own script guards its
  # search for the EF00 partition with
  #
  #	[ -z "$AUTO_INSTALL" -o -n "$AUTO_UPDATE" ] && for i in `list_disks`; do ...
  #
  # so with AUTO_INSTALL set the search is skipped, this pane never appears, and the ESP is left
  # without a loader - measured, on two runs of that path.
  - name: write Grub2 into the ESP
    key: ret
    settle: 200

  # "Congratulations! BlissOS-16.9.7 is installed successfully." It is read rather than assumed,
  # because every pane above reports nothing when it fails.
  - name: read the result
    see: {name: done}
  - name: it says the install succeeded
    check:
      name: installed
      from: done
      mode: text
      words:
      - - congratulations
      - - successfully

      rect: [0, 0, 1920, 1080]
      rect_at: [1920, 1080]
  # =======================================================================================
  # 5. THE UEFI FALLBACK PATH, WHICH THE INSTALLER CANNOT WRITE
  # =======================================================================================
  #
  # THE LOADER IS ON THE DISK AND UNREACHABLE WITHOUT THIS. The installer writes a complete
  # /EFI/BLISSOS (measured: BOOTX64.EFI, GRUBX64.EFI, MMX64.EFI, BOOTIA32.EFI, GRUB.CFG) and
  # registers it with `efibootmgr`, and THAT ENTRY LANDS IN THE NVRAM. This repository makes a fresh
  # variable store for every boot - deliberately, so a guest cannot inherit an entry naming a disk
  # somebody else wrote - and firmware with an empty NVRAM looks in exactly one place:
  #
  #	\EFI\BOOT\BOOTX64.EFI
  #
  # Measured without this step, on the disk this stage had just finished:
  #
  #	BdsDxe: failed to load Boot0002 "UEFI QEMU HARDDISK QM00011" ... : Not Found
  #	BdsDxe: No bootable option or device was found.
  #
  # `esp_fallback:` copies the loader tree to that path and replaces the config's `search.fs_uuid`,
  # a UUID the installer records before it formats the partition. On this disk the UUID happened to
  # be right - read back from the ext4 superblock - and it is still replaced, because a UUID is a
  # fact about a filesystem that a reinstall changes and a published artifact must not depend on one.
  #
  # IT RUNS AFTER `shutdown:`, because the ESP is a FAT filesystem inside a qcow2 and qemu holds the
  # write lock: measured, reading it while the installer ran failed with "Failed to get shared write
  # lock", and the first version of this reported that as "the ESP has no bootloader".
  - name: stop the installer
    shutdown: kill
    timeout: 120

  - name: copy the loader to the UEFI fallback path
    esp_fallback: {disk: disk, from: /EFI/BLISSOS}

  # =======================================================================================
  # 6. THE VERDICT IS READ OFF THE DISK
  # =======================================================================================
  #
  - name: publish the disk
    compress: '{{ out }}'

  - name: stop recording
