name: android 13 (blissos 16.9.7) - configure the vm
recording_resolution:
- 1920
- 1080
resolution:
- 1920
- 1080

# ANDROID HAS NO sshd AND DOES NOT NEED ONE: adbd IS ALREADY THERE, AND IT IS DRIVEN OVER THE TAP.
#
# This is the stage the other four operating systems run as `vm-configure`, and the transport is the
# difference. Theirs is ssh - an account, a password, a PAM stack. Android's is adbd on 5555, which
# is running before anything else is and needs no account at all:
#
#	sent     CNXN host::
#	device   CNXN version=0x1000001 maxdata=4096 banner=...ro.product.model=Generic Android-x86_64
#	         features=shell_v2,cmd,stat_v2,ls_v2,apex,abb,remount_shell,sendrecv_v2,...
#
# CNXN AND NOT AUTH: `ro.adb.secure=0`, so no RSA key and no "Allow USB debugging?" dialog. A guest
# built with secure adb answers AUTH, and `adb_connect:` reports that as the sentence it is.
#
# AND adb IS NOT A WEAKER ssh FOR THIS GUEST - IT IS A STRONGER ONE. Three of the things this stage
# has to do are Android system APIs, and ssh would have to write files to ask for them:
#
#	appops set com.farmerbb.taskbar SYSTEM_ALERT_WINDOW allow     a permission
#	cmd package set-home-activity com.farmerbb.taskbar.support/.BlissHomeActivity
#	settings put system screen_off_timeout 2147483647             a system setting
#
# MEASURED, EACH ONE, on a guest this repository installed - and the first two are what turn the
# "Select a Home app" chooser into a desktop. See the steps below.

vars:
  hostname:
    from: args.hostname
    default: easyvm-bliss
  timezone:
    from: args.timezone
    default: America/Los_Angeles
  locale:
    from: args.locale
    default: en_US.UTF-8
  out:
    from: args.out
    default: out/blissos16-vm-configure.qcow2

steps:
  - name: start recording

  - name: boot the installed disk
    boot: true
    os: android
    memory_mb: 4096
    timeout: 300

  # =======================================================================================
  # 1. THE TRANSPORT, PROVED BEFORE ANYTHING USES IT
  # =======================================================================================
  #
  # adbd comes up with the system. `adb_connect:` waits for it, completes CNXN, and runs one command
  # - a handshake alone proves a socket, and what every later step needs is a shell.
  - name: attach to the guest's adbd
    adb_connect: true
    timeout: 300

  # THE SHELL CAN CHANGE SYSTEM STATE, AND THAT - NOT ROOT - IS WHAT THIS STAGE NEEDS.
  #
  # MEASURED on this guest, and it is why there is no `adb_root:` here:
  #
  #	id                 uid=2000(shell) ... context=u:r:shell:s0
  #	ro.debuggable      0
  #	ro.build.type      user
  #	which su           nothing - /system/{bin,xbin}/su and /sbin/su are all absent
  #	pm list packages   me.weishu.kernelsu is installed; /data/adb is unreadable from this shell
  #
  # SO ROOT IS AVAILABLE - `adb root` answers "restarting adbd as root" and the shell comes back as
  # `uid=0(root) ... context=u:r:su:s0`, which this stage measured - AND IT IS NOT TAKEN, because
  # nothing here needs it. Every change below was measured working from the uid-2000 shell, whose
  # SELinux domain `u:r:shell:s0` owns `appops`, `settings`, `cmd` and `setprop`.
  #
  # A stage that took root because it could would be one more privilege to explain, and one more
  # dependency for a guest that does not have it.
  #
  # THE PROOF IS A WRITE THAT READS BACK. `id -un` says who you are; it does not say what you can do,
  # and on Android those are different questions - a `appops set` from a shell that cannot change it
  # exits 0 and changes nothing, which is the worst kind of success.
  - name: the shell can change system state
    adb_privileged: true

  # =======================================================================================
  # 2. THE HOME APP, WHICH IS THE DIFFERENCE BETWEEN A CHOOSER AND A DESKTOP
  # =======================================================================================
  #
  # MEASURED, on a disk straight out of `install.yaml`: it boots to
  #
  #	Select a Home app
  #	  Taskbar for Bliss OS / Launcher3 / Smart Dock
  #	  Just once   Always
  #
  # and SITS THERE. `cmd package resolve-activity ... HOME` answers
  # `android/com.android.internal.app.ResolverActivity` - the system asking, because nothing has been
  # chosen - and the dialog covers the frame, so `desktop: android` waits its whole budget for a panel
  # it cannot see.
  #
  # THREE COMMANDS REPLACE THE DIALOG, and none of them is a click:
  #
  #	appops set   draws-over-other-apps, without which Taskbar refuses to start at all:
  #	             "Permission needed / Taskbar requires permission to draw over other apps"
  #	set-home     names the launcher, which is what stops the chooser being drawn next boot
  #	am start     starts it now, so this run does not have to reboot to see a desktop
  - name: grant Taskbar the permission it needs to draw
    adb: appops set com.farmerbb.taskbar SYSTEM_ALERT_WINDOW allow

  - name: read the permission back
    # THE READ IS THE PROOF. `appops set` exits 0 whether or not the operation name was understood,
    # and `appops get` answers "No operations. Default mode: default" for an unknown one.
    adb: appops get com.farmerbb.taskbar SYSTEM_ALERT_WINDOW

  # TASKBAR IS THE HOME APP AND NOT Launcher3 OR Smart Dock: the other two are phone-shaped
  # launchers, and this artifact is the DESKTOP version - Taskbar is the one that draws the panel
  # `desktop: android` looks for.
  - name: make Taskbar the home app
    adb: cmd package set-home-activity com.farmerbb.taskbar.support/.BlissHomeActivity

  - name: prove nothing will ask again
    # RESOLVERACTIVITY IS THE CHOOSER. Anything else here means the next boot goes straight to it.
    adb: "cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.HOME | tail -1"

  - name: start it now
    adb: am start -n com.farmerbb.taskbar.support/.BlissHomeActivity
    timeout: 120

  # =======================================================================================
  # 3. THE THINGS THE OTHER FOUR OPERATING SYSTEMS ALSO TURN OFF
  # =======================================================================================
  #
  # AN UNATTENDED CLIENT CANNOT WAKE A SCREEN, and Android's default is 30 minutes. 2147483647 is
  # Integer.MAX_VALUE, which is what `settings put system screen_off_timeout` means by "never" - a
  # smaller number is a timeout that eventually fires.
  - name: never turn the screen off
    adb: settings put system screen_off_timeout 2147483647

  - name: read it back
    adb: settings get system screen_off_timeout

  # AND THE NAME, WHICH IS THE ONE THING THIS REPOSITORY GIVES EVERY GUEST.
  - name: name the machine
    # `net.hostname` IS THE ONLY NAME ANDROID HAS THAT A NETWORK SEES, and it is a runtime property:
    # there is no `/etc/hostname` to write and no reboot needed for it to answer.
    adb: setprop net.hostname {{ hostname }}

  - name: prove the name
    adb: getprop net.hostname

  - name: set the time zone
    # ANDROID TAKES AN IANA NAME HERE, UNLIKE WINDOWS: `setprop persist.sys.timezone` is what the
    # Settings app writes, and `persist.` is the prefix that makes it survive a reboot. Without it
    # the property lives until the next boot and the guest comes back on UTC.
    adb: setprop persist.sys.timezone {{ timezone }}

  - name: prove the time zone
    adb: getprop persist.sys.timezone

  - name: set the locale
    # `persist.sys.locale` IS THE BCP-47 FORM, `en-US`, WHICH IS NOT THE POSIX `en_US.UTF-8` THE
    # OTHER FOUR GUESTS USE. Android parses this one with `Locale.forLanguageTag`, and a value with
    # an underscore is silently ignored - the setting looks written and the device stays on its
    # previous language.
    adb: setprop persist.sys.locale en-US

  - name: prove the locale
    adb: getprop persist.sys.locale

  # =======================================================================================
  # 4. THE VERDICT IS WHAT THE SYSTEM SAYS IS IN FRONT, NOT WHAT THE PIXELS LOOK LIKE
  # =======================================================================================
  #
  # THE PIXEL DETECTOR WAS TRIED AND IT IS THE WRONG TOOL HERE. `desktop: linux` looks for a flat
  # panel with high contrast against the wallpaper; Android's Taskbar is a 40 px translucent bar over
  # a dark wallpaper, so that test answers false on a frame that is plainly a desktop:
  #
  #	row     mean   spread
  #	 936    22.3    203.0   wallpaper
  #	 954    12.4    121.7   Taskbar's top edge
  #	 972    23.2    232.7   Taskbar's icons
  #
  # A detector written for Android's shape was measured working on the full-size frame and then
  # FAILED ON THE SAME FRAME DOWNSCALED TO 640x360 - the boot splash it was meant to reject scored
  # 1.71 against the desktop's 2.36. A verdict that depends on the resolution is not a verdict.
  #
  # AND IT IS NOT NEEDED. adbd answers the question the pixels were being asked, in the system's own
  # words:
  #
  #	mCurrentFocus        com.farmerbb.taskbar/...HomeActivityDelegate
  #	topResumedActivity   com.farmerbb.taskbar/.activity.HomeActivityDelegate
  #	windows              16 belonging to com.farmerbb.taskbar
  #
  # MEASURED on the running guest, and it is what "the desktop is up" means: the launcher that draws
  # the panel is the focused, resumed activity. A boot splash has no activity, the chooser is
  # ResolverActivity, and a lock screen is SystemUI - none of them is this.
  # THE `am start` ABOVE IS ASYNCHRONOUS, SO THE VERDICT WAITS FOR IT RATHER THAN RACING IT.
  #
  # `require:` IS NOT THE TOOL AND NEITHER IS `loop:` HERE: a `check:` can only read what an `ocr:`
  # step read, and the whole point of this section is that the answer comes from the SYSTEM rather
  # than from pixels. So the wait is explicit and the check is a command whose exit status IS the
  # answer - `grep` exits 1 when the pattern is absent, and that fails the step by name.
  #
  # MEASURED: ten seconds after `am start` the answer is there; the wait is longer because a loaded
  # runner is slower, not because ten was wrong.
  - name: give the launcher time to come to the front
    settle: 20

  - name: Taskbar is the window in front
    # THE WINDOW MANAGER'S OWN ANSWER. `mCurrentFocus` names the window that receives input, and a
    # desktop is a frame in which that window belongs to the launcher.
    adb: dumpsys window | grep "mCurrentFocus" | grep com.farmerbb.taskbar
    timeout: 60

  - name: and it is the resumed activity
    # THE ACTIVITY MANAGER'S ANSWER, WHICH IS A DIFFERENT SUBSYSTEM. A launcher that is focused but
    # not resumed is one whose process is being torn down, and that is worth failing on separately.
    adb: dumpsys activity activities | grep "ResumedActivity" | grep com.farmerbb.taskbar
    timeout: 60

  - name: and its windows are on screen
    # THE THIRD STATEMENT, AND THE ONE THAT MATCHES WHAT A PERSON WOULD SEE: the number of windows
    # the launcher owns. Zero would mean the activity is resumed and drew nothing.
    adb: dumpsys window windows | grep -c com.farmerbb.taskbar
    timeout: 60


  - name: stop the machine
    shutdown: kill
    timeout: 120

  - name: publish the disk
    compress: '{{ out }}'

  - name: stop recording
